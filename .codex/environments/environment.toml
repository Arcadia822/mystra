# THIS IS AUTOGENERATED BY CODEX APP LOCAL ENVIRONMENTS. EDIT CAREFULLY.
version = 1
name = "Mystra"

[setup]
script = '''
set -euo pipefail

required_node="24.14.0"

if command -v fnm >/dev/null 2>&1; then
  fnm install "$required_node"
  eval "$(fnm env --shell bash)"
  fnm use "$required_node"
elif [ -s "${NVM_DIR:-$HOME/.nvm}/nvm.sh" ]; then
  # shellcheck disable=SC1090
  . "${NVM_DIR:-$HOME/.nvm}/nvm.sh"
  nvm install "$required_node"
  nvm use "$required_node"
elif [ "$(node --version 2>/dev/null || true)" != "v$required_node" ]; then
  echo "Mystra requires Node.js $required_node; install fnm or nvm, or provide that exact Node.js version." >&2
  exit 1
fi

corepack enable
corepack pnpm install --frozen-lockfile
corepack pnpm db:generate
corepack pnpm --filter @mystra/shared build
corepack pnpm --filter @mystra/ui build
'''

[[actions]]
name = "Dev"
icon = "run"
command = "corepack pnpm dev:control-plane"

[[actions]]
name = "Test"
icon = "check"
command = "corepack pnpm test"

[[actions]]
name = "Build"
icon = "tool"
command = "corepack pnpm build"

[[actions]]
name = "Typecheck"
icon = "check"
command = "corepack pnpm typecheck"

[[actions]]
name = "Lint"
icon = "check"
command = "corepack pnpm lint"
