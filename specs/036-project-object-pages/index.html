与 Web `/projects/:slug`\n读取同一 canonical API，并展示同一核心配置。\n\n**Acceptance Scenarios**:\n\n1. **Given** Project 存在，**When** 打开详情，**Then** 页面展示身份、仓库、runtime、\n   context 和策略字段。\n2. **Given** Project 没有 context bundle、mount、port 或 cache entry，**When** 打开详情，\n   **Then** 对应区域展示明确的 none/empty 值。\n3. **Given** slug 不存在，**When** 打开详情，**Then** 页面展示稳定的 not-found 错误和重试，\n   不显示空白页。\n4. **Given** Project 引用了 secret，**When** 打开详情，**Then** 页面只展示 secret reference\n   名称与挂载模式，不读取或暴露 secret value。\n\n### User Story 3 - Tasks 不承载通用 Issue 入口 (Priority: P1)\n\n作为 Mystra 操作员，我希望 Tasks 只展示已经进入控制面的任务，而不是假装所有 Issue\nProvider 都能使用同一种选择和分派界面。\n\n**Independent Test**: 打开 `/tasks` 后不存在 `Dispatch from Issue`，且浏览器 network\n不请求 `/api/integrations/*/issues`。\n\n**Acceptance Scenarios**:\n\n1. **Given** 操作员打开 `/tasks`，**When** 页面加载，**Then** 页面只读取 Task 数据，\n   不展示通用 Issue 分派面板。\n2. **Given** 当前筛选没有结果，**When** 展示空状态，**Then** 文案只建议调整筛选或刷新，\n   不暗示必须配置 Linear。\n3. **Given** 未来增加 Linear 或 GitHub Issue UI，**When** 设计该功能，**Then** 它必须由\n   provider-specific Integration 契约单独定义，而不是恢复本功能删除的通用面板。\n\n## Requirements\n\n### Functional Requirements\n\n- **FR-001**: 主导航 MUST 增加 `/projects` 一级入口。\n- **FR-002**: Web MUST 提供 `/projects` 列表页。\n- **FR-003**: Web MUST 提供 `/projects/:slug` 详情页。\n- **FR-004**: 两个页面 MUST 通过现有 `/api/projects` canonical API 读取数据，\n  MUST NOT 直接访问 SQLite。\n- **FR-005**: 页面可见字段 MUST 与既有 CLI `projects list/inspect` 同源，不增加第二套\n  Project 业务逻辑。\n- **FR-006**: 页面 MUST 提供 loading、empty、error 和 not-found 状态。\n- **FR-007**: 页面 MUST 可键盘操作、使用语义化 heading、可见 focus 和现有 Mystra token。\n- **FR-008**: `/tasks` MUST 移除 `Dispatch from Issue` 及其 Integration 网络请求。\n- **FR-009**: 本功能 MUST NOT 调用或修改远端 Linear、GitHub Issue 或其他 Integration。\n- **FR-010**: 本功能 MUST NOT 新增数据库 schema、Project API、CLI command 或 Runner contract。\n- **FR-011**: Project secret 配置只可展示 reference metadata，MUST NOT 读取或展示值。\n- **FR-012**: 页面 MUST 在 320px 至 1440px viewport 下可用。\n\n### Key Entities\n\n- **Project**: 现有 `projectSchema` 的只读 Web 投影。\n- **ProjectRuntimeConfig**: Project 的 sandbox provider、image、context、mount、port、\n  cache、secret references 和 override policy。\n- **TaskProjection**: 现有 Job/Run 的操作员投影；本功能只移除 intake UI，不修改实体。\n\n## Assumptions\n\n- `/api/projects` 与 `/api/projects/:slug` 已返回完整 Project。\n- CLI `projects list/inspect` 已覆盖当前最小只读操作。\n- Project 创建、编辑和归档虽有 API，但不是本次用户旅程要求，因此不在页面暴露。\n- Tasks 仍可展示持久化的 Issue snapshot；删除的是通用远端 Issue 浏览/分派入口。\n\n## Explicitly Out of Scope\n\n- `/issues` 一级页面、Issue 列表、Issue 详情和 Issue dispatch UI。\n- Linear、GitHub Issue 或其他 provider-specific Integration 页面。\n- Project create/edit/archive mutation UI。\n- API、CLI、RdbProvider、SQLite schema 或 Runner 行为变更。\n- 远端 Integration 请求、凭据读取或数据迁移。\n- Project 关联 Task 筛选和 Project 运行统计。\n\n## Success Criteria\n\n- **SC-001**: `/projects` 与 `/projects/:slug` 可直接打开并展示真实 Project 数据。\n- **SC-002**: Web 与 CLI 对同一 fixture 的 slug、repo、agent、runtime、context 和策略一致。\n- **SC-003**: `/tasks` 不包含 Issue dispatch UI，加载期间没有 `/api/integrations/*/issues` 请求。\n- **SC-004**: 320、768、1024、1440px 下无不可恢复的水平溢出。\n- **SC-005**: 浏览器 console 无 error/warning，链接、刷新和重试可键盘操作。\n- **SC-006**: focused tests、lint、typecheck、test、build 和 GitNexus change detection 通过。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# Features\n\n_specs/036-project-object-pages/features.md is not present for this spec yet._"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# Checklists\n\n_specs/036-project-object-pages/checklists.md is not present for this spec yet._"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# Prototype\n\n静态交互原型位于 `mockups/index.html`，用于确认：\n\n- Projects 作为一级导航；\n- Project list 与 detail 的信息层级；\n- Tasks 页面不再包含通用 Issue dispatch；\n- 小屏列表退化为两列、详情退化为单列。\n\n原型只表达信息架构，不读取数据库或 Integration。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1785036482016"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# 实现计划：Project Object Pages\n\n## Technical Context\n\n- TypeScript 5.9、Node 24、Next.js 16 App Router、React 19、Vitest 4。\n- 复用现有 `Project` / `ProjectRuntimeConfig`、SQLite/RdbProvider 和 Project route handlers。\n- Web 页面通过 canonical API 读取；CLI 已通过同一 API 实现 `projects list/inspect`。\n\n## Constitution Check\n\n- Web API 是 canonical 边界：PASS。\n- CLI 与 UI 同源：PASS。\n- 不新增 persistence、workflow 或 Integration abstraction：PASS。\n- 不调用 Linear/GitHub Issue：PASS。\n- 保留无关工作区改动：PASS。\n\n## Architecture\n\n```text\nProject list page ──────> GET /api/projects ───────┐\nProject detail page ────> GET /api/projects/:slug ├─> existing RdbProvider\nOperator CLI projects ──> same canonical API ─────┘\n\nTasks page ──────────────> GET /api/jobs\n                         (no Integration Issue request)\n```\n\n## Architecture Decisions\n\n1. **只补 Web 投影**：Project API、CLI 和数据库能力已经存在，不修改它们。\n2. **详情只读**：与当前 CLI `projects inspect` 对齐；不顺带暴露 create/edit/archive。\n3. **删除通用 Issue 面板**：不同 Issue Provider 的浏览与分派逻辑留给独立 Integration 功能。\n4. **不读取 secret value**：只展示 Project response 中已有的 reference metadata。\n5. **复用现有 UI primitives**：AppShell、data table、definition list、状态组件和 token 不分叉。\n\n## Implementation Slices\n\n1. Project 页面直接使用 `@mystra/shared` 导出的 `Project` type。\n2. 增加 Projects 主导航、路由标题和 responsive list grid。\n3. 实现 Project list/detail 页面。\n4. 从 Tasks 删除 Issue dispatch 面板、引用和相关文案。\n5. 使用现有 API/CLI tests、全仓 gates 与真实浏览器完成验收。\n\n## Engineering Review\n\n### Architecture\n\n- **Finding**: 不需要新增 API、CLI 或 persistence。\n  **Disposition**: 仅新增 UI consumers，避免第二套 Project contract。\n- **Finding**: control-plane 的本地 `Project` interface 字段不完整且只服务于待删除面板。\n  **Disposition**: 页面直接 type-import shared `Project`，删除本地重复 type。\n- **Finding**: 删除 `IssueDispatchPanel` 会使其文件成为确定的 dead code。\n  **Disposition**: 与 Tasks 引用一起删除；不保留兼容 shim。\n\n### Data Flow\n\n- `/projects` 单次读取 active Projects；详情按 URL slug 读取一个 Project。\n- 页面不自行聚合远端 Issue、Runner 或 Task 数据。\n- Project API 错误通过现有 `useResource` 进入统一 error state。\n\n### Risk\n\n- **Low**: runtime config 存在空数组和可选字段。\n  **Mitigation**: 所有集合都有显式 empty 表示，不假设至少一个元素。\n- **Low**: repo、image、mount target 可能很长。\n  **Mitigation**: 复用 overflow-wrap 与 responsive 单列布局。\n- **Low**: secret reference 可能被误当作 secret value。\n  **Mitigation**: 只显示 name/mode，不发起任何 secret 读取。\n\n### Test Architecture\n\n```text\nExisting route/CLI contract tests\n              │\n              ▼\n     lint + typecheck + test\n              │\n              ▼\n          Next build\n              │\n              ▼\ntemporary SQLite fixture\n      ├── CLI projects list/inspect\n      └── browser list/detail/tasks\n              │\n              ▼\nconsole + network + responsive evidence\n```\n\n### Performance\n\n- Project list 使用现有无分页 endpoint；本次不扩大结果集或增加 N+1 请求。\n- 详情只发一个 Project 请求。\n- 不增加 client polling；Project 配置不是高频状态面。\n\n### Review Result\n\n**PASS**：范围明确、没有 contract migration、GitNexus pre-change impact 均为 LOW。\n\n## Verification\n\n- Project API/CLI focused tests。\n- `pnpm lint`、`pnpm typecheck`、`pnpm test`、`pnpm build`。\n- CLI `projects list/inspect` 与页面字段对照。\n- 浏览器 list/detail/tasks、console、network、keyboard、320/768/1024/1440。\n- GitNexus `detect_changes` staged review。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks: Project Object Pages\n\n- [x] T001 Project 页面直接引用 shared Project type，删除本地重复 type\n  - Acceptance: Project runtime、lifecycle 和 config 字段均由 canonical schema 推导\n  - Verification: `pnpm typecheck`\n  - Dependencies: none\n- [x] T002 [US1] 增加 Projects 一级导航、route title 和 responsive list grid\n  - Acceptance: `/projects` 导航可见且 active state 正确\n  - Verification: browser keyboard + responsive check\n  - Dependencies: T001\n- [x] T003 [US1] 实现 `/projects` list 页面\n  - Acceptance: loading/error/empty/data 状态完整，字段与 CLI list 同源\n  - Verification: CLI/Web fixture comparison\n  - Dependencies: T001, T002\n- [x] T004 [US2] 实现 `/projects/:slug` detail 页面\n  - Acceptance: identity、repo、runtime、context、mount、port、cache、policy 和 secret refs 可检查\n  - Verification: CLI/Web fixture comparison + not-found browser check\n  - Dependencies: T001, T002\n- [x] T005 [US3] 从 Tasks 删除通用 Issue dispatch UI\n  - Acceptance: 文件与 import/render 全部移除，空状态不再提 Linear/Issue 配置\n  - Verification: source search + browser network\n  - Dependencies: none\n- [x] T006 运行 focused API/CLI tests 与全仓质量门\n  - Acceptance: lint、typecheck、test、build 全通过\n  - Verification: command output\n  - Dependencies: T003, T004, T005\n- [x] T007 完成真实浏览器和 CLI 同旅程验收\n  - Acceptance: list/detail/tasks、console、network、keyboard、4 个 viewport 通过\n  - Verification: browser evidence + CLI output\n  - Dependencies: T006\n- [x] T008 完成 GitNexus detect changes、五轴代码审查与 Spec-Kit closeout\n  - Acceptance: 影响范围符合规格，无 Critical/Important finding\n  - Verification: staged detect_changes + status/doctor\n  - Dependencies: T007\n\n## Checkpoint\n\n- [x] 现有 Project API/CLI 无修改\n- [x] Linear/GitHub Issue 无请求、无数据变更\n- [x] 只 stage 本功能文件，保留所有无关工作区改动\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
  </body>
