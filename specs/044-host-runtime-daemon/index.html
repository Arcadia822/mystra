    <script id="spec-data" type="application/json">{"feature":"044-host-runtime-daemon","title":"044-host-runtime-daemon","prototypeHref":"mockups/index.html?v=1786096947984","generatedAt":"2026-08-07T10:04:53.408Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：Host Runtime 注册、Provider 发现与心跳\n\n**Feature Branch**: `044-host-runtime-daemon`（逻辑 feature id；本次未创建或切换分支）\n**Created**: 2026-08-07\n**Status**: Draft；待 constitution/5xP 边界修订与用户故事评审后进入 `/speckit.plan`\n**Input**: Owner 需求：参考 `multica-ai/multica`，在机器上安装并启动一个 `mystra-runner`，即可在\ncontrol-plane 通过心跳把这台机器纳管为 Runtime；runner 自动扫描本机可用的 agent CLI（Provider）并\n确认其可用；持续回报心跳与状态。**本 spec 只覆盖：注册 host Runtime + Provider 自动发现与可用性确认\n+ 心跳/状态。发起任务与 Context（repo/worktree）管理不在本 spec 范围。** `mystra-runner` 用\nTypeScript 开发，不采用 multica 的 Go。\n\n**研究来源**: 见同目录 `research.md`（对 `multica-ai/multica` 的源码级研究）。\n\n## 澄清决策记录（Owner 已确认）\n\n1. **本 spec 收窄范围**：只交付 **host Runtime 注册 + Provider 发现/可用性确认 + 心跳/状态**。\n   发起任务、Context/worktree 管理、Agent 配置、执行/Session 持久化、并发/恢复 **均不在本 spec**，\n   由后续独立 feature 承接。\n2. **MVP 不做接入校验**：`mystra-runner` 配好 control-plane endpoint 后**直接启动并注册**，无 pairing、\n   无凭证交换。接入认证整体后置。\n3. **runner 实现语言 = TypeScript**：复用/改造现有 `apps/runner-daemon`（TS），不引入 Go。\n4. **执行模型方向 = 宿主机直跑（前瞻）**：长期方向是宿主机 worktree 直跑取代 Docker sandbox 成为\n   默认执行模型，但**本 spec 不交付任何执行**，仅建立\"可提供计算能力的 host Runtime\"这一纳管地基。\n\n## 概念方向（前瞻，非本 spec 交付范围）\n\n后续任务启动将采用四轴模型 `Task × Runtime(provides Provider) × Agent(provider+prompt+skills) ×\nContext(repo/worktree)`。**本 spec 只落地其中的 Runtime 与 Provider 两块**，其余轴（Agent 配置、\nContext 管理、派发/执行）留给后续 feature。此处记录方向，仅为保证本 spec 的抽象向前兼容：\n\n- **Runtime**：一个执行后端，对外声明它能提供哪些 **Provider（agent CLI）**；该能力表达**与来源\n  无关**——当前 host-bound Runtime 由 PATH 发现，未来 image-bound Runtime 可由镜像声明，上层契约不变。\n- **Provider**：agent CLI / 协议族（copilot/codex/claude…），能力维度。\n- Agent / Context / 派发：后续 feature 拥有，本 spec **MUST NOT** 引入其持久化或契约。\n\n## User Scenarios & Testing *(mandatory)*\n\n面向**平台操作者（自托管 owner）**。下列用户故事按重要性排序、可独立交付与验证。\n\n### User Story 1 - 用 mystra-runner 注册一台机器为 host Runtime (Priority: P1)\n\n作为平台操作者，我想在一台已有 agent CLI 的机器上安装 `mystra-runner`、配好 control-plane endpoint\n后直接启动，就让这台机器作为 host Runtime 出现在管理面并可做基本查看/重命名，从而拥有一个\"可提供\n计算能力的远程服务方\"的纳管入口。\n\n**Why this priority**: 整个能力的地基。无需校验流程，最短路径即可交付\"纳管一台机器并观察其存在\"。\n\n**Independent Test**: 在一台机器上以 `--endpoint <url>` 启动 `mystra-runner`，管理面出现该 Runtime；\n操作者可查看、重命名该 Runtime。\n\n**Acceptance Scenarios**:\n\n1. **Given** 一个可达的 control-plane endpoint，**When** 目标机器的 `mystra-runner` 配置该 endpoint\n   并启动，**Then** control-plane 持久化一条 host Runtime 记录（MVP 无 pairing/凭证交换）。\n2. **Given** 一个已注册 Runtime，**When** 操作者列出或查看它，**Then** 返回其稳定 id、显示名、\n   host 类型、当前状态与可用 Provider 集合。\n3. **Given** 同一台机器重复启动 `mystra-runner`，**When** 再次注册，**Then** 以 runner 本地持久化的\n   稳定 runner id 去重、更新既有 Runtime 记录而非无限新建。\n4. **Given** 一个 Runtime，**When** 操作者重命名它，**Then** 记录被更新。\n\n---\n\n### User Story 2 - 自动发现 Provider 并确认其可用 (Priority: P1)\n\n作为平台操作者，我想让 `mystra-runner` 自动扫描本机 PATH 上已安装的受支持 agent CLI，并**确认它们\n确实可用**（而不仅是存在），把可用 **Provider** 集合作为该 Runtime 的能力上报，这样我能看到每台\nRuntime 上\"真正能用\"的 Provider。\n\n**Why this priority**: \"扫描可用 agent\"是 Owner 点名的核心体验，也是 Runtime 成为有意义执行后端的\n前提。不派发任何任务、仅凭发现与可用性结果即交付价值。\n\n**Independent Test**: 在只装了部分受支持 CLI 的机器上启动 runner，该 Runtime 的可用 Provider 集合恰为\n实际可解析且通过可用性确认的 Provider；运行期新装一个受支持 CLI，无需重启一段时间后出现。\n\n**Acceptance Scenarios**:\n\n1. **Given** 机器装有 `copilot`、`codex`、未装 `claude`，**When** runner 发现，**Then** 该 Runtime\n   可用 Provider 集合为 `{copilot, codex}` 且不含 `claude`。\n2. **Given** 某受支持 CLI 存在于 PATH 但**不可用**（如无法执行 / 版本不满足门槛），**When** runner\n   做可用性确认，**Then** 该 Provider **不计入**可用集合，并记录不可用原因（发现≠可用两分开）。\n3. **Given** runner 正运行，**When** 操作者新安装一个受支持 CLI，**Then** 下一轮周期发现与确认后该\n   Provider 出现在可用集合，**无需重启 runner**。\n4. **Given** 某 CLI 仅能通过登录 shell 的 PATH 解析（nvm/fnm/`~/.local/bin`），**When** 直接查找\n   未命中，**Then** runner 通过登录 shell 兜底解析其绝对路径并纳入发现。\n5. **Given** 用 `MYSTRA_<PROVIDER>_PATH` 覆盖某 Provider 路径，**When** runner 发现，**Then** 使用\n   覆盖路径；覆盖为不存在的显式路径则该 Provider 硬性缺失，而非静默回退到别的二进制。\n6. **Given** 抽象上 Provider 能力来源无关，**When** 未来 image-bound Runtime 由镜像声明可用 Provider，\n   **Then** 上层看到的仍是同样的\"Runtime 可用 Provider\"能力，无需区分来源。\n\n---\n\n### User Story 3 - 心跳与在线状态 (Priority: P1)\n\n作为平台操作者，我想让 `mystra-runner` 持续向 control-plane 回报**存活心跳**，并在注册时及可用 Provider\n集合发生变化时上报该集合，让管理面能准确显示每台 Runtime 是 online 还是 offline，以及它当前的可用\nProvider，这样我能判断哪台机器此刻可堪使用。\n\n**Why this priority**: 纳管的价值在于\"可观测且可信\"。没有心跳/状态，Runtime 记录只是静态登记而非\n\"活的\"计算资源。\n\n**Independent Test**: 启动 runner 后该 Runtime 显示 online；停止 runner 后超过判定阈值变 offline；\n运行期 Provider 集合变化能通过变更上报反映到管理面。\n\n**Acceptance Scenarios**:\n\n1. **Given** 一个已注册 Runtime，**When** 其 runner 按周期发送存活心跳，**Then** control-plane 依据\n   **服务端接收时间**刷新**进程内存 last-seen**（不落库）并将其判为 online。\n2. **Given** 一个 online Runtime，**When** runner 停止且超过判定阈值未再心跳，**Then** 显示 offline。\n3. **Given** runner 运行期可用 Provider 集合发生变化，**When** runner 上报变更（不依赖每次心跳携带），\n   **Then** 管理面反映最新可用 Provider 集合。\n4. **Given** control-plane 需支持未来无心跳的 Runtime 类型，**When** 定义状态语义，**Then**\n   **MUST NOT** 把 host 的内存 last-seen 心跳作为所有 Runtime 类型判活的普遍前提（为 042 的 image/云\n   Provider 预留）。\n5. **Given** control-plane 进程重启，**When** 内存 last-seen 清空，**Then** host 短暂显示 offline，直至\n   下一次心跳（≤心跳周期）自动恢复 online；期间**不**触发任何持久化写。\n\n### Edge Cases\n\n- 同一机器重复启动 runner：以 runner 本地持久化的稳定 runner id 去重，更新既有 Runtime 而非新建。\n- Runtime 可用 Provider 集合为空（全部缺失或全部不可用）：允许注册但标记\"无可用 Provider\"。\n- Provider 存在但不可用（无法执行 / 版本不达标 / 登录态缺失导致 --version 失败）：不计入可用集合并\n  记录原因；本 spec 不负责修复其可用性（如登录），只如实反映。\n- 机器时钟漂移：online/offline 与心跳新鲜度判定基于**服务端接收时间**，而非客户端声明时间。\n- control-plane 进程重启：内存 last-seen 清空，host 短暂 offline，下次心跳自愈；存活为易失态、不持久，故无需恢复逻辑。\n- endpoint 暂不可达：runner 应重试注册/心跳而非崩溃退出；恢复后重新纳管。\n- image-bound 未来场景：Provider 由镜像声明，\"Runtime 可用 Provider\"语义不变；本 spec 不实现该来源，\n  但抽象 **MUST NOT** 假定 Provider 必来自 PATH 发现。\n\n## Requirements *(mandatory)*\n\n### Functional Requirements — Runtime 注册与管理\n\n- **FR-001**: `mystra-runner` MUST 支持配置 control-plane endpoint 后**直接启动并注册**为 host\n  Runtime，MVP **MUST NOT** 引入 pairing token、凭证交换或接入校验。\n- **FR-002**: 系统 MUST 持久化 **Runtime** 记录（表 `runtimes`）：稳定 id、显示名、类型（host）、动态扩展\n  `metadata`（host 形态 `{runnerId, platform?}`·JSON）、创建/更新时间；以及其**可用 Provider 关联边**（表\n  `runtime_providers`，每条含 provider 键与可用性状态）。online/offline **派生自内存 last-seen**（见 FR-021），\n  **MUST NOT** 作为持久列；读操作不得触发任何状态写。\n- **FR-003**: 重复启动同一机器的 runner MUST 以 runner 本地持久化的**稳定 runner id**（落入 `metadata.runnerId`）\n  去重、幂等更新既有 Runtime 记录而非新建。稳定 runner id 由 runner 首次启动生成并持久化到本地（如\n  `~/.mystra/runner-id`）。去重按 `metadata.runnerId` 幂等 upsert（**无 DB 唯一约束**·动态字段无法方言中立地建 JSON\n  路径唯一索引）；同机多进程用同一 runner id 并发上报时服务端**无需区分**、last-write-wins；防止同机重复起进程的\n  单实例约束由 **runner 客户端**负责，不进入服务端契约。\n- **FR-004**: 操作者 MUST 能列出、查看、重命名 Runtime。**移除**不在本 feature（见非目标）。\n- **FR-005**: runner 与 control-plane 的通信 MUST 由 runner **outbound** 发起（注册/心跳/上报），\n  control-plane **MUST NOT** 要求主动 inbound 访问 runner 主机。\n- **FR-006**: endpoint 暂不可达时 runner MUST 重试注册/心跳并保持进程存活，恢复后自动重新纳管。\n\n### Functional Requirements — Provider 发现与可用性\n\n- **FR-010**: Runtime MUST 以**可用 Provider 集合**表达其能运行的 agent CLI 能力，且该能力的表达\n  **MUST 与来源无关**（host 发现 vs 未来 image 声明），使 image-bound Runtime 未来可声明同类能力而\n  不改变上层契约。\n- **FR-011**: host `mystra-runner` MUST 通过扫描本机 PATH 自动**发现**受支持的 Provider CLI。\n- **FR-012**: host `mystra-runner` MUST 对发现到的每个 Provider 做**可用性确认**（如可执行性 /\n  版本门槛检查），仅将确认可用者计入可用 Provider 集合；发现（存在）与可用（能用）**MUST 分开表达**，\n  不可用者 MUST 记录原因。\n- **FR-013**: host `mystra-runner` MUST 在运行期**周期性重扫与重确认**，使新安装或状态变化的受支持\n  Provider CLI 无需重启 runner 即被反映。\n- **FR-014**: 当直接路径查找未命中时，host `mystra-runner` MUST 提供**登录 shell 兜底解析**，以发现\n  仅存在于登录 shell PATH 中的 Provider CLI。\n- **FR-015**: 系统 MUST 支持用环境变量（`MYSTRA_<PROVIDER>_PATH`）**显式覆盖** Provider 可执行路径；\n  覆盖为不存在的显式路径 MUST 硬性缺失，而非静默回退到其他二进制。\n- **FR-016**: 本 feature **MUST NOT** 负责 Provider CLI 的安装与登录/授权；假定目标机器已装已登录。\n\n### Functional Requirements — 心跳与状态\n\n- **FR-020**: runner MUST 周期性发送**存活心跳**（liveness ping）。心跳 **MUST NOT** 要求携带完整\n  可用 Provider 集合——集合上报与存活心跳解耦。\n- **FR-021**: control-plane MUST 依据**服务端接收时间**与心跳新鲜度判定 Runtime 的 online/offline。存活为\n  **易失态**：心跳只刷 control-plane 进程内存的 last-seen 注册表（`HostLivenessRegistry`）、**MUST NOT 持久化**\n  （0 次 DB 写·不碰 `metadata`/`updatedAt`）；`status` 读取时现算、非持久列。且 **MUST NOT** 把 host 的心跳\n  last-seen 作为未来所有 Runtime 类型判活的普遍前提（e2b 用可达/enabled，由 042 定义）。进程重启后 last-seen\n  清空、host 短暂 offline 并于下次心跳自愈——该易失性不引入需复制的 master 状态，未来 HA 仅换 registry 实现\n  （sticky routing / 共享 TTL 租约），不改持久化与契约。\n- **FR-022**: runner MUST 在**注册时**上报可用 Provider 集合，并在运行期集合**发生变化时**上报变更；\n  系统据此反映最新集合，而非依赖每次心跳携带。\n- **FR-023**: 摄取路由（注册/心跳/Provider 变更上报）MVP **MUST NOT** 引入认证；此为**已知风险**，\n  留待后续接入认证 feature（见非目标）。\n\n### Functional Requirements — 契约、实现与边界\n\n- **FR-030**: 本 feature 引入的 Runtime 记录、Provider 能力、注册/心跳/上报契约 MUST 用显式\n  TypeScript + Zod 表达（Constitution II）；Runtime 身份与 Task 意图、未来 Session/执行、Agent 配置\n  保持为分离概念。\n- **FR-031**: `mystra-runner` MUST 用 **TypeScript** 实现（复用/改造现有 `apps/runner-daemon`），\n  **MUST NOT** 引入 Go 或其他语言的并行 runner 实现。\n- **FR-032**: 抽象 **MUST NOT** 假定\"可用 Provider 必来自 PATH 发现\"或\"CLI 必绑持久机器\"；须容纳\n  未来 image-bound Runtime 由镜像声明 Provider 的情况。\n- **FR-033**: 本 feature **MUST NOT** 引入发起任务、Context/worktree 管理、Agent 配置持久化、\n  执行/Session 持久化、并发调度、接入校验/授权、Docker/Kubernetes/云 sandbox 执行；各为独立后续边界。\n- **FR-034**: 未来接入认证的秘密材料（若引入）MUST 通过 `SecretProvider` 处理、RDB 只存非秘密元数据与\n  opaque 引用；本 feature 本身不引入接入凭证，但 **MUST NOT** 设计出与该方向冲突的持久化。\n- **FR-035**: 本 feature MUST **删除** `apps/runner-daemon` 中已随 feature 040 失效的历史执行代码——\n  即全部打向已删除 `/api/runner/sessions*` 路由的 claim/执行/docker/sandbox/repo 交付/context-bundle\n  机制及其模块与测试（`direct-execution`、`preview-probe`、`repo-providers`、`sandbox-providers`、\n  `review-projections`、`runtime-paths`、`git-command-env`、`container-task.test` 及 `index.ts` 内对应\n  执行函数与 claim/execute 主循环）。**MUST NOT** 以注释保留、feature-flag 或\"以后可能用\"为由留存\n  （pre-0.1 政策：直接删除过时契约与调用方，不留兼容别名）。\n- **FR-036**: 044 交付后的 `mystra-runner` 源码 MUST **不残留**对执行/派发语义符号的引用\n  （`executor`、`docker`/`sandbox` 执行、`session` claim/result/events、repo 交付、context bundle），\n  新模块（`provider-discovery.ts`、`registration.ts`、host `index.ts`）**MUST NOT** import 被删模块或\n  携带 executor/session 类型；以 grep 门禁验证，确保新架构不受历史代码影响。\n\n## Key Entities\n\n- **Runtime（host）**: 一台由 `mystra-runner` 代表的执行后端（表 `runtimes`）。属性：id、name、类型（host）、\n  动态扩展 `metadata`（host 形态 `{runnerId, platform?}`）、createdAt/updatedAt。status（online/offline）与存活\n  last-seen 均**非持久**：status 读取时派生，last-seen 由 control-plane 进程内存 `HostLivenessRegistry` 维护。\n- **RuntimeProvider（关联边）**: Runtime ↔ Provider 的持久化关联（表 `runtime_providers`，`@@unique(runtimeId,\n  provider)`）。属性：provider 键、discovered、available、source、resolvedPath、version、unavailableReason。\n  host 由 Runner 提交形式写入，未来 e2b 由镜像声明（`source=sandbox-image`）——核心表不变。\n- **Provider**: agent CLI / 协议族（copilot/codex/claude…）。能力维度，由 Runtime 发现并确认可用；\n  实现可为注册表/枚举（复用 `agentNameSchema`），不是重业务表。区分\"发现（存在）\"与\"可用（能用）\"两态。\n\n> Agent（provider+prompt+skills）、Context（repo/worktree）、执行/Session **不在本 spec 的实体范围**，\n> 由后续 feature 拥有。**Runner** 不是实体/表，是 host 的**提交形式**（register/heartbeat/provider-report），\n> 其协议 bookkeeping 仅以 Runtime 的 `metadata` 与内存 last-seen 留痕。\n\n## 边界与依赖门禁 *(重要)*\n\n- **Constitution 修订前置（Principle III / IV + 2026-08-06 持久化边界）**: 现 constitution 写死\n  \"The MVP sandbox provider is single-machine Docker\"，并把 Runtime/Runner 持久化列为\"需新规格延期\"。\n  本 feature 引入 **host Runtime 作为一类执行后端** + **Runtime 持久化** + **Provider 能力上报**，属\n  产品与持久化边界变更。按 Principle I，**必须先显式修订 constitution 与 5xP（AGENTS.md /\n  PLATFORM.md）**：把 Runtime 提升为对外声明 Provider 能力的执行后端，host-bound Runtime 的\n  注册/发现/心跳纳入 MVP，single-machine Docker 重新定位为其中一种 sandbox provider，Runtime 持久化\n  由本 044 拥有。之后本 feature 方可进入 `/speckit.plan` 与实现。本 spec 记录该修订为**实现前门禁**。\n- **与 042 的关系**: 本 feature 是 042\"Runtime 能力提供方\"延期边界在 host-bound 模式下的**首个具体\n  落地**，遵守其语义分离（Runtime ≠ 连接方式 ≠ Sandbox 规格 ≠ Sandbox 实例）。\"来源无关的 Provider\n  能力\"正是为 042 的 image-bound/云/K8s 场景预留的兼容点；那些来源仍延期。\n- **持久化范围**: 本 feature 只拥有 **Runtime（`runtimes`）+ 可用 Provider 关联边（`runtime_providers`）**的\n  持久化；**存活心跳不持久**（进程内存 last-seen）；Agent 配置、Context、执行/Session 仍延期给后续 feature，\n  本 spec **MUST NOT** 触碰其持久化。\n- **复用现状**: 改造 TS 的 `apps/runner-daemon`（已有 register/heartbeat/poll 循环）与\n  `packages/shared` 既有 runner 契约（`runnerRegistrationSchema` 等），而非新建并行实现。\n\n## Success Criteria *(mandatory)*\n\n### Measurable Outcomes\n\n- **SC-001**: 操作者能在一台已装某 Provider CLI 的机器上，仅配置 endpoint 并启动 `mystra-runner`，\n  即在管理面看到该 host Runtime，全程无 pairing、无手工登记 Provider。\n- **SC-002**: 某 Runtime 的可用 Provider 集合与机器上实际可解析且通过可用性确认的受支持 Provider 集合\n  一致；PATH 上存在但不可用的 CLI 不计入，并记录不可用原因。\n- **SC-003**: 运行期新装一个受支持 CLI 后，无需重启 `mystra-runner`，该 Provider 在下一轮发现/确认后\n  出现在可用集合。\n- **SC-004**: 启动 runner 后 Runtime 显示 online；停止后超阈值显示 offline；判定基于服务端接收时间。\n- **SC-005**: 评审者能在规格中无歧义区分 Runtime 与 Provider，并能说明同一\"Runtime 可用 Provider\"\n  抽象如何同时容纳 host 发现与未来 image 声明两种来源。\n- **SC-006**: `mystra-runner` 以 TypeScript 实现，无 Go 或其他语言的并行 runner。\n- **SC-007**: 044 交付后，`apps/runner-daemon` 不再含指向已删除 `/api/runner/sessions*` 的执行/claim/\n  docker/sandbox/repo 交付/context-bundle 遗留代码；对上述执行语义符号的 grep 门禁为空；`build`/\n  `typecheck`/`test` 全绿，且新模块不 import 任何被删模块。\n\n## 非目标 / 排除项 *(本 spec)*\n\n- 发起任务 / 派发 / 执行（含 headless `-p` 驱动 agent）——后续 feature。\n- Context / repo / worktree 管理——后续 feature。\n- Agent 配置（provider + system prompt + skills）持久化与 UI——后续 feature。\n- 执行 / Session 持久化、并发调度、断连时执行恢复——后续 feature。\n- 接入校验 / pairing / 凭证交换 / 授权——整体后置；摄取路由 MVP 无认证为**已知风险**（FR-023）。\n- **服务端移除 Runtime**——本 feature 不做。理由：仍在运行的 runner 会在下次注册时重新纳管自己，\n  服务端单方面移除会与之冲突；移除/退役语义留待后续接入认证与生命周期 feature。\n- Docker sandbox / Kubernetes / 云 sandbox 执行路径；image-bound Runtime 仅作抽象兼容点，不实现。\n- Provider CLI 的安装、登录与授权（假定已具备）。\n- 成本/token 计量、webhooks、Issue 写回、channels、托管多租户、平台级 workflow 编排。\n- WebSocket 唤醒/流式 RPC——MVP 先 HTTP 注册/心跳，WS 后置。\n\n## Deferred Decisions（留待 `/speckit.clarify` 或 plan）\n\n- 心跳间隔、offline 判定阈值、周期重扫间隔、登录 shell 解析缓存 TTL 的具体数值。multica 参考值：\n  心跳 15s、offline ~3min、登录 shell 解析 TTL 30min、登录 shell 超时 3s(+2s 硬杀)、shell 允许表\n  `{bash,zsh,sh,dash,ksh}`。\n- 可用性确认的具体手段（`--version` / 轻量 probe / 版本门槛表）与各 Provider 的最低版本。\n- Provider 能力键形态：枚举 vs 注册表 vs 版本化 capability schema。\n- Provider 变更上报机制：独立\"变更上报\"路由 vs 复用注册 upsert（二选一，plan/tasks 定）。\n- 传输是否在后续引入 WS 唤醒，还是纯 HTTP + 轮询。\n- 跨平台（Windows service / launchd / systemd）runner 托管细节。\n- Runtime 与 Team/所有权、公有/私有可见性绑定（依赖 043 落地情况）。\n\n## 后续必需产物（进入 tasks/实现前）\n\n- 本 spec 为 **UI-facing**（Runtimes 管理页 + Runtime 详情：在线状态与可用 Provider）。按\n  `aaa-spec-kit` 门禁，进入 tasks/实现前 **MUST** 有可打开的原型；本目录 `prototype.md` 指向\n  `mockups/index.html`，覆盖：Runtimes 列表、Runtime 详情（online/offline + 可用/不可用 Provider）。\n  runner 的安装与启动**不在产品 UI 范围**（无 \"Add a computer\" 引导面），由 operator 按\n  `quickstart.md` 自行完成。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# Features\n\n_specs/044-host-runtime-daemon/features.md is not present for this spec yet._"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# Checklists\n\n_specs/044-host-runtime-daemon/checklists.md is not present for this spec yet._"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 原型：Host Runtime 注册、Provider 发现与心跳\n\n**Feature**: `044-host-runtime-daemon`\n**入口**: [`mockups/index.html`](./mockups/index.html)（自包含静态 HTML，浏览器直接打开）\n\n本 spec 为 UI-facing，按 `aaa-spec-kit` 门禁，在进入 `/speckit.tasks` 与实现前须有可打开的原型。\n原型为低保真线框，用于对齐信息架构与关键状态，不代表最终视觉。\n\n## 覆盖页面 / 状态\n\n| 面 | 覆盖内容 | 对应用户故事 |\n| --- | --- | --- |\n| **Runtimes 列表** | 已纳管 Runtime 表格：名称、类型（host）、online/offline、可用 Provider（含\"不可用\"标记）、最近心跳 | US1、US2、US3 |\n| **Runtime 详情** | 稳定 id / runner id / 类型 / 状态 / 最近心跳（服务端接收时间）/ 连接方式（outbound）/ 发现来源；可用 Provider 表区分「发现」与「可用性确认」两态并给出不可用原因；重命名操作（MVP 无服务端移除） | US1、US2、US3 |\n\n## 演示的关键规格点\n\n- 状态判定基于**服务端接收心跳时间**（列表与详情均标注）。\n- Provider **发现（存在）≠ 可用（能用）**：详情页两列分开，展示\"版本低于门槛/未发现\"等原因。\n- 发现来源**来源无关**表达：PATH 扫描 / 登录 shell 兜底 / 环境变量覆盖 / 周期重扫。\n- 连接为 runner **outbound**，control-plane 不主动 inbound。\n- 明确标注**非本 feature 范围**：发起任务、Context、Agent 配置。\n\n## 当前限制\n\n- 纯静态，数据为示意；无真实注册/心跳/发现逻辑。\n- 未覆盖发起任务、Context/worktree、Agent 配置、执行回放（均为后续 feature，不在 044）。\n- 具体数值（心跳间隔、offline 阈值、重扫周期、最低版本）见 `spec.md` 的 Deferred Decisions，原型仅占位展示。\n- **不含**产品内的 runner 安装引导（\"Add a computer\" 面）：runner 由 operator 自行安装启动，安装/托管细节见 `quickstart.md`，不在管理 UI 范围。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1786096947984"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# Implementation Plan: Host Runtime 注册、Provider 发现与心跳\n\n**Branch**: `044-host-runtime-daemon`（逻辑 feature id；本次未创建/切换分支，在 `main` in-place）\n**Date**: 2026-08-07 | **Spec**: [`spec.md`](./spec.md)\n**Input**: `specs/044-host-runtime-daemon/spec.md`\n\n## Summary\n\n把一台已装 agent CLI 的机器，通过启动 TypeScript 版 `mystra-runner`（配 endpoint 直启、无 pairing）\n纳管为 **host Runtime**；runner 自动扫描 PATH 发现受支持的 **Provider（agent CLI）**、确认其可用性，\n并周期性回报心跳与可用 Provider 集合；control-plane 依服务端接收时间判定 online/offline，并提供\nRuntime 列表/详情/重命名/移除的管理面。**本 feature 只交付 Runtime + Provider 两块**，不含发起任务、\nContext/worktree、Agent 配置、执行/Session。\n\n技术路径：复用现有 `apps/runner-daemon`（TS，已有 register/heartbeat/poll 骨架，但其 `/api/runner/*`\n路由已被 040 删除），把其注册契约从 \"docker executor + container agent 主目录\" 改造为 \"host executor +\nPATH 发现的可用 Provider 集合\"；在 `packages/shared` 新增/改造 Runtime 与心跳的 Zod 契约；在\ncontrol-plane 新增 `Runtime` Prisma 模型（sqlite + postgresql 双 schema，经 `RdbProvider`）、`/api/runtimes`\n管理路由与 `/api/runner/{register,heartbeat}` 摄取路由；重新激活 `app/runners`（更名/展示为 Runtimes）页。\n\n## Technical Context\n\n**Language/Version**: TypeScript 5.9，Node.js 24.14.0，pnpm 10.25.0\n**Primary Dependencies**: Next.js 16 Route Handlers、React 19、Zod 4、Prisma 7.9.1（`@prisma/adapter-better-sqlite3` / `@prisma/adapter-pg`）、Node `child_process`（PATH 发现 + 登录 shell 兜底 + 版本 probe）、Vitest 4\n**Storage**: SQLite via `RdbProvider`（PostgreSQL / Supabase-backed PostgreSQL 双 schema 并行维护，契约不泄漏方言）\n**Testing**: Vitest 4（`packages/shared` 契约单测、`apps/runner-daemon` 发现/注册单测、`apps/control-plane` `RdbProvider` 契约测试 + 路由测试）\n**Target Platform**: control-plane = Node 服务；`mystra-runner` = 运行在 operator 机器（darwin/linux 优先，Windows 后置）\n**Project Type**: Web service（control-plane）+ CLI daemon（runner）+ 共享包\n**Performance Goals**: 非高吞吐；心跳与发现为低频周期任务（秒级/十秒级）。目标是\"启动后数秒内出现在管理面并显示 online\"\n**Constraints**: runner 纯 outbound；online/offline 依**服务端接收时间**；发现≠可用两态分离；Provider 能力表达**来源无关**；无 pairing/无秘密材料\n**Scale/Scope**: 自用单节点，个位数~数十台 Runtime；每台受支持 Provider ~≤20 个\n\n## Constitution Check\n\n*GATE：Phase 0 前必须通过；Phase 1 设计后复核。基于已修订的 constitution v2.8.0。*\n\n| 原则 | 判定 | 说明 |\n| --- | --- | --- |\n| I. MVP 边界先修订后扩张 | ✅ 已满足 | constitution v2.8.0 + AGENTS.md/PLATFORM.md 已把 host Runtime 纳管 + Runtime 持久化纳入 MVP；本 plan 不再越界。 |\n| II. 契约用 TS+Zod，身份分离 | ✅ 遵守 | Runtime/注册/心跳/Provider 能力全部 Zod；Runtime 身份与 Task、未来 Session/Agent 保持分离。 |\n| III. Provider 是可替换边界 | ✅ 遵守 | 新增 host RuntimeProvider 语义；Provider 能力来源无关，为 image/云预留；不引入 WorkflowProvider。 |\n| IV. Runner 隔离与秘密卫生 | ✅ 遵守 | runner outbound；本 feature 不引入接入秘密；不烘焙凭证；Docker-socket 条款不涉及（host 发现不碰容器）。 |\n| 持久化边界（2026-08-07 note） | ✅ 对齐 | 只加 Runtime + 可用 Provider 持久化；Session/Context/Agent 仍延期，不触碰其持久化。 |\n| RdbProvider 不泄漏方言 | ✅ 遵守 | Runtime 经 `RdbProvider` 方法访问；sqlite/postgresql schema 并行；契约层无 Prisma 类型/连接串。 |\n\n**结论**：无违规，无需 Complexity Tracking 条目。\n\n## Project Structure\n\n### Documentation (this feature)\n\n```text\nspecs/044-host-runtime-daemon/\n├── spec.md              # 已完成（收窄版）\n├── research.md          # 已完成（multica 源码级研究 + 范围提示）\n├── plan.md              # 本文件\n├── data-model.md        # Phase 1：Runtime + Provider 能力实体、Prisma、RdbProvider 方法、状态机\n├── quickstart.md        # Phase 1：operator/dev 走查\n├── prototype.md         # 已完成（UI 原型入口）\n├── mockups/index.html   # 已完成（静态原型）\n├── contracts/           # Phase 1：Zod 契约（注册/心跳/Provider 能力/管理 API）\n└── tasks.md             # /speckit.tasks 产出（本 plan 不创建）\n```\n\n### Source Code（涉及的真实目录）\n\n```text\npackages/shared/src/\n  schemas.ts                     # 新增/改造：runtimeRegistration / runtimeHeartbeat / providerCapability / runtime view 契约\n                                 #   复用并调整既有 runnerRegistrationSchema / platformCapabilitiesSchema\napps/runner-daemon/src/\n  index.ts                       # 改造 register()/心跳循环：host executor；存活心跳 + 变更上报解耦；endpoint 直启、重试；本地 runner id 持久化\n  provider-discovery.ts          # 新增：PATH 扫描 + 登录 shell 兜底 + MYSTRA_<PROVIDER>_PATH 覆盖 + 可用性确认 + 周期重扫\n  registration.ts                # 改造：构建 host Runtime 注册 payload（可用 Provider 集合）\n  agent-adapters.ts              # 参考现有受支持 Provider 名单（codex/copilot…），抽出 host 发现所需的 provider 键\napps/control-plane/\n  prisma/sqlite/schema.prisma        # 新增 model Runtime(metadata 动态列·无 status/无 host 专属列) + model RuntimeProvider(关联边)\n  prisma/postgresql/schema.prisma    # 并行维护等价双 model\n  src/lib/db/rdb-provider.contract.ts# 新增 registerHostRuntime/getRuntime/listRuntimes/renameRuntime/reportHostProviders 契约 + 测试（无心跳写方法）\n  src/lib/db/prisma-provider.ts      # 实现新方法（metadata JSON ⇆ 结构·upsert runtime_providers 边）\n  src/lib/runtime/host-liveness.ts   # 新增：HostLivenessRegistry(进程内存·markSeen/getLastSeen·非持久) + resolveRuntimeStatus\n  app/api/runtimes/route.ts          # 新增：列表（纯读·派生 status）\n  app/api/runtimes/[id]/route.ts     # 新增：详情/重命名（无 DELETE）\n  app/api/runner/register/route.ts   # 新增（重建）：runner 注册摄取 → registerHostRuntime + markSeen\n  app/api/runner/heartbeat/route.ts  # 新增：存活心跳摄取 → HostLivenessRegistry.markSeen(runnerId, serverNow)·不落库\n  app/api/runner/providers/route.ts  # 新增：Provider 集合变更上报 → reportHostProviders(覆盖边集合)\n  app/runners/page.tsx               # 重新激活为 Runtimes 列表；新增详情视图\n```\n\n**Structure Decision**：沿用现有 monorepo 三层（`packages/shared` 契约 → `apps/control-plane` 服务/持久化/Web → `apps/runner-daemon` CLI daemon）。不新建包。host 发现逻辑独立成 `provider-discovery.ts` 便于单测与未来 image 来源替换。\n\n## 关键设计决策（供 plan-eng-review）\n\n1. **Runtime 记录形态**：稳定模型 = **Runtime ↔ Provider 关联边**。`runtimes` 表 type-agnostic（`id/name/type/\n   metadata/createdAt/updatedAt`），host 提交 bookkeeping 收进动态 `metadata`（`{runnerId, platform?}`，runner 首启\n   生成 UUID 落 `~/.mystra/runner-id`）；可用 Provider 落 `runtime_providers` 关联边表（每边含 provider 键 + 可用性\n   状态 + 版本 + 解析路径 + 不可用原因·`@@unique(runtimeId, provider)`），**不用** Runtime 上的扁平\n   `availableProviders` JSON。`status` 与存活 last-seen **均不落库**（读时派生 / 进程内存）。\n2. **发现 vs 可用两态**：`provider-discovery.ts` 先 `which`/PATH 解析（发现），再对命中者跑轻量\n   `--version`/probe（可用性确认）；两者分别落在能力项的 `discovered` 与 `available` 字段。\n3. **登录 shell 兜底（照搬 multica 机制，TS 移植）**：仅在 bare 命令名直接查找**未命中时**才走兜底——\n   `child_process.execFile(process.env.SHELL, ['-ilc', script], { timeout })`，`SHELL` basename 需在允许表\n   `{bash,zsh,sh,dash,ksh}`。脚本逐名 `unalias`+`unset -f` → `command -v` → 要求绝对路径 →\n   `cd \"$dir\" && pwd -P` 规范化 → 打印 `name\\tpath`；返回后 TS 侧再做一次\"绝对路径 + 可执行\"复核。\n   结果进程级缓存、key=`PATH+SHELL+HOME` 指纹、**TTL ~30min**（远大于发现间隔，空结果也缓存），\n   因起登录 shell 有成本、不每次扫描都跑。超时有界（~3s + 强杀宽限）。**Node 无 `exec.LookPath`**：\n   自实现 PATH 解析或用 `which` 等价逻辑。\n4. **覆盖语义**：`MYSTRA_<PROVIDER>_PATH` 命中即用；显式路径不存在 = 硬缺失，不回退。\n5. **周期重扫 + 变更上报**：与心跳解耦的独立 interval 做重扫；集合**变化时**上报（`/api/runner/providers`\n   或复用注册 upsert，二选一待定），注册时也带一次；**存活心跳不携带 Provider 集合**。\n6. **online/offline（存活不持久）**：存活是易失信号——心跳只刷 control-plane 进程内存 `HostLivenessRegistry`\n   的 last-seen（服务端接收时刻·**0 次 DB 写**·不碰 `metadata`/`updatedAt`），读取时按 `now - lastSeen > staleAfter`\n   **现算** offline，不回写状态列。**不**持久化心跳（对齐 HDFS/YARN：master 内存判活、只持久稳定身份；亦避免 K8s\n   早期把心跳写进 etcd Node 对象的写放大/索引 churn）。**不**把该心跳 last-seen 泛化为所有 Runtime 类型判活前提，\n   为 042 image/云 Provider 预留 status 语义位。\n   - **HA/SPOF**：内存化不新增单点——存活自愈，即便持久/复制在故障切换后仍须靠新心跳重建，故\"持久 vs 内存\"对可用性\n     无差别；真正的可用性边界是 control-plane 进程数量（MVP 单节点），与存活放哪正交。`HostLivenessRegistry` 是可替换\n     seam，未来多实例 HA 换 sticky routing / 共享 TTL 租约实现（归 042/hosted），不动持久化/契约/schema。\n7. **无服务端移除（MVP）**：仍在运行的 runner 会在下次注册重新纳管，故不提供单方面 delete；退役语义\n   留待后续接入认证/生命周期 feature。\n8. **传输**：MVP 纯 HTTP（`POST /api/runner/register`、`/api/runner/heartbeat`，Provider 变更上报），\n   无 WS 唤醒。\n9. **摄取路由无认证 = 已知风险**：MVP 决策不做校验，spec 非目标已显式标注，留待接入认证 feature。\n10. **契约复用**：改造既有 `runnerRegistrationSchema` 而非全新命名；执行相关字段（executor=docker 路径）\n   在本 feature 收敛为 host 语义或标注延期。\n11. **遗留执行代码清理（架构去污）**：`apps/runner-daemon` 现有全部 claim/执行/docker/sandbox/repo 交付/\n   context-bundle 机制均打向 feature 040 已删除的 `/api/runner/sessions*` 路由——即**当前整套 daemon 主流程\n   已是死代码**。044 借重建 host 语义之机**直接删除**这些历史模块与测试（见下方清理清单），host 发现/注册/\n   心跳新模块从**干净基座**长出，不 import 被删模块、不携带 executor/session 类型。按 pre-0.1 政策不留兼容\n   别名、不注释保留；以 grep 门禁与 `build/typecheck/test` 三绿收口（FR-035/036、SC-007）。\n\n### 遗留代码清理清单（teardown manifest）\n\n**删除（模块 + 同名 `.test.ts`）**：`direct-execution`、`preview-probe`、`repo-providers`（含 `repo-providers/` 目录）、\n`sandbox-providers`（含 `sandbox-providers/` 目录）、`review-projections`、`runtime-paths`、`git-command-env`、\n`container-task.test`。\n\n**删除（`index.ts` 内执行符号）**：`claimAvailableSession`、`emitEvent`、`runCommand`、`dockerTaskScript`、\n`repositoryAuthBinding`、`repositoryMetadata`、`repositoryPhaseEnvironment`、`fetchRepositoryCredential`、\n`phaseOutputHostPath`/`phaseOutputContainerPath`/`readPhaseOutput`、`executeContainerPhase`、`runtimePorts`、\n`materializeContextBundle`、`appendRuntimeMounts`/`appendRuntimePorts`、`pollCancellationRequest`、\n`repositoryTarget`、`buildAgentPrompt`、`executeFakeSession`、`executeDockerSession`、`executeSession`\n及 `main()` 的 claim/execute 主循环。\n\n**改造（保留概念、重写为 host 语义）**：`registration.ts`（去 `executor`/`docker`/`concurrency`/\n`eligibleRuntimeProviders`/`fakeExecutorAgents`）、`index.ts` 的 `readConfig`/`register`/心跳（收敛为 endpoint 直启\n+ host 注册 + 发现循环 + 存活心跳 + 变更上报）、`agent-adapters.ts`（从执行 adapter 注册表**收敛为受支持\nProvider 键来源**，或直接改由 `@mystra/shared` 的 `agentNameSchema` 供给后删除本文件）。\n\n**保留**：`sentry.ts`（横切可观测性）。\n\n**依赖收尾**：若 `agent-adapters.ts` 被删，评估从 `apps/runner-daemon/package.json` 移除 `@mystra/agent-adapters`\nworkspace 依赖（执行 adapter 包，发现无需）。\n\n## Phase 0 — Research（已完成）\n\n见 `research.md`：multica 注册/心跳/发现/登录 shell 兜底/覆盖/周期重扫源码级结论 + 与 Mystra 现状差异。\n无遗留 NEEDS CLARIFICATION 阻断项；具体数值类问题集中在 spec 的 Deferred Decisions，交由 `/speckit.clarify`。\n\n## Phase 1 — Design（本次产出）\n\n- `data-model.md`：Runtime 实体（type-agnostic + 动态 `metadata`）、RuntimeProvider 关联边、Prisma 双 schema、\n  `RdbProvider` 新方法（无心跳写）、内存 `HostLivenessRegistry` 与 status 派生、状态机（unregistered→online→offline）、\n  去重键（`metadata.runnerId` 幂等·无 DB 唯一列）、e2b 映射。\n- `contracts/`：`runtime-registration.contract.md`、`runtime-heartbeat.contract.md`、\n  `provider-capability.contract.md`、`runtime-management-api.contract.md`（Zod 形状 + 路由约定）。\n- `quickstart.md`：operator 启动 runner → 管理面出现 → 装/卸 CLI 观察可用 Provider → 停 runner 看 offline。\n\n## Phase 2 — Tasks（由 `/speckit.tasks` 产出，非本 plan）\n\n按用户故事切片：US1 注册+管理、US2 发现+可用性、US3 心跳+状态；每片含 shared 契约 → 持久化 →\n路由 → runner → Web → 测试。\n\n## 复核门禁\n\n- 进入 `/speckit.tasks` 前运行 `plan-eng-review`（架构/数据流/边界/测试/性能）。\n- 触及执行流/持久化/provider 边界，plan 阶段已用直接代码阅读对齐（runner-daemon、shared、prisma、\n  rdb-provider 契约）；如需血缘/影响面再用 GitNexus 补充。\n\n## Complexity Tracking\n\n无违规，无需填写。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"---\ndescription: \"Task list for 044 host runtime daemon\"\n---\n\n# Tasks: Host Runtime 纳管（mystra-runner 注册 + Provider 发现 + 心跳）\n\n**Input**: `specs/044-host-runtime-daemon/` 的 plan.md、spec.md、research.md、data-model.md、contracts/、quickstart.md\n**Prerequisites**: plan.md（已完成）、spec.md（3 个 P1 user story）、data-model.md、contracts/runtime-contracts.md\n\n**Tests**: 本 feature 引入 Runtime 持久化与 runner↔control-plane 契约，属高一致性风险面，因此**包含契约/单元测试任务**（与 spec 契约测试要点、SC 对齐）。\n\n**Organization**: 任务按 user story 分组，各 story 可独立实现与验证。全部为 P1，但存在自然依赖顺序 US1 → US2 → US3（注册记录先于 Provider 集合，Provider 集合先于其变更上报）。\n\n## Format: `[ID] [P?] [Story] 描述`\n\n- **[P]**: 可并行（不同文件、无相互依赖）\n- **[Story]**: US1 / US2 / US3；`FND`=Foundational；`SET`=Setup；`POL`=Polish\n- 每条含确切文件路径\n\n## Path Conventions\n\n沿用现有 monorepo 三层：`packages/shared/src/`（契约）→ `apps/control-plane/`（持久化/路由/Web）→ `apps/runner-daemon/src/`（CLI daemon）。不新建包。\n\n---\n\n## Phase 1: Setup（共享基建）\n\n**Purpose**: 确认工作面、锁定 Provider 键来源，不改动业务行为。\n\n- [x] T001 [SET] 确认 044 依赖前置：`apps/runner-daemon` 现有 `register()`/心跳骨架打的是被 040 删除的 `/api/runner/register`（现 404）；在 `specs/044-host-runtime-daemon/plan.md` 顶部或 quickstart 记录\"需重建 `/api/runner/*` 摄取路由\"这一事实基线，供实现者对齐。\n- [x] T002 [P] [SET] 从 `apps/runner-daemon/src/agent-adapters.ts` 抽出本 feature host 发现所需的**受支持 Provider 键名单**（如 `codex`/`copilot`/`claude`/`qwen`/`cursor-agent` 等），集中为一个可复用常量（如 `apps/runner-daemon/src/provider-keys.ts` 或复用现有导出），供 `provider-discovery.ts` 与契约枚举引用。仅整理来源，不改发现逻辑。\n\n---\n\n## Phase 2: Foundational（阻塞所有 story 的核心基建）\n\n**⚠️ CRITICAL**: 本阶段完成前，任何 user story 实现都不能开始。核心是**共享契约 + Prisma 模型 + RdbProvider 方法签名**，三者被三个 story 共同依赖。\n\n### 共享 Zod 契约（`packages/shared/src/schemas.ts`）\n\n- [ ] T003 [FND] 新增 `providerCapabilitySchema`（字段：`provider` 键、`discovered`、`available`、`version?`、`resolvedPath?`、`source: 'path'|'login-shell'|'env-override'`、`unavailableReason?`），并实现四条不变量校验（`available⇒discovered`、`未发现⇒resolvedPath=null`、`不可用⇒有 unavailableReason`、override 缺失语义），见 contracts §1。\n- [ ] T004 [FND] 新增 `hostRuntimeRegistrationSchema`（含 `runnerId`、`type:'host'`、显示名 `name`、`platform`、`providers: providerCapabilitySchema[]`）、`hostHeartbeatSchema`（**仅 `runnerId`·纯存活·不含 Provider 集合**）、`hostProviderReportSchema`（`{runnerId, providers}`·独立变更上报），见 contracts §2/§3/§3b。执行相关字段（`maxConcurrency`/`eligibleRuntimeProviders`）**不复用**。\n- [ ] T005 [FND] 新增 `runtimeViewSchema`（control-plane→读取方：`id`、`name`、`type`、`metadata:{runnerId,platform?}`、派生 `status`、`lastSeenAt`（取自内存·可空·非持久）、`providers: providerCapabilitySchema[]`、`createdAt`、`updatedAt`），见 contracts §4。\n- [ ] T006 [FND] 按 pre-0.1 政策**直接替换/移除**过时的 `runnerRegistrationSchema`（docker/执行语义，约 schemas.ts:571）在本 feature 范围的引用点，不留兼容别名（见 contracts \"迁移\"）。仅处理会因新契约产生冲突的调用点；执行语义的历史消费方若超出本 feature，标注 TODO 交由执行 spec。\n\n### Prisma 持久化模型（无 status 列）\n\n- [ ] T007 [FND] 在 `apps/control-plane/prisma/sqlite/schema.prisma` 新增 **`model Runtime`**（type-agnostic）：`id String @id`、`name`、`type`、`metadata String? @map(\"metadata\")`（JSON 文本·host 形态 `{runnerId,platform?}`·**无 lastHeartbeatAt**）、`createdAt`/`updatedAt`；`@@index([updatedAt,id])`/`@@index([createdAt,id])`；`@@map(\"runtimes\")`。**无 `status` 列、无 host 专属列、无 `@unique` runner 列**（去重靠 provider 内按 `metadata.runnerId` 幂等 upsert）。并新增 **`model RuntimeProvider`**（关联边）：`id`、`runtimeId @map(\"runtime_id\")`、`provider`、`discovered`、`available`、`source`、`resolvedPath?`、`version?`、`unavailableReason?`、`@@unique([runtimeId, provider])`、`@@map(\"runtime_providers\")`。见 data-model.md。\n- [ ] T008 [FND] 在 `apps/control-plane/prisma/postgresql/schema.prisma` 并行新增等价 `model Runtime` + `model RuntimeProvider`（保持双 provider schema 同步）。\n- [ ] T009 [FND] 生成/落地 SQLite migration（按仓库现有 Prisma 迁移方式），确保 `runtimes` 表可建；PostgreSQL 侧生成对应 migration。**pre-0.1 允许破坏式重建本地库**，不写兼容迁移。\n\n### RdbProvider 契约与实现\n\n- [ ] T010 [FND] 在 `apps/control-plane/src/lib/db/rdb-provider.contract.ts` 增加方法签名：`registerHostRuntime(input)`、`getRuntime(id)`、`listRuntimes()`（**纯读**）、`renameRuntime(id,name)`、`reportHostProviders(runnerId,providers)`。**无 `recordHostHeartbeat`（心跳不入 RdbProvider）、无 `deleteRuntime`**。契约保持 dialect-neutral（不泄漏 Prisma 类型/SQL；`metadata` 暴露为已解析强类型对象）。\n- [ ] T011 [FND] 在 `apps/control-plane/src/lib/db/prisma-provider.ts` 实现上述方法：`registerHostRuntime` 按 `metadata.runnerId` **幂等 upsert** `type=host` Runtime（写 `metadata={runnerId,platform}`）并用 `input.providers` **覆盖** `runtime_providers` 边集合；`reportHostProviders` 按 `metadata.runnerId` 定位并覆盖边集合；`listRuntimes`/`getRuntime` **不回写任何状态**；`metadata` JSON string ⇆ 结构转换。**无心跳写路径**。\n- [ ] T012 [FND] 新增 `apps/control-plane/src/lib/runtime/host-liveness.ts`：**内存** `HostLivenessRegistry`（`markSeen(runnerId, at)` / `getLastSeen(runnerId)`·进程级·非持久·可替换 seam）+ 服务层 `resolveRuntimeStatus(lastSeenAt, now, staleAfter)`（contracts §6）：`null⇒offline`；`now - lastSeenAt > staleAfter ⇒ offline` 否则 online。`lastSeenAt` 取自 registry；默认 `staleAfter` 采用 multica 参考值（~3min），常量集中可调。**不**将存活写入持久层。\n\n**Checkpoint**: 契约、模型、持久化方法就绪——三个 user story 可开始。\n\n---\n\n## Phase 3: User Story 1 - 注册一台机器为 host Runtime (Priority: P1) 🎯 MVP\n\n**Goal**: 配好 endpoint 直启 `mystra-runner`，机器作为 host Runtime 出现在管理面，可查看/重命名；重复启动按 runner id 去重。\n\n**Independent Test**: 以 `--endpoint <url>` 启动 runner → 管理面出现该 Runtime → 可查看/重命名 → 重复启动不新建（SC-001、FR-001~006）。\n\n### Tests for US1 ⚠️（先写、先失败）\n\n- [ ] T013 [P] [US1] 契约测试：`hostRuntimeRegistrationSchema` 解析/拒绝；注册 upsert 幂等——同 `runnerId` 两次返回同一 `runtimeId`（按 `metadata.runnerId` 去重·无 DB 唯一列；contracts 测试要点）。放于 control-plane 或 shared 的测试目录（依现有测试布局）。\n- [ ] T014 [P] [US1] 读路径测试：`GET /api/runtimes` 与 `listRuntimes()` **不产生写**（无状态回写副作用）（SC 对齐、contracts §5/§6）。\n\n### Implementation for US1\n\n- [ ] T015 [US1] 重建摄取路由 `apps/control-plane/app/api/runner/register/route.ts`：校验 `hostRuntimeRegistrationSchema` → `registerHostRuntime` → `HostLivenessRegistry.markSeen(runnerId, serverNow)` → 返回 `runtimeId`。**MVP 无认证**（FR-023 已知风险，代码注释标注）。\n- [ ] T016 [P] [US1] 管理读 API `apps/control-plane/app/api/runtimes/route.ts`：`listRuntimes()` → 每条用 `resolveRuntimeStatus` 现算 status → 返回 `runtimeViewSchema[]`（纯读）。\n- [ ] T017 [P] [US1] 管理 API `apps/control-plane/app/api/runtimes/[id]/route.ts`：`GET` 详情、`PATCH` 重命名（`renameRuntime`）。**无 `DELETE`**（非目标）。\n- [ ] T018 [US1] 改造 `apps/runner-daemon/src/index.ts` 的 `register()`：改打新的 `/api/runner/register`；**endpoint 直启**（无 pairing/校验，FR-001）；endpoint 不可达时**重试并保持存活**（FR-006）。\n- [ ] T019 [US1] 新增 `apps/runner-daemon/src/registration.ts`（或从 index 抽出）：生成/读取本地稳定 **runner id**（首启生成 UUID 落 `~/.mystra/runner-id`，FR-003），构建 host Runtime 注册 payload。\n- [ ] T020 [US1] 重新激活 `apps/control-plane/app/runners/page.tsx` 为 **Runtimes 列表 + 详情视图**：显示 id/`metadata.runnerId`/`name`/`type`/status/可用 Provider（`providers` 边）；提供重命名入口；对齐 `mockups/index.html`（无\"移除\"）。\n\n**Checkpoint**: US1 独立可用——注册、去重、列表、查看、重命名闭环。\n\n---\n\n## Phase 4: User Story 2 - 自动发现 Provider 并确认可用 (Priority: P1)\n\n**Goal**: runner 自动扫描 PATH 上受支持 CLI，做可用性确认（发现≠可用），把**可用 Provider 集合**作为能力上报；运行期周期重扫。\n\n**Independent Test**: 只装部分 CLI 的机器上启动 → 可用集合恰为实际可解析且确认可用者；运行期新装 CLI，不重启一段时间后出现（SC-002、SC-003、FR-010~016）。\n\n### Tests for US2 ⚠️\n\n- [ ] T021 [P] [US2] `providerCapabilitySchema` 四不变量单测（available⇒discovered、未发现⇒path=null、不可用⇒有原因、override 缺失硬缺失）。\n- [ ] T022 [P] [US2] `provider-discovery.ts` 单测：PATH 命中/未命中、`MYSTRA_<PROVIDER>_PATH` 覆盖命中、覆盖路径不存在=硬缺失不回退（FR-015、AC5）；发现与可用性确认结果分别落 `discovered`/`available`。\n\n### Implementation for US2\n\n- [ ] T023 [US2] 新增 `apps/runner-daemon/src/provider-discovery.ts` — **PATH 发现**：对受支持 Provider 键（T002）做 `which`/PATH 解析（Node 无 `exec.LookPath`，自实现），命中记 `source:'path'`（FR-011）。\n- [ ] T024 [US2] `provider-discovery.ts` — **可用性确认**：对命中者跑轻量 `--version`/probe，仅确认可用者计入可用集合，不可用记 `unavailableReason`；`discovered` 与 `available` 分开（FR-012、AC2）。\n- [ ] T025 [US2] `provider-discovery.ts` — **登录 shell 兜底**（照搬 multica，TS 移植，research §4/plan 决策 #3）：仅在 bare 名未命中时 `execFile(process.env.SHELL,['-ilc',script],{timeout})`；shell 允许表 `{bash,zsh,sh,dash,ksh}`；脚本 `unalias`+`unset -f`→`command -v`→绝对路径→`cd \"$d\" && pwd -P`；返回后二次\"绝对+可执行\"复核；记 `source:'login-shell'`（FR-014、AC4）。超时 ~3s + 强杀宽限。\n- [ ] T026 [US2] `provider-discovery.ts` — **解析缓存**：进程级、key=`PATH+SHELL+HOME` 指纹、TTL ~30min（空结果也缓存），env 指纹变即失效；避免每轮发现都 fork 登录 shell（research §4 理由）。\n- [ ] T027 [US2] `provider-discovery.ts` — **环境覆盖**：`MYSTRA_<PROVIDER>_PATH` 命中即用、含路径分隔符则**绕过** shell 兜底；显式路径不存在=硬缺失记 `source:'env-override'` + `unavailableReason:'override-path-missing'`（FR-015、AC5）。\n- [ ] T028 [US2] `provider-discovery.ts` — **周期重扫**：与心跳解耦的独立 interval 重扫+重确认，使运行期新装/状态变化的 Provider 无需重启即反映（FR-013、AC3、SC-003）。\n- [ ] T029 [US2] 接线：`registration.ts`/`index.ts` 注册 payload 使用 `provider-discovery` 产出的**可用 Provider 集合**（FR-010，来源无关表达）；空集合允许注册并标记\"无可用 Provider\"（Edge Case）。\n\n**Checkpoint**: US2 独立可用——发现、确认、覆盖、兜底、重扫闭环，能力随注册上报。\n\n---\n\n## Phase 5: User Story 3 - 心跳与在线状态 (Priority: P1)\n\n**Goal**: runner 周期发**存活心跳**；注册时与集合变化时上报 Provider 集合；管理面据服务端接收时间显示 online/offline 与最新 Provider。\n\n**Independent Test**: 启动→online；停止超阈值→offline；运行期集合变化经变更上报反映到管理面（SC-004、FR-020~023）。\n\n### Tests for US3 ⚠️\n\n- [ ] T030 [P] [US3] `resolveRuntimeStatus` 边界单测：`null`（含进程重启后 last-seen 清空）、恰好等于阈值、超过阈值（contracts 测试要点、SC-004、AC5）。\n- [ ] T031 [P] [US3] 心跳/上报契约测试：存活心跳**不带 Provider**、**心跳产生 0 次 DB 写**（仅内存 `markSeen`）、判活用服务端时间、客户端伪造时间被忽略；Provider 变更上报**覆盖**既有 `runtime_providers` 边集合（contracts 测试要点、AC1/AC3）。\n\n### Implementation for US3\n\n- [ ] T032 [US3] 摄取路由 `apps/control-plane/app/api/runner/heartbeat/route.ts`：校验 `hostHeartbeatSchema`（仅 `runnerId`）→ `HostLivenessRegistry.markSeen(runnerId, serverNow)`；**0 次 DB 写**；未知 `runnerId` 返回 404 触发 runner 重注册；忽略客户端声明时间（FR-020/021、AC1、Edge：时钟漂移）。\n- [ ] T033 [US3] 摄取路由 `apps/control-plane/app/api/runner/providers/route.ts`：校验 `hostProviderReportSchema` → `reportHostProviders(runnerId, providers)` 覆盖 `runtime_providers` 边集合（变更上报，与心跳解耦；FR-022、AC3）。*（若最终选择复用注册 upsert 承载变更上报，则改为在此记录决策并让 runner 走 register upsert；二选一，见 plan 决策 #5。）*\n- [ ] T034 [US3] 改造 `apps/runner-daemon/src/index.ts` 心跳循环：周期发**存活心跳**（仅带 `runnerId`，不带 Provider）；集合变化时才调 providers 上报；注册时带一次（FR-020/022）。心跳间隔采用 multica 参考值（~15s），常量可调。\n- [ ] T035 [US3] 读取视图接入派生 status：`GET /api/runtimes` 与详情用 `HostLivenessRegistry.getLastSeen(metadata.runnerId)` + `resolveRuntimeStatus` 现算 online/offline（不回写列，FR-002/021）；`runners/page.tsx` 展示 online/offline 徽标与最新可用 Provider（AC2、SC-004）。\n- [ ] T036 [US3] 状态语义防呆：确保 `resolveRuntimeStatus` 与视图**不**把内存 last-seen 硬编码为所有 Runtime 类型判活的唯一前提（为 042 image/云 Provider 预留），以注释/结构表达；`HostLivenessRegistry` 作为可替换 seam（未来 sticky routing / 共享 TTL lease，见 data-model HA 说明）（FR-021、AC4）。\n\n**Checkpoint**: 三个 story 均独立可用。\n\n---\n\n## Phase 6: Polish & Cross-Cutting\n\n- [ ] T037 [P] [POL] 按 `specs/044-host-runtime-daemon/quickstart.md` 走查 operator + dev 验证表，逐条对齐 FR/SC；发现偏差回填 tasks 或修实现。\n- [ ] T038 [P] [POL] 复核 `research.md`/`plan.md` 的 multica 参考默认值（心跳 15s、offline ~3min、TTL 30min、超时 3s+2s、shell 允许表）已作为**集中常量**落在代码中且可调；无散落魔法数。\n- [ ] T039 [POL] 一致性收尾：`git diff --check`；确认无 `deleteRuntime`/无认证摄取的已知风险注释齐备（FR-023）；确认 runner 仅 TypeScript、无 Go 并行实现（FR-031、SC-006）。\n\n---\n\n## Dependencies & Execution Order\n\n### Phase 依赖\n\n- **Setup (P1)**：可立即开始。\n- **Foundational (P2)**：依赖 Setup；**阻塞所有 user story**。契约(T003-T006)→模型(T007-T009)→RdbProvider(T010-T012)内部大体顺序，但契约与模型可并行推进。\n- **User Stories (P3-P5)**：均依赖 Foundational。虽同为 P1，推荐按 US1→US2→US3 顺序（US2 的能力集合喂给 US1 注册 payload 更完整；US3 的变更上报建立在 US2 集合之上）。若人力充足，US2 的 `provider-discovery.ts` 可与 US1 的路由/Web 并行。\n- **Polish (P6)**：依赖目标 story 完成。\n\n### Story 内顺序\n\n- 测试（本 feature 要求）先写、先失败。\n- 契约/模型 → 服务/持久化 → 路由 → runner → Web。\n\n### 并行机会\n\n- T002 与 T001 可并行；T003/T004/T005 之间大体可并行（同文件注意合并）；T007 与 T008 并行；US1 的 T016/T017 与 US2 的 `provider-discovery` 子任务跨文件可并行；各 story 的 `[P]` 测试可并行。\n\n---\n\n## Implementation Strategy\n\n### MVP First（US1）\n\n1. Setup → 2. Foundational（关键，阻塞）→ 3. US1 → **停下独立验证**：注册/去重/列表/重命名 → demo。\n\n### 增量交付\n\nFoundational 就绪后：US1（纳管闭环，MVP）→ US2（真实可用 Provider 能力）→ US3（online/offline + 变更上报）。每个 story 独立加值、不破坏前者。\n\n---\n\n## 映射校验（Traceability）\n\n- US1 ⇄ FR-001~006, SC-001；US2 ⇄ FR-010~016, SC-002/003/005；US3 ⇄ FR-020~023, SC-004。\n- 契约/实现边界 FR-030~034（TS-only、来源无关、分离概念、无执行/授权、SecretProvider 兼容）贯穿 Foundational 与 Polish（T003-T006、T039）。\n- 契约测试要点 ⇄ T013/T014/T021/T022/T030/T031。\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
  </body>
</html>
