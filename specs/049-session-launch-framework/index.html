    <script id="spec-data" type="application/json">{"feature":"049-session-launch-framework","title":"049-session-launch-framework","prototypeHref":"mockups/index.html","generatedAt":"2026-08-10T09:21:20.328Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：Session 发起、多消息执行与状态回报\n\n**功能分支**: `049-session-launch-framework`\n**创建日期**: 2026-08-09\n**修订日期**: 2026-08-10\n**状态**: 已实现\n**输入**: Control Plane 在一个数据库事务中创建 Session、冻结 system prompt 与第一条 user message；事务提交后由指定 Runtime 通过 Provider 执行；Session 支持后续串行 user message；全部经过校验、限长和脱敏的 Session 领域事件持久化。\n\n## 合同摘要\n\nSession 是 Team-scoped、独立于 Task 与 Project 的持久化会话。一次发起明确选择 Runtime、Provider、Agent、Context 四个互不推导的执行输入，并同时提供第一条 user message。\n\nMystra 不定义 `Turn`、`turnId`、`SessionTurn` 或 Turn CRUD。每条 user message 具有消息身份 `messageId`，只用于命令幂等及关联该消息触发的 response、tool、usage、interrupt 和 result 事件；它不是独立业务对象或外键目标。首条消息与 Session 使用同一个创建事务；后续消息通过 `sendMessage` 追加。\n\n| 输入 | 所有者 | 发起时冻结的内容 | system prompt 贡献 |\n| --- | --- | --- | --- |\n| Runtime | 平台/Runtime | Runtime ID、类型、执行能力快照 | workspace 与执行环境约束 |\n| Provider | Runtime capability | Provider key、协议/adapter 能力快照 | Provider 能力、限制与交互约束 |\n| Agent | Team | Agent ID、revision、system prompt 快照 | Agent 定义的行为指令 |\n| Context | Session | 可选 Project、Task 与手工上下文快照 | 作为转义后的不可信业务上下文数据 |\n\n这里的 `launch` 是 Control Plane 的 canonical application command `SessionService.launch`：它校验参数，解析 feature 048 attachment，组装 system prompt，并在一个数据库事务中写入 Session、`session.created`、`session.system_prompt_configured`、`session.workspace_attached` 和第一条 `session.user_message_submitted`，然后返回 `queued`。Runtime claim 与 Provider 网络调用只能在该事务提交后发生，数据库事务不得跨 Runtime/provider I/O。\n\n049 当前只支持 Task-bound Session。launch 必须绑定 feature 048 已准备的共享 Task Workspace，并持久化统一的 Workspace attachment 证据。Project-only Session 与既不引用 Task 也不引用 Project 的 Session 延后；未来它们仍使用同一 Workspace/attachment 合同，只是 Workspace 准备逻辑不同，049 不提前定义该逻辑。\n\n`Session.state` 是当前查询投影；`SessionEvent` 是 Session-scoped、类型化、不可变事实历史。它不是全局活动流或通用日志平台。\n\n## 使用场景与测试\n\n### 场景 1：原子创建 Session、system prompt 与第一条 user message（P1）\n\n1. Runtime online、Provider available、Agent active、Task Workspace ready 且 Team 边界有效时，`launch` 必须在一个事务内写入 Session、`session.created`、`session.system_prompt_configured`、`session.workspace_attached` 与 `session.user_message_submitted`，并把 Session 置为 `queued`、`activeMessageId` 指向首条消息。\n2. 相同 `sessionId` 与完全相同的 launch payload 重试时返回原 Session 与 `created:false`；不同 payload 返回稳定冲突。\n3. 任一校验或事务写入失败时不得留下部分 Session 或事件。\n4. 数据库事务提交后，指定 Runtime 才能 claim；其他 Runtime 不得领取。\n5. Runtime/Provider 失败不回滚已提交的创建事实，而以 SessionEvent 更新 Session 为 `failed`。\n\n### 场景 2：同一 Session 串行接收后续 user message（P1）\n\n1. Session 为 `ready` 时，`sendMessage(messageId, content)` 原子追加 `session.user_message_submitted`，并更新为 `message_pending`。\n2. 相同 `(sessionId,messageId)` 与相同内容重试是幂等重放；不同内容是冲突。\n3. 同一 Session 同时只允许一个 active message/response；`message_pending | running | waiting_for_handoff` 不接收无关联的新消息。\n4. 同一有效 lease 内，后续消息复用 Provider session；lease 切换可产生新的 Provider session，但不改变 Session 身份。\n5. 消息完成、取消或可恢复失败后，如没有下一条 user message，Session 回到 `ready`，Runtime 当前执行槽立即让出。\n\n### 场景 3：冻结且可审计的 system prompt（P1）\n\n1. 四个选择按固定顺序渲染，组件快照与最终文本写入 `session.system_prompt_configured`。\n2. Project、Task 与手工 Context 只是显式标记的不可信数据，不得覆盖系统指令。\n3. launch 后 Agent、Project 或 Task 更新不改变该 Session 已冻结的 system prompt。\n4. 第一条 user message 是独立事件，不拼入 system prompt，也不需要二次 `sendMessage`。\n\n### 场景 4：Runtime 使用 Task Workspace 并通过 Provider 执行（P1）\n\n1. Session 只能使用 ready TaskWorkspace 的 `runtimeId/taskWorkspaceId/workspaceRef/shared-mutable`，不得创建 Session 专属目录。\n2. Runtime 解析 attachment 后启动 Provider，并执行 launch 已持久化的首条 user message。\n3. launch 不引用 Task 时必须失败关闭；不得临时发明第二套 Workspace 类型或准备路径。\n4. 当前 concrete adapter 必须覆盖已启用的 Codex/Copilot CLI Provider，并保留 provider-neutral session boundary；未来外部协议即使使用 prompt turn，也不得把它引入 Mystra 领域合同。\n\n### 场景 5：状态与 Runtime 资源释放（P1）\n\n1. `queued -> dispatched` 表示 Runtime 已取得 ownership lease。\n2. 首条消息在 launch 时已等待执行，因此 `session.provider_started` 后进入 `message_pending` 或直接 `running`，不得先错误地投影为 `ready`。\n3. `session.response_started` 使 Session 进入 `running`。\n4. `session.response_completed | session.response_canceled` 清空 `activeMessageId`、记录 `lastMessageId`，使 Session 回到稳定态 `ready`。\n5. `ready` 不是终态；它表示 Provider 会话可以继续接收消息，但当前没有执行占用。\n6. `closed | failed` 才是 Session 终态。Runtime 丢失且无法恢复时失败关闭，不自动迁移。\n7. 049 不持久化、配置或执行 Runtime capacity/slot 限制；capacity 是未来 Runtime capability。lease 只表达执行 ownership 与鉴权，不是容量预留。\n\n### 场景 6：类型化 SessionEvent 历史（P1）\n\n1. Runtime 以至少一次方式回报 lifecycle、provider、response、tool、usage、interrupt、handoff、error 与 result 事件。\n2. Control Plane 按 event ID/source sequence 幂等追加，并在同一事务中更新 Session 投影。\n3. 每个事件与每批请求必须通过共享 Zod schema、大小上限与脱敏规则；二进制内容使用 Artifact 引用。\n4. Team 授权调用方可分页读取一个 Session 的全部已接受事件；不提供跨 Session 搜索、全局活动流、任意 stdout/stderr 存储或日志 API。\n\n## Session 状态模型\n\n```text\nlaunch(first message)\n  -> queued -> dispatched -> message_pending -> running -> ready\n                                    |              |        |\n                                    |              +-> interrupted\n                                    |                      |-> running (resume_message)\n                                    |                      +-> message_pending (new_message)\n                                    +-----------------> waiting_for_handoff\n\nready + sendMessage -> message_pending\n任意非终态 -> closed | failed\n```\n\n| state | 含义 |\n| --- | --- |\n| `queued` | Session 与首条消息已持久化，等待指定 Runtime claim |\n| `dispatched` | Runtime 已取得 lease，尚未确认 Provider 可执行 |\n| `message_pending` | user message 已持久化，等待 Provider 开始响应 |\n| `running` | Runtime/Provider 正在处理 `activeMessageId` |\n| `ready` | 当前消息已结束，可接收下一条消息；当前执行槽已释放 |\n| `interrupted` | 当前 response 等待输入、审批或外部动作，或因 refusal/limit 停止 |\n| `waiting_for_handoff` | 人类接管工作所有权 |\n| `closed` | Session 已正常关闭 |\n| `failed` | Session 无法继续的不可恢复错误 |\n\n## 功能需求\n\n- **FR-001**：提供 canonical `launch`、`sendMessage`、Session read、close 与 SessionEvent read；具体 Web/CLI/MCP 入口由后续规格拥有。\n- **FR-002**：launch 必须显式给出调用方生成的 `sessionId`、Runtime、Provider、Agent、包含必填 `taskId` 的 Context，以及 `firstUserMessage { messageId, content }`。\n- **FR-003**：Session 是 Team-scoped 同级对象，不归属于 Project、Task、Agent 或 Runtime。\n- **FR-004**：Runtime 必须 online，Provider 必须 available，Agent 必须 active 且同 Team；Task-bound Runtime 还必须匹配 feature 048 Workspace affinity。\n- **FR-005**：Project/Task 分别按 Team 校验；不得从 Task 推导 Session Project。\n- **FR-006**：launch 必须先规范化全部输入，再在一个 RDB 事务中写入 Session 与四个初始事件；事务不得包含 Runtime/provider 网络 I/O。\n- **FR-007**：相同 `sessionId` 与相同 launch payload是重放；不同 payload 冲突；不增加 fingerprint/hash 固定字段。\n- **FR-008**：launch 成功立即返回 `queued`，不等待 Runtime。\n- **FR-009**：Mystra 领域合同不得出现 `Turn`、`turnId`、`SessionTurn` 或 Turn CRUD。\n- **FR-010**：每条 user message 使用 `messageId` 作幂等和事件关联；它不是业务实体或外键。\n- **FR-011**：Session 原生支持串行多次 `sendMessage`；相同 `(sessionId,messageId)` 同 payload 重放、不同 payload 冲突。\n- **FR-012**：首期不得并行处理两条 user message；后续 message 只允许在 `ready` 或允许 `new_message` 的 `interrupted` 状态提交。\n- **FR-013**：Control Plane 通过按 Runtime type 注册的 dispatcher 投递；host runner 只是 Runtime 实现。\n- **FR-014**：claim 只返回请求 `runtimeId` 对应的 queued Session，并用原子 lease 防止重复执行。\n- **FR-015**：`SessionDispatchLease` 只保存 ownership/auth 所需数据；不得包含 capacity slot。Workspace identity 来自统一 attachment 合同，不由 lease 重新定义。\n- **FR-016**：049 不定义 Runtime capacity 数字、默认并发值、平台限制或调度配额。\n- **FR-017**：Runtime 必须重新确认 Provider available/capability；不兼容时失败，不静默回退。\n- **FR-018**：Provider execution 必须通过 ProviderSessionAdapter；当前 concrete adapter 覆盖已启用的 Codex/Copilot CLI，同一有效 lease 内保持一个 Provider session 并串行处理消息。\n- **FR-019**：每个 adapter 必须显式生成 start 与 continuation command；system prompt 只在 start command 与首条 user message 一起交付，continuation 不得重复注入 system prompt。\n- **FR-020**：system prompt 四部分按固定顺序生成；完整内容只保存在类型化事件中。\n- **FR-021**：launch 必须持久化 `session.workspace_attached`，引用 feature 048 的 `taskWorkspaceId/runtimeId/workspaceRef/shared-mutable`。\n- **FR-022**：049 必须拒绝缺少 Task 的 launch。Project-only Session 与 standalone Session 延后；未来必须复用同一 Workspace/attachment 合同，只允许准备逻辑不同，不得新增 parallel temporary-workspace model。\n- **FR-023**：Runtime 为上报事件生成稳定 event ID 与来源流连续序号，并至少一次重试。\n- **FR-024**：Control Plane 持久化所有经 schema 校验、限长、脱敏的 Session 领域事件，并提供 Team 授权的 Session-scoped 分页读取。\n- **FR-025**：SessionEvent 保存 `sessionId`、可选 `messageId`、全局/source sequence、kind/version、payload/metadata 与时间戳。\n- **FR-026**：事件追加事务必须完成 lease 校验、幂等去重、序号连续性、状态转换、Session 投影更新与插入。\n- **FR-027**：Session 行只物化 state、activeMessageId、lastMessageId、interruptKind、continuationMode、failureCode、metadata 与 updatedAt；不保存 providerSessionId、workspaceRef、stopReason、完整 prompt/result/error 或事件游标。\n- **FR-028**：response 完成/取消后必须释放 Runtime 当前执行占用并回到 `ready`；idle Session 不构成 049 的 capacity reservation。\n- **FR-029**：`interrupted` 使用 `resume_message | new_message` 指示下一动作；`waiting_for_handoff` 专门表示人类接管。\n- **FR-030**：Runtime 把 Provider 结束原因规范化到 result/interruption 事件，不投影成 Session 固定字段。\n- **FR-031**：租约过期且 Runtime offline 时追加失败事件，不自动迁移、回退或重试。\n- **FR-032**：跨 Team、错误 Runtime/lease/Session 的回报失败关闭，不泄漏其他 Team 对象。\n- **FR-033**：pre-0.1 旧 Session/Turn/单轮结果合同直接替换，不保留兼容路径。\n\n## 核心实体\n\n- **Session**：唯一会话业务对象；保存执行选择引用和当前状态投影。\n- **SessionEvent**：Session-scoped 类型化事实账本；user message、response、过程与结果均在此表达。\n- **SessionDispatchLease**：Runtime 的执行 ownership/auth 操作记录；不是 capacity reservation。\n- **SessionWorkspaceAttachment**：launch 的持久化 Workspace 选择证据；049 的唯一来源是 feature 048 TaskWorkspace。\n- **SessionEventStream / SessionEventHead**：来源幂等游标与 Session 全局事件序号头。\n- **ProviderSessionAdapter**：生成 Provider start/continue command 并解析 process result；Runtime worker 把结果转换为统一 SessionEvent。\n- **RuntimeSessionDispatcher**：向不同 Runtime 类型投递 Session 的边界。\n\n## 事件目录 v1\n\n| 事件 | `messageId` | 作用/Session 投影 |\n| --- | --- | --- |\n| `session.created` | 无 | 保存选择、引用与创建快照；`queued` |\n| `session.system_prompt_configured` | 无 | 保存四组件与最终 system prompt |\n| `session.user_message_submitted` | 必填 | 保存第一条或后续 user message；设置 activeMessageId |\n| `session.runtime_dispatched` | 无 | Runtime 取得 lease；`dispatched` |\n| `session.workspace_attached` | 无 | feature 048 TaskWorkspace attachment 证据 |\n| `session.provider_started` | 无 | 当前 lease 保存 Provider Session ID；首条消息继续待执行 |\n| `session.response_started` | 必填 | Provider 开始响应；`running` |\n| `session.agent_message_chunk` / `session.agent_thought_chunk` | 必填 | 输出与思考流 |\n| `session.plan_updated` | 必填 | 计划变化 |\n| `session.tool_call` / `session.tool_call_updated` | 必填 | 工具调用与进展 |\n| `session.usage_updated` | 必填 | token/成本用量 |\n| `session.input_requested` / `session.input_received` | 必填 | 补充信息请求/响应 |\n| `session.approval_requested` / `session.approval_resolved` | 必填 | 工具或权限审批 |\n| `session.interrupted` / `session.resumed` | 必填 | 中断与恢复 |\n| `session.handoff_requested` / `session.handoff_accepted` / `session.handoff_completed` | 必填 | 人工接手 |\n| `session.response_completed` | 必填 | 响应完成；清空 activeMessageId，回到 `ready` |\n| `session.response_canceled` | 必填 | 当前响应取消；可继续则回到 `ready` |\n| `session.response_failed` | 必填 | 响应或 Session 不可恢复失败 |\n| `session.close_requested` / `session.closed` | 无 | 主动关闭；`closed` |\n| `session.runtime_lost` / `session.failed` | 可选 | Session 基础设施失败；`failed` |\n\n## 假设与依赖\n\n- 044 提供 Runtime enrollment、存活状态与 Provider discovery；048 提供 Task Workspace setup 与 Runtime materialization；046 提供 Agent；047 提供 Project/Task 数据。\n- host runner 代表注册所得 `runtimeId` 实现 claim、Task Workspace ref resolution 与事件回报。\n- Runtime capacity 当前不限制、不持久化、不作为 claim 输入；未来由 Runtime capability 规格定义。\n- 已接受的类型化事件进入 Session 历史；归档、压缩与冷存储另行设计。\n\n## 范围之外\n\n- Web/CLI/MCP 具体入口与推荐策略。\n- Project repository policy、Task Workspace clone/worktree、交付、preview 与 PR。\n- prompt 效果优化、RAG、skills/knowledge/secret 注入。\n- Turn/SessionTurn、并行消息、自动重试、跨 Runtime 迁移、工作流、多 Agent 编排。\n- Project-only Session、既无 Task 也无 Project 的 Session，以及它们各自的 Workspace 准备策略；未来仍复用统一 Workspace/attachment 合同。\n- Runtime capacity、slot、配额与调度策略。\n- 跨 Session 活动流/搜索、任意 stdout/stderr 日志、日志产品、事件归档/导出。\n- Hosted remote ACP transport。\n\n## 成功标准\n\n- **SC-001**：有效 launch 100% 产生唯一 Session 与四个初始事件；无效组合产生 0 条部分记录。\n- **SC-002**：20 个相同 sessionId 并发 launch 只产生 1 条 Session；不同 payload 全部冲突。\n- **SC-003**：首条 user message 无需二次 API 即被指定 Runtime/Provider 执行。\n- **SC-004**：同一 Session 连续执行至少 3 个 messageId，Provider session 在有效 lease 内不变；数据库和 API 没有 Turn。\n- **SC-005**：20 个相同 messageId 并发 sendMessage 只产生 1 个 user-message event 和 1 次执行。\n- **SC-006**：response 完成/取消后 Session 回到 ready 且 Runtime 当前执行占用已释放；ready 仍可接收下一条消息。\n- **SC-007**：Session 表没有 system prompt、message 内容、result、event cursor、workspaceRef 或 capacity 字段。\n- **SC-008**：1 万条合法类型化事件与输入一一对应；全批重放新增行数为 0。\n- **SC-009**：所有 049 launch 都引用 ready TaskWorkspace 并复用其 attachment；缺少 Task 的 launch 100% 失败关闭，且没有第二套 temporary workspace 类型。\n- **SC-010**：SQLite/PostgreSQL 对 Session/Event/Lease 唯一性、事务与有序读取结果一致；未运行 PostgreSQL 时明确标记未验证。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# Feature 049 摘要\n\n- `launch` 在一个 RDB 事务中创建 Session、system prompt 与第一条 user message；提交后再由 Runtime/Provider 执行。\n- 领域合同没有 Turn、turnId、SessionTurn 或 Turn API；messageId 仅用于消息幂等和事件关联。\n- Session 串行支持后续 `sendMessage`，同一有效 lease 复用 Provider session。\n- `ready` 是一条 response 结束后的可继续稳定态，不是终态；此时 Runtime 当前执行占用已释放。\n- 049 不限制或持久化 Runtime capacity/slot；lease 只表达 ownership/auth。\n- 049 只支持 Task-bound Session，复用 feature 048 的统一 Workspace attachment；Project-only 与 standalone Session 延后，未来只允许准备逻辑不同，不新增 temporary Workspace 类型。\n- Team 授权调用方可以读取 Session-scoped、类型化、限长、脱敏的完整 SessionEvent 历史。\n- 不提供跨 Session 活动流、日志 API、任意 stdout/stderr、Turn、并行消息、自动重试或跨 Runtime 迁移。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# Feature 049 Readiness Checklist\n\n- [x] launch 同事务创建 Session、system prompt 与第一条 user message。\n- [x] Runtime/provider I/O 明确发生在事务提交后。\n- [x] 领域合同无 Turn/SessionTurn；messageId 只用于幂等与事件关联。\n- [x] ready/closed/failed 语义及 response 后执行占用释放明确。\n- [x] Runtime capacity/slot 明确排除并留给未来 Runtime capability。\n- [x] 049 只支持 Task-bound Session；未来非 Task 仍复用统一 Workspace 合同。\n- [x] Session-scoped typed event history 与日志/全局活动流边界明确。\n- [x] requirements checklist 按新版 spec 重新核验。\n- [x] plan-eng-review 按新版 plan 重新执行并通过。\n- [x] `/speckit.tasks` 仅在工程评审通过后生成。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# Prototype\n\n_specs/049-session-launch-framework/prototype.md is not present for this spec yet._\n\n[Open current standalone prototype](mockups/index.html)","action":{"label":"Open Prototype","href":"mockups/index.html"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# 实施计划：Session 发起、多消息执行与状态回报\n\n**分支**: `049-session-launch-framework` | **日期**: 2026-08-10 | **规格**: [spec.md](./spec.md)\n\n## 摘要\n\n049 建立 canonical Session execution path。`SessionService.launch` 校验 Runtime、Provider、Agent、Context 与 TaskWorkspace，组装 system prompt，并在一个短 RDB 事务中创建 Session、system prompt 与第一条 user message。事务提交后，指定 Runtime claim、准备 workspace、启动 Provider，并执行首条消息。后续 `sendMessage` 串行复用同一 Provider session。\n\n领域模型没有 Turn/SessionTurn。messageId 仅承担消息幂等与事件关联。049 当前只支持 Task-bound Session，并复用 feature 048 的统一 Workspace attachment。Project-only 与 standalone Session 延后；未来仍使用同一 Workspace 合同，只允许准备逻辑不同。SessionEvent 作为 Team 授权、Session-scoped、类型化历史持久化，不成为通用日志平台。\n\n## 技术上下文\n\n- TypeScript 5.9、Node.js 24.14.0、Zod 4、Prisma 7.9.1、Next.js 16 Route Handlers、Vitest 4、Node child_process；当前 concrete Provider 为 Codex/Copilot CLI，不新增 ACP SDK。\n- SQLite 与 PostgreSQL/Supabase-backed PostgreSQL 经 `RdbProvider`。\n- 依赖 044 Runtime/Provider capability、046 Agent、047 Task Context、048 Task Workspace。\n- 无 Turn、无 capacity/slot 合同、无第二套 temporary workspace、无跨 Session 活动流。\n\n## 关键数据流\n\n```text\nCaller\n  -> SessionService.launch(sessionId, runtime, provider, agent, context, firstUserMessage)\n      -> authorize + validate + assemble system prompt\n      -> RDB transaction:\n           Session(queued, activeMessageId)\n           session.created\n           session.system_prompt_configured\n           session.workspace_attached\n           session.user_message_submitted\n      -> commit and return\n\nRuntime\n  -> claim(runtimeId) [ownership lease, no capacity input]\n  -> resolve feature 048 Task workspace attachment\n  -> start ProviderSessionAdapter\n  -> execute first message\n  -> append typed SessionEvents\n  -> response completes; Session ready; current execution slot released\n\nCaller -> sendMessage(messageId, content) -> event + message_pending -> Runtime executes\n```\n\n数据库事务与 Runtime/provider I/O 明确分段。provider 调用失败通过后续事件收敛，不回滚已提交的 Session 创建事实。\n\n## 模块边界\n\n| 责任 | 目标位置 |\n| --- | --- |\n| Session domain schema/events/state machine | `packages/shared/src/session.ts` 与既有 exports |\n| RdbProvider domain operations | `apps/control-plane/src/lib/db/rdb-provider.ts`、`prisma-provider.ts` 与双 Prisma schema |\n| launch/sendMessage/read | `apps/control-plane/src/lib/sessions/session-service.ts` |\n| system prompt assembly | `apps/control-plane/src/lib/sessions/system-prompt-assembler.ts` |\n| claim/lease/event ingest | `apps/control-plane/src/lib/sessions/runtime-session-service.ts` |\n| Provider session adapter contract/registry | `packages/agent-adapters/src/*`，直接扩展既有 Codex/Copilot adapter |\n| host execution and Workspace ref resolution | `apps/runner-daemon/src/session/*` |\n| authenticated Runtime claim/event protocol | `apps/control-plane/app/api/runner/sessions/*` |\n\n## 状态与事件\n\n首条消息使 Session 从创建起就有 activeMessageId：\n\n`queued -> dispatched -> message_pending -> running -> ready`\n\n后续 `sendMessage`：\n\n`ready -> message_pending -> running -> ready`\n\n`ready` 是可继续对话的稳定态，不是终态。response 完成/取消后 Runtime execute 调用返回并释放当前执行占用。`closed | failed` 才终结 Session。\n\n核心事件：`created`、`system_prompt_configured`、`user_message_submitted`、`runtime_dispatched`、`workspace_attached`、`provider_started`、`response_started`、typed streaming/tool/usage、`interrupted|resumed`、handoff、`response_completed|canceled|failed`、`closed|failed`。\n\n## Workspace\n\n- 049 launch 必须引用 Task，并在事务中冻结 feature 048 attachment 证据。Runtime 必须匹配，使用同一个 opaque workspaceRef，不创建 Session 专属目录。\n- 缺少 Task 的 launch 失败关闭。Project-only 与 standalone Session 的 Workspace 准备策略延后，但未来仍复用同一 Workspace/attachment contract，不新增 parallel temporary model。\n\n这里的 launch 指 SessionService application command；“prepare workspace”和“start provider”才是 Runtime 动作。\n\n## Runtime ownership 与 capacity\n\n`SessionDispatchLease` 只解决多个执行进程竞争同一 Session、事件上报鉴权与失联判断。claim 请求没有 `availableSlots`，lease 没有 slot 字段。049 不限制 Runtime capacity；未来 capacity capability 可控制 Runtime 何时 claim，但不得改变 Session 状态或把 idle Session 解释为占用槽位。\n\n## Provider adapter\n\n```ts\ninterface ProviderSessionAdapter {\n  readonly providerName: string;\n  buildStartCommand(input: ProviderSessionStartRequest): ProviderSessionCommand;\n  buildContinueCommand(input: ProviderSessionContinueRequest): ProviderSessionCommand;\n  parseResult(result: ProviderProcessResult): ProviderSessionParsedResult;\n}\n```\n\nCodex/Copilot CLI 每条消息启动一个有界 child process；continuation command 使用 lease 中保存的 providerSessionId。进程完成即释放当前 Runtime 执行占用，Session 保持 ready。未来 ACP adapter 即使内部使用 protocol turn，也不得向领域层暴露 Turn。\n\n## 持久化顺序\n\n1. Session/Event/EventHead 同事务创建与追加；launch 固定写入 created、system prompt、workspace attachment、first user message 四个事件。\n2. `session.user_message_submitted` 对 `(sessionId,messageId)` 唯一。\n3. Event batch 事务验证 lease、source sequence、activeMessageId 与状态转换。\n4. SessionDispatchLease 保存 runtimeId/tokenHash/times/providerSessionId，不保存 capacity 或 workspaceRef。\n5. SQLite/PostgreSQL 使用相同领域合同；Prisma 类型不越过 RdbProvider。\n\n## 实施顺序\n\n1. 共享 Session/SessionEvent/Zod schema 与状态 reducer。\n2. SQLite/PostgreSQL Session/Event/Lease/EventStream/EventHead schema 与 provider tests。\n3. canonical SessionService launch/read/sendMessage/close。\n4. Runtime claim/event-ingest/lease lifecycle。\n5. Task attachment resolution 与 Runtime Workspace ref resolution。\n6. 扩展既有 provider adapter，增加 Codex CLI 与 Copilot CLI start/continue command contract；fake process 只用于确定性测试，ACP concrete transport 不在当前 enabled Provider 集合内。\n7. host runner execution loop 与 typed event mapping。\n8. E2E：launch 首消息、两次 continuation（总计三条消息）、中断/恢复/handoff、close/failure、事件重放。\n\n## 验证\n\n- RDB：20 路 sessionId/messageId 并发重放与冲突；1 万事件；projection 原子性；无 Turn/capacity/parallel temporary-workspace schema。\n- Domain：全部合法/非法状态转换；ready 稳定态与 closed/failed 终态。\n- Runtime：无 capacity 参数 claim；Task attachment affinity；缺少 Task 拒绝 launch；response 后释放执行占用。\n- Provider：同 providerSessionId 串行多 message；进程 cwd/argv/cancel/failure 映射正确；不泄漏 turn 概念。\n- Security：Team boundary、lease token、schema limit、redaction、Artifact 引用。\n\n## 工程评审状态\n\n2026-08-10 重新评审通过。评审修正了初始事件计数、真实 RDB 路径、现有 adapter 复用、旧 Session 合同直接替换、Runtime liveness/TOCTOU 与 batch/分页上限。详见 [checklists/engineering-review.md](./checklists/engineering-review.md)。\n\n## NOT in scope\n\n- Project-only 与 standalone Session Workspace 准备策略，等待后续规格但继续复用统一 Workspace contract。\n- Runtime capacity、slot、配额和调度上限，本功能不持久化也不配置这些能力。\n- ACP concrete transport，当前启用的 concrete Provider 仍是 Codex/Copilot CLI。\n- Web/CLI/MCP operator surface，由 050 直接复用本功能 Session/SessionEvent 合同。\n- 全局 event 搜索、stdout/stderr 日志产品、归档、冷存储与跨 Runtime 自动迁移。\n\n## GSTACK REVIEW REPORT\n\n| Review | Trigger | Why | Runs | Status | Findings |\n|--------|---------|-----|------|--------|----------|\n| CEO Review | `/plan-ceo-review` | Scope & strategy | 0 | — | owner scope decisions already explicit |\n| Codex Review | `/codex review` | Independent 2nd opinion | 0 | skipped | local Codex binary unavailable |\n| Eng Review | `/plan-eng-review` | Architecture & tests (required) | 1 | CLEAR | 10 issues resolved, 0 critical gaps |\n| Design Review | `/plan-design-review` | UI/UX gaps | 0 | — | 049 has no operator UI |\n| DX Review | `/plan-devex-review` | Developer experience gaps | 0 | — | — |\n\n**UNRESOLVED:** 0\n\n**VERDICT:** IMPLEMENTED AND VERIFIED；仅真实 PostgreSQL/Supabase connectivity 与真实 Codex CLI 因本机条件未验证。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks: Session 发起、多消息执行与状态回报\n\n**Input**: Design documents from `/specs/049-session-launch-framework/`\n**Prerequisites**: `plan.md`, `spec.md`, `research.md`, `data-model.md`, `contracts/`\n**Tests**: 本功能按 TDD 实施；每个行为任务先写失败测试，再实现。\n\n## Format: `[ID] [P?] [Story] Description`\n\n- **[P]**: 可与同阶段其他不同文件任务并行。\n- **[US1]**: 原子 launch、冻结 prompt 与首条消息。\n- **[US2]**: 串行后续消息与 Provider Session 复用。\n- **[US3]**: Runtime claim、执行、typed event ingest 与状态回报。\n- **[US4]**: 关闭、失败、历史读取与恢复边界。\n\n## Phase 1: Setup & Contract Reconciliation\n\n- [x] T001 运行并记录 `RdbProvider`、`PrismaRdbProvider`、`sessionStateSchema`、`SessionEvent`、`ProviderAdapter`、`runDaemon`、`resolveSessionAttachment` 的 GitNexus upstream impact 到 `specs/049-session-launch-framework/checklists/engineering-review.md`\n- [x] T002 核对并删除 pre-0.1 旧 Session/Runner/summary 合同的并行导出计划，在 `specs/049-session-launch-framework/checklists/engineering-review.md` 固化直接替换清单\n- [x] T003 [P] 核对 Codex/Copilot 官方 continuation/session 命令能力与当前本地 adapter，并更新 `specs/049-session-launch-framework/research.md`\n- [x] T004 [P] 运行 `git diff --check`、Spec-Kit prerequisites 与 048 attachment consistency search，更新 `specs/049-session-launch-framework/checklists.md`\n\n---\n\n## Phase 2: Foundational Domain, Persistence & Adapter Contracts\n\n**Purpose**: 所有 user story 共用的唯一 Session/SessionEvent 合同、双数据库结构与 Provider session boundary。\n\n- [x] T005 [P] 先写 Session state、launch/message input、strict typed event、payload size/redaction、无 Turn/capacity 字段测试到 `packages/shared/src/session.test.ts`\n- [x] T006 实现 canonical Session/SessionEvent/runner protocol schemas 与 reducer 到 `packages/shared/src/session.ts`、`packages/shared/src/state.ts`、`packages/shared/src/events.ts` 和 `packages/shared/src/index.ts`\n- [x] T007 [P] 先写 legacy single-run Session/Runner/summary export removal 回归测试到 `packages/shared/src/management.test.ts`、`packages/shared/src/schemas.test.ts` 与 `apps/control-plane/src/lib/db/removed-persistence.test.ts`\n- [x] T008 直接替换旧 `SessionRecord`/terminal state/runner capacity/coordination summary 合同及死调用者到 `packages/shared/src/management.ts`、`packages/shared/src/schemas.ts`、`packages/shared/ r，并以至少一次方式回报 typed events。\n\n**Independent Test**: fake Provider 从 claim 执行首条消息并回报 response events；foreign Runtime/lease、source gap、oversize/secret payload 均拒绝且不漂移 projection。\n\n- [x] T028 [P] [US3] 先写 Runtime claim、existing lease renewal、foreign Runtime、race、expiry、provider unavailable 测试到 `apps/control-plane/src/lib/sessions/runtime-session-service.test.ts`\n- [x] T029 [P] [US3] 先写 event batch lease auth、source sequence、eventId replay、state reducer、redaction/size 与 rollback 测试到 `apps/control-plane/src/lib/sessions/runtime-session-service.test.ts`\n- [x] T030 [US3] 实现 `RuntimeSessionService.claim/appendEvents` 到 `apps/control-plane/src/lib/sessions/runtime-session-service.ts`\n- [x] T031 [US3] 接入 runner identity、derived Runtime liveness 与 db 到 `apps/control-plane/src/lib/sessions/runtime-session-service-factory.ts`\n- [x] T032 [P] [US3] 先写 authenticated claim/event HTTP route contract 测试到 `apps/control-plane/app/api/runtime-session-routes.test.ts`\n- [x] T033 [US3] 实现 `POST /api/runner/sessions/claim` 到 `apps/control-plane/app/api/runner/sessions/claim/route.ts`\n- [x] T034 [US3] 实现 `POST /api/runner/sessions/[sessionId]/events` 到 `apps/control-plane/app/api/runner/sessions/[sessionId]/events/route.ts`\n- [x] T035 [P] [US3] 先写 HTTP client、retry/idempotent batch、lease token header 与 secret-safe errors 到 `apps/runner-daemon/src/session/session-client.test.ts`\n- [x] T036 [US3] 实现 Runtime session HTTP client 到 `apps/runner-daemon/src/session/session-client.ts`\n- [x] T037 [P] [US3] 先写 argv/cwd spawn、bounded output、abort、Codex/Copilot event mapping 与 missing Workspace failure 测试到 `apps/runner-daemon/src/session/provider-process.test.ts` 和 `session-worker.test.ts`\n- [x] T038 [US3] 实现 safe provider child process 与 typed event mapping 到 `apps/runner-daemon/src/session/provider-process.ts`\n- [x] T039 [P] [US3] 先写 daemon claim fan-out、同 Session 去重、response release、graceful shutdown 与 retry 测试到 `apps/runner-daemon/src/session/session-loop.test.ts`\n- [x] T040 [US3] 实现 un         function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
  </body>
</html>
