    <script id="spec-data" type="application/json">{"feature":"039-github-project-onboarding","title":"039-github-project-onboarding","prototypeHref":"mockups/index.html?v=1785926190510","generatedAt":"2026-08-05T11:28:24.963Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：GitHub Project Onboarding\n\n**Feature Branch**: `039-github-project-onboarding`  \n**Created**: 2026-08-05  \n**Status**: Approved for planning  \n**Input**: 在 Settings 连接 GitHub App；点击 Add Project 打开 Modal；默认从 GitHub 选择仓库；选定后收起列表并显示关联仓库及其他配置；设置项沿用 Castrel Settings Modal 的业务布局与密度。\n\n## 用户场景与验收\n\n### User Story 1 - 连接 GitHub App（Priority: P1）\n\n作为 Mystra 操作者，我希望在 Settings 中连接 GitHub App，以便 Mystra 只访问我明确安装并授权的仓库。\n\n**Why this priority**：仓库发现与后续交付都依赖有效连接；没有连接时，创建 Project 不能诚实地继续。\n\n**Independent Test**：从未连接状态进入 Settings，完成 GitHub 授权和安装校验，返回后能看到连接账户、安装范围和连接状态。\n\n**Acceptance Scenarios**：\n\n1. **Given** 尚未连接 GitHub，**When** 操作者打开 Settings 的 Integrations，**Then** 页面显示 GitHub App、未连接状态和 Connect 操作。\n2. **Given** 操作者开始连接，**When** GitHub 授权与安装校验成功，**Then** Mystra 显示已连接账户、安装标识和可用状态，且不展示任何访问令牌。\n3. **Given** 操作者可访问多个安装，**When** 校验返回多个候选安装，**Then** 操作者必须明确选择一个作为当前有效连接。\n4. **Given** 授权被取消、状态校验失败或安装不可访问，**When** 操作者返回 Mystra，**Then** 连接仍为未完成状态，并显示可恢复的错误和 Retry 操作。\n5. **Given** 已存在有效连接，**When** 操作者选择 Reconnect，**Then** 可以重新完成授权，但旧连接在新连接成功前不得被错误标记为新连接。\n\n---\n\n### User Story 2 - 在 Modal 中选择仓库（Priority: P1）\n\n作为 Mystra 操作者，我希望点击 Add Project 后在当前页面的 Modal 中选择 GitHub 仓库，以便不离开当前工作上下文就能开始配置 Project。\n\n**Why this priority**：这是本功能的主要入口，也是对当前内联创建页面的直接修正。\n\n**Independent Test**：从任意带 Add Project 入口的 shell 页面打开 Modal，确认地址不变、GitHub 默认选中，并能浏览和选择连接范围内的仓库。\n\n**Acceptance Scenarios**：\n\n1. **Given** shell 可见且没有创建 Modal，**When** 操作者点击 Add Project，**Then** 当前地址保持不变并打开创建 Modal。\n2. **Given** Modal 首次打开，**When** 来源选择器呈现，**Then** GitHub 默认选中；其他未来来源可以占位，但不得伪装成可用。\n3. **Given** GitHub 尚未连接，**When** Modal 尝试加载仓库，**Then** 显示连接前置条件和前往 Settings 的操作，不显示空白仓库列表。\n4. **Given** GitHub 已连接，**When** 仓库加载完成，**Then** 只显示当前 App 安装允许访问的仓库，并支持按名称筛选。\n5. **Given** 仓库加载中、无结果或请求失败，**When** 操作者查看选择区，**Then** 分别看到明确的 loading、empty 或 error 状态；错误状态提供 Retry。\n\n---\n\n### User Story 3 - 选定仓库后配置并创建 Project（Priority: P1）\n\n作为 Mystra 操作者，我希望选定仓库后只看到一个清晰的 Repository 设置项及其余 Project 配置，以便确认绑定关系并完成创建。\n\n**Why this priority**：仓库是 Project 的不可变来源；只有绑定明确后，其他配置才有业务意义。\n\n**Independent Test**：选择任意可访问仓库，确认仓库列表消失、Repository 行出现、其余配置展开；填写并提交后得到使用该仓库的 Project。\n\n**Acceptance Scenarios**：\n\n1. **Given** 仓库列表可见，**When** 操作者选择一个仓库，**Then** 列表隐藏，并显示 Repository 设置行，包含仓库标识、可见性和 Change 操作。\n2. **Given** Repository 设置行可见，**When** 操作者选择 Change，**Then** 返回仓库选择列表，原有非仓库配置保留。\n3. **Given** 仓库已选择，**When** 配置区展开，**Then** 显示 Project Name、Slug、Default Agent 和 Runtime 等现有业务配置，并使用紧凑的左说明/右控件设置行布局。\n4. **Given** 必填配置有效，**When** 操作者提交，**Then** 系统再次确认仓库仍属于当前连接范围，创建 Project，关闭 Modal，并导航到新 Project 详情。\n5. **Given** 仓库已失去访问权或提交失败，**When** 创建返回错误，**Then** Modal 保持打开、用户输入保留，并在相关位置显示可操作错误。\n\n---\n\n### User Story 4 - 以同一 App 连接完成交付（Priority: P1）\n\n作为 Mystra 操作者，我希望 Project 后续的 clone、push 和 PR 创建使用与仓库发现相同的 GitHub App 安装连接，以免创建成功后因另一套凭据失效而无法交付。\n\n**Why this priority**：仓库发现成功但 Runner 无法交付是假完成，会直接破坏 Project 的可执行性。\n\n**Independent Test**：用已连接 App 范围内的私有仓库创建 Project，启动一次受控 Session，验证仓库获取与交付均成功；撤销安装访问后，新的操作明确失败且不会回退到个人令牌。\n\n**Acceptance Scenarios**：\n\n1. **Given** Project 绑定有效 GitHub 安装连接，**When** Runner 需要 clone、push 或创建 PR，**Then** 使用该连接按需取得的短期安装凭据。\n2. **Given** 短期凭据已过期，**When** 新的仓库操作开始，**Then** 系统重新取得有效凭据，而不是复用过期值。\n3. **Given** 安装被撤销或仓库不再授权，**When** 发现或交付发生，**Then** 操作明确失败，不回退到个人访问令牌或调用者提供的 clone URL。\n4. **Given** 任意成功或失败路径，**When** 检查持久状态、日志、公共响应和交付证据，**Then** 不出现用户 OAuth token、App 私钥或安装访问 token。\n\n### Edge Cases\n\n- Modal 关闭后再次打开时，未提交草稿重置；已持久化的 GitHub 连接不受影响。\n- 仓库搜索对大小写不敏感；零匹配与安装范围为空使用不同说明。\n- 同名仓库以 `owner/name` 唯一显示和选择。\n- 仓库在列表加载后、提交前被删除、转移或撤销访问时，创建失败且要求重新选择。\n- GitHub 限流或暂时不可用时，保留 Modal 上下文并允许重试，不制造本地仓库快照。\n- 重复提交由界面阻止；服务端仍保证不会因一次用户动作创建多个 Project。\n- OAuth 回调中的未知、过期或不匹配状态被拒绝，不改变现有连接。\n- App 安装权限不足以完成仓库读取或 PR 交付时，连接状态明确说明权限问题。\n- 窄屏下设置行改为上下布局，但标签、说明、状态和操作顺序保持可理解。\n\n## Requirements\n\n### Functional Requirements\n\n- **FR-001**：Settings MUST 提供独立的 Integrations 分类，并展示 GitHub App 连接状态。\n- **FR-002**：系统 MUST 通过 GitHub 授权确认当前操作者有权绑定所选 App 安装；回调参数本身不得作为所有权证明。\n- **FR-003**：系统 MUST 在多个候选安装之间要求明确选择，MVP 同一时刻只保留一个当前有效 GitHub 连接。\n- **FR-004**：系统 MUST 只持久化连接所需的非秘密元数据，不持久化用户授权 token 或安装访问 token。\n- **FR-005**：Add Project MUST 打开 Modal，并保持触发时的页面地址和背景上下文。\n- **FR-006**：创建来源 MUST 默认选择 GitHub，并允许未来新增来源而不改变当前创建流程的结构。\n- **FR-007**：未连接 GitHub 时，Modal MUST 提供明确前置条件和打开 Settings 的操作。\n- **FR-008**：仓库列表 MUST 来自当前有效 App 安装连接，并且只包含安装可访问的远程仓库。\n- **FR-009**：仓库选择 MUST 支持 loading、filter、cursor 分页、empty、error 和 retry 状态；安装范围超过一页时操作者可以继续加载，直至目标仓库可选。\n- **FR-010**：仓库选定后，选择列表 MUST 隐藏并替换为 Repository 设置行；Change MUST 可恢复列表。\n- **FR-011**：只有仓库选定后，系统 MUST 展示 Project Name、Slug、Default Agent、Runtime 及其他现有 Project 配置。\n- **FR-012**：配置项 MUST 使用左侧标题/说明、右侧状态或控件的紧凑设置行；视觉语言使用 Mystra token，不复制 Castrel 品牌色。\n- **FR-013**：提交时系统 MUST 重新解析并校验远程仓库，不信任浏览器提交的 clone URL、默认分支或其他仓库快照字段。\n- **FR-014**：创建成功 MUST 关闭 Modal 并导航至新 Project；失败 MUST 保留已输入配置并显示就地错误。\n- **FR-015**：Project MUST 保留对其来源连接的稳定引用，以便后续仓库交付使用同一连接。\n- **FR-016**：仓库发现、clone、push 和 PR 创建 MUST 使用按需生成的短期 GitHub App 安装凭据。\n- **FR-017**：系统 MUST NOT 提供 `MYSTRA_GITHUB_TOKEN`、个人访问令牌或调用者 clone URL 的回退路径。\n- **FR-018**：秘密值 MUST NOT 出现在持久状态、日志、公共 API 响应、UI 或交付证据中。\n- **FR-019**：连接、仓库和 Project 创建失败 MUST 使用可恢复、可定位且不泄漏秘密的错误状态。\n- **FR-020**：Modal MUST 支持键盘焦点管理、Escape 关闭、可辨识标签和窄屏重排。\n- **FR-021**：`/projects` MUST 保留为 Project 列表/对象入口，不再承载内联创建表单。\n- **FR-022**：所有新增可见文案 MUST 提供英语和简体中文。\n\n### Key Entities\n\n- **Integration Connection**：一次由操作者确认的远程集成绑定；包含 provider、外部安装标识、账户信息、状态、权限摘要和时间信息，不包含秘密。\n- **Repository Candidate**：当前连接可访问且可供选择的远程仓库摘要；在创建前不是 Project 的持久来源事实。\n- **Repository Selection**：操作者在创建草稿中选定的 provider、connection 和远程仓库标识。\n- **Project**：Mystra 的持久配置对象；绑定一个由 provider 再次解析的不可变远程仓库快照，并引用其来源连接。\n- **Ephemeral Installation Credential**：为一次有限时间内的仓库操作生成的秘密，不构成业务实体，不进入持久层或公共表面。\n\n## Assumptions & Dependencies\n\n- 当前是私有、单节点 MVP，因此只管理一个当前有效 GitHub App 安装连接；公开多租户和 Team 管理不在本功能内。\n- GitHub App 的身份配置与私钥由服务端运行环境或既有秘密设施提供，不由 UI 上传或编辑。\n- 用户授权凭据只用于安装所有权验证，验证结束即丢弃。\n- Project 创建成功后继续沿用现有“导航到 Project 详情”行为。\n- Default Agent、Runtime 等配置继续使用现有 Project 业务语义，本功能不重新定义它们。\n- GitHub webhooks、安装卸载同步、Issue 写回、通用 Integration catalog 和每仓库秘密管理不在本功能内。\n\n## Success Criteria\n\n### Measurable Outcomes\n\n- **SC-001**：已配置 GitHub App 的操作者可在 90 秒内从 Add Project 入口完成仓库选择和 Project 创建。\n- **SC-002**：100% 的 Add Project 入口在 Modal 中完成创建，触发时不发生页面跳转。\n- **SC-003**：100% 的仓库候选来自当前 App 安装授权范围；服务端在创建时再次验证选择。\n- **SC-004**：仓库选择后，仓库列表在一个交互反馈周期内被 Repository 设置行替换，并显示所有后续配置。\n- **SC-005**：连接、列表和提交三类失败均保留当前工作上下文，并提供明确的恢复操作。\n- **SC-006**：私有仓库端到端验证中，发现、clone、push 和 PR 创建全部使用同一安装连接且无需个人令牌。\n- **SC-007**：自动化秘密扫描与人工证据审计均未发现 OAuth token、App 私钥或安装访问 token 泄漏。\n- **SC-008**：键盘完成连接后的 Project 创建流程时，不出现焦点丢失或不可达操作。\n- **SC-009**：安装可访问仓库超过 100 个时，操作者可以在同一 Modal 中加载后续页面并选择任意已加载仓库。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：039-github-project-onboarding\n\n## 摘要\n\n039 把 GitHub Project onboarding 收敛为一条完整链路：先在 Settings 绑定一个经验证的 GitHub App 安装连接，再从 shell 的 Add Project Modal 中选择该安装可访问的仓库，最后以同一连接完成 Runner 的 clone、push 与 PR 交付。\n\n它修正了当前两个割裂点：Project 创建不再作为 `/projects` 的内联表单，仓库发现也不再依赖与 Runner 交付不同的个人令牌。\n\n## 功能地图\n\n- Settings / Integrations 展示 GitHub App 的 disconnected、connecting、connected、error 状态。\n- OAuth 只用于确认操作者有权绑定安装；App 安装是持久连接对象。\n- Add Project 在当前页面打开 Modal，GitHub 是默认且当前唯一可用来源。\n- Modal 使用 App 安装范围加载、筛选和选择仓库。\n- 选仓库前显示候选列表；选仓库后折叠为 Repository 设置行并展开其他配置。\n- 设置项复用 Castrel Settings Modal 的业务 anatomy 与密度：左说明、右控件、紧凑分组；颜色与 token 仍归 Mystra。\n- Project 创建时服务端再次解析仓库，并保留来源连接引用。\n- Runner 使用短期安装凭据完成 GitHub 交付；没有个人令牌回退。\n\n## 边界\n\n- 本功能不是 caller login，也不建立公开 Team 管理。\n- 本功能不是通用 Integration catalog；只实现 GitHub App 连接表面和可扩展 provider seam。\n- 不实现 webhooks、Issue 写回、安装卸载同步、每仓库 secret UI 或调用者提供 clone URL。\n- App 私钥不进入 UI；用户 OAuth token 与安装 token 不进入持久状态。\n- `/projects` 继续承担 Project 列表和对象入口，不承担创建表单。\n\n## 交付切片\n\n1. 连接模型与 GitHub App 授权校验。\n2. Settings / Integrations 连接体验。\n3. Add Project Modal 与仓库选择状态机。\n4. Project 来源连接绑定与创建期再校验。\n5. Runner 短期凭据交付链。\n6. 静态、契约、浏览器和私有仓库端到端验证。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：039 GitHub Project Onboarding\n\n## Owner 评审\n\n- [x] Add Project 使用 Modal，触发时不跳转页面。\n- [x] GitHub 默认选中，并保留未来来源的结构位置。\n- [x] 先选择仓库，选中后列表折叠为 Repository 设置项，再展开其余配置。\n- [x] Settings 负责连接 GitHub App，发现和交付使用同一安装连接。\n- [x] 不保留 `MYSTRA_GITHUB_TOKEN` 或 PAT 回退。\n- [ ] 审阅并接受交互原型中的 Settings 行密度、Modal 尺寸和状态切换。\n\n## Spec 就绪度\n\n- [x] 四条 P1 用户故事覆盖连接、选择、创建和交付。\n- [x] 明确区分 OAuth 用户验证与 GitHub App 安装授权。\n- [x] 明确持久元数据和短期秘密的边界。\n- [x] loading、empty、error、retry、reconnect、change 和窄屏状态已定义。\n- [x] 成功标准包含用户效率、来源一致性、交付和秘密审计。\n- [x] 排除 caller auth、webhooks、Issue 写回、通用 catalog 和每仓库 secret UI。\n\n## 实现 Gate\n\n- [ ] 交互原型已在浏览器验证。\n- [ ] `/speckit.plan` 已完成。\n- [ ] `plan-eng-review` 已完成，发现已写回计划。\n- [ ] `/speckit.tasks` 与 `/speckit.analyze` 已通过。\n- [ ] 修改任何 symbol 前已完成 GitNexus upstream impact。\n- [ ] 修改 API 前已完成接口 blast-radius 检查。\n- [ ] 实现后已完成 focused tests、typecheck、浏览器验证和 GitNexus change detection。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 原型：039 GitHub Project Onboarding\n\n## 交互入口\n\n- [打开独立交互原型](mockups/index.html)\n\n## 覆盖范围\n\n原型用于确认两类交互：Settings 中的 GitHub App 连接状态，以及 Add Project Modal 从仓库选择到配置表单的渐进披露。\n\n- Settings 使用 Castrel Settings Modal 的双栏结构和紧凑 setting row anatomy；全局分类固定为 `Account`、`Appearance`、`Team`、`Integrations`，GitHub App 连接只位于 Integrations。\n- Add Project 默认选择 GitHub；未来来源显示为不可用占位。\n- 未连接状态可跳转到 Settings；连接后可以加载、搜索并选择仓库。\n- 选择仓库后，列表隐藏为 Repository 设置行，Project Name、Slug、Default Agent 与 Runtime 随后出现。\n- Change 恢复仓库列表但保留其他输入。\n- 原型提供 connected/disconnected、loading、empty、error 与 submit error 演示状态。\n- 视觉使用 Mystra dark-tech token，不复制 Castrel 颜色、品牌或业务文案。\n\n## 验证步骤\n\n1. 打开 Settings，进入 Integrations，点击 Connect GitHub。\n2. 完成模拟连接，确认状态行显示账户、安装和 Reconnect。\n3. 关闭 Settings，点击 Add Project，确认背景地址与上下文没有变化。\n4. 在仓库列表中搜索并选择 `mystra`，确认列表折叠、配置项出现。\n5. 点击 Change，确认回到列表且 Project Name 保留。\n6. 使用原型工具条切换 loading、empty、error，检查恢复操作。\n7. 调整到窄屏，确认 setting row 由左右布局改为上下布局。\n\n## 限制\n\n- 这是交互和视觉评审产物，不发起真实 OAuth、GitHub API 或 Project 创建请求。\n- 示例账户、安装、仓库和错误均为模拟数据。\n- 生产实现必须以 canonical API、服务端仓库再解析和 Runner 短期凭据验证为准。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1785926190510"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# Implementation Plan: GitHub Project Onboarding\n\n**Branch**: `039-github-project-onboarding` | **Date**: 2026-08-05 | **Spec**: [spec.md](spec.md)\n**Input**: Feature specification from `/specs/039-github-project-onboarding/spec.md`\n\n## Summary\n\n把 GitHub App 安装连接变成 Project repository 的显式来源，并让控制面在需要时生成短期 installation token。Settings 完成安装、OAuth 用户校验和连接展示；Add Project 由全局 shell Modal 承担，先选仓库再渐进展示配置。Project 持久化非秘密 connection ID，Runner 在 clone、push、PR 前通过已有 Runner credential 调用专用 no-store endpoint 取得短期凭据；删除生产路径中的 `MYSTRA_GITHUB_TOKEN` 回退。\n\n## Technical Context\n\n**Language/Version**: TypeScript 5.9，Node.js 24.14.0  \n**Primary Dependencies**: Next.js 16 Route Handlers、React 19、Zod 4、Node `crypto`、GitHub REST API、现有 Integration/Runner provider contracts  \n**Storage**: SQLite via `RdbProvider`；只保存 IntegrationConnection 非秘密元数据和 Project connection reference  \n**Testing**: Vitest 4；route/provider/model tests；真实浏览器验证；受控 GitHub App private-repository E2E  \n**Target Platform**: 私有单节点 Mystra Control Plane + outbound Runner daemon  \n**Project Type**: TypeScript monorepo，canonical Web API、secondary Next.js UI、独立 Runner daemon  \n**Performance Goals**: Modal 本地状态切换在单帧内完成；仓库首屏受 GitHub 延迟支配且 15s fail closed；有效 installation token 在进程内复用至过期前 60s  \n**Constraints**: OAuth user token 不持久化；installation token 不落库、不进日志/公共响应/证据；App 私钥不离开控制面；无 PAT fallback；Project 只接受 provider-resolved remote repository  \n**Scale/Scope**: 一个当前 active GitHub connection、一个 Control Plane 进程、低并发操作员、100 个仓库/页并支持 cursor Load more；历史 connection 可供已绑定 Project 使用但不再作为新建默认值\n\n## Constitution Check\n\n### Pre-research gate\n\n- Specification boundary：PASS。Constitution 2.3.0 已明确批准单一 GitHub App installation connection；caller login、webhooks、Issue write-back 和通用 Integration catalog 继续排除。\n- Typed contracts：PASS。连接、Project selector/reference、Runner 私有 credential response 都使用共享 Zod contract。\n- Replaceable providers：PASS。Connection 是 provider-neutral entity；GitHub OAuth/JWT/installation 逻辑只存在于 GitHub adapter/service。\n- Runner isolation and secrets：PASS。App 私钥只在控制面；Runner 只通过已认证 session endpoint 得到短期 token，并仅在 clone/push/review 内存与子进程环境中使用。\n- Verification and documentation：PASS。计划包含 contract、route、DB、Runner、UI model、browser 与真实 App E2E。\n\n### Post-design gate\n\n- `RepositorySelector.connectionId` 明确来源连接，服务端仍重新 resolve，不接受 clone URL。\n- `IntegrationConnection` 只保存安装/账户/权限摘要；用户 token 和 installation token 均无持久字段。\n- Runner claim 保持 secret-free；独立 POST credential route 使用 Runner bearer auth、session ownership check 和 `Cache-Control: no-store`。\n- 现有 Linear provider 与 GitLab runner delivery 不被扩大或删除；GitHub 生产路径不再读取 `MYSTRA_GITHUB_TOKEN`。\n- SQLite schema 升级遵循当前 exact-schema rebuild 纪律，不引入兼容 alias。\n\n## Architecture\n\n### Connection and onboarding flow\n\n```text\nSettings / Integrations\n        |\n        | GET /api/integration-connections\n        v\n [Disconnected] --Connect--> GitHub App installation screen\n                                  |\n                                  | setup_url: installation_id (untrusted)\n                                  v\n                    OAuth start: state + PKCE cookies\n                                  |\n                                  v\n                         GitHub user consent\n                                  |\n                                  | code + state\n                                  v\n                    exchange ephemeral user token\n                                  |\n                                  | GET /user/installations\n                                  | exact installation_id + app_id must match\n                                  v\n             discard user token -> persist non-secret connection\n                                  |\n                                  v\n                         Settings [Connected]\n```\n\nThe GitHub setup callback is treated as a hint. It never writes a connection before the OAuth user token proves the same installation is accessible to that user.\n\n### Repository discovery and Project creation\n\n```text\nAdd Project (+)\n    |\n    v\nProjectCreateModal (route unchanged)\n    |\n    +-- no active connection --> Open Settings\n    |\n    +-- active connection\n          |\n          | GET /api/integrations/github/repositories?connectionId=...\n          v\n    GitHub RepoProvider --installation token--> /installation/repositories\n          |\n          v\n    choose owner/name -> collapse picker -> setting rows\n          |\n          | POST /api/projects { repository: {integration, connectionId, identifier} }\n          v\n    resolve exact connection -> mint/reuse token -> GET /repos/owner/name\n          |\n          v\n    atomically persist Project(repository snapshot + connectionId)\n```\n\n### Runner credential flow\n\n```text\nRunner claim (secret-free)\n    |\n    | before clone / push / review\n    v\nPOST /api/runner/sessions/:id/repository-credential\n    |\n    +-- authenticate Runner bearer credential\n    +-- verify Session assignment ownership\n    +-- load Project.repositoryConnectionId\n    +-- verify connection provider == repository provider\n    +-- mint/reuse installation token in control-plane memory\n    v\n{ provider, username, secret, expiresAt }  [private, no-store]\n    |\n    +-- clone: process-scoped env only\n    +-- push: in-memory credential argument, askpass temp file\n    +-- PR: in-memory Authorization header\n    v\ndiscard Runner copy after phase / Session\n```\n\nNo token is placed in Runner claim, Project, Task, Session, runtime contract, events, result, metadata or error text.\n\n## Key Decisions\n\n1. **Setup URL then OAuth validation**：GitHub’s installation screen chooses the account/repository scope; the untrusted `installation_id` is accepted only after a user access token lists that exact installation.\n2. **Direct REST + Node crypto**：reuse the repository’s existing validated-fetch style; avoid adding an SDK only for JWT signing/token exchange. JWT, PKCE and response parsing remain isolated and exhaustively tested.\n3. **Explicit connection reference**：`RepositorySelector` and `Project` carry `connectionId`; no active-connection inference during Project execution.\n4. **Secret-free claim plus private exchange**：do not add installation token to the durable DB claim. Runner retrieves it with existing Runner authentication immediately before repository phases.\n5. **In-memory token cache with expiry margin and single-flight**：reduce token mint calls without creating durable secret state or concurrent refresh bursts.\n6. **Shared setting-row business component**：one Mystra-owned `SettingGroup`/`SettingRow` anatomy is reused by Settings Integrations and Project Modal. Castrel supplies layout evidence, not runtime dependency or palette.\n7. **One active, historical immutable references**：reconnecting the same installation refreshes its metadata; connecting another installation marks the old record inactive for discovery while existing Projects retain their original connection.\n\n## Project Structure\n\n### Documentation\n\n```text\nspecs/039-github-project-onboarding/\n├── spec.md\n├── features.md\n├── checklists.md\n├── checklists/requirements.md\n├── prototype.md\n├── mockups/index.html\n├── plan.md\n├── research.md\n├── data-model.md\n├── contracts/\n│   ├── integration-connections.md\n│   ├── project-onboarding.md\n│   └── runner-repository-credential.md\n├── quickstart.md\n└── tasks.md\n```\n\n### Source code\n\n```text\npackages/shared/src/\n├── integrations.ts             # connection contracts\n├── repository.ts               # selector carries connectionId\n├── schemas.ts                  # Project carries repositoryConnectionId\n└── management.ts               # API and private Runner responses\n\napps/control-plane/src/lib/\n├── db/\n│   ├── rdb-provider.ts\n│   ├── sqlite-provider.ts\n│   └── migrations.ts\n├── integrations/\n│   ├── github-app.ts            # OAuth, JWT, install-token broker\n│   ├── github.ts                # installation-scoped Repo/Issue provider\n│   ├── registry.ts\n│   └── README.md\n└── projects/resolve-project-input.ts\n\napps/control-plane/app/\n├── api/integration-connections/...\n├── api/integrations/[integration]/repositories/route.ts\n├── api/projects/route.ts\n├── api/runner/sessions/[id]/repository-credential/route.ts\n├── _components/\n│   ├── app-shell.tsx\n│   ├── shell-settings.tsx\n│   ├── setting-row.tsx\n│   ├── project-create-modal.tsx\n│   └── shell-copy.ts\n├── projects/_components/project-create-model.ts\n└── projects/page.tsx\n\napps/runner-daemon/src/\n├── index.ts\n├── repo-providers.ts\n└── repo-providers/github.ts\n```\n\n**Structure Decision**：沿用现有 shared → control-plane provider/API → secondary UI 与 runner-daemon 分层。新增一个 GitHub App service 和两个纯 UI business components；不引入新 package、独立 auth server 或 general Integration framework。\n\n## Delivery Slices\n\n1. Contract + SQLite：连接实体、Project connection reference、private Runner credential response、exact schema rebuild。\n2. GitHub App adapter：OAuth state/PKCE、installation ownership verification、JWT/token broker、installation-scoped repository listing。\n3. Canonical API：connection status/connect/setup/callback、repository connection query、Project re-resolution、Runner credential exchange。\n4. Runner：just-in-time credential fetch、clone/push/review explicit credential flow、PAT path removal。\n5. UI：shared setting rows、Settings integration state、global Add Project Modal、`/projects` list-only。\n6. Verification：focused tests → package tests/typecheck/build → browser states → real GitHub App private repo E2E → secret audit → GitNexus detect changes。\n\n## Test Coverage Map\n\n```text\nCONNECTION\n  connect -> install redirect -> setup hint -> OAuth/PKCE\n    ├── success + exact accessible installation        [route + service]\n    ├── spoofed/unknown installation                   [security regression]\n    ├── state/code/verifier missing or mismatched      [route]\n    ├── canceled/timeout/rate-limit/invalid response   [service]\n    └── reconnect same/new installation                [DB + route]\n\nPROJECT\n  modal -> active connection -> repository list -> choose -> create\n    ├── disconnected/loading/empty/error/retry         [model + browser]\n    ├── first page/load more/cursor failure            [model + route]\n    ├── filter/select/change/double-submit              [model + browser]\n    ├── stale/revoked repository at submit             [resolver + route]\n    └── route unchanged + focus/Escape/narrow layout   [browser]\n\nRUNNER\n  claim -> credential exchange -> clone -> push -> PR\n    ├── wrong Runner/session/provider                  [route]\n    ├── revoked/missing connection                     [route]\n    ├── token omitted from claims/events/results       [contract + audit]\n    ├── installation credential passed explicitly      [runner/provider]\n    └── no MYSTRA_GITHUB_TOKEN fallback                [regression + audit]\n```\n\n## Failure Modes\n\n| Path | Production failure | Test | Handling | User visibility |\n|---|---|---|---|---|\n| OAuth start/setup | missing App configuration | route test | stable configuration error | Settings shows admin action |\n| OAuth callback | forged state/install ID | security test | reject, clear transient cookies | reconnect error |\n| token mint | private key invalid / GitHub timeout | service test | stable sanitized failure | repo list or Session fails clearly |\n| repository list | installation has zero repos | provider/UI test | valid empty result | explicit empty state |\n| Project submit | access revoked after selection | resolver test | no DB write | Modal preserves fields |\n| credential exchange | wrong Runner or Session | route test | 401/404, no token mint | Runner records sanitized failure |\n| clone/push/review | token expires/revoked | provider/E2E | fetch just-in-time; fail closed | Session failure without secret |\n| token cache | concurrent refresh | broker test | single-flight + 60s margin | no visible duplication |\n\nNo silent critical path remains by design; implementation tests must prove each row.\n\n## Performance\n\n- GitHub repository list stays paginated at max 100 items per request. Modal exposes cursor-based Load more, appends de-duplicated items, and applies client-side filtering to all loaded pages.\n- Installation token cache is process-local and bounded by historical GitHub connection count; entries expire and are replaced, never serialized.\n- A single-flight promise per installation prevents duplicate token creation under concurrent API/Runner requests.\n- OAuth and GitHub requests retain the existing 15s timeout and stable rate-limit errors.\n- No polling is added. Settings and Modal refresh only on open, retry or successful connection.\n\n## What Already Exists\n\n- `GitHubIntegrationProvider` already validates repository/Issue responses and stable errors; 039 changes its credential source and installation list endpoint instead of replacing it.\n- `IntegrationRegistry` already separates repository and Issue capabilities; 039 supplies a connection-bound GitHub provider without provider branches in consumers.\n- `resolveProjectCreateInput` already performs server-side repository re-resolution; 039 adds exact connection selection.\n- `RdbProvider`/`SqliteRdbProvider` already own all durable business state and exact schema verification.\n- Runner already authenticates outbound calls and verifies Session assignment; the credential endpoint reuses this boundary.\n- `githubRepoProvider` already uses askpass and redacts GitHub error bodies; 039 changes token acquisition from process env to an explicit ephemeral argument.\n- `ShellSettings`, `UiDialogSurface`, `UiButton`, `UiInput`, `UiSelect` and Project draft model already provide the shell primitives to reuse.\n\n## NOT in Scope\n\n- Caller sign-in/session management：GitHub OAuth verifies installation ownership only.\n- GitHub webhooks and uninstall synchronization：revocation is detected on the next remote operation.\n- Multiple concurrently active connections or Team administration：historical records exist only to preserve Project binding.\n- Generic Integration marketplace/catalog：only a provider-neutral connection contract plus GitHub implementation is added.\n- GitLab/GitHub Enterprise connection UI：existing delivery support remains untouched.\n- Issue write-back, callbacks, retry orchestration or logs API：unchanged MVP exclusions.\n- Per-repository token storage or UI secret upload：App private key remains deployment configuration.\n- GitHub server-side full-text repository search：installation endpoint has no equivalent requirement；039 provides deterministic cursor Load more plus filtering across loaded pages.\n\n## Complexity Tracking\n\nThe change crosses more than eight files because it deliberately closes one end-to-end authorization chain across contracts, persistence, API, UI and Runner. Reducing it to a UI-only Modal would preserve the current split-credential failure and violate the approved no-PAT boundary. New behavior is confined to one GitHub App service and two reusable UI business components; all other edits extend existing seams.\n\n| Necessary complexity | Why needed | Shortcut rejected because |\n|---|---|---|\n| IntegrationConnection entity | stable, non-secret source for discovery and delivery | active env token cannot prove Project provenance |\n| Runner private credential route | App private key must stay in control plane | token in claim can become stale and broadens secret exposure |\n| OAuth + PKCE validation | setup `installation_id` is explicitly untrusted | direct persistence enables installation spoofing |\n| Cross-layer tests | regression removes an existing credential path | UI-only evidence cannot prove delivery works |\n\n## Engineering Review Placeholder\n\n`plan-eng-review` completed on 2026-08-05. Detailed evidence is in [checklists/engineering-review.md](checklists/engineering-review.md). Scope remains end-to-end; cursor pagination was added as the only missing main-flow behavior. Four architecture findings are resolved, zero critical gaps remain, and task decomposition may proceed.\n\n## GSTACK REVIEW REPORT\n\n| Review | Trigger | Why | Runs | Status | Findings |\n|---|---|---|---|---|---|\n| CEO Review | `/plan-ceo-review` | Scope & strategy | 0 | — | — |\n| Codex Review | `/codex review` | Independent 2nd opinion | 0 | — | — |\n| Eng Review | `/plan-eng-review` | Architecture & tests (required) | 1 | CLEAR | 4 issues resolved, 0 critical gaps |\n| Design Review | `/plan-design-review` | UI/UX gaps | 0 | — | Claude Design prototype completed |\n| DX Review | `/plan-devex-review` | Developer experience gaps | 0 | — | — |\n\n**UNRESOLVED:** 0  \n**VERDICT:** ENG CLEARED — ready for task decomposition and implementation.\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks: GitHub Project Onboarding\n\n**Input**: `spec.md`、`plan.md`、`research.md`、`data-model.md`、`contracts/`  \n**Tests**: 本功能修改授权、共享合同、持久化、API、Runner 和用户主流程；每个切片必须先写失败测试。\n\n## Phase 1: Setup and review gates\n\n**Purpose**：冻结已批准边界，确保实现只触及预期 execution flows。\n\n- [x] T001 记录现有 `/api/projects`、repository list、Runner Session route 的 `gitnexus_api_impact` 结果，并在 `specs/039-github-project-onboarding/checklists/engineering-review.md` 保持 MEDIUM `/api/projects` consumer mismatch 提醒。\n- [x] T002 为 `apps/control-plane/src/lib/integrations/README.md` 和 `docs/RUNNER-DOCKER-MVP.md` 预留 GitHub App deployment variables、Setup URL、callback URL 与无 PAT invariant 的最小文档变更。\n\n**Checkpoint**：规格、原型、计划、工程评审完整；没有未解决 clarification。\n\n---\n\n## Phase 2: Foundational contracts and persistence\n\n**Purpose**：建立所有用户故事依赖的 connection identity 与 secret-free contract。\n\n- [x] T003 [P] 在 `packages/shared/src/integrations.test.ts` 和 `packages/shared/src/management.test.ts` 添加 IntegrationConnection、connection list、OAuth status/error 与 private Runner repository credential 的成功/拒绝合同测试。\n- [x] T004 [P] 在 `packages/shared/src/repository.test.ts` 和 `packages/shared/src/schemas.test.ts` 添加 `RepositorySelector.connectionId`、`Project.repositoryConnectionId`、provider mismatch 输入与无 clone URL 输入测试。\n- [x] T005 在 `packages/shared/src/integrations.ts`、`packages/shared/src/repository.ts`、`packages/shared/src/schemas.ts` 和 `packages/shared/src/management.ts` 实现 T003-T004 的 Zod/TypeScript contracts，并导出到 `packages/shared/src/index.ts`。\n- [x] T006 [P] 在 `apps/control-plane/src/lib/db/sqlite-provider.test.ts` 添加 connection create/reactivate/deactivate/list/get、一个 active invariant、Project FK、exact v3 rebuild 与 secret-column absence 测试。\n- [x] T007 在 `apps/control-plane/src/lib/db/rdb-provider.ts`、`apps/control-plane/src/lib/db/migrations.ts` 和 `apps/control-plane/src/lib/db/sqlite-provider.ts` 实现 IntegrationConnection persistence、Project connection reference 与 schema version bump。\n- [x] T008 更新 `apps/control-plane/src/lib/db/sqlite-provider.test.ts`、`apps/control-plane/app/api/routes.test.ts` 和现有 Project fixture helpers，使所有 Project 明确绑定测试 connection，不增加 compatibility default。\n\n**Checkpoint**：`pnpm --filter @mystra/shared test` 与 control-plane DB focused tests 通过；SQLite/Project/claim 无 secret 字段。\n\n---\n\n## Phase 3: User Story 1 - Connect GitHub App\n\n**Goal**：Settings 可以完成经 OAuth 用户验证的 GitHub App installation 连接，并展示非秘密状态。\n\n**Independent Test**：从 disconnected 进入 Connect，模拟 install/setup/OAuth callback，验证 exact installation 被激活、token 未落库；spoofed installation 被拒绝。\n\n### Tests\n\n- [ ] T009 [P] [US1] 在 `apps/control-plane/src/lib/integrations/github-app.test.ts` 编写 config、PKCE、JWT、OAuth exchange、accessible installation、installation token expiry/cache/single-flight、timeout/rate-limit/redaction 失败测试。\n- [ ] T010 [P] [US1] 在 `apps/control-plane/app/api/integration-connections.test.ts` 编写 list、connect redirect、setup transaction cookies、callback state/install validation、reconnect 与 sanitized redirect error route tests。\n- [ ] T011 [P] [US1] 在 `apps/control-plane/app/_components/github-connection-model.test.ts` 编写 configured/disconnected/connected/connecting/error/reconnect view-model 测试。\n\n### Implementation\n\n- [x] T012 [US1] 在 `apps/control-plane/src/lib/integrations/github-app.ts` 实现 GitHub App config、PKCE/OAuth、App JWT、accessible installation verification 与内存 installation-token broker。\n- [x] T013 [US1] 在 `apps/control-plane/app/api/integration-connections/route.ts`、`github/connect/route.ts`、`github/setup/route.ts` 和 `github/oauth/callback/route.ts` 实现 thin Route Handlers、短期安全 cookies、relative return target 与非秘密 response。\n- [x] T014 [US1] 在 `apps/control-plane/app/_components/setting-row.tsx` 和 `apps/control-plane/app/globals.css` 实现 Mystra-owned `SettingGroup`/`SettingRow`，对齐 Castrel anatomy/density 并保持 Mystra token。\n- [x] T015 [US1] 在 `apps/control-plane/app/_components/github-connection-model.ts`、`shell-settings.tsx` 和 `shell-copy.ts` 实现 Integrations tab、GitHub App status row、Connect/Reconnect 与英语/简体中文文案。\n- [x] T016 [US1] 在 `apps/control-plane/app/_components/app-shell.tsx` 处理 OAuth return query，自动打开 Integrations、移除一次性 query，并保持其他 shell modal 状态互斥。\n\n**Checkpoint**：mocked OAuth happy/negative routes 全通过；浏览器能完成模拟 connect/reconnect，Settings 不呈现 token 或 env 名。\n\n---\n\n## Phase 4: User Story 2 - Modal repository selection\n\n**Goal**：Add Project 在当前 route 打开 Modal，GitHub 默认选中，并从 active App connection 分页浏览仓库。\n\n**Independent Test**：在非 `/projects` route 点击 plus，地址不变；验证 disconnected、loading、empty、error/retry、filter、Load more 和 repository selection。\n\n### Tests\n\n- [ ] T017 [P] [US2] 在 `apps/control-plane/src/lib/integrations/github.test.ts` 添加 installation `/installation/repositories` response、cursor pagination、duplicate/archived item、invalid shape 和 static test credential seam 测试。\n- [ ] T018 [P] [US2] 在 `apps/control-plane/app/api/routes.test.ts` 添加 connection-scoped repository list、omitted-active connection、wrong provider/connection、cursor 与 later-page error route tests。\n- [ ] T019 [P] [US2] 扩展 `apps/control-plane/app/projects/_components/project-create-model.test.ts`，覆盖默认 GitHub、connection required、page append/de-dup、filter、selection/change、later-page failure 与 draft reset。\n\n### Implementation\n\n- [x] T020 [US2] 在 `apps/control-plane/src/lib/integrations/github.ts` 和 `registry.ts` 支持异步 installation credential source与 installation repository endpoint，并删除 production `MYSTRA_GITHUB_TOKEN` 读取。\n- [x] T021 [US2] 在 `apps/control-plane/app/api/integrations/[integration]/repositories/route.ts` 与 `repositories/resolve/route.ts` 解析 connectionId，构造 exact/active connection registry，并保持现有 response schema。\n- [ ] T022 [US2] 在 `apps/control-plane/app/projects/_components/project-create-model.ts` 实现显式 Modal state reducer、repository page append/de-dup/filter 和 selection/change 状态。\n- [x] T023 [US2] 在 `apps/control-plane/app/_components/project-create-modal.tsx` 使用 `UiDialogSurface`、`SettingRow` 和现有 fields/actions 实现 source selector、connection prerequisite、picker states、Load more、focus/Escape/backdrop。\n- [x] T024 [US2] 在 `apps/control-plane/app/_components/app-shell.tsx` 将 Projects plus 从 Link 改为 Modal action，协调 Settings 跳转，并刷新 Project resource；不改变触发 route。\n\n**Checkpoint**：component model/provider/route tests 通过；浏览器在 320/768/1024/1440px 验证 Modal 与 repository states。\n\n---\n\n## Phase 5: User Story 3 - Configure and create Project\n\n**Goal**：选仓库后列表折叠为 Repository 设置行，其他配置出现，服务端用 exact connection 重解析并创建。\n\n**Independent Test**：选择 private repo，配置 Name/Slug/Agent/Runtime，Change 保留非仓库输入；成功导航详情，失败保留 Modal。\n\n### Tests\n\n- [ ] T025 [P] [US3] cope.\n- **US3**：selection collapses into Repository row, remaining settings appear, server re-resolves exact connection, error retains fields.\n- **US4**：private repository clone/push/PR succeeds with App token only; removal/revocation fails closed.\n\n## Implementation Strategy\n\n1. Freeze shared/DB contracts before touching UI or Runner.\n2. Complete US1 and verify security negatives before exposing repository selection.\n3. Complete US2 and US3 as route-stable vertical UI/API slices.\n4. Complete US4 before declaring Project onboarding usable; discovery-only success is not completion.\n5. Finish with real App E2E and secret audit, then reconcile Spec-Kit artifacts.\n\n## Format Validation\n\n- 44 tasks, sequential IDs T001-T044.\n- User-story tasks include `[US1]` through `[US4]`.\n- `[P]` appears only where files and incomplete dependencies do not overlap.\n- Every task includes exact file paths or an exact verification command/surface.\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
