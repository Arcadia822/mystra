    <script id="spec-data" type="application/json">{"feature":"041-github-integration-connections","title":"041-github-integration-connections","prototypeHref":"mockups/index.html?v=1786010779098","generatedAt":"2026-08-06T16:05:22.869Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：GitHub Integration 多连接与凭据配置\n\n**Feature Branch**: `041-github-integration-connections`\n**Created**: 2026-08-06\n**Status**: RDB envelope architecture approved for implementation\n**Persistence Amendment (2026-08-06)**: The owner approved removing the node-local encrypted-file backend. RDB now stores envelope-encrypted ciphertext while the KEK remains outside RDB; `credentialRef` still identifies an immutable secret version and PAT plaintext remains confined to `SecretProvider`.\n**Input**: 在 Settings → Integrations 增加 GitHub Integration Detail；支持多连接和显式 PAT；Project 固定绑定所选连接；Mystra GitHub App 仅作为 hosted capability，self-hosted 不支持但开源代码可以保留。\n\n## 用户场景与验收\n\n### User Story 1 - 在 GitHub Detail 管理全部连接（Priority: P1）\n\n作为 Mystra 操作者，我希望从 Settings → Integrations 进入 GitHub Detail，集中查看所有个人账户和组织连接，以便知道每个 Project 实际可以使用哪些 GitHub 身份与仓库范围。\n\n**Why this priority**：多连接如果仍被压缩成一个“已连接”状态，操作者无法理解、选择或维护真实授权关系。\n\n**Independent Test**：准备两条不同账户或组织的连接，进入 GitHub Detail，确认两条连接分别显示身份、连接方式、仓库范围、状态和可用操作。\n\n**Acceptance Scenarios**：\n\n1. **Given** 操作者位于 Settings → Integrations，**When** 点击 GitHub 行，**Then** 在同一 Settings Modal 内进入 GitHub Detail，并保留返回 Integrations 列表的操作。\n2. **Given** GitHub 没有任何连接，**When** 打开 Detail，**Then** 显示真实空状态以及“添加连接”，而不是显示伪造的已连接状态。\n3. **Given** 存在多条连接，**When** 打开 Detail，**Then** 每条连接分别显示账户或组织、连接方式、仓库访问摘要、有效状态和最近更新时间。\n4. **Given** 连接加载失败，**When** Detail 呈现，**Then** 显示错误与 Retry，现有导航和关闭操作仍可使用。\n5. **Given** 操作者通过回调或 URL 重新打开 Settings，**When** URL 指向 GitHub Detail，**Then** Modal 恢复到该 Detail，而不是退回默认设置页。\n\n---\n\n### User Story 2 - 在 Hosted Mystra 添加多个 GitHub App 安装连接（Priority: P1）\n\n作为 Hosted Mystra Team 的授权操作者，我希望可以重复安装或授权平台运营的 Mystra GitHub App，并将每个可访问安装保存为独立连接，以便从不同组织选择仓库而不覆盖已有连接。\n\n**Why this priority**：这是新目标对现有“一个 Integration 只有一条 active connection”合同的直接替换。\n\n**Independent Test**：依次连接个人账户安装和组织安装，确认两条连接同时可用；再次连接其中一个安装只更新该安装，不影响另一条。\n\n**Acceptance Scenarios**：\n\n1. **Given** 当前部署为 hosted、操作者已登录且具有目标 Team 的 Integration 管理权限，**When** 操作者选择“添加连接 → GitHub App”并完成另一个安装，**Then** 新旧连接同时保持可用。\n2. **Given** 同一安装已存在，**When** 操作者再次完成该安装的授权校验，**Then** 系统更新原连接元数据，而不是产生重复连接。\n3. **Given** OAuth 校验可访问多个安装，**When** 当前回调没有唯一指向一个安装，**Then** 操作者必须明确选择目标安装，系统不得任意激活其中一个。\n4. **Given** 新授权失败或被取消，**When** 操作者返回 Mystra，**Then** 已有连接保持不变，并显示可恢复错误。\n5. **Given** 某安装已不可访问，**When** 状态刷新或使用该连接，**Then** 只将该连接标记为不可用，不影响其他连接。\n6. **Given** OAuth callback 到达任意 hosted 实例，**When** 服务端消费 transaction，**Then** transaction 必须仍绑定原 actor、Team、安装意图和安全 return path，且只能成功消费一次。\n\n---\n\n### User Story 3 - 使用 PAT 建立和维护连接（Priority: P1）\n\n作为无法安装 GitHub App 或希望使用个人授权范围的操作者，我希望显式选择 Personal access token 模式，提交 PAT 并由 Mystra 验证后保存为独立连接，以便使用该 token 可访问的仓库。\n\n**Why this priority**：PAT 是用户明确要求的第二种连接合同，不是 GitHub App 失败后的隐式后门。\n\n**Independent Test**：使用有效 PAT 建立连接、浏览其仓库、轮换 token 并再次浏览；检查任何管理响应、持久元数据和日志都不包含明文 PAT。\n\n**Acceptance Scenarios**：\n\n1. **Given** 操作者选择“添加连接 → Personal access token”，**When** 输入 token 并提交，**Then** Mystra 先验证 GitHub 身份和仓库访问，再创建连接。\n2. **Given** token 无效、过期或无法访问任何仓库，**When** 验证完成，**Then** 不创建连接，不覆盖旧凭据，并显示具体的恢复建议。\n3. **Given** PAT 连接已创建，**When** Detail 再次呈现，**Then** 只显示账户、连接方式、访问摘要和安全的凭据提示，不回显 token。\n4. **Given** PAT 即将或已经失效，**When** 操作者选择 Replace token 并提交有效新 token，**Then** 原连接标识保持稳定，绑定它的 Project 无需改绑。\n5. **Given** 新 token 验证失败，**When** 替换操作结束，**Then** 旧 token 仍可继续使用，系统不得先删除旧凭据。\n6. **Given** 某连接仍被 Project 引用，**When** 操作者尝试删除，**Then** 系统阻止删除并列出阻止原因；操作者仍可更新凭据或恢复访问。\n\n---\n\n### User Story 4 - 创建 Project 时选择连接与仓库（Priority: P1）\n\n作为创建 Project 的操作者，我希望 Add Project Modal 先确定 GitHub 连接，再从该连接可访问的仓库中选择一个 repo，以便 Project 的发现与后续交付始终使用同一授权来源。\n\n**Why this priority**：多连接下，“随便取第一条 active connection”会令 Project 来源不确定，并在 Runner 交付阶段产生难以诊断的权限错误。\n\n**Independent Test**：准备一条 App 和一条 PAT 连接，分别用它们创建 Project；确认仓库列表按连接隔离，Project 保存精确 connection reference，clone/push/PR 使用对应连接。\n\n**Acceptance Scenarios**：\n\n1. **Given** 只有一条可用连接，**When** 打开 Add Project，**Then** 系统可以默认选中该连接，并清楚显示其身份和连接方式。\n2. **Given** 有多条可用连接，**When** 打开 Add Project，**Then** 操作者必须选择或确认一条连接后才能浏览仓库。\n3. **Given** 操作者切换连接，**When** 新连接生效，**Then** 已加载的仓库和选择状态被清除，只显示新连接范围内的仓库。\n4. **Given** 选定 repo，**When** 仓库列表收起，**Then** 配置区只显示 Connection、Repository、Project Name 和 Slug；Agent 与开发镜像不作为初始创建选项。\n5. **Given** Project 创建成功，**When** 后续执行 clone、push 或创建 PR，**Then** 系统只使用 Project 绑定连接的凭据，不回退到其他 App 或 PAT 连接。\n6. **Given** 绑定连接失效，**When** Project 执行仓库操作，**Then** 操作明确失败并指出连接需要恢复，不自动切换到另一条连接。\n\n---\n\n### User Story 5 - Self-hosted 只暴露受支持的 GitHub 方法（Priority: P1）\n\n作为 self-hosted Mystra 操作者，我希望设置页只呈现当前部署真正支持的 PAT 连接方式，不出现 GitHub App 选项，也不把一组无法在本部署完成的 OAuth 配置字段伪装成正式能力。\n\n**Why this priority**：部署支持边界若只写在文档里，路由仍然可调用，就不叫边界，只叫愿望。\n\n**Independent Test**：以 stock self-hosted profile 启动控制面，确认公开连接方式列表只包含 PAT，UI DOM 不出现 GitHub App 添加方式；App 的 connect/setup/callback/credential 路径全部稳定 fail closed，同时 PAT 流程按 SecretProvider 配置正常工作。\n\n**Acceptance Scenarios**：\n\n1. **Given** 当前部署为 stock self-hosted，**When** 打开 GitHub Detail 的添加方式，**Then** 只显示 PAT，GitHub App 名称、说明和 Continue 控件均不进入 UI DOM；PAT 仍按本地 secret store 状态显示可用或配置缺失。\n2. **Given** self-hosted 调用方绕过 UI 直接访问 App connect、setup 或 callback route，**When** 请求到达服务端，**Then** 返回稳定的 hosted-only capability error，不发生 GitHub redirect、OAuth code exchange 或连接写入。\n3. **Given** self-hosted 数据库遗留 GitHub App connection，**When** 查看连接或运行绑定 Project，**Then** 连接可检查但派生为当前部署不可用，系统不得 mint installation token 或退回 PAT。\n4. **Given** 开源构建包含 GitHub App 源码和测试，**When** self-hosted 启动，**Then** 源码存在不改变运行时 capability；测试可通过注入 hosted profile 验证 cloud adapter。\n\n### Edge Cases\n\n- 同一个 GitHub App 安装被重复授权时，更新原连接而不是重复插入。\n- 同一 GitHub 用户可以拥有多条 PAT 连接；它们由连接标识和凭据生命周期区分，而不是仅按用户名合并。\n- PAT 验证成功但返回 0 个仓库时，不建立连接，因为它不能完成 Project onboarding 的核心用途。\n- PAT 能读取仓库但目标 repo 缺少 push 权限时，该 repo 不得被伪装成可交付；fine-grained PAT 的 Pull requests(write) 无法无副作用探测时，界面明确标记为未验证并在真实交付失败时给出恢复提示。\n- GitHub 限流、网络错误、权限撤销、组织 SSO 未授权分别保留可恢复错误，不暴露 token 或 App 私钥。\n- 删除未被 Project 引用的连接时，秘密材料和非秘密元数据作为一次业务操作一起失效；部分失败必须保持可诊断状态。\n- 历史单连接数据升级后仍是有效连接，现有 Project 的 `repositoryConnectionId` 不变。\n- 多个浏览器窗口同时添加或替换同一连接时，最终状态保持唯一且不会短暂暴露或丢失有效凭据。\n- self-hosted 即使意外配置全部 GitHub App secret，也不得因“配置齐全”而自动启用 hosted capability。\n- hosted callback 缺少 caller session、Team membership 已撤销、transaction 过期或已消费时，不得创建或更新连接。\n- 同一 GitHub App installation 默认只允许归属一个 Mystra Team；跨 Team 转移必须是显式管理操作，不能通过重复 callback 偷偷改写归属。\n\n## Requirements\n\n### Functional Requirements\n\n- **FR-001**：Settings → Integrations MUST 将 GitHub 显示为可进入的业务行，并展示连接数量和整体健康摘要。\n- **FR-002**：系统 MUST 在同一 Settings Modal 内提供 GitHub Integration Detail，并支持返回 Integrations 列表。\n- **FR-003**：GitHub Detail MUST 显示 loading、empty、full、error、disabled 与 permission-limited 状态。\n- **FR-004**：每条连接 MUST 具有稳定 ID、GitHub 身份、连接方式、仓库范围摘要、状态和时间信息。\n- **FR-005**：Hosted 部署 MUST 同时支持多条 active GitHub App 安装连接，不得因添加新安装而停用其他安装。\n- **FR-006**：同一 GitHub App installation MUST 只对应一条连接；重连 MUST 原地更新该连接。\n- **FR-007**：GitHub App OAuth user token MUST 仅用于验证安装访问权，不得持久化或用于仓库交付。\n- **FR-008**：Hosted MUST 提供显式的 `GitHub App` 和 `Personal access token` 添加方式；stock self-hosted 的公开连接方式列表与 UI MUST 只提供 PAT，不呈现 GitHub App 方法；两者不得互为静默 fallback。\n- **FR-009**：系统 MUST 在保存 PAT 前验证 token 身份和仓库可见性，并验证 GitHub 可无副作用观测的仓库操作能力；无法安全探测的写权限必须明确标记为未验证，不得伪造通过状态。\n- **FR-010**：PAT 明文 MUST 只进入 `SecretProvider` 与短期运行时注入，不得进入关系数据库、客户端状态、公共 API 响应、URL、日志、事件或验收证据；RDB 只允许保存无法直接用于 GitHub API 的 authenticated encryption envelope。\n- **FR-011**：关系数据库 MUST 区分连接业务元数据、opaque `credentialRef` 与 envelope 密文；每条 envelope 使用随机 DEK 加密，DEK 再由数据库外的 KEK 包装，KEK 不得进入 RDB。\n- **FR-012**：PAT token replacement MUST 先验证新凭据，再以 immutable credential version 写入新 envelope，并在同一 RDB transaction 切换 connection reference；失败时旧 reference 与旧凭据保持有效。\n- **FR-013**：系统 MUST 支持删除未被 Project 引用的连接，并拒绝删除仍被任何 Project 引用的连接。\n- **FR-014**：连接状态变化 MUST 局限于目标连接，不得修改同一 Integration 的其他连接。\n- **FR-015**：Add Project Modal MUST 使用连接选择器；只有一条可用连接时可默认选中，多条时必须显式确认。\n- **FR-016**：仓库发现、仓库解析、Project 创建与 Runner 交付 MUST 使用请求或 Project 指定的精确连接 ID。\n- **FR-017**：切换连接 MUST 清空前一连接的仓库列表、分页游标和已选仓库，防止跨授权范围混用。\n- **FR-018**：Project MUST 保留不可变的 `repositoryConnectionId` 和 provider-resolved repository snapshot。\n- **FR-019**：绑定连接失效时，Project 仓库操作 MUST 明确失败，不得自动改用其他连接或环境 token。\n- **FR-020**：GitHub Detail 和 Add Project 的设置项 MUST 复用 Mystra 的 `SettingGroup` / `SettingRow` 业务布局、暗色语义 token、紧凑密度和操作层级。\n- **FR-021**：新增 UI 文案 MUST 提供简体中文与英文值，并在 320 / 768 / 1024 / 1440px 宽度保持主要操作可用。\n- **FR-022**：Dialog、连接行、方式选择、PAT 表单和仓库选择 MUST 支持键盘操作、稳定焦点顺序、可访问名称与错误播报。\n- **FR-023**：现有单连接 GitHub App 数据与 Project connection reference MUST 可迁移到多连接模型，且不得把未知或混合 schema 误判为可升级状态。\n- **FR-024**：API、MCP、CLI 与 Web MUST 共享同一连接合同；Web 不得成为唯一可管理连接的真相来源。\n- **FR-025**：Add Project UI MUST 不要求配置 Agent 或 runtime image；服务端 MUST 从平台全局默认配置解析并把解析结果固化到 Project，以保证后续执行可复现。\n- **FR-026**：服务端 MUST 从可信 deployment policy 解析 Integration method capability；客户端输入、request host 和 App 环境变量存在性都不得自行提升 capability。\n- **FR-027**：内部 deployment capability contract MUST 以结构化 availability 和稳定 reason code 区分 `available`、`hosted-only`、`not-configured` 与 `policy-disabled`；stock self-hosted 的公开 method projection MUST 省略 hosted-only App，直接 App 路由 MUST 返回机器可读 `HOSTED_ONLY` reason code，不得要求客户端解析英文错误文本。\n- **FR-028**：self-hosted 的 GitHub App connect、setup、callback、installation credential mint、repository discovery 与 delivery entry point MUST 全部 fail closed，且不得产生外部 redirect 或 GitHub API side effect。\n- **FR-029**：Hosted OAuth transaction MUST 持久保存一次性 nonce 的 hash、actor、Team、安装意图、safe return path、过期时间和消费状态；callback MUST 原子消费并重新验证 actor session 与 Team authorization。\n- **FR-030**：Hosted GitHub App registration 的 client secret、private key 与未来 webhook secret MUST 由平台 secret boundary 管理，不得成为 Team、Project、connection 或 self-hosted 配置状态。\n- **FR-031**：Hosted `IntegrationConnection` MUST 归属一个 Team；同一 App registration 的 installation 默认不得同时绑定多个 Team，除非未来规格引入明确的跨 Team repository partition 合同。\n- **FR-032**：部署不支持某已有 connection 时，系统 MUST 保留其非秘密元数据以供检查，但其派生 availability 必须阻止 discovery、Project 创建和 Runner credential 签发。\n- **FR-033**：部署 capability 判断 MUST 位于 Integration 管理和 exact-connection credential resolution 边界，不得让 `IntegrationRegistry` 按部署返回不同的核心 provider graph。\n- **FR-034**：Self-hosted `SecretProvider` MUST 通过共享 `RdbProvider` 持久化 envelope，不得依赖节点本地 secret 文件、`MYSTRA_SECRET_STORE_PATH` 或 sticky-session/node affinity。\n- **FR-035**：SQLite、PostgreSQL 与 Supabase-backed PostgreSQL MUST 对 `secret_envelopes` 提供相同的 Prisma-backed CRUD 与 create/replace/delete transaction 行为；Prisma 生成类型不得越过 DB 模块。\n\n### Key Entities\n\n- **IntegrationConnection**：一条稳定的 GitHub 授权关系；区分 GitHub App installation 与 PAT，保存非秘密身份、能力、状态和凭据引用。\n- **ConnectionCredential**：与连接关联的秘密材料及其生命周期；只能通过受保护的秘密边界解析，不作为公共业务对象返回。\n- **GitHub Account**：由 GitHub 验证的用户或组织身份，可被一条或多条连接引用。\n- **Project**：绑定一条 IntegrationConnection 和一个不可变、provider-resolved Repository snapshot 的执行边界。\n- **Repository Access Summary**：连接在验证时形成的非秘密能力摘要，用于界面说明和创建前置检查，不替代每次实际授权校验。\n- **Deployment Capability**：服务端派生的 Integration method 可用性；不持久化为用户可编辑配置，不由客户端决定。\n- **GitHub OAuth Transaction**：Hosted-only、短期、一次性的 actor/Team/installation 绑定；不是长期 session，也不保存 OAuth user token。\n\n## Scope\n\n### In scope\n\n- GitHub Integration Detail 与多连接管理。\n- Hosted 的多个 GitHub App installation 连接，以及 self-hosted 对 hosted-only capability 的服务端拦截与 PAT-only 公开展示。\n- 显式 PAT 创建、替换、验证与删除。\n- Project 创建时选择连接，并让 discovery 与 delivery 使用同一绑定连接。\n- self-hosted 的受保护 PAT secret storage，以及 hosted secret provider 的接口边界。\n- 开源代码保留 hosted GitHub App adapter，但运行时能力由 deployment policy 控制。\n- 对现有 039 单连接数据和文档边界的迁移。\n\n### Out of scope\n\n- 通用 Integration marketplace/catalog、GitLab intake、webhooks、Issue write-back、caller login、公开多租户管理。\n- 自动选择“最好”的连接、连接间自动 failover、PAT 自动刷新、组织 PAT 生命周期管理。\n- 在 Settings 中编辑 GitHub App 本身的 manifest、权限或品牌资料。\n- 把 PAT 复制到 Project 记录、repo snapshot 或长期 Runner 配置。\n- self-hosted GitHub App 的正式支持、任意用户自带 GitHub App registration、或通过环境变量绕过 deployment policy。\n- 在 041 内实现 hosted caller authentication、Team administration、hosted RDB/KMS 或 installation lifecycle webhook；它们是 hosted App 上线前的明确依赖阶段。\n\n## Assumptions\n\n- 当前操作者拥有添加相应 GitHub App installation 或创建 PAT 的权限。\n- GitHub App installation 只在 hosted profile 下启用；开发测试通过依赖注入模拟 hosted profile，不把 localhost 自动等同于 self-hosted 产品部署。\n- PAT 可以是 fine-grained 或 classic；系统以实际 API 能力验证为准，不依赖某一种 scope header。\n- 一条连接可服务多个 Project；删除连接前必须先解除所有 Project 引用。\n- 只有一条可用连接时的默认选择是便利行为，不改变 Project 提交时必须携带精确 connection ID 的合同。\n- 当前全局默认 Agent 沿用 `copilot`，默认开发镜像沿用 `mystra-runner:local`；部署可通过平台配置覆盖，Add Project UI 不暴露这些高级项。\n- 039 是本功能的代码基线；041 明确取代其中“单 active connection、无 PAT fallback”的限制，其余 GitHub App 安全约束继续有效。\n- self-hosted 默认 PAT，hosted 默认推荐 GitHub App；这是展示优先级，不是运行时 fallback 顺序。\n\n## Success Criteria\n\n### Measurable Outcomes\n\n- **SC-001**：Hosted 操作者可在一个 GitHub Detail 中识别并管理至少 10 条同时可用的 App/PAT 连接；self-hosted 操作者只能看到和管理 PAT 添加方式，GitHub App 添加控件计数为 0。\n- **SC-002**：从 Detail 开始，操作者可在 3 个主要操作以内进入 App OAuth 或 PAT 输入流程。\n- **SC-003**：使用两条不同连接创建的 Project，其仓库发现和交付验证均 100% 使用各自绑定连接，0 次跨连接 fallback。\n- **SC-004**：重复授权同一 App installation 产生 1 条稳定连接；添加另一个 installation 后原连接仍保持可用。\n- **SC-005**：无效 PAT、失败的 PAT replacement、被取消的 OAuth 都不会破坏已有可用连接。\n- **SC-006**：关系数据库、公共 API 响应、UI DOM、日志、事件和测试证据中的 PAT 明文泄露计数为 0；RDB envelope 在正确 KEK 缺失、错误或 auth tag 被篡改时均无法解密。\n- **SC-007**：现有 039 Project 在 schema 升级后保持相同 `repositoryConnectionId`，无需重新选择仓库。\n- **SC-008**：GitHub Detail 与 Add Project 在键盘操作和 320 / 768 / 1024 / 1440px 视口下完成主要流程，无不可达操作或页面级水平滚动。\n- **SC-009**：self-hosted profile 下 100% 的 GitHub App 管理与凭据入口在任何 GitHub redirect/API 调用前返回结构化 `hosted-only`；仅配置 App secrets 不能改变结果。\n- **SC-010**：Hosted OAuth transaction 的过期、重放、actor 不匹配、Team 权限撤销和 installation Team 冲突测试均 100% fail closed，且 OAuth user token 持久化计数为 0。\n- **SC-011**：能力 API、Settings UI、Project repository discovery 与 Runner credential resolver 对同一 deployment profile 的 GitHub App availability 判断一致率为 100%。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：GitHub Integration 多连接与凭据配置\n\n## 摘要\n\nMystra 将 GitHub 从单一状态升级为部署感知的连接集合。Self-hosted 正式支持 PAT；Hosted Mystra 额外支持平台运营的 GitHub App。开源代码保留 App adapter，但运行时不会把“代码存在”或“环境变量齐全”误判为 self-hosted 支持。每个 Project 固定绑定一条连接，发现与交付始终使用同一授权来源。\n\n## 功能地图\n\n- Integrations 列表：GitHub 行显示连接数量与健康摘要，并进入 Detail。\n- GitHub Detail：查看全部连接；stock self-hosted 只显示 PAT 添加方式；Hosted 可添加 App 或 PAT；支持重连、替换 token、删除未被引用的连接。\n- Add Project：选择连接，再选择该连接可访问的 repo；选定后只填写 Project Name 和 Slug。Agent 与开发镜像由平台全局默认配置解析。\n- 执行链：Project 保存精确 connection reference；clone、push、PR 不跨连接 fallback。\n- 安全边界：RDB 保存非秘密元数据、opaque reference 与 envelope ciphertext；PAT 明文只进入 `SecretProvider`，随机 DEK 由数据库外 KEK 包装。\n- 部署边界：capability 由可信服务端策略统一决定；UI、OAuth routes、repo discovery 和 Runner credential 必须一致 fail closed。\n- Hosted OAuth：一次性 transaction 绑定 actor、Team、安装意图和安全 return path；OAuth user token 验证后立即丢弃。\n\n## 边界\n\n- 本功能不引入通用 Integration catalog、GitLab intake、Issue write-back 或自动连接 failover。\n- PAT 是与 GitHub App 并列的显式方式，不是 App 失败后的隐藏回退。\n- 连接仍被 Project 引用时不能删除；失效连接必须显式恢复。\n- Self-hosted GitHub App、bring-your-own App registration 不属于支持范围。\n- Hosted caller auth、Team administration、RDB/KMS 与 lifecycle webhook 是明确后续阶段，不伪装成当前已实现能力。\n\n## 分阶段能力图\n\n1. Shared deployment capability contract 与 self-hosted 全入口 fail-closed。\n2. GitHub Detail Hosted-only 状态、PAT 和 Add Project 可用连接过滤。\n3. Hosted caller/Team、OAuth transaction、managed RDB/SecretProvider prerequisites。\n4. Hosted App installation activation、single-Team ownership 与 exact credential delivery。\n5. Hosted GA lifecycle webhook、审计/告警与真实 provider 验证。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：GitHub Integration 多连接与凭据配置\n\n## Owner 评审\n\n- [x] GitHub Detail 位于现有 Settings Modal 内，而不是新增主导航页面。\n- [x] Hosted 中 GitHub App 与 PAT 是并列、显式的添加方式。\n- [x] Stock self-hosted 的公开方式与 UI 只呈现 PAT；开源代码保留 hosted adapter，但所有 App 入口 fail closed。\n- [x] 多条 App/PAT 连接可以同时可用，新增连接不覆盖旧连接。\n- [x] Project 固定绑定所选连接，不进行跨连接自动 failover。\n- [x] Add Project 不展示 Agent 或 image；它们由平台全局默认配置解析并固化。\n- [ ] Owner 审阅交互原型中的 Detail、添加连接与 Add Project 状态。\n- [x] Owner 确认 self-hosted PAT-only 与 hosted App/PAT 两种 distribution projection。\n\n## Spec 就绪度\n\n- [x] 用户故事、边界、失败恢复和可测成功标准完整。\n- [x] 单连接/无 PAT 的旧产品边界已被标记为需要正式修订。\n- [x] PAT 明文禁止进入 RDB、公共响应、URL、日志和证据。\n- [x] 技术计划明确 deployment capability、SecretProvider、OAuth transaction、Team ownership、API 和 Runner credential 分派。\n- [x] 工程评审覆盖 CRITICAL Registry blast radius、route bypass、OAuth replay、跨 Team 冲突和秘密泄露测试。\n\n## 后续插件检查\n\n- [ ] prototype 产物覆盖 loading、empty、full、error、PAT form 与多连接 Add Project。\n- [ ] prototype 增加 self-hosted PAT-only 与 hosted App/PAT 状态。\n- [x] plan-eng-review 已处理 CRITICAL `defaultIntegrationRegistry` 影响项：capability 不进入 Registry provider graph。\n- [x] Hosted composition root 与最终 image build 归属独立 private distribution project；OSS 不维护 Cloud fork。\n- [ ] 使用 `/speckit.tasks` 按新架构重生成 capability / self-hosted enforcement 任务；现有 tasks 只代表此前多连接/PAT 实现。\n- [ ] 实现后运行 focused tests、typecheck、全量 test、build 和真实浏览器验证。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 交互原型：GitHub Integration 多连接与凭据配置\n\n## 原型入口\n\n[打开独立 HTML 原型](mockups/index.html)\n\n## UX Intent\n\n- **目标**：让操作者在现有 Settings Modal 内理解并管理 GitHub 连接集合；创建 Project 时明确连接 provenance。\n- **页面族**：Settings 使用固定阅读宽度的双栏 Modal；GitHub Detail 是 Integrations 的同模态下钻，不增加主导航。\n- **密度**：复用 Castrel-derived `SettingGroup` / `SettingRow`，32px 区段节奏、36px 字段、紧凑 ghost/soft/solid 操作层级。\n- **视觉**：Mystra dark-tech 语义色，平面 surface、quiet hairline、0/2/4/6px 圆角；无渐变、glow、glass 或装饰阴影。\n- **响应式**：窄屏隐藏设置左栏，Detail 仍保留返回路径；设置行按标题、说明、控件顺序堆叠。\n- **可访问性**：所有交互使用 button/input/select；连接类型和状态均有文本，不只依赖颜色；子流程可关闭并恢复焦点。\n\n## 覆盖页面与状态\n\n原型顶部的 `GitHub Detail`、`Add PAT`、`Add Project` 可切换三个关键流程：\n\n1. GitHub Detail：多条连接、状态、添加连接、删除保护；下一轮原型需覆盖 self-hosted PAT-only 与 hosted App/PAT 两种 distribution projection。\n2. Add PAT：方式选择、一次性 token 输入、安全说明与验证动作。\n3. Add Project：连接优先、连接范围内 repo 列表；选择 repo 后只保留 Connection、Repository、Project Name 和 Slug。\n\nDetail 中 `Add connection` 可打开方式选择；选择 `Personal access token` 进入 PAT 表单。Add Project 中选择 repo 后，列表隐藏并显示 Connection、Repository、Project Name 和 Slug。Agent 与开发镜像使用平台全局默认配置，不进入此流程。\n\n## 当前限制\n\n- 原型使用静态示例数据，不调用 GitHub 或本地 API。\n- OAuth 跳转、PAT 验证、token replacement、删除引用检查只表现交互意图，不模拟秘密生命周期。\n- 当前 HTML 原型仍以 hosted App 可用为默认示例；在进入 capability 实现前必须补充 self-hosted Hosted-only 状态并完成 Owner 复核。\n\n## 实现对照\n\n- 真实 Settings → Integrations → GitHub Detail 已在同一 Modal 内下钻；stock self-hosted 只呈现 PAT，Hosted distribution 才呈现 App/PAT，连接集合仍支持替换与删除操作。\n- 真实 Add Project 已验证为 Modal；选中 repo 后列表收起，只显示 Connection、Repository、Name、Slug，不显示 Agent 或 image。\n- PAT 输入使用非受控 password input；明文不进入 React state，成功提交后立即清空。\n- loading、empty、error、disabled 状态由真实 API 驱动。`Add connection` 先打开明确的方法选择；self-hosted 的 App 项保留说明但没有可执行 Continue，Hosted 才提供 OAuth action。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1786010779098"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# Implementation Plan: GitHub Integration 部署能力与 Hosted App\n\n**Branch**: `041-github-integration-connections` | **Date**: 2026-08-06 | **Spec**: [spec.md](spec.md)\n**Input**: GitHub Integration Detail、多连接、Project 精确连接绑定，以及 GitHub App hosted-only / PAT self-hosted-supported 的部署边界。\n\n## Summary\n\n在现有 041 多连接实现上增加服务端 deployment capability。Self-hosted 只正式支持 PAT；Mystra GitHub App 只在 hosted profile 可用。开源仓库保留 App adapter、路由和测试，但 capability API、管理路由与 exact-connection credential resolver 必须一致地阻止 self-hosted App 流程。Hosted OAuth 增加 caller/Team authorization 与一次性 durable transaction，App installation token 继续按需签发且不持久化。\n\nSettings 继续使用现有双栏 Modal。Stock self-hosted 的公开方式列表和 UI 只呈现 PAT；Hosted distribution 才可注入并优先显示 App。PAT 是否可用仍由 SecretProvider capability 决定。Self-hosted SecretProvider 改为 Prisma/RdbProvider-backed envelope encryption，移除 node-local file backend；Add Project、Project exact binding、Agent/image 全局默认和 Runner delivery 合同保持不变。\n\n## Technical Context\n\n**Language/Version**: TypeScript 5.9，Node.js 24.14.0\n**Primary Dependencies**: Next.js 16 Route Handlers、React 19、Zod 4、Node `crypto`、Prisma 7、GitHub REST API、现有 SQLite/PostgreSQL adapters\n**Storage**: SQLite、PostgreSQL 或 Supabase-backed PostgreSQL 经 `RdbProvider` 保存 connection metadata 与 envelope ciphertext；KEK 由部署 secret/KMS 提供\n**Testing**: Vitest 4、Prisma SQLite/PostgreSQL contract tests、API/component model tests、真实浏览器验证\n**Target Platform**: self-hosted Linux/macOS 单节点或多副本 PostgreSQL control-plane + Hosted Mystra 多实例控制面；Web 为 secondary client\n**Project Type**: monorepo web service + Runner daemon + shared contracts\n**Performance Goals**: 10 条连接的 GitHub Detail 首次加载不产生逐连接 GitHub 请求；capability 解析无网络调用；repo 列表保持分页；installation token 只按 exact connection mint\n**Constraints**: deployment capability 只由可信服务端策略决定；self-hosted App 在外部 redirect/API 调用前 fail closed；OAuth transaction 一次性且绑定 actor/Team；PAT plaintext、KEK 与 OAuth user token 不进 RDB/URL/log/public response；RDB 只保存 envelope ciphertext；App/PAT 不 fallback\n**Scale/Scope**: self-hosted 单节点与 Hosted 多 Team；一个 App installation 默认只归属一个 Team；不引入通用 Integration catalog\n\n## Constitution Check\n\n*GATE: Phase 0 前检查，并在 Phase 1 后复核。*\n\n- **Product boundary**：PASS。Constitution 2.5.0 明确 self-hosted PAT / hosted App；开源保留 adapter 不等于 self-hosted 支持。通用 catalog、GitLab intake 和本阶段 webhook 仍排除。\n- **Typed boundaries**：PASS。Connection list/create/replace/delete、PAT input、public view 和 Runner credential 继续使用 shared Zod contracts。\n- **Provider replaceability**：PASS。`IntegrationRegistry` 保持稳定；deployment capability 位于管理与凭据解析边界。`RdbProvider` 只持久化 opaque encrypted envelope，永不接触 plaintext/KEK；`SecretProvider` 可将 KEK wrapping 替换为 hosted KMS。\n- **Secret hygiene**：PASS。PAT 与 OAuth user token 仅在短期验证/使用路径存在；App identity secret 平台持有；所有公开 mapper fail closed。\n- **Verification/documentation**：PASS。计划包含 capability matrix、OAuth transaction、Team authorization、遗留连接、API/Runner/UI 一致性与 leakage 检查。\n\n## What already exists\n\n| Existing surface | Reuse decision |\n|---|---|\n| `IntegrationConnection` shared schema | 扩展 connection type/public credential state，不另建平行 Integration entity |\n| `RdbProvider.activateIntegrationConnection` | 拆除“upsert + 全局停用”混合职责，改为 connection-level upsert/status/delete |\n| `GitHubAppService` | 保留 OAuth verification、JWT 与 installation token cache；PAT 不塞进 App class |\n| `readGitHubAppConfig()` | 仅负责解析 App identity 配置；不再被视为 capability 判断 |\n| App connect/setup/callback routes | 保留 hosted adapter entry point；在 handler 最前执行同一 server capability guard |\n| `createGitHubIntegration` credential source | 继续作为 Repo/Issue provider 注入点，改由 exact-connection resolver 提供 token |\n| Project `repositoryConnectionId` | 原样保留，成为 discovery/delivery provenance 的唯一引用 |\n| Settings Modal、`SettingGroup`、`SettingRow` | 直接复用，增加同模态 Detail 状态而非新 route/page shell |\n| `ProjectCreateModal` | 保留 repo selection/config 收起逻辑，增加 connection step，删除 Agent/image 字段 |\n| Runner repository-credential route | 保留 assignment/no-store 边界，替换 App-only credential lookup |\n\nGitNexus 证据：`GitHubAppService` 为 MEDIUM 风险，9 个直接 import、22 个上游受影响项；`defaultIntegrationRegistry` 为 CRITICAL 风险，8 个直接 API caller、8 条执行流。因此不能在 Registry 内按部署删改 GitHub provider，也不能只守住 OAuth UI 而放过 Runner credential 路径。\n\n## Design Decisions\n\n### D0. Deployment capability 是服务端合同\n\n新增可注入的 `DeploymentCapabilityProvider`，由运行时装配提供可信 profile：\n\n```text\nself-hosted                           hosted\n    |                                  |\n    v                                  v\nDeploymentCapabilityProvider.resolve(\"github\")\n    |\n    +-- PAT: available / not-configured / policy-disabled\n    |\n    +-- GitHub App: hosted-only / available / not-configured\n```\n\n- capability 不来自 request、cookie、Host header 或客户端参数。\n- App secrets 配置齐全不自动把 self-hosted 提升成 hosted。\n- 部署形态由 control-plane 的 **composition root** 注入，不提供面向操作者的\n  `MYSTRA_DEPLOYMENT_PROFILE=hosted` 开关。开源发行入口固定装配\n  `createSelfHostedDeploymentServices()`；官方 Cloud 的受管启动入口装配\n  `createHostedDeploymentServices(...)`；测试可注入 fake hosted services。Hosted\n  composition root、Cloud adapters 与最终 image build 位于独立 private\n  distribution project；它通过 versioned deployment contract 消费固定 OSS\n  revision，不维护 Mystra fork。\n- `hosted` 不是一个足以授权功能的布尔值。Hosted 装配必须同时提供 caller\n  authentication、Team authorization、durable OAuth transaction store、managed\n  SecretProvider/KMS 和 GitHub App identity；缺少任一项时 capability 派生为\n  `PREREQUISITE_UNAVAILABLE`，不得降级为 cookie-only 或本地文件实现。\n- App 的普通环境变量只允许被 Hosted composition root 读取，用于构造\n  `GitHubAppIdentityProvider`；Self-hosted composition root 根本不装配该 provider，\n  因而变量存在也不会产生 App capability。\n- capability contract 使用结构化 `availability` 与 `reasonCode`，不要求客户端解析 `disabledReason` 文案。\n- Self-hosted 的公开 method projection 过滤 hosted-only App，因此 stock UI 只看到 PAT；`HOSTED_ONLY` 仍用于 direct route、遗留 connection 和内部 credential guard，不作为一个必须展示的卡片。\n- UI 是 capability 的展示者，不是安全边界。connect/setup/callback、credential resolver 与 Runner route 都重复执行同一 guard。\n\n```text\nOSS entrypoint                         Mystra Cloud entrypoint\n      |                                         |\n      v                                         v\ncreateSelfHostedDeploymentServices()  createHostedDeploymentServices(...)\n      |                                         |\n      +-- kind=self-hosted                      +-- kind=hosted\n      +-- local SecretProvider                  +-- caller/Team authz\n      +-- no GitHubAppIdentityProvider          +-- durable OAuth transaction store\n                                                +-- managed SecretProvider/KMS\n                                                +-- GitHubAppIdentityProvider\n                         \\                     /\n                          v                   v\n                         DeploymentCapabilityProvider\n```\n\n这条边界表达的是官方支持与默认装配，而不是 DRM。开源操作者始终可以修改源码\n重新装配服务；Mystra 只保证未经修改的 self-hosted 发行入口不会宣称或启动 Hosted\nGitHub App 能力。\n\n完整 ownership、build compatibility 与 rejected alternatives 记录于\n[`decision-cloud-distribution.md`](decision-cloud-distribution.md)。\n\n建议合同采用 discriminated union，而不是继续让 `configured: boolean` 同时表示产品支持、配置健康和策略许可。三个概念塞进一个布尔值，通常只能得到一个极具创造性的故障排查过程。\n\n### D1. 公共和内部 connection 分离\n\n公共 `IntegrationConnection` 不包含 `credentialRef`。控制面内部 `IntegrationConnectionRecord` 扩展公共字段并携带 optional opaque reference；API 必须通过显式 mapper 输出公共 schema。\n\n这避免将“虽然不是 token，但足以定位 token”的引用传播到 shared client contracts。\n\nHosted connection 增加 `teamId`、`createdByActorId` 和 `updatedByActorId` 作为授权与审计边界。Self-hosted 使用平台的 implicit local Team，不从请求接受任意 Team id。`status` 继续表示持久生命周期；`availability` 是 deployment + credential + policy 派生值，不回写 connection row。\n\n### D2. SecretProvider 与 RDB envelope 分层\n\n- `SecretProvider` 是唯一 plaintext boundary：`seal(ref, plaintext)`、`put/get/delete`；opaque ref 与 ciphertext 均不进入公共合同。\n- 每个 immutable credential version 使用随机 DEK 做 AES-256-GCM content encryption；部署 KEK 再独立包装 DEK。两次加密使用不同 96-bit IV 和 reference-bound AAD。\n- `RdbProvider`/Prisma 保存 envelope ciphertext、wrapped DEK、auth tags、算法版本和非秘密 `keyId`，但不接触 plaintext 或 KEK。\n- `MYSTRA_SECRET_STORE_KEY` 为 base64 32-byte KEK；缺失时 PAT method 显示 disabled。`MYSTRA_SECRET_STORE_KEY_ID` 默认 `env-v1`，为后续 rotation/KMS rewrap 提供标签。\n- secret ref：`github-pat/<connection-uuid>/<credential-version-uuid>`；create/replace 把 envelope write 与 connection ref switch 放入同一 serializable RDB transaction。\n- 不保留 `EncryptedFileSecretProvider`、`MYSTRA_SECRET_STORE_PATH`、dual read 或 file migration。Hosted 未来只替换 KEK wrapping adapter，不改变 RDB/public contract。\n\nGitHub App private key/client secret 是 hosted platform secret，不是 `IntegrationConnection` secret。Self-hosted distribution 不分发这些值。installation token 与 OAuth user token 都不进入任一 SecretProvider。\n\n### D3. PAT validation 诚实边界\n\n创建/替换 PAT 时调用 GitHub `GET /user` 验证身份，并通过 authenticated repository listing 验证至少一个 token-visible repo。Repository selection 时使用 GitHub 返回的 repo permissions 阻止明显不可 push 的目标。\n\nGitHub 没有一个无副作用 endpoint 可以证明 fine-grained PAT 具备 Pull requests(write)。系统不创建试验 PR；它显示该能力未验证，并在真实 review 调用返回 403 时给出精确恢复信息。\n\n### D4. 精确 connection resolver\n\n```text\nconnection id\n    |\n    v\nRdbProvider.getIntegrationConnectionRecord\n    |\n    +-- DeploymentCapabilityProvider.assertUsable(connection type)\n    |       |\n    |       +-- self-hosted + github-app -> HOSTED_ONLY (stop)\n    |\n    +-- github-app ----------> Team ownership check -> GitHubAppService.getInstallationCredential\n    |\n    +-- personal-access-token -> SecretProvider.get -> short Runner lease\n    |\n    v\ncreateGitHubIntegration credentialSource / Runner credential response\n```\n\n不存在“App 失败后试 PAT”或“PAT 失效后试另一条 connection”的边。未提供 connection ID 时，仅当恰好一条 active GitHub connection 存在才允许便利解析；0 或多条都返回显式错误。\n\n`defaultIntegrationRegistry` 不参与 capability 分支。它继续暴露稳定的 GitHub provider graph；每次 repository/Issue/Runner 操作都在 exact connection credential resolution 时执行 capability 与 Team authorization。这样不会把部署差异扩散到 8 个 Registry caller。\n\n### D5. Hosted OAuth transaction 与 Team ownership\n\n当前 cookie-only transaction 适合私有单操作者假设，不适合 hosted 多实例、多 Team。Hosted 流程改为：\n\n```text\nauthenticated actor in Team\n    -> create OAuthTransaction(hash(nonce), actorId, teamId, returnTo, expiresAt)\n    -> httpOnly cookie carries only opaque transaction id\n    -> GitHub install/setup + user authorization\n    -> callback atomically consumes transaction\n    -> re-check actor session + Team role\n    -> exchange code, verify installation belongs to Mystra App and actor\n    -> enforce installation -> one Team ownership\n    -> upsert Team-scoped connection\n    -> discard OAuth user token\n```\n\n- transaction store 必须跨实例可见，TTL 10 分钟，消费操作原子且不可重放。\n- callback base URL 只取 trusted hosted config；绝不从 request origin/forwarded host 推导。\n- safe return path 只允许站内相对路径，并在 transaction 创建时固化。\n- 同一 App registration 的 installation 默认只能属于一个 Team。GitHub 对一个 account 的同一 App 只有一个 installation；如果同时绑定多个 Mystra Team，各 Team 会看到同一授权仓库集合，无法形成可信租户隔离。未来若要共享，必须另立 repository partition 合同。\n- Hosted App GA 依赖 caller authentication 与 Team RBAC。041 只定义接口和 gate，不声称这些前置能力已经存在。\n\n### D6. Project 全局默认值\n\n`ProjectCreateRequest.defaultAgent` 与 `runtime` 对兼容客户端保持 optional。控制面用中央 `readProjectDefaults()` 解析：\n\n- `MYSTRA_DEFAULT_AGENT`，默认 `copilot`\n- `MYSTRA_DEFAULT_DEV_IMAGE`，默认 `mystra-runner:local`\n\nresolved `Project` 仍持久化 `defaultAgent` 和 `runtime`，因此后续修改全局默认不会偷偷改变已有 Project。\n\n### D7. 连接数据与部署迁移\n\n现有 v4 → v5 数据迁移保持不变：\n\n1. 为 `integration_connections` 增加 `connection_type`（已有行默认 `github-app`）、`credential_ref`、`display_name` 和 `access_summary`。\n2. 删除 `idx_integration_connections_active` partial unique index。\n3. 保留 `UNIQUE(integration, external_id)`；App 使用 installation id，PAT 使用 server-side token fingerprint 作为不公开 external identity。\n4. 把 schema version 更新为 5，执行 foreign-key check。\n\n未知、混合或部分升级 schema 继续 fail closed。现有 Project row 和 `repository_connection_id` 不重写。\n\n部署 capability 不写入 schema v5。切换到 self-hosted profile 后，遗留 App connection 保留非秘密元数据并派生 `availability=unsupported`；不得 mint token、发现仓库或供 Runner 使用。041 不自动删除连接，也不偷偷改绑 Project。若将来已有生产数据需要从 App 改为 PAT，另行设计“同 provider + 同 immutable repository identity”的显式 credential rebind migration，而不是松动 Project provenance。\n\n## End-to-end Data Flows\n\n### Add GitHub App connection\n\n```text\nHosted Detail: Add connection -> GitHub App\n  -> authenticated Team authorization check\n  -> create durable one-time OAuthTransaction\n  -> public App install URL\n  -> GitHub Setup URL records installation intent\n  -> OAuth callback + PKCE + atomic transaction consume\n  -> re-check actor/Team role\n  -> verify installation belongs to user and exact Mystra App registration\n  -> enforce installation ownership by one Team\n  -> upsert by (team, github, app registration, installation id)\n  -> discard OAuth user token\n  -> redirect to safe stored return path\n```\n\n新 upsert 只更新目标安装，不停用其他 connection。\n\n```text\nSelf-hosted Detail: Add connection\n  -> public method list = PAT only\n  -> direct GitHub App routes = hosted-only error\n  -> no actionable connect URL\n\ndirect request to connect/setup/callback\n  -> DeploymentCapabilityProvider guard\n  -> 409 INTEGRATION_CONNECTION_METHOD_UNAVAILABLE\n  -> no redirect, no GitHub API, no state write\n```\n\n### Create or replace PAT\n\n```text\nPOST/PUT JSON body { token, label? }\n  -> Zod parse, no logging\n  -> GET /user + authenticated repo validation\n  -> derive non-public fingerprint + public metadata\n  -> SecretProvider.seal(new immutable ref, plaintext)\n  -> RdbProvider transaction: insert envelope + insert/update metadata + switch opaque ref\n  -> replace transaction deletes previous envelope after reference switch\n  -> explicit public mapper\n  -> no-store response without token/ref\n```\n\nReplace 在 GitHub validation 成功前不写 envelope；transaction 失败时旧 reference 与旧 envelope 继续有效。\n\n### Delete connection\n\n```text\nDELETE connection\n  -> count Project references\n  -> if count > 0: 409 CONNECTION_IN_USE\n  -> RdbProvider transaction deletes metadata row + referenced envelope\n```\n\ntransaction 失败时 connection 与 envelope 都保持原状，避免“界面说已删、RDB 仍留 credential material”。\n\n### Add Project\n\n```text\nopen modal\n  -> list active public connections\n  -> 1 connection: preselect; >1: require confirmation\n  -> list repos with exact connection id\n  -> select repo; hide list\n  -> show Connection + Repository + Name + Slug\n  -> POST without Agent/image\n  -> server resolves global defaults + remote snapshot\n  -> persist Project with exact repositoryConnectionId and resolved defaults\n```\n\nCapability filtering occurs before repository listing. Existing unsupported App connections may be shown read-only in Settings, but Add Project only accepts connections whose derived availability is `available` in the current deployment.\n\n## Project Structure\n\n### Documentation (this feature)\n\n```text\nspecs/041-github-integration-connections/\n├── spec.md\n├── features.md\n├── checklists.md\n├── prototype.md\n├── mockups/index.html\n├── plan.md\n├── research.md\n├── data-model.md\n├── quickstart.md\n├── contracts/\n└── tasks.md\n```\n\n### Source Code\n\n```text\npackages/shared/src/\n├── integrations.ts        # public connection/method/input schemas\n├── management.ts          # responses and stable error codes\n└── schemas.ts             # optional create overrides; resolved Project unchanged\n\napps/control-plane/src/lib/\n├── db/\n│   ├── rdb-provider.ts    # internal records, connection-level persistence methods\n│   ├── migrations.ts      # exact v4 -> v5 preservation migration\n│   └── sqlite-provider.ts\n├── deployment/\n│   └── capabilities.ts    # trusted profile + Integration method availability\n├── secrets/\n│   ├── secret-provider.ts\n│   ├── rdb-secret-provider.ts\n│   └── managed-secret-provider.ts # hosted adapter, provider chosen later\n├── integrations/\n│   ├── github-app.ts      # existing App path\n│   ├── github-oauth-transaction.ts # hosted one-time actor/Team binding\n│   ├── github-pat.ts      # PAT validation and safe fingerprint\n│   ├── github-credential.ts # exact connection dispatcher\n│   ├── registry.ts\n│   └── README.md\n└── projects/\n    ├── project-defaults.ts\n    └── resolve-project-input.ts\n\napps/control-plane/app/\n├── api/integration-connections/...\n├── api/integrations/[integration]/repositories/...\n├── api/runner/sessions/[id]/repository-credential/route.ts\n└── _components/\n    ├── shell-settings.tsx\n    ├── shell-settings-panels.tsx\n    ├── github-integration-detail.tsx\n    ├── github-connection-form.tsx\n    └── project-create-modal.tsx\n```\n\n**Structure Decision**：在现有 `SecretProvider` 与 exact credential resolver 上增加一个小型 deployment capability port；不创建 self-hosted/hosted 两套 Registry、connection entity 或 UI。Hosted OAuth transaction 是独立安全边界，不塞进 `GitHubAppService` 的 API client 职责。具体 hosted KMS/RDB adapter 在对应平台 feature 中实现。\n\n## Failure Modes\n\n| Codepath | Production failure | Handling | Test | User-visible result |\n|---|---|---|---|---|\n| Capability list | App secrets 存在导致 self-hosted 误报可用 | trusted profile 优先，self-hosted public projection 省略 App | contract/API | UI 只显示 PAT |\n| Direct App route | 调用方绕过 self-hosted UI | handler 首行 capability guard | route integration | 结构化 hosted-only，无 redirect |\n| OAuth callback | state forged、过期、重放或 actor/Team 不匹配 | durable atomic consume + session/RBAC re-check | API integration | 返回 Detail 的明确失败原因 |\n| OAuth callback | 请求落到另一个 hosted instance | shared transaction store | multi-instance integration | 流程继续或明确过期，不丢状态 |\n| App ownership | 同一 installation 被另一个 Team 重连 | global installation ownership conflict | RDB/API | 显式冲突，不泄露原 Team 详情 |\n| App upsert | 添加第二安装触发旧 unique-active 逻辑 | v5 drop index + connection-level upsert | SQLite + OAuth API | 两条连接同时 active |\n| PAT create | token 401/403/SSO blocked | stable integration error；不写 secret | provider/API | form 保留并显示恢复建议 |\n| PAT create | envelope/DB insert 失败 | 同一 transaction rollback；返回非泄露错误 | service integration | 未创建连接、无 orphan envelope |\n| PAT replace | 新 token invalid | validation-before-write | provider/API | 旧 token 保持有效 |\n| PAT replace | envelope insert 或 metadata switch 失败 | transaction rollback | integration | 旧 token/reference 保持有效 |\n| Delete | Project still references connection | DB reference count 409 | SQLite/API | 显示阻止原因 |\n| Delete | envelope/connection delete transaction fails | 保留原 connection + envelope | SecretProvider/API | 显示 Retry，不宣称完成 |\n| Repo list | multiple connections but no id | `CONNECTION_SELECTION_REQUIRED` | API | UI 要求选择连接 |\n| Runner credential | PAT decrypt/auth failure | no-store 409/502；不 fallback | route integration | Session 失败指向绑定连接 |\n| Runner credential | self-hosted 遗留 App connection | exact resolver capability guard before mint | route integration | Session 失败指向 Hosted-only |\n| Add Project | rapid connection switch | request identity guard + clear cursor/repo | component/model | 不显示前一连接 repo |\n| Defaults | invalid env agent/image | startup/request validation | unit/API | 配置错误明确，Project 不创建 |\n\nHosted caller authentication、Team RBAC、shared transaction store 或 managed SecretProvider 尚未落地时，hosted App capability 必须整体 unavailable；不得只因为 App env 配齐就开放半条流程。计划覆盖后没有允许 silent failure 且同时缺少 test/error handling 的路径。\n\n## Test Coverage Plan\n\n### Engineering review: RDB envelope amendment\n\n- **Architecture**: approved. Connection metadata/reference and encrypted material remain distinct logical models; only their transaction boundary is shared. `SecretProvider` alone sees plaintext/KEK, while `RdbProvider` sees portable envelope fields.\n- **Consistency**: create/replace/delete require serializable Prisma transactions. Immutable credential refs avoid in-place ciphertext overwrite; failed replace leaves the old reference readable and commits no orphan envelope.\n- **Security**: random DEK per credential, distinct GCM IVs for content/wrap, reference/key/version-bound AAD, no plaintext/error echo, and fail-closed wrong-key/tamper behavior. Key rotation stores `keyId`; bulk rewrap and hosted KMS are later operational work.\n- **Operations**: SQLite backup includes metadata and ciphertext but still requires separately backed-up KEK. PostgreSQL/Supabase backups become replica-portable without copying node-local files. Loss of KEK is intentionally unrecoverable.\n- **Performance**: indexed primary-key lookup is O(1); PAT envelopes are small and add one row lookup plus two local AES-GCM operations per credential resolution. No list path loads ciphertext.\n- **Testing gate**: provider contract on SQLite and optional PostgreSQL, schema parity, cryptographic integrity/leak tests, lifecycle rollback tests, public response tests, typecheck/build, and real API/UI evidence. GitNexus impact remains `UNKNOWN` if the LadybugDB native storage version mismatch persists; direct reference inventory then becomes recorded fallback evidence.\n\n### Verification evidence (2026-08-06)\n\n- Node `24.14.0` and pnpm `10.25.0`; both Prisma schemas validate and the SQLite preview applied both committed migrations.\n- 9 focused files / 27 tests pass for SQLite RdbProvider contract, schema parity, adoption, config parsing, envelope encryption, PAT lifecycle, credential resolution, and connection API; migration-wrapper tests add 3 passes.\n- Scoped strict TypeScript checking for the changed DB/secret/PAT modules passes. Next production compilation succeeds, then the full TypeScript gate stops on pre-existing 040/041 field drift in `github-connection-model.ts` (`connectionType` versus `authMethod`); the branch-wide gate is therefore not claimed as green.\n- Port 3000 detached `mystra-preview` returns PAT `configured: true`; real browser navigation opens the password-type PAT form. Empty input remains unsent in the UI and direct empty JSON returns 400 `INVALID_REQUEST` with zero connections.\n- Preview DB, preview log, git diff, API response, and UI DOM contain zero PAT/key matches. No real PAT was submitted.\n- GitNexus impact and change detection remain unavailable because LadybugDB reports database storage version 42 versus runtime version 40; risk is conservatively treated as high and source/tests/runtime are the evidence of record.\n\n```text\nCODE PATH COVERAGE\n==================\n[+] shared contracts\n    ├── App/PAT discriminated public connection              [planned ★★★]\n    ├── method availability discriminates supported reasons   [planned ★★★]\n    ├── PAT input accepts token but public response rejects it [planned ★★★]\n    └── optional create defaults -> resolved Project required [planned ★★★]\n\n[+] schema v5 / RdbProvider\n    ├── exact v4 migration preserves ids and Projects         [planned ★★★]\n    ├── two App + two PAT connections active simultaneously  [planned ★★★]\n    ├── repeated installation upserts one row                 [planned ★★★]\n    ├── deletion blocked by Project FK/reference count        [planned ★★★]\n    └── unknown/mixed schema fails closed                     [planned ★★★]\n\n[+] SecretProvider / PAT\n    ├── AES-GCM round trip + wrong key/auth tag failure       [planned ★★★]\n    ├── path traversal rejected, permissions 0700/0600        [planned ★★★]\n    ├── valid/invalid/rate-limited/SSO-shaped responses       [planned ★★★]\n    ├── invalid replacement preserves old secret              [planned ★★★]\n    └── plaintext absent from disk/RDB/error/public JSON      [planned ★★★]\n\n[+] exact credential resolver\n    ├── self-hosted App -> HOSTED_ONLY before token mint       [planned ★★★]\n    ├── App -> installation credential                        [planned ★★★]\n    ├── PAT -> decrypted short lease                          [planned ★★★]\n    └── missing/inactive/wrong type -> no fallback            [planned ★★★]\n\n[+] API and Runner\n    ├── list/create/replace/delete public shapes              [planned ★★★]\n    ├── all App routes fail closed in self-hosted profile     [planned ★★★]\n    ├── App env cannot elevate self-hosted capability         [planned ★★★]\n    ├── hosted transaction expiry/replay/actor/Team conflict  [planned ★★★]\n    ├── OAuth second installation regression                  [planned ★★★]\n    ├── repo list/resolve exact connection                    [planned ★★★]\n    └── Runner App/PAT/no-store/assignment checks             [planned ★★★]\n\nUSER FLOW COVERAGE\n==================\n[+] Settings -> GitHub Detail                                 [planned model + browser]\n    ├── loading / empty / full / error\n    ├── self-hosted Hosted-only / PAT configured states\n    ├── App add callback returns to Detail\n    └── PAT add / replace / in-use delete\n\n[+] Add Project                                               [planned model + browser]\n    ├── one connection preselect / multiple require confirm\n    ├── switch clears prior repositories and selection\n    ├── repo selection collapses list\n    └── only Name + Slug, no Agent/image\n\n[→E2E] Real GitHub smoke, when credentials are available\n    ├── hosted App connection lists private repo\n    ├── self-hosted App route makes zero external requests\n    └── PAT connection lists repo and delivers clone/push/PR\n```\n\n## Performance Review\n\n- Deployment capability is resolved from immutable server bootstrap state and may be cached for process lifetime；it performs no per-request network call。\n- Connection list is one SQLite query plus project-reference aggregation, not N GitHub calls。\n- PAT validation is explicit write-path work；repo discovery remains paginated。\n- App installation token cache remains process-local and keyed by App registration + installation id；multi-instance hosted nodes may mint independently because cache is disposable, never durable truth。\n- Hosted OAuth transaction consume is one indexed lookup/update by opaque id or nonce hash；TTL cleanup is bounded background maintenance。\n- Secret files are small；atomic rename is O(1) for the expected local filesystem。\n- UI switching uses request identity/AbortController to discard stale connection responses；does not merge lists across identities。\n\nNo material N+1 or memory-growth concern at the MVP scale。\n\n## Implementation Sequence\n\n1. **Capability contract**：shared discriminated availability schema、trusted deployment profile、provider-method list；覆盖 self-hosted/hosted matrix。\n2. **Self-hosted enforcement**：给 connect/setup/callback、exact resolver、repo discovery 与 Runner credential 增加同一 guard；保留 PAT。\n3. **UI projection**：GitHub Detail 在 stock self-hosted 只显示 PAT；Add Project 排除 unavailable connection；更新 prototype/browser contract。\n4. **Hosted prerequisites**：caller session/Team RBAC port、durable OAuthTransaction store、managed SecretProvider/RdbProvider adapter；缺一项则 App capability 不可用。\n5. **Hosted activation**：actor/Team-bound install + OAuth callback、installation single-Team ownership、user token discard、exact connection upsert。\n6. **Hosted runtime**：installation token mint/cache、repo discovery、Runner delivery、跨实例与权限恢复测试。\n7. **Hosted GA follow-up**：经过独立 spec 批准后加入 verified installation lifecycle webhook、审计/告警与运营 runbook。\n\n前 1–3 步是当前 041 的最小部署边界修订。4–7 是 hosted rollout roadmap，不应在缺少 caller auth/Team/RDB 前被半实现。实现上保持顺序执行：shared schema、route guards、UI 都集中在同一 Integration module，平行 worktree 的冲突成本高于收益。\n\n## NOT in scope\n\n- Generic Integration catalog/marketplace：GitHub-only requirement does not justify it。\n- GitLab intake or GitLab PAT：current provider boundary excludes it。\n- Automatic connection failover/default ranking：would destroy Project credential provenance。\n- Hosted Vault/KMS provider：`SecretProvider` seam is included，hosted implementation is not。\n- Hosted caller auth、Team administration、RDB/KMS concrete provider：041 定义 prerequisite contract，不假装当前已有实现。\n- Webhooks and automatic connection health polling：当前 041 仍在 management/use path 验证；installation lifecycle webhook 是 Hosted GA 前的独立 follow-up。\n- PAT lifecycle automation or refresh：GitHub PATs are replaced explicitly。\n- Agent/runtime controls in Add Project：removed by owner direction，resolved from platform defaults。\n- Editing GitHub App manifest/permissions/avatar：deployment administration remains external to this UI。\n- Self-hosted GitHub App support 或 bring-your-own GitHub App registration：与 owner 指定的产品边界冲突。\n- 通过许可证、代码删除或混淆阻止 fork 启用 App：这是 capability/support architecture，不是 DRM 项目。\n\n## Complexity Tracking\n\n| Concern | Why Needed | Simpler Alternative Rejected Because |\n|---|---|---|\n| Deployment capability port | UI、API、repo discovery 与 Runner 必须得到同一部署结论 | 各 route 直接读 env 会漂移且无法测试 |\n| Hosted OAuth transaction store | cookie-only transaction 不能绑定多实例 caller/Team 授权 | 把 Team id 放 state/cookie 会泄漏并允许重放 |\n| Cross-package change >8 files | 一个 hosted-only 边界必须覆盖 shared contract、API、provider、Runner 和 UI | 只隐藏 UI 仍允许直接 route/Runner 调用 |\n\n## Engineering Review Result\n\n- **Step 0 Scope Challenge**：保留现有 041 connection/credential 架构，不分叉 self-hosted/hosted 产品代码；当前实现只新增 capability seam 与完整 guard，Hosted foundation 分阶段交付。\n- **Architecture**：GitNexus 显示 `defaultIntegrationRegistry` 为 CRITICAL，因此明确禁止 Registry 按部署变形；`GitHubAppService` MEDIUM，所有 9 个直接 import 入口由统一 policy 覆盖。\n- **Code quality**：一个 deployment capability port、一个 hosted OAuth transaction boundary；不新增 Integration catalog 或平行 connection entity。\n- **Tests**：coverage diagram已补 capability matrix、route bypass、OAuth replay/Team ownership、Runner legacy connection；0 silent critical gap。\n- **Performance**：capability 无网络调用；OAuth transaction O(1)；installation token cache 继续是 disposable process-local hint。\n- **Lake score**：5/5 选择完整边界，包括 UI、API、provider、Runner 与 hosted callback，而不是只隐藏按钮。\n\n## GSTACK REVIEW REPORT\n\n| Review | Trigger | Why | Runs | Status | Findings |\n|---|---|---|---|---|---|\n| CEO Review | `/plan-ceo-review` | Scope & strategy | 0 | — | — |\n| Codex Review | `/codex review` | Independent 2nd opinion | 0 | — | — |\n| Eng Review | `/plan-eng-review` | Architecture & tests (required) | 2 | CLEAR | deployment capability + hosted OAuth/Team boundary；0 unresolved；0 critical gaps |\n| Design Review | `/plan-design-review` | UI/UX gaps | 0 | — | Prototype + Mystra UX rules applied |\n| DX Review | `/plan-devex-review` | Developer experience gaps | 0 | — | — |\n\n**VERDICT:** ENG CLEARED — ready for task decomposition。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks: GitHub Integration 多连接与 PAT\n\n**Input**: `/specs/041-github-integration-connections/` 下的 `spec.md`、`plan.md`、`research.md`、`data-model.md`、`contracts/` 与 `quickstart.md`\n\n**Tests**: 本功能改变共享合同、秘密持久化、SQLite schema、授权路由与核心 UI，所有行为任务遵循 TDD：先写失败测试，再实现，再运行聚焦验证。\n\n**Organization**: 任务按用户故事组织；共享合同、schema v5 与精确凭据解析是所有故事的阻塞基础。\n\n## Phase 1: Setup\n\n**Purpose**: 固化实现基线与全局配置合同。\n\n- [ ] T001 在 `specs/041-github-integration-connections/quickstart.md` 核对 Node 24.14.0、pnpm 10.25.0、schema v5 与 PAT master key 的本地验证命令\n- [ ] T002 [P] 在 `apps/control-plane/src/lib/integrations/README.md` 记录 App/PAT 不 fallback、精确 connection ID 与秘密边界\n- [ ] T003 [P] 在 `apps/control-plane/src/lib/db/README.md` 记录 schema v5、opaque credent  `pnpm --filter @mystra/control-plane test -- src/lib/db src/lib/secrets src/lib/projects/project-defaults src/lib/integrations/github-credential`，修复基础阶段回归\n\n**Checkpoint**: 公共响应不含 secret ref，v4 数据可保序升级，多条连接可同时 active，App/PAT 只能按精确连接解析。\n\n---\n\n## Phase 3: User Story 1 - GitHub Detail 管理全部连接 (Priority: P1)\n\n**Goal**: Settings → Integrations 下钻到 GitHub Detail，并展示所有连接的真实状态与操作。\n\n**Independent Test**: 准备两条不同类型连接，进入 Detail 后分别看到身份、方式、仓库摘要、状态、时间和操作；刷新 URL 仍恢复 Detail。\n\n- [ ] T018 [P] [US1] 在 `apps/control-plane/app/api/integration-connections.test.ts` 为连接集合、公共 mapper、数量/状态摘要与 no-store 编写失败 API 测试\n- [ ] T019 [P] [US1] 在 `apps/control-plane/app/_components/github-connection-model.test.ts` 为 loading/empty/full/error/disabled/permission-limited 状态编写失败 model 测试\n- [ ] T020 [US1] 在 `apps/control-plane/app/api/integration-connections/route.ts` 实现多连接 public list 与安全状态摘要\n- [ ] T021 [US1] 在 `apps/control-plane/app/_components/github-connection-model.ts` 与 `apps/control-plane/app/_components/github-integration-detail.tsx` 实现 Detail 状态模型和 Castrel-style connection rows\n- [ ] T022 [US1] 在 `apps/control-plane/app/_components/shell-settings-panels.tsx` 与 `apps/control-plane/app/_components/shell-settings.tsx` 接入 Integrations → GitHub Detail、返回导航和 URL 状态恢复\n- [ ] T023 [US1] 在 `apps/control-plane/app/_components/shell-copy.ts` 增加 GitHub Detail 的中英文 loading、empty、error、状态与操作文案\n\n**Checkpoint**: GitHub Detail 可独立加载、重试、返回、关闭，并且公开 DOM/响应不出现凭据或 secret ref。\n\n---\n\n## Phase 4: User Story 2 - 多 GitHub App 安装连接 (Priority: P1)\n\n**Goal**: 重复安装/授权不同 GitHub App installation 时同时保留连接；重连同一 installation 原地更新。\n\n**Independent Test**: 依次授权两个 installation，确认二者 active；再次授权第一个只更新对应记录。\n\n- [ ] T024 [US2] 在 `apps/control-plane/src/lib/integrations/github-app.test.ts` 与 `apps/control-plane/app/api/integration-connections.test.ts` 为第二 installation、不唯一 installation 选择和取消回调不破坏旧连接编写失败测试\n- [ ] T025 [US2] 在 `apps/control-plane/src/lib/integrations/github-app.ts` 与 `apps/control-plane/app/api/integrat y: P1)\n\n**Goal**: Add Project 仅选择 Connection、Repository、Name、Slug；服务端解析全局 Agent/image 默认值并固化，发现与交付使用同一连接。\n\n**Independent Test**: 使用一条 App 与一条 PAT 分别创建 Project，repo 列表互相隔离，Project 保存 exact connection 和 resolved defaults，Runner 只签发绑定凭据。\n\n- [ ] T035 [P] [US4] 在 `apps/control-plane/app/projects/_components/project-create-model.test.ts` 为单连接预选、多连接确认、切换清空和 repo 收起编写失败测试\n- [ ] T036 [P] [US4] 在 `apps/control-plane/src/lib/projects/resolve-project-input.test.ts` 为 exact connection、optional UI defaults 与 server-resolved defaults 编写失败测试\n- [ ] T037 [P] [US4] 在 `apps/control-plane/src/lib/integrations/registry.test.ts` 为 exact App/PAT repo provider、缺 ID 多连接错误和 no-fallback 编写失败测试\n- [ ] T038 [P] [US4] 在 `apps/control-plane/app/api/integration-connections.test.ts` 为 repo list/resolve connection isolation 与 Project create exact binding 编写失败 API 测试\n- [ ] T039 [US4] 在 `apps/control-plane/src/lib/integrations/registry.ts`、`apps/control-plane/app/api/integrations/[integration]/repositories/route.ts` 与 `apps/control-plane/app/api/integrations/[integration]/repositories/resolve/route.ts` 接入 exact connection credential resolver\n- [ ] T040 [US4] 在 `apps/control-plane/src/lib/projects/resolve-project-input.ts` 与 `apps/control-plane/app/api/projects/route.ts` 接入全局 defaults 并固化 resolved Project\n- [ ] T041 [US4] 在 `apps/control-plane/app/projects/_components/project-create-model.ts` 与 `apps/control-plane/app/_components/project-create-modal.tsx` 实现 connection-first repo flow，并删除 Agent/image 控件与请求字段\n- [ ] T042 [US4] 在 `apps/control-plane/app/api/runner/sessions/[id]/repository-credential/route.ts` 接入 exact App/PAT credential resolver，保持 assignment 检查与 no-store\n- [ ] T043 [US4] 在 `apps/control-plane/app/api/integration-connections.test.ts` 增加 Runner App/PAT credential、inactive binding 和无 fallback 回归测试\n\n**Checkpoint**: Project onboarding 与 Runner delivery 均由同一 `repositoryConnectionId` 决定；Modal 不显示 Agent 或镜像。\n\n---\n\n## Phase 7: Polish & Cross-Cutting Verification\n\n**Purpose**: 收拢文档、可访问性、安全性和真实运行证据。\n\n- [ ] T044 [P] 更新 `specs/041-github-integration-connections/prototype.md` 与 `specs/041-github-integration-connections/mockups/index.html` 的最终实现差异和状态说明\n- [ ] T045 [P] 更新 `.env.example` 与 `specs/041-github-integration-connections/quickstart.md`，只记录 secret store key/path 和 Project defaults 配置名，不写真实秘密\n- [ ] T046 运行 focused tests、`pnpm typecheck`、`pnpm test`、`pnpm build`，并记录所有真实退出码\n- [ ] T047 在真实应用中按 320/768/1024/1440px 验证 Settings Detail、PAT 表单、Add Project 键盘/焦点/错误状态和无页面级水平滚动\n- [ ] T048 执行 RDB、HTTP response、浏览器 DOM/console 与日志的 PAT 明文泄露审计，并确认公开 connection JSON 不含 `credentialRef`\n- [ ] T049 运行 `gitnexus_detect_changes()`，核对只影响 GitHub connection、Project onboarding、Runner credential 与预期文档执行流\n- [ ] T050 重新运行 `node scripts/render-spec-view.mjs --feature 041-github-integration-connections` 并在 Spec View 中核对规格、计划、任务与验证证据\n\n---\n\n## Phase 8: OSS Self-hosted PAT-only enforcement\n\n**Goal**: Stock OSS control-plane 只公开和渲染 PAT 添加方式；保留 GitHub App domain code，但所有 App runtime 入口在外部副作用前 fail closed。\n\n**Independent Test**: 即使配置完整 `MYSTRA_GITHUB_APP_*`，连接方式 API 仍只返回 PAT；Settings DOM 不出现 GitHub App 添加方式；connect/setup/callback 返回稳定 `HOSTED_ONLY`；默认 repo/Runner credential resolver 不 mint App token。\n\n- [x] T051 [P] 为 self-hosted PAT-only method list、UI projection、三个 App route 和 exact credential resolver 编写失败测试\n- [x] T052 在 shared error contract 与 `apps/control-plane/src/lib/integrations/deployment-capabilities.ts` 定义稳定 Hosted-only guard\n- [x] T053 在 connection list、connect/setup/callback 与默认 GitHub credential resolver 接入 stock self-hosted policy\n- [x] T054 在 GitHub Detail 与 Settings 摘要中仅渲染 API 返回的方法，self-hosted 只出现 PAT\n- [x] T055 更新模块文档、Spec View，并运行 focused tests、typecheck、build、真实浏览器与泄露检查\n\n---\n\n## Phase 9: RDB envelope SecretProvider amendment\n\n**Goal**: Remove node-local secret files while keeping PAT plaintext outside RDB and making PostgreSQL-backed self-hosted replicas viable.\n\n- [x] T056 Update 041/durable contracts from file-backed encryption to RDB envelope encryption with external KEK\n- [x] T057 [P] Add failing SQLite/PostgreSQL schema parity and RdbProvider contract tests for immutable `SecretEnvelope` CRUD\n- [x] T058 [P] Add failing SecretProvider tests for random DEK wrapping, AAD integrity, wrong KEK, tampering, missing rows, and plaintext leakage\n- [x] T059 Add failing PAT lifecycle tests proving create/replace/delete couple envelope and `credentialRef` in one transaction and preserve the old credential on failure\n- [x] T060 Add `SecretEnvelope` to both Prisma schemas/migrations and keep generated Prisma types inside the DB module\n- [x] T061 Implement `RdbSecretProvider`, remove `EncryptedFileSecretProvider`/path configuration, and compose it with the selected `RdbProvider`\n- [x] T062 Update PAT routes/resolver to the async Prisma composition root without changing public API shapes\n- [ ] T063 Run focused tests, schema validation, typecheck/build, plaintext leak audit, port-3000 API/UI verification, and record the LadybugDB impact-analysis blocker\n\n## Dependencies & Execution Order\n\n- **Phase 1 → Phase 2**：先固定配置与文档边界，再落 shared/storage foundation。\n- **Phase 2 → US1/US2/US3/US4**：所有用户故事依赖同一个多连接 schema 与 exact credential resolver。\n- **US1 → US2/US3**：Detail shell 先存在，App/PAT 管理行为再进入该 Detail。\n- **US2 + US3 → US4**：Project selector 需要至少两种可列出的 connection type；实现按 App、PAT、Project 顺序验证。\n- **Phase 7**：依赖所有选择交付的用户故事完成。\n- **Phase 8**：覆盖旧任务中的 App 本地可用假设；必须在 stock OSS 验收前完成。\n\n## Parallel Opportunities\n\n- T004/T005、T008/T010、T018/T019、T028/T029、T035/T036/T037 可在合同冻结后按不同文件并行编写测试。\n- 实际实现应保持顺序：shared → DB/secret → credential resolver → API → UI；这些文件共享类型与持久化合同，盲目并行只会制造冲突。\n\n## Implementation Strategy\n\n1. 先完成 Phase 2，并证明 v4 migration、秘密存储和 no-fallback 约束。\n2. 完成 US1，使真实连接集合可见。\n3. 完成 US2 与 US3，使 App/PAT 都能进入同一管理面。\n4. 完成 US4，删除 Add Project 的 Agent/image 深层配置，并验证 end-to-end provenance。\n5. 每个红灯测试先观察失败，再做最小实现；每个 checkpoint 运行聚焦套件，最后运行全套与真实浏览器验证。\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
