    <script id="spec-data" type="application/json">{"feature":"040-prisma-rdb","title":"040-prisma-rdb","prototypeHref":"mockups/index.html","generatedAt":"2026-08-06T10:02:04.246Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：Prisma 多数据库 RDB\n\n**Feature Branch**: `040-prisma-rdb`  \n**Created**: 2026-08-05  \n**Revised**: 2026-08-06  \n**Status**: Awaiting fourth owner ER approval  \n**Input**: 由 Prisma 接管 RDB，并实现 SQLite、PostgreSQL 与 Supabase-backed PostgreSQL；提供启动时 provider 切换配置、独立迁移配置及 `INSTALLATION.md` 安装说明。Owner 反馈要求 capability 以内嵌 JSON 保存，不提前建立联动表；第一期同时移除待重做的 Project execution defaults、ContextBundle、Runner 与 Session persistence。Project 只保存 stable Repository identity；Task 只保留 identity、Project relation、Issue dispatch 幂等键和通用元数据，Issue/Repository snapshot 与 cache 设计留给后续 Integration 规格。\n\n## User Scenarios & Testing\n\n本功能属于持久化所有权与部署能力迁移。以下场景以平台维护者、自托管操作员、SaaS\n操作员和未来 provider 实现者为 actor，避免把数据库生命周期伪装成消费型 UI 故事。\n\n### 场景 1：Prisma 接管全部关系型持久化 (Priority: P1)\n\n作为平台维护者，我希望 SQLite 与 PostgreSQL 的关系模型、迁移历史、生成类型和数据访问\n均由 Prisma 管理，以便删除手写 schema/CRUD 的双重事实来源，并让两种数据库实现遵守同一\n领域合同。\n\n**Why this priority**: 若 Prisma 只覆盖部分操作，Mystra 将同时维护 Prisma、手写 SQL 和\n多套迁移语义。那不是接管，只是增加了更多可以互相否认的事实来源。\n\n**Independent Test**: 对 SQLite 和 PostgreSQL 分别从空库运行迁移，再执行同一套\n`RdbProvider` contract tests；静态审计证明业务 CRUD 只通过 Prisma-backed provider 完成。\n\n**Acceptance Scenarios**:\n\n1. **Given** 一个空 SQLite 文件或空 PostgreSQL schema，**When** 操作员部署迁移并启动 control plane，**Then** 完整关系模型可用且无需手工 SQL。\n2. **Given** 任一 `RdbProvider` 操作，**When** control plane 访问数据库，**Then** 数据访问通过对应 Prisma Client 与官方 driver adapter 完成。\n3. **Given** 同一业务 fixture，**When** 分别在 SQLite 和 PostgreSQL 上执行，**Then** 返回的 Mystra domain objects、排序、冲突和生命周期语义一致。\n\n---\n\n### 场景 2：既有 SQLite 数据可安全接管 (Priority: P1)\n\n作为自托管操作员，我希望受支持的现有 Mystra SQLite 数据库升级到 Prisma 管理后保留\n三张获批候选实体的业务记录、关系和约束，以便升级保留 IntegrationConnection、Project 与 Task\n数据；已明确移出第一期的 Session、ContextBundle、Runner、SessionEvent 与 Artifact rows 不迁移。\n\n**Why this priority**: 把“迁移”实现为删除数据当然很稳定。数据库再也不会报告一致性错误，\n因为它已经没有内容。该方案不予采用。\n\n**Independent Test**: 使用迁移前完整 fixture 执行接管，逐实体、逐关系核对迁移前后记录\n与可观察 API 结果，并验证重复部署迁移不产生二次变更。\n\n**Acceptance Scenarios**:\n\n1. **Given** 当前受支持 schema 的非空 SQLite 数据库，**When** 首次纳入 Prisma migration history，**Then** 三张获批候选表的保留字段、标识符、关系、唯一性和归档状态保持不变，GitHub connection 的 repository 字段被无损合并到 `capabilities.repositories`，Project 的 `repository_snapshot.externalId` 被提升为 `repository_external_id`，`tasks.dispatch_key` 被迁移为 `issue_dispatch_key`，Session 等明确删除的表和字段被记录并移除。\n2. **Given** 已完成接管的数据库，**When** 再次执行部署迁移，**Then** 不重复导入、不重复创建记录，也不改变业务数据。\n3. **Given** 未知、混合、损坏或 migration metadata 不一致的 SQLite schema，**When** 系统尝试接管，**Then** 在写入业务数据前 fail closed，并保留原数据库。\n4. **Given** 任一迁移步骤失败，**When** 操作员检查结果，**Then** 可以定位失败 migration 和恢复入口，不会得到被声称成功的部分终态。\n\n---\n\n### 场景 3：通过配置选择 SQLite、PostgreSQL 或 Supabase (Priority: P1)\n\n作为部署操作员，我希望通过一个受校验的启动配置选择 RDB，并为 hosted PostgreSQL 提供\n运行时与迁移连接配置，以便相同应用制品可以用于本地开源安装和 SaaS 部署。\n\n**Why this priority**: 若 provider 选择散落在路由或服务代码中，所谓“可切换”只是每位\n维护者都能发明自己的环境变量。\n\n**Independent Test**: 对三个 provider 值运行配置矩阵，验证正确实现被实例化、缺失或冲突\n配置在连接前失败、日志不包含凭据，并证明修改配置只在重启后生效。\n\n**Acceptance Scenarios**:\n\n1. **Given** `MYSTRA_RDB_PROVIDER=sqlite`，**When** control plane 启动，**Then** 使用 `MYSTRA_DB_PATH` 或默认路径实例化 SQLite provider。\n2. **Given** `MYSTRA_RDB_PROVIDER=postgresql`，**When** 配置合法的 `MYSTRA_DATABASE_URL`，**Then** 使用 PostgreSQL Prisma client 和 `@prisma/adapter-pg`。\n3. **Given** `MYSTRA_RDB_PROVIDER=supabase`，**When** 配置 pooled runtime URL 与 direct migration URL，**Then** runtime 使用 PostgreSQL provider，迁移命令只使用 direct URL。\n4. **Given** provider 值未知、URL scheme 错误或必需配置缺失，**When** 进程初始化数据库，**Then** 在发起连接前返回可操作但不泄密的配置错误。\n5. **Given** 进程已经初始化 provider，**When** 环境变量在进程外变化，**Then** 当前进程不热切换数据库；操作员必须重启。\n\n---\n\n### 场景 4：领域合同不暴露 Prisma 或数据库方言 (Priority: P1)\n\n作为 API、MCP、CLI 或 Web 的内部调用者，我希望 `RdbProvider` 的领域输入、输出、\n错误和事务语义保持稳定，以便持久化迁移不会成为外部产品合同迁移。\n\n**Why this priority**: Prisma 是持久化实现，不是 Mystra 业务模型。生成 model、连接池和\n数据库错误若穿透边界，replaceable provider 会迅速退化为装饰性接口。\n\n**Independent Test**: 使用同一套 provider contract tests 覆盖 SQLite 与 PostgreSQL；\n静态检查 shared contracts、route response 和 MCP schema 不存在 Prisma、\nSQLite 或 `pg` 类型泄漏。\n\n**Acceptance Scenarios**:\n\n1. **Given** 未列入删除面的 canonical API、MCP、CLI 和 Web 调用，**When** 底层 provider 改变，**Then** 请求和响应 payload、排序、幂等、not-found、冲突与状态转换语义不变。\n2. **Given** Prisma Client 是异步 API，**When** `RdbProvider` 与内部调用者迁移为 `Promise`，**Then** 仅内部 TypeScript 调用签名改变，网络合同和业务语义保持不变。\n3. **Given** Issue dispatch 的 Task 写入失败，**When** 事务回滚，**Then** 不产生部分 Task 记录；Session lifecycle 不属于本期合同。\n4. **Given** 任一 service boundary，**When** 维护者检查依赖，**Then** 只发现 Mystra-owned TypeScript/Zod contract。\n\n---\n\n### 场景 5：安装文档支持三种部署形态 (Priority: P2)\n\n作为首次安装或升级的操作员，我希望一份根目录 `INSTALLATION.md` 说明依赖、配置、迁移、\n启动、验证和故障恢复，以便不需要从源码和聊天历史推断安装步骤。\n\n**Why this priority**: 能运行但无法被正确安装的软件仍然是一种精致的本地现象。\n\n**Independent Test**: 在干净环境分别按 SQLite、local PostgreSQL 和 Supabase 章节执行文档；\n命令可复制、配置项完整、迁移与 runtime URL 用途清晰，且 README 可发现该文档。\n\n**Acceptance Scenarios**:\n\n1. **Given** 新操作员打开仓库 README，**When** 查找安装入口，**Then** 可直接导航到 `INSTALLATION.md`。\n2. **Given** 任一受支持 provider，**When** 操作员按文档安装，**Then** 可以安装依赖、配置环境、部署 migration、启动并完成健康验证。\n3. **Given** Supabase 部署，**When** 操作员阅读配置表，**Then** pooled runtime URL 与 direct migration URL 的用途、网络限制和秘密处理明确区分。\n4. **Given** 升级失败或 schema drift，**When** 操作员查阅文档，**Then** 能找到非破坏性诊断和恢复步骤；文档不建议自动 reset 生产数据库。\n\n### Edge Cases\n\n- SQLite 路径不存在、父目录不可写、文件只读或被其他进程锁定。\n- PostgreSQL/Supabase DNS、TLS、IPv4/IPv6、凭据、schema 权限或连接数配置错误。\n- Supabase pooled URL 被错误用于 migration，或 direct URL 在部署网络不可达。\n- Prisma Client 未生成、生成资产与 schema/provider 不一致，或迁移历史发生 drift。\n- SQLite 与 PostgreSQL 对 enum、boolean、时间、JSON、部分索引和 foreign key 的表达不同。\n- JSON 字段包含历史允许但当前 Zod schema 不接受的值。\n- capabilities 整体更新或重复 Task dispatch key 发生竞争。\n- migration 中途终止后重试；PostgreSQL migration lock 未释放；SQLite 文件处于部分复制状态。\n- provider 配置在测试间污染 singleton，或热重载创建过多 PostgreSQL pool。\n- Repository 在 Provider 侧 rename、delete、archive，或 Connection 权限被撤销；040 只保证 Project\n  stable identity 不需要随名称变化改写，Repo Info 查询、展示、缓存与失效行为留给后续规格。\n- 既有 Project snapshot 缺失 `externalId`，或同一 snapshot 的 external identity 与绑定 Connection 无法解析；\n  adoption 必须 fail closed，不得回退到可变 `fullName` 作为永久 identity。\n- 040 feature branch 尚未同步 `main@10750ca`；该 baseline 已包含 039 与 041 的最终\n  IntegrationConnection、Project 与 SecretProvider contracts。\n\n## Requirements\n\n### Functional Requirements\n\n- **FR-001**: Prisma MUST 成为 SQLite 与 PostgreSQL 关系模型、migration history、生成 client 和运行时 CRUD 的所有者。\n- **FR-002**: SQLite 与 PostgreSQL MUST 使用各自的 Prisma datasource、生成 client 和 migration history；不得声称一套 migration SQL 可跨方言复用。\n- **FR-003**: 两套 Prisma schema MUST 表达同一 Mystra 逻辑数据模型，并通过自动 parity 检查防止无意漂移；经记录的方言差异除外。\n- **FR-004**: SQLite runtime MUST 使用 Prisma Client 与 `@prisma/adapter-better-sqlite3`；PostgreSQL 和 Supabase runtime MUST 使用 Prisma Client 与 `@prisma/adapter-pg`。\n- **FR-005**: Supabase MUST 复用 PostgreSQL provider 实现、Prisma client 与 migration history；不得引入 `supabase-js` 作为 RDB CRUD 的第二路径。\n- **FR-006**: 现有手写 SQLite CRUD 与独立 schema version 系统 MUST 被替换；所有运行时业务\n  CRUD 与 lifecycle transition MUST 只通过 Prisma Client API 实现，不得使用\n  `$queryRaw`、`$executeRaw`、`pg.query` 或 `better-sqlite3` 业务查询。Prisma Migrate 生成或审查的\n  migration SQL 与旧 SQLite 接管前只读 fingerprint 不属于运行时业务 CRUD。\n- **FR-007**: Mystra MUST 保留 `RdbProvider` 作为 API、MCP、CLI、Web 与持久化实现之间的领域合同。\n- **FR-008**: `RdbProvider` MUST 迁移为异步方法以匹配 Prisma；所有内部调用者 MUST 显式 `await`。\n  除 FR-029 至 FR-040 的明确删除、重命名、Repository identity 和 Integration capability 合同修订外，未删除的外部\n  HTTP/MCP/CLI/Web payload 不得改变。\n- **FR-009**: Prisma model、input、transaction client、错误类、adapter、connection URL 和 pool 类型 MUST NOT 出现在 shared contracts 或 service boundaries。\n- **FR-010**: provider implementations MUST 返回现有 Mystra-owned domain/Zod types，并保持字段、排序、幂等、not-found、冲突与生命周期语义。\n- **FR-011**: Issue dispatch MUST 通过 nullable unique `tasks.issue_dispatch_key` 在 Task 持久化范围内保持\n  幂等与并发不变量。Session create、\n  lifecycle、cancellation、completion、result 与 assignment persistence 整体不进入第一期 Prisma 合同；\n  不得保留 `session_events` append 路径。现有 Runner enrollment、heartbeat 与 claim persistence 同样不进入。\n- **FR-012**: provider selection MUST 由 `MYSTRA_RDB_PROVIDER=sqlite|postgresql|supabase` 在进程启动时完成；默认值 MUST 为 `sqlite` 以保持开源本地安装兼容。\n- **FR-013**: SQLite MUST 支持 `MYSTRA_DB_PATH`；PostgreSQL/Supabase runtime MUST 使用 `MYSTRA_DATABASE_URL`；migration CLI MUST 使用 `MYSTRA_DIRECT_DATABASE_URL`，若普通 PostgreSQL 部署未提供 direct URL，可显式回退到 runtime URL。\n- **FR-014**: Supabase profile MUST 要求显式 `MYSTRA_DIRECT_DATABASE_URL`，不得把 transaction-mode pooler URL 用于 Prisma migration。\n- **FR-015**: 配置 MUST 在连接前通过 Zod boundary validation；错误不得回显用户名、密码、query token 或完整 URL。\n- **FR-016**: provider singleton MUST 能在测试中可靠关闭和重置；开发热重载不得无界创建 PostgreSQL pools。\n- **FR-017**: 新安装 MUST 通过已提交 migration 从空 SQLite 或空 PostgreSQL schema 初始化；生产启动不得隐式运行 destructive reset 或 `migrate dev`。\n- **FR-018**: 当前受支持 SQLite schema MUST 被 baseline 到 Prisma history，完整保留\n  `integration_connections`、`projects`、`tasks` 的获批字段、标识符、时间戳、JSON、关系、\n  唯一性和归档状态；现有 GitHub connection 的 `repository_selection`、`permissions`、\n  `access_summary` MUST 无损合并到 `capabilities.repositories`。Session、ContextBundle、Runner、\n  SessionEvent、Artifact rows 与明确删除的 Project/Task 字段属于批准的破坏性删除面。\n- **FR-019**: SQLite 接管 MUST 幂等；未知、混合、损坏或不匹配 schema MUST fail closed，不得猜测、删除或重建业务数据。\n- **FR-020**: 开发环境 MUST 提供 generate、migration creation、migration deploy、drift check、test reset 与 provider-specific schema selection 命令。\n- **FR-021**: PostgreSQL/Supabase production migration MUST 使用非交互 `prisma migrate deploy` 和 direct connection；runtime connection pool 参数 MUST 由 `pg` adapter 配置而不是无效的 Prisma 6 URL 参数。\n- **FR-022**: 最终 baseline MUST 包含 `main@10750ca` 中 039 与 041 的 IntegrationConnection、\n  Project、SecretProvider contracts；ER 获批后、040 实现前 MUST merge/rebase/reconcile 该 baseline。\n- **FR-023**: `INSTALLATION.md` MUST 覆盖系统前置条件、依赖安装、三种 provider 配置、migration、启动、健康检查、升级、备份/恢复入口和常见故障。\n- **FR-024**: README MUST 链接 `INSTALLATION.md`；module README MUST 记录 provider factory、配置 owner、migration owner 与 secrets invariants。\n- **FR-025**: SQLite 与 PostgreSQL MUST 运行同一套 provider contract tests；PostgreSQL tests MUST 使用真实 PostgreSQL 实例而不是 mock driver。\n- **FR-026**: Supabase MUST 至少通过配置/URL 路由测试和 PostgreSQL protocol contract suite；若未提供外部 Supabase project，验收证据 MUST 明确区分本地 PostgreSQL evidence 与未执行的云端 connectivity check。\n- **FR-027**: 连接字符串、数据库密码和 Supabase credentials MUST 只通过运行时环境注入，不得提交、写入数据库或出现在测试快照和日志中。\n- **FR-028**: 本功能 MUST NOT 引入 public hosted multi-tenancy、Team 管理、RLS 产品合同、数据库管理 UI 或自动创建外部 Supabase project。\n- **FR-029**: Prisma 第一期业务模型 MUST 只包含 `integration_connections`、`projects`、`tasks`；\n  MUST 删除 `sessions`、`context_bundles`、`runners`、`session_events`、`artifacts` 与旧\n  `mystra_schema`，不得继续用旧 SQL 维护这些表。\n- **FR-030**: event-derived `CoordinationSessionSummary`、`GET /api/sessions/:id/summary`、\n  `mystra_get_session_summary` 与对应 provider/shared contracts MUST 删除，不得改存为 Session phase\n  或 summary 字段。所有 Task child-Session relation projections 也随 Session persistence 延后。\n- **FR-031**: `ExecutionContractReference.artifactId` MUST 与 Artifact entity 一并删除，不得改名或\n  新增替代 identity。`ExecutionSpecArtifact` MUST 改为 `ExecutionSpecSnapshot`，URI MUST 离开\n  `/artifacts/` namespace；execution contract 继续作为 Session-owned frozen inline snapshot。\n- **FR-032**: `IntegrationConnection` MUST 只表达 provider connection identity、auth method、\n  non-secret connection config、credential reference 与 lifecycle；MUST NOT 要求 repository-specific\n  顶层字段。Connection-specific 可用模块 MUST 保存于同一 `capabilities` serialized JSON 字段，不得\n  建立第一期 capability 子表，也不得为每项 capability 增加物理列。Connection identity MUST 以\n  `(integration, provider, provider_external_id)` 唯一，避免不同 provider namespace 互相冲突。\n- **FR-033**: Capability key MUST 为 plugin-declared 可扩展 string，而不是数据库 enum。\n  每项 value MUST 使用统一的 `state/config/permissions/accessSummary/verifiedAt` envelope，并由 Zod\n  原子校验。`repositories`、`issues` 是当前实现方向；`change-requests`、`code-reviews`、`ci`、\n  `deployments` 可在未来扩展而不修改表结构。\n- **FR-034**: Project 创建/仓库重新解析 MUST 验证 `repository_connection_id` 指向 active connection，\n  且该 connection 的 `capabilities.repositories.state=enabled`。Linear/Jenkins 等无 repository\n  capability 的 connection MUST 能正常存在，但不得绑定为 Project repository source。\n- **FR-035**: `projects.base_branch` MUST 改名为 `repository_base_branch`。`projects.default_agent`、\n  `projects.runtime`/候选 `runtime_config` 与 `projects.prewarm_config` MUST 从第一期 schema 和写入合同删除，\n  且不得转存到 `metadata`。\n- **FR-036**: 现有 ContextBundle catalog/CRUD、Runner persistence/management/assignment CRUD 与\n  Session persistence/CRUD MUST 从第一期活动 RDB 合同移除。未来设计分别由新的 Context delivery、\n  Runtime capacity 与 Session persistence 规格承担。\n- **FR-037**: `projects.repository_snapshot` MUST 删除并替换为非空\n  `projects.repository_external_id`。`repository_connection_id + repository_external_id` MUST 构成不可变\n  Project Repository binding；Repository rename 不得触发 Project 持久化更新。\n- **FR-038**: Repository 的 `fullName`、URL/clone URL、Provider default branch、visibility、archive/delete\n  状态和 `fetchedAt` MUST NOT 进入第一期 Prisma model。040 MUST NOT 新增 Repository cache、TTL、\n  refresh、invalidation、Repo Info query service 或对应测试；这些能力必须由后续规格设计。\n- **FR-039**: `tasks.source`、`tasks.objective`、`tasks.issue_snapshot` 与 `tasks.repository_snapshot` MUST\n  从第一期 schema 和写入合同删除，且不得转存到 `metadata`。`tasks.dispatch_key` MUST 改名为\n  `tasks.issue_dispatch_key`。Issue/Repository 当前信息未来通过 Integration-owned cache 设计提供；040\n  MUST NOT 定义或实现 cache key、payload、TTL、refresh 或 invalidation。\n- **FR-040**: 040 MUST 完成三表 Prisma schema、migration、保留 CRUD 与数据库配置；由批准删除字段/表\n  引发的既有 UI、API、MCP、Runner 或其他功能报错不属于本期修复范围，不得为消除这些报错恢复旧字段、\n  旧表或旁路 SQL。受影响功能必须记录为后续适配清单。\n\n### Key Entities\n\nPrisma 第一期 ER（逐字段定义与命名审计见 [data-model.md](./data-model.md)）：\n\n```mermaid\nerDiagram\n  INTEGRATION_CONNECTION ||--o{ PROJECT : \"repository connection\"\n  PROJECT ||--o{ TASK : owns\n```\n\n- **RdbConfiguration**: 启动时解析的 provider discriminated union；分别约束 SQLite path、PostgreSQL runtime/direct URL 和 Supabase pooled/direct URL。\n- **Prisma Schema Bundle**: provider-specific datasource、逻辑模型、生成策略和 parity rule 的版本化集合。\n- **SQLite Migration History**: SQLite 新建与既有数据库接管所使用的独立 Prisma migration history。\n- **PostgreSQL Migration History**: PostgreSQL 与 Supabase 共同使用的 Prisma migration history。\n- **Prisma RDB Provider**: `RdbProvider` 的 Prisma-backed 实现，负责 domain/model 映射、事务、错误归一化和连接生命周期。\n- **Supabase Deployment Profile**: PostgreSQL provider 的配置变体，区分 runtime pooler 与 direct migration connection，不产生新的 domain provider contract。\n- **Supported Existing Database**: 与接管前受支持 fingerprint 匹配、可无损 baseline 的 SQLite 数据库。\n- **Unknown Database**: fingerprint、migration metadata 或结构与受支持输入不一致的数据库，必须 fail closed。\n\n## Assumptions\n\n- 用户的 2026-08-06 指令是对 hosted RDB 排除项的显式 product-boundary amendment。\n- “切换配置”指进程启动时选择 provider，不包含运行中热切库或跨数据库在线数据复制。\n- Supabase 被视为 PostgreSQL 托管部署形态；本功能不使用 Supabase Data API 或 `supabase-js` 承担 RDB CRUD。\n- SQLite 仍为默认 provider，以保持本地开发和开源单机安装的最低门槛。\n- `main@10750ca` 是 implementation dependency；040 必须吸收其中 039 与 041 的最终 schema 和\n  contracts 后才能生成 Prisma baseline。\n- Prisma 具体版本在 plan 阶段按 Node 24.14.0 与 pnpm 10.25.0 兼容性锁定。\n- 官方设计依据包括 [Prisma PostgreSQL connector](https://docs.prisma.io/docs/orm/v6/overview/databases/postgresql)、[Prisma database connections](https://www.prisma.io/docs/orm/prisma-client/setup-and-configuration/databases-connections)、[Prisma data sources](https://docs.prisma.io/docs/orm/v6/prisma-schema/overview/data-sources)、[migration histories](https://www.prisma.io/docs/orm/prisma-migrate/understanding-prisma-migrate/migration-histories) 与 [Supabase connection modes](https://supabase.com/docs/guides/database/connecting-to-postgres)。\n\n## Explicitly Out of Scope\n\n- 删除 `RdbProvider` 或让调用者直接依赖 Prisma Client。\n- 运行时热切换数据库、跨 provider 在线数据复制或 SQLite-to-PostgreSQL 自动数据搬迁。\n- public hosted multi-tenancy、Team/RLS 管理、region routing 或 per-tenant database provisioning。\n- Supabase Auth、Storage、Realtime、Data API 或自动创建/管理 Supabase project。\n- 数据库管理控制台或 Prisma Studio 的产品化 UI。\n- Repo Info 查询、Provider re-resolution、缓存、TTL、refresh、invalidation 及 rename/delete 后的上层展示或执行适配。\n- Issue Info/Repository Info cache 的 key、payload、TTL、refresh、invalidation 与消费合同。\n- Session persistence、字段、关系、状态机、CRUD、迁移与上层适配；040 只删除旧 Session 表及其 RDB surface，\n  后续必须通过新规格重新设计。\n- 除明确删除 event-derived Session coordination summary/`artifactId`、Project execution defaults、Project\n  Repository snapshot persistence、Session/ContextBundle/Runner persistence，以及把 IntegrationConnection\n  修订为 provider-neutral connection + capabilities JSON 外，改变 Task、Project、Integration、Issue 或\n  Repository 的其他合同。\n- 重新设计 Session、Runner、Runtime、Sandbox、Context delivery、Agent profile 或 Prewarm；040 只移除旧持久化面。\n\n## Success Criteria\n\n### Measurable Outcomes\n\n- **SC-001**: SQLite 与真实 PostgreSQL 上 100% 的三表 provider contract tests 通过；批准删除面引发的上层功能报错不计入本期通过条件，但不得存在旧 SQL/旧表兼容回退。\n- **SC-002**: 对受支持非空 SQLite upgrade fixture，三张候选表 30 个获批字段迁移前后 100% 记录、标识符、关系、唯一性、时间戳、JSON 与归档状态一致；每条现有 GitHub connection 生成等价 `capabilities.repositories`，每个 Project 从 snapshot 提升 stable `repository_external_id`，每个旧 `dispatch_key` 无损迁移为 `issue_dispatch_key`，并验证包括 Session 与 Task snapshots 在内的全部批准删除面不存在。\n- **SC-003**: 三种 provider 配置均能实例化预期实现；无效配置矩阵 100% 在连接前失败且输出中不包含凭据。\n- **SC-004**: 空 SQLite、空 PostgreSQL 和 Supabase-compatible PostgreSQL schema 均可仅用已提交 migration 初始化；连续执行两次 deploy，第二次产生 0 个 schema 和业务数据变更。\n- **SC-005**: 静态边界检查在持久化模块之外发现 0 个 Prisma/driver import，shared/API/MCP contracts 发现 0 个数据库实现类型。\n- **SC-006**: 未知、混合和损坏 SQLite schema 的失败 fixture 均在业务写入前停止并保留原文件校验值或验证过的事务回滚结果。\n- **SC-007**: `INSTALLATION.md` 的 SQLite 与 local PostgreSQL 路径在干净环境可完整执行；Supabase 章节通过配置校验，并在有外部 project credentials 时完成 connectivity smoke test。\n- **SC-008**: focused persistence、provider contract、migration 与 configuration tests 全部通过；全仓 lint/typecheck/test/build 的既有失败和新增失败均形成按删除面归因的后续适配清单，不作为 040 数据层交付的阻断条件。\n- **SC-009**: 文档与代码审查能定位 provider-specific Prisma schema/migration histories、一个 domain-neutral `RdbProvider`、一个受校验 provider factory，以及一份根目录安装说明；不存在并行手写 CRUD/schema owner。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：Prisma 多数据库 RDB\n\n## 摘要\n\nPrisma 成为 Mystra SQLite 与 PostgreSQL 持久化的 schema、migration、类型生成和运行时访问\n所有者。Supabase 作为 PostgreSQL 部署 profile 复用同一 provider，并显式区分 runtime pooler\n与 migration direct connection。`RdbProvider` 继续隔离全部数据库实现细节。\n\n## 功能地图\n\n- SQLite：默认本地 provider，支持既有数据库无损接管。\n- PostgreSQL：通过 Prisma PostgreSQL client 和 `@prisma/adapter-pg` 提供完整持久化。\n- Supabase：复用 PostgreSQL 实现，增加 pooled/direct URL 配置约束。\n- 启动配置：`MYSTRA_RDB_PROVIDER=sqlite|postgresql|supabase`，启动前校验并 fail closed。\n- 数据模型：第一期只管理 IntegrationConnection、Project、Task 三类实体；Connection 的\n  repository/issue/CI/deploy 等能力保存在单一 `capabilities` JSON；删除待重做的 Project execution\n  defaults、Session/ContextBundle/Runner persistence，以及遗留 Session events、Artifacts、event-derived\n  Session summary 与 `artifactId`。Project 只保存 Connection + stable Repository external ID；Task 删除\n  source、objective 与 Issue/Repository snapshots，并将幂等键命名为 `issue_dispatch_key`。Issue/Repo Info\n  cache 由后续 Integration 规格设计，不属于本功能。\n- 合同迁移：`RdbProvider` 内部异步化；除上述删除面与 Integration capability payload 修订外，\n  其他外部 payload 保持不变。\n- 兼容边界：批准删除面造成的现有上层功能报错不在 040 修复；形成后续适配清单，不保留旧 SQL/旧表兜底。\n- 安装交付：根目录 `INSTALLATION.md` 覆盖三种安装、迁移、验证与恢复。\n\n## 边界\n\n- 不删除 `RdbProvider`，不允许消费者直接访问 Prisma Client。\n- 不把 Supabase Data API 或 `supabase-js` 作为第二条 RDB CRUD 路径。\n- 不支持运行时热切库、自动跨库搬迁或 public hosted multi-tenancy。\n- SQLite 和 PostgreSQL 使用独立 migration history，并以 parity tests 保持逻辑模型一致。\n\n## 分阶段能力图\n\n1. owner 确认三表 ER、Integration capabilities JSON、逐字段说明与删除面，并同步 `main@10750ca` 的 039/041 contracts。\n2. 建立 SQLite/PostgreSQL Prisma schema、生成 client、迁移历史和 parity gate。\n3. 将 `RdbProvider` 异步化并迁移全部调用者与事务行为。\n4. 增加 provider config/factory、PostgreSQL 与 Supabase connection lifecycle。\n5. 完成 SQLite 接管、真实 PostgreSQL contract tests、Installation 文档；全仓失败按批准删除面归因并\n   输出后续适配清单，不作为数据层验收阻断项。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：Prisma 多数据库 RDB\n\n## Owner 评审\n\n- [x] 用户已明确要求实现 PostgreSQL、Supabase、切换配置与 Installation 文档。\n- [x] 已将 hosted RDB 从排除项修订为批准部署目标。\n- [ ] 确认 Supabase 复用 PostgreSQL provider，而不是引入 Supabase Data API CRUD。\n- [ ] 确认切换只在进程启动时发生，不支持运行中热切库。\n- [ ] 确认 `RdbProvider` 内部异步化；除遗留删除面与 Integration capability 修订外，其他外部 payload 不变。\n- [x] Owner 已要求 Prisma 第一期只采用 3 张业务表，并删除 `sessions`、`context_bundles`、`runners`、`session_events`、`artifacts`、`mystra_schema`。\n- [x] Owner 已明确 IntegrationConnection 只表达通用连接；repository、issue、PR、code review、CI、deploy 是零到多项 capability。\n- [x] Owner 已否决 capability 联动表；第一期使用 `integration_connections.capabilities` 单一 JSON 字段。\n- [ ] 确认 capability JSON 的统一 envelope 与枚举：`state=enabled|disabled|unavailable`。\n- [ ] 确认删除 event-derived Session coordination summary，不增加 phase/summary 替代字段。\n- [ ] 确认删除 `ExecutionContractReference.artifactId`，并将 `ExecutionSpecArtifact` 改为\n  `ExecutionSpecSnapshot`，不设置替代 Artifact identity。\n- [x] Owner 已要求 `projects.base_branch` 改为 `repository_base_branch`。\n- [x] Owner 已要求删除 Project 的 `default_agent`、`runtime_config`、`prewarm_config`。\n- [x] Owner 已要求 ContextBundle 与 Runner 表退出第一期并等待重新设计。\n- [x] Owner 已要求 Session 表、关系、状态机与 CRUD 退出第一期并等待重新设计。\n- [x] Owner 已批准删除 `projects.repository_snapshot`，改存 stable `repository_external_id`。\n- [x] Owner 已要求删除 Task 的 `source`、`objective`、`issue_snapshot`、`repository_snapshot`，并将\n  `dispatch_key` 改名为 `issue_dispatch_key`；Issue/Repository cache 留给后续 Integration 规格。\n- [x] Owner 已明确 Repo Info 获取、缓存、TTL、刷新和失效不属于 040。\n- [x] Owner 已明确批准删除面造成的既有功能报错不在 040 修复，只记录后续适配清单。\n\n## Spec 就绪度\n\n- [x] 技术场景和 actor 已定义。\n- [x] SQLite 接管、PG/Supabase、配置、合同与安装均可独立验证。\n- [x] 数据保留、幂等、连接秘密与 fail-closed 行为已定义。\n- [x] `main@10750ca` 的 039/041 schema dependency 已记录。\n- [x] 当前 schema 84 个业务列完成机器审计；第四轮三表 ER、30 个候选字段及逐字段说明已提交 owner 评审。\n- [x] Project stable Repository identity 已纳入逐字段 ER，三表总字段数为 30；无 Session、snapshot 或 cache 实体/任务。\n- [x] UI prototype 不适用：本功能没有 UI/experience surface。\n\n## 后续工程检查\n\n- [x] `/speckit.plan` 锁定 Prisma 版本与双 schema/migration 结构。\n- [ ] `plan-eng-review` 审查 CRITICAL 异步化 blast radius、事务、迁移恢复、pool lifecycle 与性能。\n- [ ] GitNexus 逐项分析 `RdbProvider`、`getDb`、provider factory、事务方法和全部消费者。\n- [ ] `/speckit.tasks` 仅在 owner ER approval、main sync 与 engineering re-review 后生成。\n- [ ] SQLite 与真实 PostgreSQL 运行同一 contract suite。\n- [ ] Supabase 外部 connectivity 若缺少 project credentials，证据必须明确标记未执行。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# ER 审批面\n\n本功能没有 UI prototype。此页用于 Owner 审批 Prisma 第一期数据模型；完整约束与 JSON envelope\n以 [`data-model.md`](./data-model.md) 为唯一事实来源。\n\n## 本期范围\n\n- 3 张业务表，30 个字段：IntegrationConnection 14、Project 10、Task 6。\n- `sessions` 整表、Task-to-Session 关系、Session 状态机与 CRUD 全部延期。\n- `context_bundles`、`runners`、`session_events`、`artifacts`、`mystra_schema` 不进入新 schema。\n- Repo Info 查询、缓存、TTL、刷新与失效不属于 040。\n\n```mermaid\nerDiagram\n  INTEGRATION_CONNECTION ||--o{ PROJECT : \"repository connection\"\n  PROJECT ||--o{ TASK : owns\n```\n\n## IntegrationConnection（14）\n\n| 字段 | Null | 类型/枚举 | 作用 |\n|---|---:|---|---|\n| `id` | 否 | UUID string | Mystra 内部稳定 Connection ID。 |\n| `integration` | 否 | extensible key | Integration plugin 产品族，例如 GitHub、Linear、Jenkins。 |\n| `provider` | 否 | extensible key | 具体 adapter/service variant。 |\n| `auth_method` | 否 | provider-defined key | 认证方式；由 adapter Zod schema 限定，不是数据库 enum。 |\n| `provider_external_id` | 否 | string | Provider 侧稳定连接身份。 |\n| `display_name` | 是 | string | 操作者可独立编辑或清空的显示名称；`null` 使用 Provider 主体信息展示，不参与身份判断。 |\n| `provider_subject` | 否 | JSON object | 被授权主体的非秘密快照。 |\n| `connection_config` | 否 | JSON object | Connection-level 非秘密配置。 |\n| `capabilities` | 否 | JSON object | 零到多个 capability envelope 的原子映射。 |\n| `credential_ref` | 是 | opaque string | 指向 SecretProvider 的不透明引用。 |\n| `credential_state` | 否 | `ready \\| missing \\| invalid` | credential 的可解析/缺失/无效状态。 |\n| `status` | 否 | `active \\| inactive` | 是否允许新的业务操作选择该 Connection。 |\n| `created_at` | 否 | ISO-8601 string | 创建时间。 |\n| `updated_at` | 否 | ISO-8601 string | 最后更新时间。 |\n\nCapability entry 统一为 `state/config/permissions/accessSummary/verifiedAt`；`state` 枚举为\n`enabled | disabled | unavailable`。Capability key 是 plugin-declared string，不是数据库 enum。\nConnection identity 唯一键为 `(integration, provider, provider_external_id)`。\n\n## Project（10）\n\n| 字段 | Null | 类型/枚举 | 作用 |\n|---|---:|---|---|\n| `id` | 否 | UUID string | Project 稳定 ID。 |\n| `name` | 否 | string | 面向操作者的名称。 |\n| `slug` | 否 | slug string | URL、CLI 与 MCP 使用的稳定可读标识。 |\n| `repository_connection_id` | 否 | UUID FK | 精确绑定 repository IntegrationConnection。 |\n| `repository_external_id` | 否 | opaque string | Provider 侧稳定 Repository identity，不因 rename 改写。 |\n| `repository_base_branch` | 否 | string | Mystra 对该 Project 使用的 repository base branch。 |\n| `metadata` | 否 | JSON object | 非核心、非秘密扩展元数据。 |\n| `archived_at` | 是 | ISO-8601 string | 非空表示 Project 已归档。 |\n| `created_at` | 否 | ISO-8601 string | 创建时间。 |\n| `updated_at` | 否 | ISO-8601 string | 最后更新时间。 |\n\nProject 不保存 Repository 名称、URL、clone URL、Provider default branch、visibility、archive/delete\n状态或 fetchedAt；也不保存 Agent、Runtime、Prewarm 配置。\n\n## Task（6）\n\n| 字段 | Null | 类型/枚举 | 作用 |\n|---|---:|---|---|\n| `id` | 否 | UUID string | Task 稳定 ID。 |\n| `project_id` | 否 | UUID FK | 所属 Project。 |\n| `issue_dispatch_key` | 是 | string, unique | Issue dispatch 幂等键；不承载 Issue 内容。 |\n| `metadata` | 否 | JSON object | 非核心、非秘密 Task 扩展元数据。 |\n| `created_at` | 否 | ISO-8601 string | 创建时间。 |\n| `updated_at` | 否 | ISO-8601 string | 最后更新时间。 |\n\nTask 不保存 source、objective、Issue/Repository snapshot、Session state/result、Agent 或 Runtime，也不\n提供 child Session projection。Issue/Repository 当前信息未来走 Integration-owned cache；040 不实现\ncache，也不得把删除字段转存到 `metadata`。\n\n## 审批结论\n\nOwner 确认本页后，040 才可以生成三表 Prisma schema/migrations 和 implementation tasks。此前不会\n启动 Prisma 业务代码开发。由删除 Session 等旧表造成的现有功能报错只记录为后续适配项。\n","action":{"label":"Open Prototype","href":"mockups/index.html"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# Implementation Plan: Prisma 多数据库 RDB\n\n**Branch**: `040-prisma-rdb` | **Date**: 2026-08-06 | **Spec**: [spec.md](./spec.md)  \n**Input**: Prisma 接管 SQLite/PostgreSQL，Supabase 作为 PostgreSQL deployment profile，增加\n启动切换配置与根目录 Installation 文档。\n\n## Summary\n\n将 control-plane 的同步、手写 `better-sqlite3` persistence 替换为 Prisma 7.9.1。SQLite 和\nPostgreSQL 使用独立 Prisma schema/config/generated client/migration history；Supabase 复用\nPostgreSQL 资产，通过 pooled runtime URL 与 direct migration URL 配置。现有 `RdbProvider`\n领域方法全面异步化，所有内部调用者显式 `await`。除明确删除 Session persistence、event-derived\nSession summary、`artifactId`、Project execution defaults、Project Repository snapshot persistence、ContextBundle/Runner persistence，并修订\nIntegrationConnection capability payload 外，未删除的外部 payload 不变。\n\n实现前强制同步 `main@10750ca` 中 039/041 的最终 IntegrationConnection、Project 与 SecretProvider\ncontracts。SQLite 既有数据库\n通过显式 fingerprint + backup + Prisma baseline adoption 接管；生产应用启动不隐式运行迁移。\n\n## Technical Context\n\n**Language/Version**: TypeScript 5.9，Node.js 24.14.0  \n**Primary Dependencies**: Prisma ORM/Client 7.9.1，`@prisma/adapter-better-sqlite3` 7.9.1，`@prisma/adapter-pg` 7.9.1，`pg`，Zod 4，Next.js 16  \n**Storage**: SQLite；PostgreSQL；Supabase-backed PostgreSQL  \n**Testing**: Vitest 4，provider contract suite，SQLite adoption fixtures，真实 PostgreSQL integration database  \n**Target Platform**: local macOS/Linux development，Node.js control-plane container/VM，Supabase network endpoint  \n**Project Type**: pnpm monorepo，Next.js web service + MCP/CLI clients；Session/Runner persistence integration deferred  \n**Performance Goals**: provider change不增加 N+1；PostgreSQL pool 有界；Task dispatch 维持原子性；常规单记录操作不超过现有查询数量级  \n**Constraints**: 除已批准合同修订外 payload 不变；Prisma/driver types 不越界；SQLite 三张候选表获批字段无损，backfill connection capabilities JSON，并将 Project snapshot 的 stable external ID 提升为列；未知 schema fail closed；owner ER approval 与 main baseline sync 必须先完成  \n**Scale/Scope**: 3 张业务表；移除 Session、event/summary/artifact、ContextBundle/Runner persistence、Project execution defaults 和 Project Repository snapshot；Repo Info 获取/缓存不在本功能；三种启动 profiles\n\n## Constitution Check\n\n### Pre-research gate\n\n- **I. Specification Owns Product Boundaries**: PASS。constitution 2.3.0 已在 2026-08-06 显式批准 PostgreSQL 与 Supabase-backed PostgreSQL，同时继续排除 public multi-tenancy。\n- **II. Typed Contracts**: PASS。配置由内部 Zod discriminated union 校验；domain objects 保持 `@mystra/shared`。\n- **III. Replaceable Providers**: PASS。保留 `RdbProvider`；Supabase 不成为第二条 Data API persistence path。\n- **IV. Secret Hygiene**: PASS。URL 只从环境注入，错误和日志必须 sanitize。\n- **V. Verification/Documentation**: PASS。计划包含双 provider contract suite、migration/adoption evidence、`INSTALLATION.md` 和 module docs。\n\n### Post-design gate\n\nPASS with two hard gates：owner 尚未批准 ER；040 当前 HEAD 尚未同步已落在\n`main@10750ca` 的 039/041 persistence/shared-contract changes。baseline generation 与代码\nimplementation 在两项解决前不得开始。\n\n## Architecture\n\n### Startup and runtime data flow\n\n```text\nprocess.env\n    │\n    ▼\nparseRdbConfiguration() ──invalid──> sanitized startup error, no connection\n    │\n    ├── sqlite ─────> SQLite generated client ─> BetterSqlite3 adapter ─> .db file\n    │\n    ├── postgresql ─> PG generated client ─────> PrismaPg / pg pool ───> PostgreSQL\n    │\n    └── supabase ───> PG generated client ─────> PrismaPg / pooler ────> Supabase PG\n                              │\n                              ▼\n                     PrismaRdbProvider\n                              │\n                              ▼\n                  Promise<RdbProvider domain types>\n                              │\n                    API / MCP / Integration\n```\n\n`getDb()` 缓存初始化 promise，而不是只缓存 resolved instance，防止并发 route 首次访问创建多个\nPostgreSQL pools。初始化失败清除 cache；`resetDbForTests()` await disconnect 后清除。\n\n### Migration flow\n\n```text\nMYSTRA_RDB_PROVIDER\n    │\n    ├── sqlite ─────> prisma/sqlite/prisma.config.ts\n    │                   ├── fresh: migrate deploy\n    │                   └── existing: fingerprint -> backup -> resolve baseline -> deploy -> verify\n    │\n    └── postgresql/supabase\n                        └── prisma/postgresql/prisma.config.ts\n                              └── DIRECT URL -> migrate deploy -> verify\n```\n\nruntime URL 永不被 Prisma CLI 隐式选作 Supabase migration connection。CLI config 显式选择 direct\nURL；普通 PostgreSQL 缺省允许 direct=runtime。\n\nProvider-specific `prisma.config.ts` 在连接 URL 不存在时省略 `datasource`，使 `prisma generate`\n可以在无数据库的 clean install/build 中运行。所有 migrate/status/resolve 命令通过 Mystra wrapper\n先校验真实 URL，再传入 `--config`；不设置“看起来能用”的 placeholder URL。\n\n### Persistence implementation\n\n`PrismaRdbProvider` 只实现一份 domain CRUD、mapping、transactions 和 error normalization。\nSQLite/PG factory 注入对应 generated client。因为 Prisma schema 只能有一个 datasource，两套 generated\nclient 必须存在；其共同 delegate surface 只在 DB module 内使用，并由三层门证明等价：两份 schema\n的 model section 逐字 parity、PostgreSQL generated delegates 对 SQLite internal client surface 的\ncompile-time assignability、同一 runtime provider contract suite 在两库通过。禁止无校验 `as unknown as`。\n\n关键 transaction 用 Prisma interactive transaction。Issue dispatch 不依赖“先读后写”的乐观幻想：\n\n```text\nresolve Issue + dispatch key\n    │\n    ▼\nupsert Task in one transaction\n    │\n    ├── same key/same input -> return existing Task\n    └── same key/conflicting input -> stable conflict\n```\n\ndispatch 使用 transaction、unique constraint normalization 与必要的 Prisma `P2034` 有界重试。\n运行时业务路径禁止 provider-local raw query。\n\n## Project Structure\n\n### Documentation (this feature)\n\n```text\nspecs/040-prisma-rdb/\n├── spec.md\n├── features.md\n├── checklists.md\n├── plan.md\n├── research.md\n├── data-model.md\n├── quickstart.md\n├── contracts/\n│   ├── rdb-configuration.md\n│   └── rdb-provider.md\n└── tasks.md\n```\n\n### Source Code (repository root)\n\n```text\nINSTALLATION.md\nREADME.md\npackage.json\npnpm-lock.yaml\n\napps/control-plane/\n├── package.json\n├── prisma/\n│   ├── sqlite/\n│   │   ├── schema.prisma\n│   │   ├── prisma.config.ts\n│   │   └── migrations/\n│   └── postgresql/\n│       ├── schema.prisma\n│       ├── prisma.config.ts\n│       └── migrations/\n├── scripts/\n│   ├── adopt-sqlite.ts\n│   ├── check-prisma-parity.ts\n│   └── verify-database.ts\n├── src/generated/prisma/\n│   ├── sqlite/\n│   └── postgresql/\n├── src/lib/db/\n│   ├── config.ts\n│   ├── config.test.ts\n│   ├── client-factory.ts\n│   ├── index.ts\n│   ├── prisma-provider.ts\n│   ├── provider-contract.test.ts\n│   ├── sqlite-adoption.test.ts\n│   ├── rdb-provider.ts\n│   └── README.md\n└── app/api/**/route.ts\n```\n\nGenerated client output由 `pnpm db:generate` 创建并纳入 build 前置门；是否提交 generated source 在\nimplementation 前按仓库 build/deploy可重复性验证决定，默认不提交并由 `postinstall/prebuild` 生成。\n\n**Structure Decision**: 保持所有 ORM 和 driver imports 在 control-plane DB module 与 migration\nscripts。不开新 workspace package，不建立第二个 repository abstraction。两个 Prisma asset trees 是\nPrisma datasource/migration 限制导致的必要复杂度。\n\n## Implementation Phases\n\n### Phase 0：冻结 baseline 与工具链\n\n1. owner 批准 ER 后，将 `main@10750ca` merge/rebase 到 040；再次审计 039/041 的\n   IntegrationConnection、Project FK、SecretProvider ref 与 schema v5。\n2. 锁定 Prisma/adapter/pg 版本与 pnpm lockfile。\n3. 建立 SQLite/PostgreSQL schema、provider-specific config、generated outputs 和 parity script。\n4. 从最终 3 表模型生成并审查两套 baseline migrations；SQLite adoption 将现有 connection 的\n   repository fields 无损 backfill 到 `capabilities.repositories`，并将每个 Project\n   `repository_snapshot.externalId` 提升为 `repository_external_id` 后删除 Project snapshot；缺失或无效\n   external ID 时 fail closed。Task adoption 将 `dispatch_key` 改名为 `issue_dispatch_key`，删除 source、\n   objective 与 Issue/Repository snapshots，不把它们转存到 metadata。Session 表及其 branch partial index 不进入新 schema；CHECK/FK actions\n   在 provider-specific migration 中验证。\n\nVerification: Prisma validate/generate、parity check、migration SQL review、空库 replay。\n\n### Phase 1：先异步化 contract，再替换实现\n\n1. `RdbProvider` 全方法变为 `Promise`。\n2. 删除 Session persistence、Task child-Session projection 与 event-derived Session coordination summary\n   surface，并把受影响调用者记入后续适配清单。\n3. 对保留的 route/MCP/integration/test 迁移 `await`，保持现有 SQLite provider 暂时以 async wrapper 实现。\n   `dispatchIssue()` 必须在 `try` 内 `return await db.dispatchIssue(...)`，确保 rejection 被现有 conflict\n   normalization 捕获。\n4. 运行可执行的 scoped typecheck/test 并生成受影响功能适配清单；批准删除面造成的全仓失败不在本期修复。\n\n这是“make the change easy” slice。它不同时改变查询实现，避免结构变更和 ORM 行为变更互相掩护。\n\n### Phase 2：Prisma provider 与事务\n\n1. 实现 domain/model mappers、统一错误归一化和 provider lifecycle。\n2. 依功能群迁移 IntegrationConnection、Project、Task；不建立 capability 子表、Session、ContextBundle、\n   Runner、SessionEvent 或 Artifact model。\n3. 将 Project 的完整 snapshot 映射改为 stable `repositoryExternalId`，不在本期新增 RepoProvider 方法、\n   Repo Info query service 或 cache。\n4. 为 capabilities 原子更新与 Task dispatch 建立 transaction/竞争测试。\n5. 上述三表所有业务 CRUD 只用 Prisma Client API；静态审计禁止运行时 raw SQL。\n\nVerification: shared provider contract suite 先 SQLite，后真实 PostgreSQL。\n\n### Phase 3：配置、迁移和 Supabase profile\n\n1. 实现 `RdbConfiguration` Zod union 与 sanitized errors。\n2. `getDb()` 改为 async singleton promise factory，支持三种 provider profile。\n3. 实现 SQLite adoption command 和 verify command。\n4. 增加 provider-specific generate/migrate/deploy/drift/test scripts。\n5. 使用 local PostgreSQL 验证 PG/Supabase protocol path；若有 Supabase credentials，执行 cloud smoke。\n\n### Phase 4：删除旧 owner 与文档\n\n1. 删除 `sqlite-provider.ts`、`migrations.ts` 和不再使用的手写 CRUD/schema version tests。\n2. 保留 `better-sqlite3` 仅作为 Prisma adapter/adoption verifier 所需依赖，不允许业务代码 direct import。\n3. 创建 `INSTALLATION.md`，更新 README、PLATFORM、PRODUCT、AGENTS、DB module README 与相关旧 docs。\n4. 运行静态 boundary audit、focused/full tests、typecheck、lint、build、migration replay。\n\n全仓命令仍用于收集证据，但批准删除面导致的失败只记录到后续适配清单，不阻断 040 数据层交付。\n这不是允许保留旧 schema 或旧 SQL 的委婉表达；旧 owner 必须删除。\n\n## What Already Exists\n\n| Existing surface | Reuse decision |\n|---|---|\n| `RdbProvider` domain contract | 保留并异步化，不新建 parallel port |\n| `SqliteRdbProvider` 约 35 个行为及测试 | 作为行为 baseline 和 contract fixture 来源，最终实现删除 |\n| `ensureCurrentSchema` fingerprints | 转换为显式 adoption preflight，不在 app startup 继续拥有 migration |\n| shared Zod domain schemas | 继续作为 input/output validation owner |\n| Next.js async route handlers | 直接传播 `await`，不改变 HTTP contract |\n| `resetDbForTests()` | 扩展为 async disconnect/reset lifecycle |\n| Session persistence 与 Task child-Session projection | 整体退出 040；受影响调用者进入后续适配清单 |\n| event-derived Session summary | 删除 route/MCP/provider/shared projection，不迁移为字段 |\n| IntegrationPlugin optional capabilities | 保留该抽象并扩展；持久化从 repository-specific 顶层列收敛为 Connection.capabilities JSON |\n| Project/Task snapshots | Project 只提升 stable external ID；Task 删除 Issue/Repository snapshots、source 与 objective；cache 设计延后 |\n| 039/041 main baseline | 必须吸收，不能从旧 v3 schema重建 |\n\n## NOT in Scope\n\n- runtime hot database switching：需要 drain、缓存一致性和跨库复制，非本需求。\n- SQLite -> PostgreSQL 自动数据迁移：本功能只接管既有 SQLite 和初始化 PG。\n- Supabase Auth/Storage/Realtime/Data API：与 RDB provider 无关。\n- public Team multi-tenancy/RLS：数据库可 hosted 不等于产品已具备 tenancy contract。\n- 自动创建 Supabase/PostgreSQL infrastructure：Installation 只连接用户提供的数据库。\n- database admin UI/Prisma Studio product surface：无用户需求且扩大秘密与权限面。\n- Issue/Repo Info query、provider re-resolution、cache key/payload/TTL/refresh/invalidation 与相关 UI/执行适配：另立 Integration 规格。\n- Session persistence、字段、关系、状态机、CRUD、迁移与上层适配：后续另立规格重新设计。\n- 修复由批准删除的表/字段造成的既有上层功能报错：记录适配清单，后续按新设计恢复，不在 040 伪造兼容层。\n- provider-specific性能调优 beyond bounded pool/critical indexes：需实际负载数据后单独处理。\n\n## Failure Modes and Controls\n\n| Path | Production failure | Test | Handling | Operator visibility |\n|---|---|---|---|---|\n| config parse | URL/pool missing or invalid | config matrix | fail before connect, sanitize | clear variable-level error |\n| provider singleton | concurrent first requests create multiple pools | concurrency unit | cache initialization promise | startup error once |\n| SQLite adoption | unknown schema or interrupted backup | fingerprint/failure fixtures | fail closed, checksum backup | exact failed phase |\n| migration deploy | pooled URL/session lock failure | config + local PG integration | use direct URL only | Prisma migration error, no secret echo |\n| client/schema mismatch | wrong generated client loaded | parity/generate tests | provider-tag assertion at factory | startup error |\n| dispatch | duplicate key race | concurrent contract test | transaction + unique conflict normalization | stable conflict/idempotent result |\n| dispatch async catch | rejected Promise 跳过 conflict mapping | route/integration regression | `return await` inside try | stable IntegrationFailure |\n| capability update | invalid or lost whole-object write | SQLite/PG concurrency test | single owner + whole-object Zod validation/atomic update | valid complete envelope or rollback |\n| pool exhaustion | no free PG connection | timeout integration test | finite timeout, bounded pool | sanitized database unavailable error |\n| shutdown/test reset | pool remains open | lifecycle test | `$disconnect()` and await reset | no hanging test/process |\n\nNo listed path is allowed to fail silently without test and error handling.\n\n## Test Strategy\n\n```text\nCONFIG\n├── sqlite default/path                    [unit]\n├── postgresql runtime/direct fallback     [unit]\n├── supabase runtime+required direct       [unit]\n└── invalid provider/URL/pool + redaction  [unit]\n\nSCHEMA / MIGRATION\n├── SQLite fresh replay                    [integration]\n├── SQLite v5 non-empty adoption           [integration]\n├── unknown/mixed/corrupt fail closed      [integration]\n├── PostgreSQL fresh replay + redeploy     [real DB integration]\n├── schema parity/allowed dialect diff     [static + generated client]\n└── CHECK/FK verification                  [real DB integration]\n\nRDB PROVIDER CONTRACT (same assertions)\n├── Project + IntegrationConnection JSON       [SQLite + PG]\n├── Project stable repository identity         [SQLite + PG]\n├── repository capability binding guard    [SQLite + PG]\n├── dispatch idempotency/conflict          [SQLite + PG, concurrent]\n└── ordering/not-found/error normalization [SQLite + PG]\n\nSURFACES\n├── route fixture regression               [Next route integration]\n├── MCP tool fixture regression            [MCP integration]\n├── removed ContextBundle/Runner surfaces  [negative regression]\n├── async dispatch rejection normalization [integration regression]\n├── removed Session persistence/projections [route/MCP/shared negative regression]\n├── removed Session summary/artifact ID     [route/MCP/shared negative regression]\n└── boundary import audit                  [static]\n\nDEFERRED COMPATIBILITY\n└── approved-removal failures inventory    [full commands, non-blocking for 040]\n\nDOCUMENTATION\n├── SQLite clean install                    [command walkthrough]\n├── local PostgreSQL clean install         [command walkthrough]\n└── Supabase configuration/connectivity    [config; cloud smoke if credentials]\n```\n\n## Performance and Capacity\n\n- Preserve existing select ordering and avoid per-row follow-up queries；保留的三表 summary/list 使用\n  batched reads 或 explicit relations。\n- `pg` pool default：`max=10`、connect timeout 5s、idle timeout 10s；允许 validated env override。\n- Supabase operators must budget `pool max × app instances` against project connection limits。\n- Interactive transactions保持短小；不在 transaction 内进行 external GitHub/Linear/network calls。\n- Concurrent Task dispatch retry 有界，不允许无限 spin。\n\n## Security\n\n- URLs only from environment；不保存、不打印、不序列化到 Sentry context。\n- error sanitizer 处理 Prisma/pg messages 中可能包含的 host/user/database details。\n- Supabase service role key不是数据库连接所需，不在 Installation 中要求。\n- migration role需要 DDL 权限；runtime role最小权限方向记录，但 role provisioning 不自动化。\n\n## Parallelization Strategy\n\n由于 contract async migration、Prisma provider 和 route changes 共享 `apps/control-plane` DB/API\n核心，主体按顺序实施。文档可在 baseline/config 稳定后独立编写，但最终命令验证依赖代码。\n\n| Step | Modules touched | Depends on |\n|---|---|---|\n| A baseline/schema | control-plane/prisma, db contracts | owner ER approval + main sync |\n| B async contract | control-plane/db, api, integrations, tests | A contract shape |\n| C Prisma provider | control-plane/db, prisma, tests | A + B |\n| D config/migration scripts | control-plane/db, scripts, prisma | A + C lifecycle |\n| E Installation/docs | root docs, DB README | D commands/config |\n\nLane A: baseline → async contract → provider → config/migrations（sequential，共享 DB module）  \nLane B: Installation draft（可在 D 稳定前并行，但最终 verification 等待 D）\n\n## Complexity Tracking\n\n| Violation | Why Needed | Simpler Alternative Rejected Because |\n|---|---|---|\n| 修改超过 8 个文件 | 同步 `RdbProvider` 有 27 条 execution flows；异步 I/O 必须传播到所有调用者 | 保持同步无法支持 PostgreSQL；并行旧/新接口会增加更多状态 |\n| 两套 Prisma asset trees | Prisma schema 只能有一个 datasource，migration history provider-locked | 动态 provider/共享 SQL history 不受 Prisma 支持 |\n| migration/adoption scripts | 既有 SQLite 要无损且未知 schema fail closed | constructor 自动迁移风险更大且不可恢复 |\n\n新增核心 class/service 控制为两个：`PrismaRdbProvider` 与 provider client factory/config boundary。\n其余均为 scripts、generated assets 或现有模块改造。\n\n## Implementation Gate\n\n**当前状态：CLOSED。** 解除条件：\n\n1. owner 批准 `data-model.md` 中的 ER、字段改名与移除面；\n2. 040 merge/rebase `main@10750ca` 后确认 schema v5 + 039/041 contracts；\n3. 重新运行 GitNexus analyze/impact；\n4. plan-eng-review 通过；\n5. `/speckit.tasks` 与 `/speckit.analyze` 完成。\n\n## GSTACK REVIEW REPORT\n\n| Review | Trigger | Why | Runs | Status | Findings |\n|---|---|---|---:|---|---|\n| CEO Review | `/plan-ceo-review` | Scope & strategy | 0 | — | — |\n| Codex Review | `/codex review` | Independent 2nd opinion | 0 | — | 当前 reviewer 即 Codex，未启动未授权 sub-agent |\n| Eng Review | `/plan-eng-review` | Architecture & tests (required) | 1 | RE_REVIEW_REQUIRED | Session 整表退出后的三表 ER 使旧 verdict 失效 |\n| Design Review | `/plan-design-review` | UI/UX gaps | 0 | N/A | backend-only feature |\n| DX Review | `/plan-devex-review` | Developer experience gaps | 0 | — | Installation/quickstart 已纳入 eng review |\n\n**UNRESOLVED:** 2，owner ER approval 与 main baseline sync。  \n**VERDICT:** design ready for owner ER review；implementation gate remains closed。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks\n\n_specs/040-prisma-rdb/tasks.md is not present for this spec yet._"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
  </body>
</html>
