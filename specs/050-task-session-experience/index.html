    <script id="spec-data" type="application/json">{"feature":"050-task-session-experience","title":"050-task-session-experience","prototypeHref":"mockups/index.html","generatedAt":"2026-08-10T10:18:00.948Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：Task Session 创建与历史体验\n\n**功能分支**: `050-task-session-experience`\n**修订日期**: 2026-08-10\n**状态**: 已实现\n**依赖**: 048 Task Workspace；049 Session launch、Session、SessionEvent\n\n## 合同摘要\n\n050 为 Task 页面增加 Session 列表、创建入口和 Session 详情/事件体验。它不设计新的 `SessionSummary`、`SessionDetail`、TaskSession view 或终态摘要模型：列表和详情直接复用 049 的 `Session`；事件历史直接复用 `SessionEvent`。\n\n050 只处理 Task-bound Session，并消费 feature 048 的 ready Workspace。Project-only Session 与既不引用 Task 也不引用 Project 的 Session 均延后；它们未来仍应复用同一 Workspace/attachment 合同，只允许准备逻辑不同。\n\n050 只增加：\n\n- 按 Task 过滤和分页读取 `Session[]` 的 canonical API；\n- 将 Task 页面选择映射为 049 `SessionLaunchRequest` 的 `launchForTask` 应用命令；\n- 基于 `SessionEvent[]` 的纯展示 reducer；\n- 页面可见期间的有界轮询与手动刷新。\n\n`ready` 表示最近一次 response 已结束、可继续发送消息且 Runtime 当前执行占用已释放，不是终态。050 首期没有 Session 内继续发送 user message 的输入框，因此页面在 ready 时停止自动轮询并保留手动刷新；这只是 UI 策略，不改变 049 会话可继续的语义。\n\n## 场景 1：Task 页面直接列出相关 Session（P1）\n\n1. 打开 Task 详情时，服务按 subject.teamId 与 taskId 过滤 049 `Session`，按 `(updatedAt,id)` 降序稳定分页。\n2. 页面直接使用 Session 的 state、runtimeId、providerKey、agentId、updatedAt，不请求或构造新的 summary DTO。\n3. Runtime/Agent 展示名可由现有资源查询/缓存解析；缺失时显示稳定 ID，不把名称快照塞进 Session。\n4. 1,000 个 Session 可分页访问，首屏不超过 50 条。\n\n## 场景 2：创建 Task Session（P1）\n\n1. 只有 feature 048 TaskWorkspace 为 ready 时才能提交；Runtime 固定为 Workspace runtimeId。\n2. 用户选择该 Runtime 的 available Provider、同 Team active Agent，并可输入可选 Manual Context。\n3. `launchForTask` 服务端读取 Task、其不可变可选 Project context、Workspace、Manual Context 和执行选择，生成 canonical 第一条 user message；随后调用 049 launch，由 049 组装并冻结 system prompt。\n4. 第一条 user message 与 Session/system prompt 同事务持久化，不再调用第二次 sendMessage。\n5. 创建成功立即导航到 `/sessions/{id}`，不等待 Runtime claim 或 response 完成。\n\n## 场景 3：直接展示 Session 与 SessionEvent（P1）\n\n1. `GET /api/sessions/{id}` 直接返回 049 `Session`。\n2. `GET /api/sessions/{id}/events` 直接返回 049 `SessionEvent[]` 的有界窗口。\n3. 页面按 globalSequence 展示 lifecycle、user message、response、thinking/process、plan、tool、usage、interrupt、handoff、error/result 与 unknown fallback。\n4. queued/dispatched/message_pending/running/interrupted/waiting_for_handoff 时，页面可见期间轮询 afterSequence；ready/closed/failed 时停止自动轮询并保留 Refresh now。\n5. 页面把 ready 展示为“本次响应完成，可继续”，closed/failed 展示为 Session 终态；不得把 response result 叫作 Session 终态摘要。\n\n## 场景 4：Workspace 状态与错误可行动（P1）\n\n1. absent/preparing Workspace 显示 setup action 或等待态；failed 显示 048 已脱敏 failure 与 retry action；ready 才显示创建表单。\n2. Workspace runtimeId 为只读；不存在重新选择 Runtime 后再与 048 affinity 冲突的 UI。\n3. Provider 列表只来自该 Runtime available capabilities；Agent 只来自当前 Team active Agents。\n4. 稳定错误码映射为可行动文案，未知错误显示 request/correlation ID，不暴露路径、credential 或原始 Provider payload。\n\n## 功能需求\n\n- **FR-001**：Task Sessions API 必须返回 049 `Session[]`，不得定义 SessionSummary/SessionDetail/TaskSession view。\n- **FR-002**：列表按 `updatedAt DESC,id DESC` 稳定 keyset 分页，默认/最大 limit 有服务端上限。\n- **FR-003**：Session detail API 必须直接返回 049 Session；事件 API 直接返回 049 SessionEvent。\n- **FR-004**：所有 Task/Session/Event/Runtime/Agent 操作必须由服务端 subject.teamId 授权。\n- **FR-005**：Task Session 创建必须消费 048 ready Workspace 并锁定其 runtimeId；不得重复 workspace materialization。\n- **FR-006**：Provider 只能从该 Runtime available capabilities 选择；Agent 必须 active 且同 Team。\n- **FR-007**：Manual 是可选 Context 数据，按明确 schema/长度限制保存到 049 Context/system-prompt 审计事件；不得作为 system instruction。\n- **FR-008**：`launchForTask` 必须组装 canonical 第一条 user message，并与 Session/system prompt 经 049 同一事务持久化。\n- **FR-009**：050 不得在创建后再调用 sendMessage，也不得引入 Turn/turnId。\n- **FR-010**：创建成功立即返回已持久化 Session并导航；不等待 Runtime 或 response。\n- **FR-011**：事件展示必须为纯 reducer，对未知 kind 提供安全 fallback，不执行事件中的 HTML/脚本。\n- **FR-012**：事件读取支持 latest/beforeSequence/afterSequence 三种互斥的 globalSequence 有界窗口；不得让首屏加载完整历史。\n- **FR-013**：只有页面可见且 Session 处于活动/等待状态时自动轮询；同页最多一个 in-flight 请求。\n- **FR-014**：ready 停止 050 自动轮询是 UI 策略；文案必须说明可继续，不得称 ready 为 terminal。\n- **FR-015**：closed/failed 才使用 Session 终态文案；response_completed/result 只描述最近一次响应结果。\n- **FR-016**：不提供跨 Session event 搜索、全局活动流、原始日志下载或任意 stdout/stderr 展示。\n- **FR-017**：不得展示 workspaceRef、绝对路径、credential、完整 system prompt 或未脱敏 Provider payload。\n- **FR-018**：错误码复用 048/049 lowercase 合同，包括 `session_conflict`；050 只补充 transport 输入错误 `event_window_invalid`，不创建大小写别名或第二套 taxonomy。\n- **FR-019**：Web Route Handler 是 canonical service 的薄 adapter；MCP/CLI 不复制业务规则。\n\n## 直接复用的数据合同\n\n- **Session**（049）：列表项与详情主体。\n- **SessionEvent**（049）：事件历史与最近一次 response/result 事实。\n- **TaskWorkspace** / 048 action/view：Workspace readiness 与固定 Runtime。\n- **Runtime** / Provider capability（044）、**Agent**（046）、**Task/Project**（047）。\n\n050 自有的唯一数据结构是表单输入、事件窗口游标与展示 reducer state；它们都不是持久化业务 view。\n\n## UX Intent\n\n- **体验问题**：Task Workspace 已 ready 后仍没有可发现的 Session launch/list，Session route 仍是假占位，操作者无法判断首条消息是否真正执行。\n- **页面族**：Task detail 保持 reading-width object detail，在既有 Workspace panel 后增加 Sessions panel；Session detail 复用同一 shell/path header 与 reading column，不引入聊天式全屏 workbench。\n- **复用规则**：复用现有 panel、definition list、status、button/select/textarea、loading/error state；事件历史新增一个紧凑 timeline component，但不创建 summary card family。\n- **状态**：Workspace loading/absent/preparing/failed/ready，Session empty/list/launching/error，以及 events loading/empty/live/ready/terminal/network-error 均显式呈现。\n- **响应式与无障碍**：320px 起单列，桌面保持紧凑 reading width；表单有 label，状态有文字，轮询用 polite live region，所有 action 为原生 button/link。\n- **验证信号**：真实浏览器检查 Task launch、Session redirect、事件窗口、ready/terminal 文案、keyboard focus、窄屏和 console/network。\n\n## 范围之外\n\n- 新的 Session summary/detail/view 持久化或 DTO。\n- Session 内继续发送 user message 的输入体验；049 已支持，后续 UI 规格再接入。\n- Runtime capacity/slot 展示或限制。\n- Project-only 与 standalone Session 的创建入口及 Workspace 准备逻辑。\n- 重做 048 repository/workspace policy；交付、preview、commit、PR、waiting_for_review。\n- 跨 Session 活动流、日志产品、事件全文搜索/导出。\n\n## 成功标准\n\n- **SC-001**：Task Session 列表/详情 JSON 中的 Session 字段与 049 shared schema 完全一致，无 summary/detail duplicate type。\n- **SC-002**：1,000 个相关 Session 稳定分页，首屏不超过 50 条。\n- **SC-003**：创建请求只提交一次 canonical launch；Session、system prompt 与首消息同事务创建。\n- **SC-004**：Workspace 非 ready 时 100% 阻止创建；ready 时 Runtime 不可修改。\n- **SC-005**：10,000 个事件的首屏/向前/增量窗口均有界、无重复、globalSequence 连续。\n- **SC-006**：ready 文案与 closed/failed 终态文案完全区分；不存在“ready 终态摘要”。\n- **SC-007**：页面不可见或 ready/closed/failed 时无自动轮询；手动刷新可获取后续合法事件。\n- **SC-008**：真实端到端证据包含 TaskWorkspace、Session、首消息、固定 Runtime、Provider/Agent、有序 SessionEvent 与最近 response 结果。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：Task Session 发起与执行历史\n\n## 摘要\n\n让 Team 操作者在 Task 详情页先准备并确认唯一 Workspace，再在锁定 Runtime 上选择 Provider 与 Agent 发起 Session，并找到历次执行。每次发起可以携带只属于该 Session 的补充说明，执行中的状态、消息、过程、工具调用和结果在 Session 详情页按可靠顺序持续呈现。\n\n## 功能地图\n\n- Task 详情：Workspace 状态/Setup/Retry、Session 列表、空状态、分页、New Session 入口。\n- New Session：锁定 Workspace Runtime、选择 Provider/Agent，并提供可选 Manual Context；Project context 来自不可变 Task。\n- Session 详情：直接使用 049 Session 当前状态与执行选择；结果与精确时间来自 SessionEvent。\n- Event history：最新窗口、更早分页、运行期增量刷新、未知事件安全降级。\n- 049 对接：复用 canonical launch/get/listEvents、Session 与 SessionEvent；不增加 summary/detail view。\n\n## 边界\n\n- Session 只引用 Task，不归属于 Task。\n- Manual Context 只属于一次 Session，不修改 Task、Project 或 Agent。\n- 只展示已验证并脱敏的 Session domain events，不展示任意进程输出。\n- ready 表示最近一次响应完成且执行占用已释放，不是 Session 终态。\n- 不包含 cancel/retry、全局活动流、日志搜索、仓库物化或 PR 交付。\n\n## 分阶段能力图\n\n1. 先落地 048 Task Workspace，再落地 049 Session/Event attachment 底座。\n2. 扩展 Manual Context、直接返回 Session 的 Task-filtered list 与 authenticated Web API。\n3. 交付 Workspace/Task launch/list UI 与 Session detail/event UI。\n4. 以确定性 Provider fixture 和真实浏览器验证 Task→shared Workspace→Session→Runtime→Events 闭环。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：Task Session 发起与执行历史\n\n## Owner 评审\n\n- [x] 确认 Task-bound launch 只有一个可选自由文本框，且它明确属于 Manual Context。\n- [x] 确认 050 从不可变 Task context 显式映射其可选 Project ID；UI 不提供会与 Task/Workspace affinity 冲突的第二个 Project selector。\n- [x] 确认 Runtime 在 Setup Workspace 时选择，Session form 锁定该 Runtime。\n- [x] 确认多个 Task Session 共享同一目录且 UI 不宣称隔离。\n- [x] 确认 Session event history 采用 Mystra 紧凑信息层级，不复制聊天产品功能。\n- [x] 确认 050 不包含 cancel/retry、repository delivery 或全局日志能力。\n\n## Spec 就绪度\n\n- [x] 用户故事与验收场景完整。\n- [x] `context.manual` 的合同边界明确。\n- [x] 048/049/044/046/047 依赖与 048 → 049 → 050 顺序明确。\n- [x] Requirements Quality Score 达到 90+。\n- [x] 旧 prototype 不作为门禁；UX Intent 已刷新，最终以真实浏览器实现、响应式与无障碍证据验收。\n- [x] `/speckit.plan` 技术产物完成。\n- [x] `plan-eng-review` 完成且无未解决关键问题。\n\n## 后续插件检查\n\n- [x] UI 实现前使用 `frontend-ui-engineering` 与 `mystra-ux`。\n- [x] 真实页面验收使用 `browser-testing-with-devtools`；当前环境以应用内浏览器的 DOM、截图、console 与真实 HTTP 证据完成同等验收。\n- [x] 修改 API/共享合同前执行 GitNexus impact analysis；SessionService MEDIUM，其余现有方法/页面 LOW。\n- [x] 实现完成后使用 `code-review-and-quality` 与 `aaa-spec-close`。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 原型：Task Session 发起与执行历史\n\n## 状态\n\n旧的独立 HTML fixture 已退役。它在 048/049 落地前创建，包含 per-Session Runtime 与 Project 选择，和当前合同冲突。050 不再维护第二套静态页面；最终验收直接针对真实 Task 与 Session 页面。\n\n## 设计 Intake\n\n- **目标用户**：已登录并具有当前 Team resource access 的操作者。\n- **首要行动**：确认/准备 Task Workspace，再从固定 Runtime 发起 Session；随后理解 Session 正在做什么。\n- **参考**：Mystra 当前 Task/detail shell；Castrel Session history 的 turn grouping、折叠 process trace、工具分组与按需展开。\n- **硬约束**：不引入 Task ownership、聊天继续输入、日志产品或 Castrel 依赖。\n- **变体范围**：不创建新 view family，复用现有 shell、panel、form 与 object detail。\n\n## Wireframe 方向\n\n评估过三种结构：\n\n1. **Task 页面内联长表单**：上下文清楚，但会把常用的 Task 阅读/编辑页面永久变成配置页。\n2. **独立 New Session 页面**：空间充足，但打断 Task→Session 的短路径，并增加一个不必要路由。\n3. **Task 详情 + 右侧 launch drawer + 独立 Session detail**：保留 Task 作为视觉锚点，表单只在需要时出现，创建成功后进入可持续观察的 Session 页面。\n\n采用 Task detail 内嵌 Sessions panel + 独立 Session object route。它用最少新表面覆盖发起与观察，同时保持 Session 的独立对象身份。\n\n## 覆盖页面与状态\n\n- Task 详情：Workspace absent/preparing/ready/failed 状态、Setup/Retry、已有 Session、无 Session、分页入口、New Session。\n- Launch panel：锁定 Workspace Runtime、Provider、Agent、来自不可变 Task context 的 Project reference、可选 Manual Context、shared-mutable 提示、提交中与错误槽位。\n- Session 详情：状态摘要、执行选择、Context 摘要、message/process/tool/lifecycle/error/unknown event 表现、折叠与展开。\n- Live behavior：运行中提示与新增 event；ready 显示“本次响应完成，可继续”并停止 050 自动刷新；closed/failed 使用终态文案。\n\n## 交互说明\n\n- 点击 `New Session` 展开 Task 内的 launch panel。\n- Runtime 不可修改；Provider 只来自 Workspace Runtime，避免制造无法访问该目录的选择。\n- Task context 始终包含；可选 Project reference 从 Task 不可变 context 派生，不提供第二个 selector。\n- 创建成功后真实页面导航到 Session detail。\n- Session detail 的 process 与 tool group 可以展开；`Load earlier events` 模拟向前游标分页。\n\n## 已知限制\n\n- 不保留静态 fixture，因此没有脱离实现的伪交互证据。\n- 真实页面必须覆盖小屏、键盘路径、最终双语文案、console 与 network。\n- 生产实现复用 Mystra token、controls 与状态组件。\n\n## 浏览器验证证据\n\n实现完成后用真实浏览器重新验证 Workspace 状态、locked Runtime、shared-mutable 提示、launch disabled 状态、直接复用 Session 的列表/详情、ready 与 closed/failed 文案差异，以及键盘、窄屏、console/network。旧 fixture 的任何结论均不计入验收。\n","action":{"label":"Open Prototype","href":"mockups/index.html"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# 实施计划：Task Session 创建与历史体验\n\n**分支**: `050-task-session-experience` | **日期**: 2026-08-10 | **规格**: [spec.md](./spec.md)\n\n## 摘要\n\n050 把 048 Task Workspace 与 049 Task-bound Session execution contract 接入 Web。Task 页面列出直接复用的 `Session[]`；创建表单通过 `launchForTask` 组装 049 launch 输入；Session 页面直接读取 Session 与 SessionEvent。没有 SessionSummary、SessionDetail、TaskSession view、终态摘要列或重复持久化。Project-only 与 standalone Session 延后，不在 050 创建入口或准备逻辑中出现。\n\n## 依赖与边界\n\n| 责任 | Owner | 050 行为 |\n| --- | --- | --- |\n| Task Workspace readiness/affinity | 048 | 读取并锁定 Runtime |\n| Session launch + first message | 049 | 直接调用 canonical service |\n| Session/SessionEvent schema | 049 | API 原样复用 |\n| Runtime/Provider capability | 044 | 读取 available providers |\n| Agent | 046 | 读取 Team active agents |\n| Task/Project Context | 047 | 服务端冻结 snapshot |\n\n050 不增加 Runtime capacity、Session message composer、日志平台、repository materialization、Project-only/standalone Session 或 delivery。后续非 Task 场景必须复用同一 Workspace/attachment 合同。\n\n## 数据流\n\n```text\nTask page\n  -> GET TaskWorkspace (048)\n  -> GET sessions by task -> Session[] (049 type)\n  -> POST launch input\n      -> launchForTask:\n           authorize Task/Workspace/Runtime/Provider/Agent\n           normalize Manual Context\n           generate canonical firstUserMessage\n           call 049 SessionService.launch\n  -> navigate /sessions/{id}\n\nSession page\n  -> GET Session (049 type)\n  -> GET SessionEvent window (049 type)\n  -> pure presentation reducer\n```\n\n## API 与 RDB\n\n- `GET /api/tasks/{taskId}/sessions` 复用 049 `listSessions({teamId,taskId,cursor})`，用现有 `(updatedAt DESC,id DESC)` 顺序返回 `Session[]` 与 opaque next cursor。\n- `POST /api/tasks/{taskId}/sessions` 调用 `SessionService.launchForTask`，返回 `{session,created}`。\n- `GET /api/sessions/{id}` 返回 `{session: Session}`。\n- `GET /api/sessions/{id}/events` 返回 `SessionEvent[]` latest/beforeSequence/afterSequence window。\n- 不增加 `listSessionsByTask`；RdbProvider 只扩展既有 `listSessionEvents` 的 before/descending window 能力，返回 shared SessionEvent，不定义 projection。\n\n## launchForTask\n\n1. 从 subject 解析 Team；读取 Task 及其不可变可选 Project context，不提供第二个 Project selector。\n2. 读取 048 ready Workspace；runtimeId 固定为 workspace.runtimeId。\n3. 验证 provider available、Agent active/same Team。\n4. 校验 Manual Context schema 与长度。\n5. 接受调用方 sessionId，服务端生成 canonical firstUserMessage.messageId 与稳定执行指令。\n6. 调用 049 launch，使 Session/system prompt/Workspace attachment/first user message 同事务持久化。\n7. 立即返回 queued Session；不等待 Runtime claim 或 response。\n\nWeb adapter 不自行拼 system prompt、不自行追加首消息、不复制 049 状态机。\n\n## 列表与详情 UI\n\n- Task 首屏最多 50 个 Session，直接显示 state/runtimeId/providerKey/agentId/updatedAt；Task Workspace panel 把最新 Workspace 状态传给 Sessions panel，不重复维护第二套 Workspace state machine。\n- Runtime/Agent label 通过现有资源读取解析；失败时回退 ID。\n- Session 页面 header 直接使用 Session；时间、消息与结果从 SessionEvent 事实展示。\n- 不计算 objectiveLabel、terminalSummary、created/started/finished projection。\n\n## Event window 与轮询\n\n1. 首屏 `latest=100`，RDB 倒序有界读取后在 API 边界恢复 globalSequence 升序。\n2. Load earlier 使用 beforeSequence，并在客户端按 eventId/globalSequence 去重后 prepend。\n3. 活动/等待状态且页面可见时，每 3 秒 afterSequence 拉取；错误退避至 15 秒。\n4. ready/closed/failed 停止自动轮询并保留 Refresh now。\n5. ready 的 UI 标签为“本次响应完成，可继续”；closed/failed 才标终态。\n6. 纯 reducer 显示全部已知类型及 unknown fallback；050 不做跨事件聚合、terminal summary 或新的持久化/传输 view。\n\n## 实施顺序\n\n1. shared API response 引用 049 Session/SessionEvent schema。\n2. 复用 RdbProvider Task filter，并扩展 SessionEvent before/descending window 与 SQLite/PostgreSQL contract tests。\n3. `launchForTask` service 与 048/049 contract tests。\n4. Task Workspace states + Session list + launch form。\n5. Session header + event presentation/window/可见性轮询。\n6. error mapping、redaction、accessibility 与 responsive states。\n7. 真实 Runtime/provider E2E 与浏览器验证。\n\n## 验证\n\n- Static：仓库无 050 SessionSummary/SessionDetail types；API schema 引用 049。\n- Contract：Task/Team/Workspace/Provider/Agent 校验；同事务首消息；稳定 lowercase error codes。\n- Pagination：1,000 Sessions、10,000 events 的 latest/before/after window，无重复/缺口、请求有界。\n- UI：workspace absent/preparing/failed/ready；locked Runtime；unknown event；ready 与终态文案。\n- E2E：ready Workspace -> launch -> Runtime claim -> first message -> response events -> ready；记录 IDs 与连续 globalSequence。\n\n## 工程评审状态\n\n2026-08-10 新版 plan-eng-review 通过：复用现有 Session Task filter；只扩展既有 event read window；选择完整事件类别但不做跨事件聚合。prototype 不作为实现前阻塞，真实浏览器实现验收取代旧静态 prototype 结论。详见 [engineering-review.md](./engineering-review.md)。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks: Task Session 创建与历史体验\n\n**Input**: `spec.md`, `plan.md`, `data-model.md`, `contracts/`, `engineering-review.md`\n**Tests**: contract、service、RDB、Route Handler、component、真实 HTTP/Runtime 与浏览器验证均为必需。\n\n## Phase 1 — 规格与架构门禁\n\n- [x] T001 对齐 048 Workspace、049 Session/Event 与 050 UI/API 边界。\n- [x] T002 删除 SessionSummary/SessionDetail/TaskSession view 与额外 Project selector 设计。\n- [x] T003 运行 GitNexus query/context/impact 并记录 SessionService MEDIUM、页面/RDB LOW。\n- [x] T004 完成 `/speckit.plan` 与 `plan-eng-review`，确认无 HIGH/CRITICAL 风险。\n\n## Phase 2 — Shared transport 与 event window\n\n- [x] T005 [P] 在 `packages/shared` 添加直接引用 Session/SessionEvent 的 050 request/response schema 与边界测试。\n- [x] T006 [P] 为 latest/beforeSequence/afterSequence 互斥、limit 上限和 Manual Context 长度先写失败测试。\n- [x] T007 扩展既有 RdbProvider `listSessionEvents` 可选 before/descending window，不增加新 view 方法。\n- [x] T008 [P] 为 SQLite 与 PostgreSQL 合同补齐 latest/before/after 窗口、顺序与边界测试。\n- [x] T009 验证 10,000 events 窗口读取有界，API 返回 globalSequence 升序。\n\n## Phase 3 — Task-bound launch service\n\n- [x] T010 为 `SessionService.launchForTask` 的 Task/Team/Workspace/Provider/Agent 校验先写失败测试。\n- [x] T011 为 Task 不可变 Project、Workspace runtimeId、Manual Context 与 canonical first message 映射写测试。\n- [x] T012 为重复 sessionId、事务回滚和单次 launch/不调用 sendMessage 写测试。\n- [x] T013 实现窄的 `launchForTask`，复用 049 `launch` 事务与 prompt ownership。\n- [x] T014 验证 Workspace attachment、system prompt audit、first user message 与 queued Session 同事务。\n\n## Phase 4 — Authenticated HTTP API\n\n- [x] T015 [P] 为 Task Session list/launch route 写 human auth、Team permission、schema 与错误映射测试。\n- [x] T016 [P] 为 Session get/events route 写 auth、Team boundary 与 event window 测试。\n- [x] T017 实现 `GET/POST /api/tasks/[taskId]/sessions` 薄 adapter。\n- [x] T018 实现 `GET /api/sessions/[sessionId]` 与 events route 薄 adapter。\n- [x] T019 验证 API JSON 只返回共享 Session/SessionEvent；授权 API 保留原始事实，UI reducer 不展示 system prompt、workspaceRef 或 provider payload。\n\n## Phase 5 — 纯展示与客户端状态\n\n- [x] T020 [P] 为全部已知 event kind、unknown fallback、ready/terminal 文案写 presentation 测试。\n- [x] T021 [P] 为 event prepend/append 去重、globalSequence 排序与轮询状态写纯函数测试。\n- [x] T022 实现纯 event presentation/merge/polling helpers，不跨事件生成 summary。\n- [x] T023 [P] 在 `shell-copy.ts` 增加中英文 Task Sessions、launch、history、错误与状态文案。\n\n## Phase 6 — Task 页面 Sessions\n\n- [x] T024 为 `TaskWorkspacePanel` 可选 Workspace 回调与现有状态兼容性补齐类型、回归与真实浏览器验证。\n- [x] T025 实现 Workspace 回调，父页面仅维护一份 Workspace state。\n- [x] T026 为 Session empty/list/loading/error/pagination 与 launch disabled states 补齐模型、route 与真实浏览器验证。\n- [x] T027 实现 Task Sessions panel：直接渲染 Session 字段、锁定 Runtime、选择 available Provider/active Agent。\n- [x] T028 实现可选 Manual Context、提交错误与成功导航 `/sessions/{id}`。\n\n## Phase 7 — Session 详情与事件历史\n\n- [x] T029 为 Session loading/not-found/header 与 events loading/empty/error/unknown 补齐 presentation、route 与真实浏览器验证。\n- [x] T030 实现直接使用 Session 的 header 与有界 latest event history。\n- [x] T031 实现 Load earlier、Refresh now、按 eventId/globalSequence 合并与请求互斥。\n- [x] T032 实现只在可见且活动/等待状态下的 3 秒轮询、错误 15 秒退避和 ready/closed/failed 停止。\n- [x] T033 补齐 320px 单列、reading width、键盘 focus、polite live region 与语义 token 样式。\n\n## Phase 8 — 集成、性能与验收\n\n- [x] T034 运行 shared、control-plane、RDB、runner 相关 targeted tests 与 typecheck。\n- [x] T035 运行全量受影响 package tests，确认无 048/049 回归。\n- [x] T036 用 migrated SQLite 运行真实 HTTP E2E：ready Workspace -> launch -> claim -> events -> ready。\n- [x] T037 验证 1,000 Sessions 稳定分页与 10,000 events 有界窗口。\n- [x] T038 使用真实浏览器检查 Task launch、redirect、history、ready/terminal、console/network。\n- [x] T039 [P] 浏览器检查 320/768/1280 宽度、键盘路径、隐藏页停止轮询与手动刷新。\n- [x] T040 运行 `gitnexus detect-changes`、targeted diff review、Spec-Kit status/doctor/repoindex。\n- [x] T041 使用 `code-review-and-quality` 处理发现，并执行 `aaa-spec-close`。\n- [x] T042 提交 050、fast-forward 合并到本地 `main`，复核保留用户已有 dirty changes。\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
  </body>
</html>
