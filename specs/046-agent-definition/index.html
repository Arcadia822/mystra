    <script id="spec-data" type="application/json">{"feature":"046-agent-definition","title":"046-agent-definition","prototypeHref":"mockups/index.html","generatedAt":"2026-08-08T10:42:35.242Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：Agent 定义与 Session 选择边界\n\n**Feature Branch**: `046-agent-definition`\n**Created**: 2026-08-08\n**Status**: Complete\n**Input**: 用户要求“启动新 spec：定义 Agent；效果相关只配置 sys prompt 就行；Agent 是发起 Session 的四要素之一：Runtime、Provider、Agent、Context”。\n**Scenario Rationale**: 本功能首先定义平台内部业务对象与跨边界契约，使用具名操作者/调用方的技术场景比虚构消费型用户故事更准确。用户已明确确认两个核心产品决定：Session 发起使用四个正交要素；Agent 唯一影响执行效果的可配置内容是 system prompt。\n**Clarification Review**: 2026-08-08 用户明确确认 Team 是租户边界；Agent、Task、Project、Session 都是 Team 直属对象。Agent、Task、Session 均不属于 Project，Session 也不属于 Task；Project 与 Task 只是 Session 上彼此独立的 `0..1` 可选引用。该澄清已写入全部场景、要求和成功标准；其余 system prompt 长度、错误码、持久化形态与符号 blast radius 属于 plan/research 决策。\n\n## Contract Summary\n\n发起一次 Session 时，平台必须解析四个彼此独立的执行选择。Project 与 Task 不属于这四个执行选择；它们分别只是 Session 的 `0..1` 可选业务引用，且都不是 Session 父级。\n\n| 要素 | 回答的问题 | 本功能中的边界 |\n| --- | --- | --- |\n| **Runtime** | 在哪里执行 | 提供执行后端与可用 Provider；由 `044-host-runtime-daemon` 及后续 Runtime 规格拥有 |\n| **Provider** | 用哪个 agent CLI / 协议族执行 | 如 `copilot`、`codex`；必须由所选 Runtime 提供，不属于 Agent 配置 |\n| **Agent** | 以怎样的稳定行为角色执行 | Team-scoped 配置；不属于 Project，唯一影响执行效果的可配置字段是 `systemPrompt` |\n| **Context** | 带着哪些工作目录、仓库材料和上下文执行 | 独立选择；skills、文件、知识与 workspace 交付不进入 Agent |\n\n本规格把历史文档中的 `Agent(provider + prompt + skills)` 方向收窄为：\n\n```text\nAgent = Team identity + lifecycle metadata + systemPrompt\n```\n\n其中只有 `systemPrompt` 是效果配置。Provider、模型/CLI、skills、工具、Context、Runtime、资源规格、凭据与 workflow 行为都不是 Agent 字段。\n\n## Clarifications\n\n### Session 2026-08-08\n\n- Q: Agent 是否归属于 Project？ → A: 不属于；Agent 直属 Team，Team 是租户边界。\n- Q: Session 是否归属于 Task 或 Project？ → A: 都不属于；Session 直属 Team，`taskId?` 与 `projectId?` 是彼此独立的 `0..1` 可选引用。\n- Q: Task 是否归属于 Project？ → A: 不属于；Task 直属 Team。\n\n## User Scenarios & Testing *(mandatory)*\n\n### Technical Scenario 1 - 创建 Team-scoped Agent 行为配置 (Priority: P1)\n\n作为 Team 的 Agent 管理者，我希望创建有稳定身份和名称、但不归属于任何 Project 的 Agent，并只通过 system prompt 定义其执行行为，以便同一 Team 内的 Session 都可以引用同一个行为角色，而不会把 Project、Task 或其他三个启动要素固化进 Agent。\n\n**Why this priority**: 如果 Agent 继续只是 `codex`/`copilot` 的别名，Session 四要素实际上只剩三个；如果 Agent 同时携带 tools、skills 或模型参数，边界又会悄悄长回一个混合配置袋。那当然也能运行，只是无法解释。\n\n**Independent Test**: 在一个 Team 内创建 Agent 并读取其完整配置；可观察字段包含稳定身份、Team ID、名称、system prompt、修订和生命周期元数据，不包含 Project ID、Provider、Runtime、Context、skills、tools、模型参数或凭据。\n\n**Acceptance Scenarios**:\n\n1. **Given** 调用方具备 Team `T1` 的 Agent 管理权限，**When** 以名称和非空 system prompt 创建 Agent，**Then** 平台返回属于 `T1` 的稳定 Agent 身份，不要求或接受 Project 归属字段。\n2. **Given** Team `T1` 已存在 Agent，**When** 调用方读取或列出 Agents，**Then** 管理面按 Team 隔离并完整返回其 system prompt 与非效果元数据，不按 Project 过滤，也不返回任何隐式 Provider、Runtime 或 Context 默认值。\n3. **Given** 同一 Team 的 Session 分别带有 Project、Task、二者同时存在或二者都为空，**When** 它们选择同一个 active Agent，**Then** Agent 本身不被复制、不被重新归属，也不被修改。\n\n---\n\n### Technical Scenario 2 - 以四个正交要素发起 Session (Priority: P1)\n\n作为人类操作者或调用 Agent，我希望发起 Session 前明确解析 Runtime、Provider、Agent、Context 四个要素，以便“在哪里执行”“由哪个执行器执行”“采用什么行为角色”“携带什么上下文”不会由同一个字段含混承担。\n\n**Why this priority**: 这是 Agent 定义能够成立的使用边界，也是 044 已记录但尚未交付的后续契约。\n\n**Independent Test**: 组装两组 Session 发起选择：同一个 Agent 搭配两个不同且可用的 Provider，以及同一个 Provider 搭配两个不同 Agent；平台分别保留四个独立引用，并把正确的 resolved system prompt 交给执行边界。\n\n**Acceptance Scenarios**:\n\n1. **Given** Runtime `R1` 提供 Provider `codex`，且 Agent `A1` 与 Context `C1` 可用，**When** 调用方以 `R1 + codex + A1 + C1` 发起 Session，**Then** 四个选择分别解析，Agent 只贡献 `A1` 当前修订的 system prompt。\n2. **Given** Runtime `R1` 不提供 Provider `copilot`，**When** 调用方选择 `R1 + copilot + A1 + C1`，**Then** Session 在执行开始前失败，系统不得通过 Agent 猜测或替换 Provider。\n3. **Given** Team `T1` 中存在 Project `P1` 与 Task `K1`，**When** 调用方创建四个 Session，分别携带 `projectId=P1`、`taskId=K1`、二者同时存在、二者都为空，**Then** 四个 Session 均可独立创建，且 Project/Task 不改变四要素解析。\n4. **Given** Team `T1` 的 Session 选择 Team `T2` 的 Agent、Project 或 Task，**When** 发起请求到达解析门槛，**Then** 系统因租户不一致失败，且不把任何对象重新归属。\n5. **Given** 四个执行要素中任一项未能解析，**When** 发起请求到达执行门槛，**Then** 系统明确指出缺失或不兼容要素，不使用静默 fallback。\n\n---\n\n### Technical Scenario 3 - 更新 Agent 而不改写历史执行语义 (Priority: P2)\n\n作为 Agent 管理者和 Reviewer，我希望修改 Agent 的 system prompt 只影响之后发起的 Session，而已创建 Session 仍保留其发起时解析的 Agent 修订与 prompt 快照，以便执行证据可复核。\n\n**Why this priority**: 可变 Agent 若没有解析快照，会让同一个 Session 在不同时间看起来使用了不同指令。那会使“复现”成为一种文学体裁。\n\n**Independent Test**: 用 Agent revision 1 创建 Session 选择，随后更新 Agent 为 revision 2；读取旧选择仍得到 revision 1 与原 prompt，新选择得到 revision 2 与新 prompt。\n\n**Acceptance Scenarios**:\n\n1. **Given** Agent 已被一个 Session 解析，**When** 操作者更新其 system prompt，**Then** Agent 修订递增，既有 Session 的 resolved Agent snapshot 不变。\n2. **Given** Agent 被归档，**When** 读取历史 Session，**Then** 仍可审查其 resolved Agent snapshot；新 Session 不得再选择该 Agent。\n3. **Given** 两次并发更新基于同一旧修订，**When** 服务端应用更新，**Then** 至多一次成功，另一次返回明确冲突而不静默覆盖。\n\n### Edge Cases\n\n- system prompt 为空、只包含空白或超过平台显式上限时，创建/更新失败；确切上限在 plan 中根据 Provider 输入限制统一确定。\n- Agent 名称是显示信息而不是身份；所有选择与引用 MUST 使用稳定 Agent ID 消除歧义。名称唯一性或冲突规则由 plan 决定，但不得借此引入 Project Scope。\n- Agent 不存在、已归档、不属于 Session 的 Team，或调用方无权读取时，不得解析为 Session 输入；Project 不得成为 Agent 查找或选择条件。\n- Session 的 `projectId` 与 `taskId` 都为空是有效状态；仅存在任一项或二者同时存在也有效。二者不得相互推导，Task 不得隐式带出 Project。\n- Agent 在 Session 发起与执行之间被更新或归档时，已完成的原子解析结果保持有效；不得在执行时重新读取“最新 prompt”。\n- Runtime 在线但所选 Provider 不可用时，四要素不兼容，不能切换到 Agent 名称暗示的 Provider。\n- Context 中存在 skills 或额外指令文件时，它们仍是 Context 内容，不得反写或持久化为 Agent 的隐藏配置。\n- system prompt 是授权成员可读取的普通配置，不是 SecretProvider；其中不得用来存放凭据或秘密材料。\n\n## Requirements *(mandatory)*\n\n### Functional Requirements — Agent 定义\n\n- **FR-001**: Agent MUST 是独立于 Runtime、Provider 与 Context、直属一个且仅一个 Team、且不归属于任何 Project 的业务配置。\n- **FR-002**: Agent MUST 拥有稳定 ID、不可变 Team ID、显示名称、`systemPrompt`、单调递增 revision、active/archived 生命周期以及创建/更新时间；MUST NOT 拥有 Project ID 或 Project scope discriminator。\n- **FR-003**: Agent 的效果相关可配置字段 MUST 只有 `systemPrompt`。名称、身份、归属、revision、状态与时间属于管理元数据，不得改变执行行为。\n- **FR-004**: Agent MUST NOT 保存或隐式选择 Provider、Runtime、Context、skills、tools、模型、模型参数、资源规格、branch、Task、Session、凭据或授权状态。\n- **FR-005**: `systemPrompt` MUST 是非空、去除首尾空白后仍有内容且长度受显式上限约束的文本；平台 MUST 在持久化前统一校验。\n- **FR-006**: 授权调用方 MUST 能在 Team 边界内创建、读取、列出、重命名、更新 system prompt 与归档 Agent；这些操作 MUST NOT 要求 Project 参数，MVP 不要求硬删除。\n- **FR-007**: 每次 system prompt 变化 MUST 产生新的单调递增 revision；仅重命名不得改变 revision 或执行效果。\n- **FR-008**: 并发更新 MUST 使用可观察的 revision 冲突保护，禁止 last-write-wins 静默覆盖 system prompt。\n- **FR-009**: 归档 Agent MUST 保持可读以支持历史审查，但 MUST NOT 用于新的 Session 发起。\n\n### Functional Requirements — Session 四要素边界\n\n以下条款是 046 对后续 Session 规格施加的前向契约，不表示 046 实现 Session 持久化、创建或执行。046 的实现责任限于：提供无 Project/Task 参数的 active Agent resolver、不可变 Resolved Agent Snapshot，以及可组合但不落库的四要素/可选业务引用共享 schema。\n\n- **FR-010**: Session 进入执行前 MUST 解析且固定四个独立要素：Runtime、Provider、Agent、Context。\n- **FR-011**: Provider MUST 作为独立字段表达 agent CLI / 协议族；任何公共或 Session 发起契约中的 `agent: \"codex\"` / `agent: \"copilot\"` 旧语义均视为过时，当前模型 MUST 分别使用 Provider 选择和 Agent 引用，不保留 pre-0.1 兼容别名。\n- **FR-012**: 所选 Runtime MUST 明确声明所选 Provider 可用；不兼容时 MUST 在执行开始前失败，不得从 Agent 名称或 prompt 推断 Provider，也不得 fallback 到其他 Provider。\n- **FR-013**: 所选 Agent MUST 存在、处于 active 状态且与 Session 属于同一 Team；Agent 选择 MUST 与 Session 的可选 Project/Task 引用无关。\n- **FR-014**: Session 发起时 MUST 原子解析 Agent 当前 revision 与 system prompt，形成不可变的 Resolved Agent Snapshot；后续 Agent 更新或归档不得改变该快照。\n- **FR-015**: Agent system prompt MUST 作为 system-level 行为指令交付；Session objective、Task/Issue 内容和 Context 材料 MUST 保持各自来源，不得拼装回 Agent 配置。\n- **FR-016**: 默认选择策略 MAY 在后续 Session 规格中定义，但任何默认值在执行前 MUST 解析为四个显式结果；本功能 MUST NOT 通过 Project/Task 绑定或静默 fallback 推断 Agent。\n- **FR-017**: Session MUST 直属一个且仅一个 Team，MUST NOT 归属于 Task 或 Project。Session MAY 各自保存最多一个 `taskId` 与最多一个 `projectId`；两者 MUST 可独立为空、独立存在或同时存在，且都 MUST 引用同一 Team 内的对象。\n- **FR-018**: Task MUST 直属一个且仅一个 Team，MUST NOT 归属于 Project。Session 的 `taskId` MUST NOT 推导、要求或覆盖 `projectId`，反之亦然。\n- **FR-019**: 四要素中任一项不存在、不可访问、已归档或彼此不兼容时，平台 MUST 返回稳定、可区分的失败结果，且不得创建可执行的部分 Session。\n\n### Functional Requirements — 管理与安全边界\n\n- **FR-020**: Agent 管理 MUST 首先具备 canonical programmable surface；MCP、CLI 与未来 Web 只能作为同一授权与验证规则的客户端，不得各自解释 Agent 字段。\n- **FR-021**: Agent 的 canonical 管理与读取入口 MUST 按 Team 隔离但不嵌套于 Project；Agent 列表、读取和 Session 选择 MUST NOT 按 Project membership 过滤。\n- **FR-022**: system prompt MUST 被视为同一 Team 内授权调用方可见的普通配置，不得承担 SecretProvider 职责；Agent 响应、审计或错误信息不得附带执行凭据。\n- **FR-023**: Agent 配置 MUST NOT 引入 workflow graph、standing order、子 Agent 层级、自动任务分解、自动重试或平台拥有的编排行为。\n- **FR-024**: 本功能 MUST 使用明确的 Agent / Provider 术语，使 Provider adapter 与 Agent 业务配置在共享契约、管理面和后续 Session 规格中不可混淆；具体符号重命名和 blast radius 由 plan + GitNexus 分析确定。\n\n### Key Entities\n\n- **Agent**: Team-scoped 行为配置。包含稳定身份、不可变 Team 归属、显示名称、唯一效果配置 `systemPrompt`、revision、active/archived 生命周期与管理时间；不包含 Project 关系。\n- **Task**: Team 直属业务意图；不属于 Project。它可被 Session 以 `0..1` 方式引用，但不拥有 Session。\n- **Session**: Team 直属执行对象；不属于 Task 或 Project。它可分别引用 `0..1` 个 Task 与 `0..1` 个 Project，并固定四个执行要素。\n- **Resolved Agent Snapshot**: Session 发起时从 Agent 原子解析出的不可变执行输入，至少包含 Agent ID、revision 与 resolved system prompt。它是 Session 输入投影，不是独立管理对象。\n- **Session Launch Selection**: 四个独立引用 `runtime + provider + agent + context` 的解析结果；本规格只拥有其中 Agent 的定义与交付边界。\n\n## Assumptions & Dependencies\n\n- Team 是 Owner 已明确的租户边界；Agent、Task、Project、Session 都直属 Team。它们之间的引用不得改变这一归属。\n- system prompt 可更新；新 Session 使用新 revision，既有 Session 保留 resolved snapshot。这是可复核执行的默认要求，而不是完整 Agent 版本管理产品。\n- Agent 配置可以在 Session 持久化重新设计前独立交付和管理；真正创建/执行 Session 仍依赖后续 Session 与 Context 规格。\n- `044-host-runtime-daemon` 已定义 Runtime 与 Provider 能力；本功能不修改其注册、发现、可用性或心跳语义。\n- `043-identity-team-rbac` 拥有 Team 租户与授权边界；046 只定义 Agent 的 Team 归属以及 Session 解析时的同 Team 约束。\n- 本功能不是 UI-facing spec；首期以 API/MCP/CLI 可管理和可验证为准，不要求 Agent 管理页或视觉原型。\n\n## Out of Scope\n\n- Context、workspace、worktree、skills、知识文件或 prompt assembly 的完整设计。\n- Session 持久化、生命周期、调度、claim、Runner 分配、取消、结果或 Review evidence。\n- Runtime/Provider 注册、Provider 安装/登录、Provider 版本探测或自动选择。\n- 模型选择、temperature、reasoning effort、token budget、tools、MCP server、hooks、skills 或其他效果调参。\n- Agent marketplace、模板库、继承、组合、多 Agent/子 Agent 层级、自动编排或 standing orders。\n- Agent 密钥、workload identity、Agent 级权限主体或以 system prompt 存放秘密。\n- Web 管理 UI、Agent 测评、A/B test、效果评分、prompt 自动优化或历史 diff 页面。\n\n## Success Criteria *(mandatory)*\n\n### Measurable Outcomes\n\n- **SC-001**: 评审者检查任一 Agent 创建/读取结果时，100% 的效果相关可配置内容只有一个 system prompt；Provider、Runtime、Context、skills、tools 与模型参数均不出现在 Agent 配置中。\n- **SC-002**: 对同一 Agent 搭配两个不同 Provider、以及同一 Provider 搭配两个不同 Agent 的契约测试均能保留四个独立选择，不发生字段复用或隐式推断。\n- **SC-003**: 046 的共享契约测试可表达 Project/Task 两个独立 `0..1` 引用的四种组合，并且四种组合都使用同一个 `agentId` 而不修改 Agent；Agent resolver 对同 Team active Agent 返回 snapshot，对跨 Team、缺失或 archived Agent 返回可区分失败。Runtime/Provider 兼容性与完整 Session 原子创建由后续 Session 规格验证。\n- **SC-004**: Agent system prompt 更新后，所有既有 Session 的 Resolved Agent Snapshot 保持逐字不变；之后发起的 Session 100% 使用新 revision。\n- **SC-005**: 两个并发 system prompt 更新基于同一 revision 时，恰有一个成功，另一个返回可识别冲突；不存在静默丢失更新。\n- **SC-006**: API、MCP、CLI 与共享文档中的抽样术语审计达到 100%：`Provider` 表示 CLI/协议族，`Agent` 表示 system-prompt 行为配置，不再用 `agent` 字段承载 `codex`/`copilot` Provider 键。\n- **SC-007**: 独立 Agent 管理切片可在尚未实现 Session/Context 的环境中完成创建、读取、列出、更新与归档验证，不伪造 Session 执行能力。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：Agent 定义与 Session 选择边界\n\n## 摘要\n\nAgent 是发起 Session 的四个独立要素之一。Runtime 决定在哪里执行，Provider 决定使用哪个 agent CLI / 协议族，Agent 只提供行为角色的 system prompt，Context 提供 workspace、仓库材料、skills 与其他上下文。\n\nAgent 是 Team-scoped 配置，不属于 Project。Session 同样直属 Team，不属于 Task 或 Project；它可以分别携带 `0..1` 个 Task 引用与 `0..1` 个 Project 引用。Agent 可以被更新和归档；每次 Session 发起会固定所选 Agent 的 revision 与 system prompt，使之后的 Agent 修改不改写历史执行语义。\n\n## 功能地图\n\n- Agent 管理：在 Team 边界内创建、读取、列出、重命名、更新 system prompt、归档；不要求 Project 参数。\n- 唯一效果配置：Agent 只有 `systemPrompt` 会影响执行行为。\n- Session 选择：`Runtime + Provider + Agent + Context` 四项分别解析，不互相推断。\n- 兼容性门槛：Runtime 必须提供 Provider；Agent 必须存在、active 且与 Session 同 Team；Agent 不做 Project 归属校验；四项都必须可用。\n- 可选业务引用：Session 的 `taskId?` 与 `projectId?` 彼此独立，均为 `0..1`，二者都不拥有 Session。\n- 可复核执行：Session 固定 Agent ID、revision 与 resolved system prompt。\n\n## 边界\n\n- Agent 不保存 Provider、Runtime、Context、skills、tools、模型参数、凭据或 workflow 行为。\n- `codex`、`copilot` 等是 Provider，不是 Agent。\n- skills、工作目录、仓库材料和知识文件属于 Context，不属于 Agent。\n- 本功能不实现 Session 生命周期、Context 管理、调度、Runner claim 或执行结果。\n- 本功能不提供 Agent UI、marketplace、多 Agent 层级、自动编排或 prompt 优化。\n\n## 分阶段能力图\n\n1. 当前 spec：冻结 Agent 的 Team Scope、system-prompt-only 效果配置、Session 四要素边界，以及 Project/Task 的独立可选引用语义。\n2. Agent 独立切片：交付 canonical API 以及薄 MCP/CLI 管理面，支持创建、读取、列出、更新与归档。\n3. Session/Context 后续规格：接入四要素解析、兼容性校验与 Resolved Agent Snapshot。\n4. 后续可选能力：只有在独立产品规格授权后，才讨论 UI、模板或评测；同一 Team 内跨 Project 使用是当前模型的固有能力，不是后续共享功能。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：Agent 定义与 Session 选择边界\n\n## Owner 评审（非阻塞反馈）\n\n以下项目用于 Owner 后续修改规格，不作为 Specify 完成门禁；未勾选不代表需求缺失或尚未执行验证。\n\n- [x] Owner 已确认 Team 是租户；Agent 直属 Team，不属于 Project。\n- [x] Owner 已确认 Session 直属 Team，不属于 Task 或 Project；`taskId?` 与 `projectId?` 均为彼此独立的 `0..1` 可选引用。\n- [x] Owner 已确认 Task 直属 Team，不属于 Project。\n- [x] 确认 Agent 唯一效果配置为 system prompt；Provider、skills、tools 与模型参数均不进入 Agent。\n- [x] 确认 Session 发起使用 `Runtime + Provider + Agent + Context` 四个独立要素。\n- [ ] 确认 Agent 更新只影响新 Session，历史 Session 保留 resolved prompt snapshot。\n- [ ] 确认首期不做 Agent Web UI、多 Agent 层级或自动 prompt 优化。\n\n## Spec 就绪度\n\n- [x] `spec.md` 已完成且无 `[NEEDS CLARIFICATION]`。\n- [x] requirements checklist 已通过并记录 96/100 评分。\n- [x] Agent / Provider / Runtime / Context 的职责互斥且可测试。\n- [x] Agent 按 Team 隔离且不属于 Project；Session 的可选 Project/Task 引用不参与 Agent 归属。\n- [x] 非目标、依赖、失败关闭和历史可复核语义已记录。\n- [x] clarify-style 结构化歧义扫描完成；0 个关键问题，剩余细节均适合在 plan/research 决定。\n- [x] Specify 阶段完成，下一步为 `/speckit.plan`。\n\n## 后续插件检查\n\n- [ ] `/speckit.plan` 使用 GitNexus 检查历史 `agent` 字段、`agentNameSchema`、Agent adapter 与 Session 输入的 blast radius。\n- [ ] `plan-eng-review` 评审持久化、API/MCP/CLI、授权、revision 冲突与 Session snapshot 边界。\n- [ ] `/speckit.tasks` 仅在工程评审完成或被明确豁免后生成。\n- [ ] 实现前运行 `/speckit.analyze`，检查 044、038 与当前 5xP 术语是否需要同步。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# Prototype\n\n_specs/046-agent-definition/prototype.md is not present for this spec yet._\n\n[Open current standalone prototype](mockups/index.html)","action":{"label":"Open Prototype","href":"mockups/index.html"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# Implementation Plan: Agent 定义与管理面\n\n**Branch**: `046-agent-definition` | **Date**: 2026-08-08 | **Spec**: [spec.md](./spec.md)\n**Input**: Feature specification from `/specs/046-agent-definition/spec.md`\n\n## Summary\n\n046 将 Agent 实现为 Team 直属、与 Project/Task/Session 均无父子关系的业务配置。Agent 的唯一效果配置是 `systemPrompt`；管理元数据包含稳定 ID、名称、revision、active/archived 状态和时间。交付范围包括共享 Zod 契约、Prisma SQLite/PostgreSQL 持久化、`RdbProvider` 能力、canonical HTTP API、薄 MCP/CLI 客户端以及完整契约测试。\n\nSession 执行不在本功能实现：046 只提供 active Agent 的原子解析方法，返回不可变的 resolved snapshot，供后续 Session 规格把它与 Runtime、Provider、Context 三个独立选择组合。Project/Task 只会在后续 Session 上作为彼此独立的可选引用，不进入 Agent 表或 Agent API。\n\n同时直接替换 pre-0.1 的错误术语：公共契约中 `codex`/`copilot` 是 `Provider`，不再使用 `agent` 字段或 `AgentName` 类型承载 Provider 键。该清理不实现 Session 生命周期，也不保留兼容别名。\n\n## Technical Context\n\n**Language/Version**: TypeScript 5.9，Node.js 24.14.0\n**Primary Dependencies**: Next.js 16 Route Handlers、React 19、Zod 4、Prisma ORM/Client 7.9.1、`@prisma/adapter-better-sqlite3`、`@prisma/adapter-pg`\n**Storage**: SQLite 与 PostgreSQL/Supabase-backed PostgreSQL，通过 `RdbProvider` 暴露领域契约\n**Testing**: Vitest 4、共享 schema 单测、双数据库 provider contract、API/MCP/CLI 路由测试、Prisma schema parity\n**Target Platform**: 自托管 Mystra control plane；API/MCP/CLI 优先，无 Web UI\n**Project Type**: TypeScript monorepo / web service + CLI\n**Performance Goals**: Agent 列表默认 50、最大 100 条；所有单记录读写保持一次领域操作内完成；冲突检测不得依赖客户端重试猜测\n**Constraints**: Team 隔离；system prompt 最大 32,768 个字符；无 Project scope；无 SecretProvider；无 pre-0.1 兼容别名；无 Session 持久化伪实现\n**Scale/Scope**: 单 Team 可有数百 Agent；一张 Agent 表、5 个 HTTP 操作、5 个 MCP tools、5 个 CLI 子命令\n\n## Constitution Check\n\n### Pre-design gate\n\n| Gate | Result | Evidence |\n| --- | --- | --- |\n| Team 是租户边界 | PASS | Agent 表只含 `teamId` 外键；API 从 active Team 派生 Team ID |\n| Agent 与 Project 无关 | PASS | schema、API、RDB 方法均不接受 `projectId` |\n| Session/Task/Project 无父子误建模 | PASS | 046 不新增 Session 关系，也不修改 Task/Project 持久化 |\n| Agent 只有 system prompt 效果配置 | PASS | 共享 create/update schema 拒绝 Provider、Runtime、Context、skills、tools、model 等额外字段 |\n| API-first、MCP/CLI thin client | PASS | 共享 schema + RdbProvider 为唯一语义来源；MCP/CLI 不复制字段解释 |\n| Prisma 不泄漏到公共边界 | PASS | Prisma row 只在 DB 模块映射为 `@mystra/shared` 类型 |\n| SQLite/PostgreSQL parity | PASS | 同步 schema、迁移和 parity test |\n| pre-0.1 直接替换 | PASS | `AgentName` Provider 旧命名直接改为 `ProviderName`，不加 alias |\n| 测试先行与可验证交付 | PASS | tasks 要求 schema/provider/API/MCP/CLI 先 RED 后 GREEN |\n\n### Post-design gate\n\nPhase 1 设计没有新增例外。Agent revision 使用数据库条件更新实现 optimistic concurrency；归档是软删除；resolved snapshot 是值对象，不是新表。没有引入服务层框架、事件总线、版本历史表或 Session 占位实现。\n\n## Architecture and Data Flow\n\n```text\nHuman / MCP / CLI\n        |\n        v\nactive Team auth + shared Zod contract\n        |\n        v\ncanonical Agent API / MCP adapter\n        |\n        v\nRdbProvider Agent operations\n        |\n        v\nPrismaRdbProvider ----> SQLite / PostgreSQL\n        |\n        +---- resolveActiveAgent(id, teamId)\n                         |\n                         v\n              ResolvedAgentSnapshot value\n              { agentId, revision, systemPrompt }\n                         |\n                         v\n              future Session launch contract\n              Runtime + Provider + Agent + Context\n```\n\n写路径先读取当前 Agent，在同一数据库事务中比较 Team、status 与 revision，再以 `WHERE id + teamId + revision + status=active` 条件更新。system prompt 真正变化才递增 revision；仅重命名不递增。旧 snapshot 是已返回的不可变值，不会重新读取当前 Agent。\n\n## Public Contract Decisions\n\n- `POST /api/agents`：创建 active Agent；Team ID 只从登录会话解析。\n- `GET /api/agents?limit=&cursor=&includeArchived=`：按 ID 稳定分页列出 active Agent；具备 Team 读取权限的调用方可显式包含 archived。\n- `GET /api/agents/{id}`：同 Team 内读取 active 或 archived Agent。\n- `PATCH /api/agents/{id}`：重命名和/或更新 prompt；必须携带 `expectedRevision`。\n- `POST /api/agents/{id}/archive`：软归档；必须携带 `expectedRevision`。\n- 读取需要 `team.resource.access`；创建、更新、归档需要 `team.settings.manage`。\n- 稳定错误：`AGENT_NOT_FOUND`、`AGENT_ARCHIVED`、`AGENT_REVISION_CONFLICT`、`INVALID_AGENT`。\n- 列表 cursor 是服务器返回的 opaque Agent ID；默认 50，最大 100。\n- system prompt 最大 32,768 字符，允许内部换行和边缘空白，但 `trim()` 后必须非空；存储保留调用方原文。\n\n## Deliberate Non-goals\n\n- 不创建 Session 表、Session API 或执行调度。\n- 不修改 Task、Project 现有持久化关系；其独立 Team 模型由后续修正规格拥有。\n- 不把 Runtime/Provider 可用性判断塞入 Agent RDB 方法。\n- 不提供 Agent Web UI、硬删除、prompt 历史 diff、模型参数、skills 或 tools。\n- 不让 Agent system prompt 进入 SecretProvider。\n\n## Project Structure\n\n### Documentation (this feature)\n\n```text\nspecs/046-agent-definition/\n├── plan.md\n├── research.md\n├── data-model.md\n├── quickstart.md\n├── contracts/\n│   ├── agent-management.md\n│   └── session-selection-boundary.md\n├── checklists/\n│   ├── requirements.md\n│   └── engineering-review.md\n└── tasks.md\n```\n\n### Source Code (repository root)\n\n```text\npackages/shared/src/\n├── agent.ts\n├── schemas.ts\n├── issue.ts\n└── index.ts\n\npackages/agent-adapters/src/\n└── index.ts\n\napps/control-plane/\n├── app/api/agents/\n│   ├── route.ts\n│   └── [id]/\n│       ├── route.ts\n│       └── archive/route.ts\n├── app/api/mcp/route.ts\n├── prisma/\n│   ├── sqlite/schema.prisma\n│   ├── postgresql/schema.prisma\n│   └── migrations/<timestamp>_agent_definition/migration.sql\n└── src/lib/db/\n    ├── rdb-provider.ts\n    ├── prisma-provider.ts\n    ├── prisma-client.ts\n    ├── prisma-mappers.ts\n    └── rdb-provider.contract.ts\n\nscripts/operator-cli.mjs\n```\n\n**Structure Decision**: 复用现有 shared → RdbProvider → Prisma → Route Handler 分层。Agent 是新业务对象，但没有足够理由再制造一个 service package。MCP 与 CLI 只是 canonical contract 的适配器。\n\n## Verification Strategy\n\n1. Shared schema：字段白名单、32,768 上限、空白 prompt、revision 请求、Provider 命名。\n2. Provider contract：Team 隔离、分页、归档可读/不可解析、prompt revision、rename 不增 revision、并发条件更新、snapshot 值稳定。\n3. SQLite/PostgreSQL parity：model/table/index/foreign key 一致；生成客户端成功。\n4. HTTP API：auth、permission、active Team 派生、错误状态、额外字段拒绝。\n5. MCP：tool listing、同一共享 schema、管理权限、稳定错误不泄漏。\n6. CLI：解析、请求路径、stdin/参数行为、human/JSON 输出和退出码。\n7. Terminology audit：代码与公开契约中 Provider 键不再使用 `agent`/`AgentName`。\n8. 全量 `pnpm test`、`pnpm typecheck`、相关 build；完成前运行 GitNexus `detect_changes(compare main)`。\n\n## Complexity Tracking\n\n无 constitution 例外。文件数量较多来自五个既有边界的必要端到端交付，不新增抽象层；唯一新领域对象是 Agent，唯一新持久化模型也是 Agent。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"---\ndescription: \"Task list for 046 Agent definition and management\"\n---\n\n# Tasks: Agent 定义与管理面\n\n**Input**: `specs/046-agent-definition/` 的 spec、plan、research、data-model、contracts、quickstart 与 engineering review\n**Tests**: 本功能改变公共术语、RDB contract、双数据库 schema 和三个可编程入口，所有 story 都要求测试先行。\n**Organization**: US1 交付独立 Agent 管理；US2 清晰固定四要素中的 Agent/Provider 边界；US3 交付 revision、归档与 immutable snapshot。\n\n## Format\n\n- `[P]` 表示不同文件且不依赖未完成任务，可并行。\n- `[US1]`、`[US2]`、`[US3]` 对应 spec technical scenarios。\n- 每个实现任务必须先完成同阶段 RED 测试并观察失败。\n\n## Phase 1: Setup and impact baseline\n\n- [x] T001 [SET] 运行并记录 GitNexus 对既有 `RdbProvider`、`PrismaRdbProvider`、Prisma client wrapper、MCP `POST`、operator CLI `parseArgs/run/usage`、shared Provider schema 与 adapter symbols 的 upstream impact；HIGH/CRITICAL 必须在编辑前报告。\n- [x] T002 [SET] 在 `specs/046-agent-definition/quickstart.md` 对照现有 package scripts 校准精确测试、generate、migrate、typecheck 和 build 命令。\n\n## Phase 2: Foundational shared contracts and terminology\n\n**Purpose**: 建立唯一 Agent 语义来源，并让 Provider 键不再伪装成 Agent。\n\n### RED\n\n- [x] T003 [P] [FND] 在 `packages/shared/src/agent.test.ts` 新增 strict Agent create/update/archive/list/response/snapshot schema 测试：拒绝空白、超 32,768、Project/Provider/Runtime/Context/skills/tools/model/teamId 等额外字段。\n- [x] T004 [P] [FND] 在 `packages/shared/src/schemas.test.ts` 与 `packages/shared/src/issue.test.ts` 将 `codex|copilot` 断言改为 `ProviderName`/`provider`，先观察旧 `agent` 公共字段测试失败。\n- [x] T005 [P] [FND] 在 `packages/agent-adapters/src/index.test.ts` 将 adapter 公共符号断言改为 Provider 命名，先观察旧 AgentAdapter 命名失败。\n\n### GREEN\n\n- [x] T006 [FND] 新增 `packages/shared/src/agent.ts`，实现 Agent 常量、Zod request/record/page/snapshot schemas 与类型；从 `packages/shared/src/index.ts` 导出。\n- [x] T007 [FND] 在 `packages/shared/src/schemas.ts` 和 `packages/shared/src/issue.ts` 直接替换 `agentNameSchema`/`AgentName` 与承载 Provider 键的 `agent` 字段为 `providerNameSchema`/`ProviderName`/`provider`，不保留 alias。\n- [x] T008 [FND] 在 `packages/agent-adapters/src/index.ts`、相关 runner/shared 调用方与测试中将 Provider adapter 符号和属性直接改为 Provider 命名。\n- [x] T009 [FND] 删除无生产调用方的 `apps/control-plane/src/lib/projects/project-defaults.ts`、对应测试和 Project execution-default 残留；将 operator CLI 的旧执行选择 flags 从 `--agent` 改为 `--provider`，移除已不符合 canonical Project contract 的 create 命令，不实现 Session persistence。\n\n**Checkpoint**: Agent 与 Provider 在共享类型层不可混淆；Agent request 只接受名称和 system prompt。\n\n## Phase 3: User Story 1 — Team-scoped Agent CRUD (P1) 🎯 MVP\n\n**Goal**: 授权调用方可以不提供 Project 参数，在 active Team 内创建、列出、读取 Agent。\n\n**Independent Test**: 创建 Agent 后通过 RDB/API/MCP/CLI 读取；返回只有 stable identity、Team、name、systemPrompt、revision 和 lifecycle metadata；另一 Team 看不到。\n\n### RED — persistence\n\n- [x] T010 [P] [US1] 在 `apps/control-plane/src/lib/db/rdb-provider.contract.ts` 增加 create/get/list、Team isolation、稳定分页和重复名称测试，并由 SQLite/PostgreSQL provider suites 共同执行。\n- [x] T011 [P] [US1] 在 `apps/control-plane/src/lib/db/prisma-schema-parity.test.ts` 增加 Agent model/table/field/index/relation parity 断言。\n\n### GREEN — persistence\n\n- [x] T012 [P] [US1] 在 `apps/control-plane/prisma/sqlite/schema.prisma` 与 SQLite migration 新增 Team-owned `Agent` model/table/index，无 Project/Task/Session/Runtime/Provider/Context 字段。\n- [x] T013 [P] [US1] 在 `apps/control-plane/prisma/postgresql/schema.prisma` 与 PostgreSQL migration 新增等价 Agent model/table/index。\n- [x] T014 [US1] 运行 `pnpm db:generate`，更新生成客户端，并在 `apps/control-plane/src/lib/db/prisma-client.ts` 添加受保护 Agent delegate typings/methods。\n- [x] T015 [US1] 在 `apps/control-plane/src/lib/db/prisma-mappers.ts` 添加 dialect-neutral Agent row mapper；在 `apps/control-plane/src/lib/db/rdb-provider.ts` 添加 create/get/list 契约。\n- [x] T016 [US1] 在 `apps/control-plane/src/lib/db/prisma-provider.ts` 实现 Team-filtered create/get/list 与稳定 limit/cursor 分页；更新 SQLite adoption/current-schema 检查中受 Agent 表影响的最小表清单。\n\n### RED/GREEN — canonical HTTP API\n\n- [x] T017 [P] [US1] 在 `apps/control-plane/app/api/routes.test.ts` 先写 create/list/get 的 auth、active Team、permission、strict payload、Team isolation、pagination 与 404 contract 测试。\n- [x] T018 [US1] 新增 `apps/control-plane/app/api/agents/route.ts`，实现 GET list 和 POST create；Team ID 只从 active session 派生，读取/管理权限分别使用既有 RBAC。\n- [x] T019 [US1] 新增 `apps/control-plane/app/api/agents/[id]/route.ts` 的 GET，并在 `apps/control-plane/src/lib/management-http.ts` / shared management error schema 中加入稳定 Agent 错误映射。\n\n### RED/GREEN — MCP and CLI\n\n- [x] T020 [P] [US1] 在 `apps/control-plane/app/api/mcp/route.test.ts` 先写 `mystra_create_agent`、`mystra_list_agents`、`mystra_get_agent` 的 discovery、validation、Team auth 与 permission 测试。\n- [x] T021 [US1] 在 `apps/control-plane/app/api/mcp/route.ts` 接入三个 Agent tools，共用 shared schemas 与 RdbProvider，不复制字段语义。\n- [x] T022 [P] [US1] 在 `apps/control-plane/src/lib/operator-cli.test.ts` 先写 `agents create/list/inspect` 的 argv、请求路径、JSON/human output 与 error exit code 测试。\n- [x] T023 [US1] 在 `scripts/operator-cli.mjs` 实现 `agents create/list/inspect` thin client；新增 `--system-prompt`、`--include-archived` flags。\n\n**Checkpoint**: 在没有 Session/Context 的环境中，US1 Agent 管理切片可独立工作。\n\n## Phase 4: User Story 2 — Agent/Provider 四要素边界 (P1)\n\n**Goal**: Agent resolver 只贡献 snapshot；Provider 仍是 Runtime 能力键，Agent 与 Project/Task 完全无关。\n\n**Independent Test**: 同一 Agent 可与两个 Provider 组成选择，同一 Provider 可与两个 Agent 组成选择；schema 不复用字段、不推断默认值。\n\n### RED/GREEN\n\n- [x] T024 [P] [US2] 在 `packages/shared/src/agent.test.ts` 新增 `sessionExecutionSelectionSchema`/`resolvedAgentSnapshotSchema` 测试：四要素独立、`projectId?`/`taskId?` 为独立业务引用且不进入 Agent；不创建 Session record schema。\n- [x] T025 [US2] 在 `packages/shared/src/agent.ts` 实现仅用于 contract composition 的 strict 四要素 selection 与 optional business references schemas，Provider 字段使用 `providerNameSchema`，Agent 字段使用 UUID `agentId`。\n- [x] T026 [P] [US2] 在 `apps/control-plane/src/lib/db/rdb-provider.contract.ts` 增加 `resolveActiveAgent` 的 Team isolation、无 Project 参数、snapshot exact fields 测试。\n- [x] T027 [US2] 在 `apps/control-plane/src/lib/db/rdb-provider.ts` 与 `apps/control-plane/src/lib/db/prisma-provider.ts` 实现 active-only `resolveActiveAgent(agentId,{teamId})`，不接受/推断 Runtime、Provider、Context、Project 或 Task。\n\n**Checkpoint**: 046 已提供未来 Session 需要的 Agent-owned resolver seam，但没有伪造 Session lifecycle。\n\n## Phase 5: User Story 3 — Revision, archive, immutable snapshot (P2)\n\n**Goal**: prompt 更新只影响未来解析；rename 不增 revision；并发写冲突可观察；archived Agent 可审查但不可新选。\n\n**Independent Test**: 解析 revision 1 snapshot，更新为 revision 2 后旧值逐字不变；同 revision 两次并发 prompt 更新恰有一次成功；归档后 GET 成功、resolve 失败。\n\n### RED — provider and API\n\n- [x] T028 [P] [US3] 在 `apps/control-plane/src/lib/db/rdb-provider.contract.ts` 增加 rename/prompt revision、same-prompt、stale conflict、并发 update、archive/idempotent read、archived resolve 与 snapshot stability 测试。\n- [x] T029 [P] [US3] 在 `apps/control-plane/app/api/routes.test.ts` 增加 PATCH/archive 的 expectedRevision、409 error、rename-only revision、archived GET/list 测试。\n\n### GREEN — provider and API\n\n- [x] T030 [US3] 扩展 `apps/control-plane/src/lib/db/rdb-provider.ts`、`prisma-client.ts` 与 `prisma-errors.ts` 的 update/archive/error contracts。\n- [x] T031 [US3] 在 `apps/control-plane/src/lib/db/prisma-provider.ts` 用 transaction + conditional update 实现 update/archive；区分 not found、archived、revision conflict，禁止 lost update。\n- [x] T032 [US3] 扩展 `apps/control-plane/app/api/agents/[id]/route.ts` 实现 PATCH；新增 `apps/control-plane/app/api/agents/[id]/archive/route.ts`，返回稳定 404/409/400。\n\n### RED/GREEN — MCP and CLI\n\n- [x] T033 [P] [US3] 在 `apps/control-plane/app/api/mcp/route.test.ts` 增加 update/archive、settings permission、revision conflict 与 archived error tests。\n- [x] T034 [US3] 在 `apps/control-plane/app/api/mcp/route.ts` 实现 `mystra_update_agent` / `mystra_archive_agent`。\n- [x] T035 [P] [US3] 在 `apps/control-plane/src/lib/operator-cli.test.ts` 增加 `agents update/archive` 的 expected revision、payload、输出与 exit code tests。\n- [x] T036 [US3] 在 `scripts/operator-cli.mjs` 实现 `agents update/archive`。\n\n**Checkpoint**: US1–US3 均可独立验证；Agent 管理和 snapshot seam 完整。\n\n## Phase 6: Polish, analysis and closeout\n\n- [x] T037 [P] [POL] 运行 `rg` 术语审计：公共/shared/API/MCP/CLI 中不再用 `agent` 字段承载 `codex|copilot`；Agent schema 不含 Project/Task/Session/Runtime/Provider/Context/skills/tools/model。\n- [x] T038 [P] [POL] 运行 targeted tests、双 provider contract、schema parity、`pnpm typecheck`、`pnpm build` 与 `git diff --check`；PostgreSQL 无凭据时明确记录 skip。\n- [x] T039 [POL] 运行 GitNexus `detect_changes(scope=compare,base_ref=main)`，审查 unexpected symbols/flows；按 `code-review-and-quality` 完成多轴 review 并修复发现。\n- [x] T040 [POL] 按 `specs/046-agent-definition/quickstart.md` 执行可用的真实 SQLite/API/CLI smoke path；不将端口监听冒充 HTTP/内容验证。\n- [x] T041 [POL] 刷新 `specs/046-agent-definition/index.html`、`specs/spec-status.md` 与 Spec-Kit/GitNexus 状态，将 046 标为完成并记录实际验证证据。\n\n## Dependencies and execution order\n\n- Setup → Foundational → US1 persistence/API → US2 resolver boundary → US3 mutations/lifecycle → Polish。\n- T003–T005 是 RED；T006–T009 前不得把对应测试改回绿色预期。\n- T010/T011 必须先失败；T012–T016 才可实现持久化。\n- T017/T020/T022 必须分别先失败；随后才实现 HTTP/MCP/CLI。\n- US2 依赖 Agent schema 与 persistence，但不依赖 Session。\n- US3 依赖 US1 create/get 与 US2 resolver。\n\n## Traceability\n\n- US1 / FR-001~009, FR-020~023 / SC-001, SC-007 → T003, T006, T010~T023。\n- US2 / FR-010~019, FR-024 / SC-002, SC-003, SC-006 → T004~T009, T024~T027, T037。\n- US3 / FR-007~009, FR-014 / SC-004, SC-005 → T028~T036。\n- Security/performance/verification → T010, T016~T023, T037~T041。\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
