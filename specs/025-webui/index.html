    <script id="spec-data" type="application/json">{"feature":"025-webui","title":"025-webui","prototypeHref":"mockups/index.html?v=1785760071700","generatedAt":"2026-08-06T09:40:50.423Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：MVP 操作 Web UI 框架\n\n**Feature Branch**: 已合并到本地 `main`，保留逻辑 feature id `025-webui`\n**Created**: 2026-05-19  \n**Status**: Draft  \n**Input**: 用户描述：“简单补充 025 的 spec，作为 mvp 版本的操作 ui”；后续范围决策：`025-webui` 只聚焦前端框架层，并纳入主题/design-system、国际化、主侧边栏、共享 layout、基础组件、响应式和未来 Electron 兼容边界。2026-08-05 owner 明确要求 demo/PR 平移 Castrel UX 的结构、密度与交互模式：主菜单为 `New`、`Search`、`Inbox`、`Issues`、`Automations`，其下是 Projects 与按 Project 分组的 Tasks；具体配色采用 dark-tech design system，默认 UI 字号为 12px。随后 owner 要求将当前页面实际使用的 Castrel v2 组件迁移并替换现有页面原语，尤其保证 padding 与配色通过主题 token system 实现。2026-08-06 owner 进一步要求 New 页面使用放大的独立 Logo、统一 `Project` 术语和共享 dropdown，并用 Project 选定后出现的 Issue 卡片列表替代 Issue select；随后要求从主菜单移除 `Automations`，并把 `/automations` 清空为只显示 `Coming soon` 的直接访问占位页。Appearance 后续必须迁入本机当前 Codex 发布包的全部内置主题，并把原 Graphite 正式命名为 Mystra，提供同一 `codeThemeId` 下的明暗双变体。随后 owner 明确共享布局必须由 `Sidebar`、`Main`、可选 `Right Panel` 三列组成，三列分别拥有自己的 Header 与 Content，页面可按需注册 Right Panel，未注册时不得占用主区域宽度。\n\n2026-08-06 后续字体决策：内部统一为 UI / Content / Code 三个角色；Codex v1 导入保持原 schema，并把 `fonts.ui` 同步到 Content。Mystra 自有主题分别使用常见单一 primary family，平台 fallback 由浏览器/system generic 负责。\n**Consolidation**: 2026-08-03 起，025 是唯一保留的未完成 UI spec；原 `026`–`031` 的页面探索材料并入 025，已完成的 035/036 对象页继续作为当前代码事实。025 的 shell 实施将显式迁移现有导航，而不是假装当前代码已经采用目标 taxonomy。\n\n## 用户场景与测试 *(mandatory)*\n\n### 用户故事 1 - 操作员使用已批准的 Shell 框架（优先级：P1）\n\n作为内部操作员，我希望 MVP UI 提供稳定的 shell、已批准的顶层导航和共享页面框架，以便我能识别 Mystra 的人类操作界面，同时不让 shell 拥有页面级业务行为。\n\n**优先级原因**：第一个有用的 UI 切片是框架本身：导航、布局、路由框架和共享 chrome。Mystra 仍然以 API 为真相，并保持 agent-first；shell 应先存在，而不是让任意一个页面先变成产品本体。\n\n**独立测试**：在桌面和窄视口打开应用，确认 shell 只暴露已批准的顶层菜单，为每个路由提供一致页面框架，并且不依赖页面级功能先实现才能可用。\n\n**验收场景**：\n\n1. **前提** 操作员打开应用 shell，**当** 主导航渲染，**则** primary navigation 依次且只包含 `New`、`Search`、`Inbox` 和 `Issues`；其下显示 Project list，再下方的 Tasks section 按 Project 分组显示 Task，`Settings` 作为底部 shell action 打开 modal；直接访问 `/automations` 时只显示 `Coming soon`。\n2. **前提** 操作员在已批准路由之间切换，**当** 每个路由加载，**则** shell 提供一致的导航、页面框架和共享视觉结构，即使该页面的专属 feature spec 尚未实现。\n3. **前提** 某个已批准页面目前只有框架级支持，**当** 操作员打开它，**则** UI 可以显示占位或只读框架内容，而不是发明属于后续实现切片的页面行为。\n\n---\n\n### 用户故事 2 - 后续页面实现切片接入 Shell 而不重新定义 Shell（优先级：P1）\n\n作为未来的 Mystra agent 或前端维护者，我希望页面级工作落在稳定的 shell 合同之后，以便 `New`、`Search`、`Inbox`、`Issues`、Project-grouped Tasks、`Settings` 和不在主菜单中的 `/automations` 占位路由可以在同一 025 边界内按独立实现切片演进，而不反复改变产品分类或共享 UI 所有权边界。\n\n**优先级原因**：页面功能需要拆成独立实现切片。025 必须定义什么属于框架、什么必须延后，否则下一个 agent 会再次即兴发挥。非常可预期。也非常不必要。\n\n**独立测试**：审查 shell 合同，确认后续页面实现切片可以向某个已批准路由添加具体内容，而不改变顶层导航、管理面层级或 shell 级偏好设置。\n\n**验收场景**：\n\n1. **前提** 后续实现切片定义具体的 `Recent Sessions` 行为，**当** 实现该工作，**则** 它接入现有已批准 shell 的 secondary route，而不是添加新的主导航入口或替换 shell 所有权。\n2. **前提** 某个页面能力需要新数据、动作或视觉解释，**当** 指定该能力，**则** 它由 025 中明确的实现切片拥有，而不是悄悄扩张 shell 任务。\n3. **前提** shell 框架已经存在，**当** 后续页面实现切片增量到来，**则** 它们可以独立交付，而不迫使全局导航、布局原语或共享偏好设置重设计。\n\n---\n\n### 用户故事 3 - 操作员跨设备、主题和语言环境使用 Shell（优先级：P2）\n\n作为内部操作员，我希望 shell 框架处理响应式导航、外观、主题和语言环境脚手架，以便后续页面实现切片继承可用的横切基础，而不是每个页面重新发明一遍。\n\n**优先级原因**：响应式、视觉偏好和本地化属于框架问题，应在 shell 层解决一次，而不是每个页面重复争论。\n\n**独立测试**：在窄视口和宽视口打开 shell，切换 light/dark 外观、主题和语言环境，确认即使页面级功能仍是占位，shell 也保持可用。\n\n**验收场景**：\n\n1. **前提** 操作员使用窄视口，**当** 在已批准路由之间导航，**则** shell 仍可使用，且主要导航策略不是横向滚动。\n2. **前提** 操作员切换 light/dark 外观或主题，**当** shell 重新渲染，**则** 共享导航和页面框架在所有已批准路由中保持视觉一致。\n3. **前提** 操作员切换语言环境，**当** 再次访问 shell，**则** 共享导航和框架自有文案显示所选语言或可预测 fallback。\n4. **前提** 操作员将主题模式设为 `System`，**当** 操作系统明暗偏好变化，**则** shell 在不刷新页面的情况下使用分别配置的浅色或深色主题。\n5. **前提** 操作员分别选择浅色主题和深色主题，**当** 在 `System`、`Light`、`Dark` 间切换，**则** 每种模式使用对应 variant 的主题，不接受跨 variant 的无效 theme id。\n6. **前提** 操作员调整边缘线模式、代码表面明暗、对比度、字体或字号，**当** 控件值变化，**则** Settings 预览与整个 shell 即时反映结果，并可把主题细节复位为当前主题默认值。\n7. **前提** 当前版本没有服务端 Appearance persistence，**当** 操作员刷新同一浏览器，**则** 有效设置从 localStorage 恢复；损坏或过期值回退为安全默认值，且不得创建 API 或 RDB 写入。\n8. **前提** 维护者提供 `codex-theme-v1:{...}` 字符串，**当** Mystra 解析并应用该主题，**则** `codex-theme-v1` 只作为 schema version，JSON 内 `codeThemeId` 作为主题 ID，payload 可无损序列化回同一 v1 格式；未知 schema version、额外 synthetic `id` 或非法 payload 必须被拒绝。\n9. **前提** 操作员打开 Appearance 的亮色或暗色主题选择器，**当** 查看可选项，**则** 本机 Codex 26.730.61639 注册的 28 个主题族、43 个受支持变体全部可选，Mystra 另以同一 `codeThemeId: \"mystra\"` 提供 light/dark 两个变体。\n10. **前提** 维护者导入一个合法 Codex v1 theme，**当** Mystra 建立内部字体角色，**则** `theme.fonts.ui` 的首个 primary family 同步到 UI 与 Content，`theme.fonts.code` 同步到 Code；v1 JSON 不得新增 `content` 字段。\n\n---\n\n### 用户故事 4 - 前端维护者复用共享布局和组件（优先级：P2）\n\n作为前端维护者，我希望 shell 框架提供主侧边栏、共享 layout archetype 和与 Mystra design-system 方向一致的基础组件层，以便后续页面实现切片能组合一致 UI，而不是临时重建结构和原语。\n\n**优先级原因**：如果框架现在不拥有 sidebar、layout mode 和 base components，每个后续页面实现切片都会从侧门把框架决策塞回来。这并不优雅，只是可预测。\n\n**独立测试**：审查 shell 合同，确认后续页面实现切片可以选择已批准 layout archetype 和共享基础组件，而不用重新定义 sidebar、token model 或基础交互模式。\n\n**验收场景**：\n\n1. **前提** 操作员使用 shell，**当** 显示导航，**则** 主侧边栏仍是已批准顶层路由的共享主导航容器。\n2. **前提** 后续页面实现切片需要会话式、仪表盘式或阅读式界面，**当** 实现它，**则** 它可以接入 `chatLayout`、`dashboardLayout` 或 `readLayout`，而不是默认发明新的顶层框架模型。\n3. **前提** 后续页面实现切片需要按钮、输入框、badge、panel、list 或类似原语，**当** 实现它，**则** 它可以依赖框架共享组件层和 design-system 对齐，而不是引入无关视觉语法。\n4. **前提** 当前 025 表面已经存在页面级 action、surface、field、dialog 和 state，**当** Castrel v2 组件迁移完成，**则** shell、New、Search、Inbox、Issues 与 Settings 都消费 Mystra-owned 共享组件，且 padding、颜色、border、focus、height 与 radius 可追溯到主题 token。\n5. **前提** 页面需要补充上下文、检查器或页面级操作，**当** 页面注册 Right Panel，**则** shell 在 Sidebar 与 Main 之外渲染拥有独立 Header/Content 的第三列；页面未注册或离开该路由时第三列消失，Main 自动恢复全部可用宽度。\n\n---\n\n### 用户故事 5 - 未来桌面封装保留同一框架合同（优先级：P3）\n\n作为未来 Mystra 维护者，我希望 shell 框架与后续 Electron wrapper 兼容，以便 Mystra 可以获得桌面 shell，而不用重写导航、布局、主题、本地化或基础组件合同。\n\n**优先级原因**：owner 明确希望未来兼容 Electron。这应被视为框架切片的架构护栏，而不是发布前一周添加的道歉。\n\n**独立测试**：审查框架要求，确认 shell concern 的表达既能运行在当前 web delivery 形态中，也能兼容未来 Electron-hosted shell。\n\n**验收场景**：\n\n1. **前提** Mystra 当前以 web control-plane UI 交付，**当** 实现 shell 框架，**则** 它不假设浏览器唯一产品模型，以至于未来 Electron 需要重新设计路由分类、主题处理或布局所有权。\n2. **前提** 未来 Electron shell 包裹同一前端，**当** 迁移发生，**则** 主侧边栏、共享布局、i18n 和主题系统保持可复用，而不是成为 web-only 特例。\n3. **前提** 某个框架能力确实依赖 host 环境，**当** 指定或实现它，**则** 环境特定 seam 必须显式存在，而不是藏在共享 shell 行为内部。\n\n---\n\n### 边界情况\n\n- 当已批准页面还没有专属 feature spec 时怎么办？shell 仍应渲染有效路由，显示占位或只读框架，而不是省略路由或发明页面语义。\n- 当页面级后端能力尚不足以支持编辑或实时数据时怎么办？框架可以保持 inspection-first，不应伪装为已完成产品行为。\n- 当小屏导航空间不足时怎么办？shell 应保留所有已批准菜单入口，而不是为移动端创造不同产品分类。\n- 当选中主题或语言环境不完整时怎么办？shell 应可预测 fallback，同时保持导航可理解。\n- 当 localStorage 中 Appearance JSON 损坏、字段越界或引用错误 variant 的主题时怎么办？主题模型应逐字段 normalize，并回退到对应 variant 的有效默认主题，不能让首帧脚本或 React hydration 崩溃。\n- 当 `System` 模式下操作系统明暗偏好在页面打开后变化时怎么办？shell 应监听 `prefers-color-scheme` 并即时重新解析 active theme，同时在组件卸载时移除监听。\n- 当旧版 localStorage 保存的是 `notion-light`、`notion-dark`、`linen-light` 或 `graphite-signal` synthetic preset id 时怎么办？解析必须按 variant 迁移为有效 canonical `codeThemeId`，其中 `graphite-signal` 迁移到 `dark:mystra`，并让首帧 bootstrap 与 hydration 后解析得到相同结果。\n- 当本机 Codex 发布版本更新主题目录时怎么办？Mystra 不在运行时读取应用包；维护者必须以明确版本重新提取、测试并更新静态 catalog，不能悄悄混合不同 Codex 版本的主题事实。\n- 当页面形态不明显适配 `chatLayout`、`dashboardLayout` 或 `readLayout` 时怎么办？默认映射到已批准 archetype，除非 025 的后续变更证明需要新的框架级 layout。\n- 当页面设计偏离共享 design system 时怎么办？页面应论证对框架的扩展，而不是静默绕过共享 token 和原语。\n- 当未来 Electron host 引入桌面专属 affordance 时怎么办？框架应保持共享 UI 合同可移植，并把 host-only 行为隔离在显式 seam。\n- 当后续页面实现切片试图引入新的主菜单或 UI-owned 管理语义时怎么办？该变化超出既定 shell 范围，必须先更新 025 并对照项目管理面层级证明。\n- 当注册 Right Panel 的页面卸载或导航到不使用 Right Panel 的页面时怎么办？shell 必须同步清理旧 panel，不得保留跨路由的陈旧标题、内容或宽度。\n- 当窄视口无法同时容纳 Main 与 Right Panel 时怎么办？Right Panel 必须按共享响应式规则堆叠到 Main 之后，并且不得制造 page-wide 横向滚动。\n\n## 需求 *(mandatory)*\n\n### 功能需求\n\n- **FR-001**: 系统 MUST 提供内部 MVP web UI 框架，作为 Mystra 现有管理能力之上的二级操作与 inspection shell。\n- **FR-002**: MVP demo UI 的 primary navigation MUST 依次且只包含 `New`、`Search`、`Inbox` 和 `Issues`；`Automations` MUST NOT 出现在主菜单中；`Settings` MUST 是底部 shell action/modal。\n- **FR-003**: 本 spec MUST 只拥有 shell 级 concern，包括已批准导航、路由框架、共享布局结构、共享视觉语言、shell-wide preference plumbing 和未来兼容 host-shell 边界。\n- **FR-004**: 本 spec MUST NOT 把页面探索材料伪装为已实现产品行为；`New`、`Search`、`Inbox`、`Issues`、`Settings` 或 Project-grouped Tasks 的具体行为 MUST 作为 025 内独立实现切片明确计划和验证，`/automations` 在对应实现切片出现前 MUST 保持占位状态。\n- **FR-005**: 每个已批准 navigation surface MUST 有路由或等价 shell entry，以便在页面级功能实现前导航模型已经具体。\n- **FR-006**: 当某个已批准路由的专属 feature spec 尚未落地时，shell MUST 允许该路由渲染 placeholder、unavailable 或 read-only 框架内容。\n- **FR-007**: shell MUST 提供主侧边栏，作为已批准 primary routes 与 Project-grouped Tasks 的共享导航容器。\n- **FR-008**: shell MUST 定义并拥有三个核心 layout archetype：`chatLayout`、`dashboardLayout` 和 `readLayout`。\n- **FR-009**: 后续页面级 spec MUST 默认组合到 `chatLayout`、`dashboardLayout` 或 `readLayout`，除非单独论证的框架变更扩展已批准 layout 集合。\n- **FR-010**: shell MUST 为各已批准路由使用的常见 UI 原语提供共享基础组件层。\n- **FR-011**: 基础组件层和 shell 视觉语言 MUST 与 Mystra 的 Claude design-system 方向保持一致，以便主题、token 和组件行为在框架内一致。\n- **FR-011a**: 当前 025 表面使用的 Castrel v2 通用组件 anatomy、density、padding 和交互状态 MUST 迁移到 Mystra-owned 共享组件；Castrel palette、业务 API 和未使用的领域组件 MUST NOT 被机械复制。\n- **FR-011b**: shell、New、Search、Inbox、Issues 与 Settings 的可见 color、background、border、focus、padding、gap、height 和 radius MUST 通过 semantic theme token 消费，非 4px 特殊值 MUST 使用命名 token。\n- **FR-012**: shell MUST 为导航、页面框架和共享交互模式提供跨路由一致结构，而不是让每个页面定义不兼容 shell。\n- **FR-013**: shell MUST 在支持的窄视口和宽视口中提供共享响应式行为。\n- **FR-014**: shell MUST 支持 light mode 和 dark mode。\n- **FR-015**: 当产品定义不同视觉主题时，shell MUST 支持超出 light/dark 外观模式的主题切换。\n- **FR-016**: shell MUST 支持国际化，使已批准导航和框架自有文案可以用受支持语言或可预测 fallback 呈现。\n- **FR-017**: shell MUST 保持项目管理面层级：API 为真相，skill/MCP 和 CLI 仍是优先 programmable interfaces；UI 框架 MUST NOT 成为管理语义的唯一 owner。\n- **FR-018**: shell MUST 将 workspace 视为 session-scoped execution-context 概念，MUST NOT 用 workspace 表示 hosted product structure 的 tenancy。\n- **FR-018a**: Settings MUST 按 `Account`、`Appearance`、`Team`、`Integrations` 四个 Tab 组织；Theme 与 Language MUST 归入 `Appearance`，租户术语 MUST 使用 `Team`。当前 MVP 不支持的 Account 或 Team 写操作 MUST 显示为 read-only/unavailable，不得由 UI 伪造持久化。\n- **FR-019**: MVP shell 框架 MUST 保持 private-operations focused，MUST NOT 在可用前要求 caller auth、logs API、retry API、public SaaS tenancy management 或其他当前 out-of-scope platform features。\n- **FR-020**: 025 的后续页面实现切片 MUST 能在不改变已批准 navigation taxonomy 或 shell-level ownership model 的前提下，为某个已批准 surface 添加路由内容、动作和数据呈现。\n- **FR-021**: shell 框架 MUST 保持与未来 Electron host 的兼容性，使导航、layout archetype、theme system、internationalization 和 base components 可复用，而无需重新定义框架合同。\n- **FR-022**: 未来 Electron shell 所需的任何环境特定行为 MUST 被隔离在显式 seam 之后，而不是作为 web-only 假设嵌入共享框架合同。\n- **FR-023**: shell 默认 UI 字号 MUST 为 12px，sidebar menu row MUST 使用 28px 紧凑行高和 token-derived hover/selected state。\n- **FR-024**: Tasks section MUST 按 Project 分组；每个 Task 的 icon MUST 表达其最新 Session 状态，无 Session 时使用明确的 idle icon。\n- **FR-025**: `/automations` 在本 demo/PR 切片中 MUST 是不出现在主菜单中的直接路由，页面 MUST 只显示 `Coming soon`，且 MUST NOT 引入 workflow API、持久化、配置入口或平台编排语义。\n- **FR-026**: shell MUST 平移 Castrel UX 的结构、密度、层级与交互模式，并以 dark-tech design system 作为具体颜色来源：canvas `#111513`，surface `#181C1A` / `#202522` / `#2B312D`，ink `#E7ECE8` / `#AAB4AD` / `#76817A`，executor `#74B98B`，以及已批准 signal colors；统一使用等宽字体、0/2/4/6px radius、flat elevation，且不得使用 gradient、glow、glass 或 noise。\n- **FR-027**: `New` surface MUST 在主内容区域居中显示放大的独立产品 Logo，不得在 Logo 右侧重复产品文案。Task composer MUST 保持默认 3 行输入高度、无分隔线且透明的 ghost footer，并在 Castrel 9/7/7/9px 基础 inset 上补偿右侧与底部 2px，使 textarea、footer controls 与 32px send action 的有效视觉 inset 四边一致。footer 左侧 MUST 提供附件和由 Mystra-owned shared dropdown 实现的 `Project` control，右侧 MUST 提供语音输入和发送 controls；不得用 `Repository` 指代 Project。Project 选定前不得呈现 Issue selector；选定后 MUST 在输入框下方加载该 Project repository scope 内的 Issue 卡片列表，卡片 MUST 可选择并通过既有 Issue dispatch API 创建对应 Task/initial Session。不得显示无行动价值的 Project 配置引导文案；未被现有 API contract 支持的 control MUST 清楚表现为不可用，不得伪造提交成功。\n- **FR-028**: `Search` MUST 以 modal 形式覆盖当前 route，并支持按 Task id、objective、Issue、repository 或最新 branch 过滤和导航。\n- **FR-029**: 主侧边栏 MUST 支持显式收起与展开，并持久化该 preference；收起状态 MUST 将侧边栏完整压缩为 0px 并移除其交互命中，不得保留 icon rail。此时主区域 header MUST 提供 Mystra brand、`New` action 与重新展开 control。\n- **FR-030**: primary navigation 之后 MUST 显示 Projects section，且 Project item MUST 导航到对应 Project detail route；Projects 与 Tasks section heading MUST NOT 显示 count，Projects heading 右侧 MUST 提供 ghost-style add Project action；Project-grouped Tasks 继续作为其后的独立 section。\n- **FR-031**: `Inbox` MUST 使用标准 master-detail 布局：左侧为最新 Session 处于 `waiting_for_review` 的 Task 卡片列表，右侧为当前选中 Task 的只读详情；`Issues` 继续使用当前 Task table。Inbox 列表 MUST 支持搜索、刷新、明确选中态、加载态、空态与窄视口降级，右侧详情 MUST 提供进入完整 Task 对象页的入口。\n- **FR-032**: `Appearance` MUST 迁移 Castrel 的外观能力模型：`System` / `Light` / `Dark` 模式、分别配置的浅色与深色主题、`Default` / `High Contrast` / `Color High Contrast` 边缘线模式、代码与终端表面的浅色/深色 variant，以及 Theme Details 中的预览、对比度、UI/Content/Code 字体、UI/Content 字号和复位动作。所有控件 MUST 使用 Mystra-owned 共享原语、双语文案和 semantic theme token，不得复制 Castrel palette、Zustand、`next-themes` 或业务服务依赖。\n- **FR-033**: 本切片的 Appearance preference MUST 只保存在当前浏览器 localStorage，并在 hydration 前应用有效保存值以避免错误主题闪烁。解析 MUST 对损坏 JSON、未知字段、越界数值、无效 mode/border/variant 和跨 variant theme id fail closed 到可预测默认值。不得新增 Appearance API、RDB schema、server action 或伪造跨设备同步；未来数据库存储属于独立 contract change。\n- **FR-034**: 主区域 header MUST 只显示当前 surface title，不得显示 `local control plane`、`本地控制平面` 或等价环境说明。\n- **FR-035**: Theme import/export contract MUST 完全兼容 `codex-theme-v1:{JSON}`。冒号前的 `codex-theme-v1` 是 schema version，不是主题 ID；JSON payload MUST 且只能包含 `codeThemeId`、`theme`、`variant`，其中 `codeThemeId` 是 canonical theme id。Mystra display metadata 与 explicit token extensions MUST 保持在该 payload 之外；未知 version、额外 `id`、字段缺失、非法 variant/contrast/font/color 值 MUST fail closed。\n- **FR-036**: Appearance 的 `lightThemeId` / `darkThemeId`、Settings option value、运行时 dataset 和 hydration bootstrap MUST 使用 `codeThemeId`。同一 `codeThemeId` MAY 分别提供 light/dark variant，查找时 MUST 使用 `(variant, codeThemeId)`；旧 synthetic preset id MUST 仅作为受限本地迁移输入，不能继续成为输出合同。\n- **FR-037**: Mystra MUST 从明确记录版本的本机签名 Codex 应用包迁移全部已注册内置主题族与其实际支持的 light/dark variant。catalog MUST 保留 Codex `codeThemeId`、variant 和完整 v1 theme payload，且 MUST NOT 以社区列表、主题名称猜测或未标版本的数据替代来源事实。\n- **FR-038**: Mystra 自有主题 MUST 使用 canonical `codeThemeId: \"mystra\"` 并同时提供 light/dark variant。dark variant MUST 保留原 Graphite explicit tokens；light variant MUST 使用同一矿物灰、绿色强调和 restrained semantic signal 视觉语法。旧 `graphite-signal` 只作为 `dark:mystra` 迁移输入。\n- **FR-039**: 内部 theme adapter MUST 暴露 UI / Content / Code 三个字体角色，每个角色只允许一个 normalized primary family；运行时 MUST 分别追加 `system-ui, sans-serif`、`ui-serif, serif`、`ui-monospace, monospace` fallback。Mystra 两个 variant MUST 使用 UI=`Arial`、Content=`Georgia`、Code=`Courier New`。Codex v1 导入 MUST 将 `theme.fonts.ui` 同步到 UI 与 Content，将 `theme.fonts.code` 映射到 Code，并保持外部 payload exact round-trip。旧 `chatFont` / `chatFontSize` 与原 Graphite family stack MUST 在 localStorage normalization/bootstrap 边界迁移。\n- **FR-040**: 全局 shell MUST 将可视结构表达为 `Sidebar`、`Main` 与可选 `Right Panel` 三列；每列 MUST 分别包含语义明确的 Header 与 Content。页面 MUST 通过共享 page-owned seam 显式注册 Right Panel header/content；缺省、卸载或跨路由清理后 Right Panel MUST 不渲染且不占 grid 宽度。桌面宽视口使用右侧列，`<=700px` 时 Right Panel MUST 堆叠到 Main 之后。Task 详情 MUST 作为首个接入页面，将 `Create Session` 表单放入 Right Panel，而不改变 canonical Session API。\n\n### 关键实体\n\n- **Operations Shell**: 组织顶层导航和共享页面框架的框架级 UI 容器。\n- **Main Sidebar**: 已批准顶层路由的共享主导航栏。\n- **Navigation Model**: 已批准顶层菜单集合及其路由身份。\n- **Page Frame Contract**: 后续页面级 spec 添加内容时继承的共享 shell 结构。\n- **Layout Archetypes**: 已批准框架布局 `chatLayout`、`dashboardLayout` 和 `readLayout`。\n- **Base Component Layer**: 各路由共享的 UI 原语和交互模式集合。\n- **Theme System**: 框架拥有的主题、token 和外观模型，与 Mystra Claude design-system 方向对齐。\n- **Shell Preferences**: 框架拥有的 appearance、theme、locale 和其他跨路由共享 UI 设置。\n- **Project-grouped Tasks**: 侧边栏中的 Task 导航列表，按 Project 聚合，并用最新 Session 状态决定 Task icon。\n- **Placeholder Route State**: 已批准页面在专属 feature spec 尚未实现时的有效 shell-level 状态。\n- **Host Shell Compatibility Boundary**: 保持共享 UI 可在当前 web host 与未来 Electron host 之间移植的框架约束。\n\n## 成功标准 *(mandatory)*\n\n### 可衡量结果\n\n- **SC-001**: MVP demo UI 的 primary navigation 只暴露 `New`、`Search`、`Inbox` 和 `Issues`；其下依次显示 Project list 和 Project-grouped Tasks，`Settings` 保持底部 shell action 语义；`/automations` 直接访问时只显示 `Coming soon`。\n- **SC-002**: shell 提供主侧边栏以及已批准的 `chatLayout`、`dashboardLayout` 和 `readLayout` archetype，作为后续页面实现切片可复用框架原语。\n- **SC-003**: shell 提供 Castrel-derived UX 结构与共享 dark-tech 默认配色、英语/简体中文切换、12px 默认字号、基础组件和响应式行为；dark-tech 源 token 可由自动测试逐项验证，后续页面实现切片无需重新定义。\n- **SC-004**: 操作员可访问每个已批准 navigation surface，并看到一致的 shell-valid 页面框架，即使页面级行为被延后。\n- **SC-005**: 后续页面级 spec 可添加具体路由行为，而不改变已批准 shell taxonomy 或重新定义共享 layout、component 和 preference。\n- **SC-006**: 操作员可在窄视口和宽视口使用 shell，并可切换 light/dark mode、theme 和受支持语言，而不破坏 shell 导航。\n- **SC-007**: 同一框架合同可用于当前 web host，并且不会以阻塞未来 Electron wrapper 的方式被指定。\n- **SC-008**: UI 框架保持为 API、skill/MCP 和 CLI 管理面的二级辅助界面，不需要 MVP excluded platform capabilities 才能有用。\n- **SC-009**: 操作员可在 `New` 页面看到 Castrel 密度的 ghost-footer composer controls、以 modal 搜索 Task、将侧边栏完整收起并从 header 恢复；Projects 与 Tasks heading 不显示 count 且 Projects 提供 add action；在 `Inbox` 中通过左侧卡片切换右侧详情，在 `Issues` 中继续使用 Task table；header 不再出现本地控制平面说明。\n- **SC-010**: 组件迁移清单覆盖当前 025 的全部可见原语，shell、New、Search、Inbox、Issues 与 Settings 不再各自拥有平行 action/surface/field/state 视觉实现；自动测试和浏览器计算样式可验证关键 padding 与配色来自 token。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：025-webui\n\n## 摘要\n\n025 定义 Mystra MVP 操作 Web UI 的框架层能力。它提供面向人类操作者的稳定 shell：统一导航、侧边栏、路由承载、布局范式、基础组件期望、主题与本地化脚手架、响应式行为，以及未来 Electron 宿主兼容边界。\n\n本功能刻意不把页面探索材料等同于已实现业务行为。`New`、`Search`、`Inbox`、`Issues`、Project-grouped Tasks 和 `Settings` 的业务语义、数据解释与操作动作，将作为 025 内独立实现切片接入这个 shell；`/automations` 在独立实现切片出现前只保留 `Coming soon` 占位页。\n\n## 功能地图\n\n- 建立 Mystra MVP 的操作型 Web UI shell。\n- 固定 primary navigation：`New`、`Search`、`Inbox`、`Issues`。\n- 保留不在主菜单中的 `/automations` 直接路由，只显示 `Coming soon`。\n- 固定 secondary surfaces：Project-grouped Tasks 与 `Settings` shell modal。\n- 为已批准页面提供共享侧边栏与路由框架。\n- 为 `Inbox` 提供标准 master-detail 检查面：左侧 review Task 卡片列表，右侧选中 Task 详情。\n- 定义共享布局范式：`chatLayout`、`dashboardLayout`、`readLayout`。\n- 建立 shell 基础组件层，供后续页面复用。\n- 提供完整 Appearance preference：System/Light/Dark、亮暗主题分别设置、边缘线高对比模式、代码表面 variant、对比度、字体/字号、预览与复位；当前只做 versioned localStorage persistence，不创建数据库写入。\n- 兼容 `codex-theme-v1:{JSON}` 主题文档：schema version 与主题 ID 分离，`codeThemeId` 是 canonical ID；旧 synthetic preset id 只用于 localStorage 迁移。\n- 内置本机 Codex 26.730.61639 的完整主题目录：28 个 Codex 主题族、43 个实际注册变体；另提供 Mystra light/dark 双变体，合计 45 个可选主题。\n- 内部字体合同统一为 UI / Content / Code 三个角色；每个角色只保存一个 primary family，系统 fallback 由 CSS 统一追加。Codex v1 导入时 `fonts.ui` 同步到 UI 与 Content，`fonts.code` 映射到 Code。\n- 保留英语/简体中文、本地化与响应式脚手架；默认 UI 字号为 12px。\n- 默认平移 Castrel UX 的结构、密度和交互模式，并采用 dark-tech 的精确 palette、统一等宽字体、语义 signal colors、0/2/4/6px radius 与 flat elevation；禁止阴影、渐变、辉光、glass 和 noise。\n- 为未来 Electron 宿主保留兼容边界，但不提前实现桌面专属能力。\n\n## 边界\n\n- API 仍是管理能力的事实来源。\n- Skill/MCP 与 CLI 仍是优先的可编程管理界面。\n- 具体页面行为按 025 内独立实现切片承担，不能由 shell 重构顺带臆造。\n- `workspace` 仍表示 session-scoped 执行上下文，不表示租户或产品组织。\n- MVP 排除项继续排除：caller auth、logs API、retry API、公开 SaaS 租户管理、Kubernetes sandbox 以及相关平台能力。\n\n## 分阶段能力图\n\n- 阶段 1：交付共享 shell、固定导航、路由框架和可安全占位的页面槽位。\n- 阶段 2：允许页面级 spec 接入具体路由内容，但不重新定义全局 shell taxonomy。\n- 阶段 3：通过显式宿主边界扩展未来 Electron packaging，而不是把宿主行为混入 Web shell。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：025-webui\n\n## Owner 评审\n\n- [ ] 确认 primary navigation 严格为 `New`、`Search`、`Inbox`、`Issues`，`Automations` 不在主菜单中；并确认 `/automations` 直接访问时只显示 `Coming soon`、Project-grouped Tasks 与 `Settings` modal 可达。\n- [ ] 确认 025 只负责 shell/framework 范围，不吞并页面级业务行为。\n- [ ] 确认并入 025 的页面探索材料仍与已实现行为分离，后续按独立实现切片推进。\n- [ ] 确认 Web UI shell 仍低于 API、Skill/MCP 和 CLI 等管理事实来源。\n- [ ] 确认 `prototype.md` 已提供可运行 Control Plane 入口，并把旧独立 HTML 明确标为历史探索材料。\n- [ ] 确认 Inbox 使用左侧 review Task 卡片列表与右侧选中 Task 详情，Issues 继续保留 Task table，并验证窄屏堆叠。\n\n## Spec 就绪度\n\n- [ ] `spec.md` 已描述 shell 层用户场景、需求、实体与成功标准。\n- [ ] 框架负责的事项已经明确：导航、侧边栏、路由承载、布局范式、基础组件、主题、本地化、响应式与 Electron 兼容边界。\n- [ ] 被推迟的页面行为已与 shell 行为分离。\n- [ ] MVP 排除项足够可见，避免后续 agent 把它们偷偷塞回当前切片。\n- [ ] 面向用户、评审者和后续 agent 的说明默认使用中文，必要英文仅保留为标识符、路径、命令或产品名。\n\n## 后续插件检查\n\n- [ ] `FEATURES` tab 通过固定路径加载本文件的同级 `features.md`。\n- [ ] `CHECKLISTS` tab 通过固定路径加载本文件。\n- [ ] `PROTOTYPE` tab 通过固定路径加载 `prototype.md`，并由该文件指向独立 HTML 原型。\n- [ ] renderer 不解析 `spec.md` heading，也不从标准 Spec-Kit 文件中推断产品结构。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 原型：025-webui\n\n## 当前实现入口\n\n- 启动 `pnpm --filter @mystra/control-plane exec next dev -p 3100` 后打开 `http://127.0.0.1:3100/`。\n\n## 历史原型入口\n\n- [打开交互式高保真 HTML 原型](mockups/index.html)\n- [打开 Settings Modal 布局迁移原型](mockups/settings-modal.html)\n\n## 覆盖范围\n\n当前可运行 Control Plane 是本切片的权威 demo/PR 表面。下列独立 HTML 是此前 shell/layout 探索材料，不再拥有当前 navigation taxonomy。\n\n当前实现平移 Castrel UX 的结构、密度与交互模式，并使用 dark-tech design system 的具体配色；历史 HTML 原型只用于布局交互参考，不再拥有颜色、字体、radius 或 elevation 的设计系统权威性。\n\n当前组件迁移的权威清单见 [`component-migration.md`](component-migration.md)。运行态必须使用 Mystra-owned 共享组件和主题 token；Castrel v2 只拥有来源 anatomy、density、padding 与交互证据，不拥有运行时 palette 或业务语义。\n\n- `New`：主区域居中的产品 Logo 与 Task composer；输入区默认 3 行并使用 9/7/7/9px 内边距，ghost footer 无分隔线，左侧是附件、Repository 和 Issue，右侧是语音输入和发送。\n- `Inbox`：使用标准 master-detail 布局；左侧显示最新 Session 处于 `waiting_for_review` 的 Task 卡片，右侧显示当前选中 Task 的只读详情与完整对象页入口。\n- `Search`：从侧边栏打开 modal，在不离开当前 route 的前提下过滤并导航 Task。\n- `Issues`：`/tasks` 继续使用 Castrel-aligned Task table，不跟随 Inbox 改为 master-detail。\n- `Automations`：不进入主菜单；`/automations` 仅保留可直接访问的 `Coming soon` 占位页。\n- `Settings`：左下角入口打开 modal 组件，不再作为 route 页面；设置容器采用 Castrel Settings 的 `240px + 内容区` 双栏、左侧 identity/search/tab、44px 内容标题栏和独立滚动区。Tab 固定为 `Account`、`Appearance`、`Team`、`Integrations`。Appearance 原型覆盖 Language、System/Light/Dark、边缘线模式、代码表面 variant、亮暗主题分别设置、对比度与字体/字号细节、即时预览和复位；主题选项包含 Codex 26.730.61639 的完整 catalog，以及置顶的 Mystra light/dark 双变体。当前状态只保存在浏览器，不包含数据库/API。GitHub connection 位于 Integrations，Account/Team 的未支持写操作保持只读/不可用。\n- `Projects`：位于 primary navigation 下方，heading 不显示 count，右侧 ghost plus 进入 Project 创建表面；Project item 直接导航到 Project detail。\n- 左侧 sidebar 的 `Tasks` section 按 Project 分组，Task icon 映射最新 Session 状态。\n- 全局 shell 使用 `Sidebar | Main | Right Panel?`；三列分别拥有 Header/Content。Task 详情将 `Create Session` 放入 Right Panel，其他未注册页面不显示右栏且 Main 自动扩展。\n\n## 使用方式\n\n1. 打开本 feature 的 Spec View：`specs/025-webui/index.html`。\n2. 切换到 `PROTOTYPE` tab。\n3. 点击上方原型入口，在独立页面打开 `mockups/index.html`。\n4. 在原型左侧导航中切换 route，检查 navigation、layout archetypes、placeholder framing 与视觉方向是否一致。\n5. 打开 Search modal，输入无匹配和有匹配查询，确认焦点、空状态、关闭和 Task 导航。\n6. 收起/展开左侧栏，检查收起时 sidebar 完整变为 0px 且没有 icon rail；header 显示 Mystra brand、`New` 与重新展开 control。\n7. 打开 New、Inbox 和 Issues，检查居中 composer、Inbox 左卡片/右详情布局与 Issues table；确认主 header 不显示环境说明。\n8. 打开 `mockups/settings-modal.html` 或运行中的 Settings，检查 920×760 上限、四个 Tab、Appearance 中的 mode、border、code surface、浅/深主题、主题细节与 Language，Integrations 中的 GitHub 状态、搜索过滤、选中态、Escape/backdrop close，以及 320/768/1024/1440px 重排。\n9. 打开任一 Task 详情，确认桌面显示 Sidebar/Main/Right Panel 三列及三个独立 Header/Content；再导航到 Issues，确认 Right Panel 与其占用宽度都被清理；在 320px 确认右栏堆叠到 Main 后且无横向溢出。\n\n## 补充截图\n\n- [chatLayout](mockups/screenshots/chatlayout.jpg)\n- [chatLayout 打开右侧栏](mockups/screenshots/chatlayout-inspector.jpg)\n- [readLayout](mockups/screenshots/readlayout.jpg)\n\n## 当前限制\n\n- 原型是交互式高保真 HTML review artifact，不是生产实现。\n- 原型中的 route 内容区只放一个大 layout placeholder，不展示页面业务数据、组件网格、消息结构或真实 API 行为，也不会提交任务。\n- 所有可见交互都应有动画反馈，包括 route 切换、hover/selected、左侧栏完整展开/收起、右侧栏开合与 placeholder 入场。\n- 页面级业务能力仍由 025 内后续实现切片定义；当前原型只确认 shared shell、route taxonomy、layout archetypes 与兼容边界。\n- 如果后续 prototype plugin 接管该产物，应保持 `prototype.md` 作为 `PROTOTYPE` tab 的固定入口说明。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1785760071700"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# 实施计划：MVP 操作 Web UI 框架\n\n**Branch**: 本地 `main`（逻辑 feature id `025-webui`） | **Date**: 2026-05-20 | **Spec**: `specs/025-webui/spec.md`\n**Input**: 来自 `/specs/025-webui/spec.md` 的功能规格\n\n## 摘要\n\n将 025 Web UI 框架实现为现有 `@mystra/control-plane` Next.js 应用的 shell 层。当前切片复刻 Castrel 的紧凑侧边栏结构：primary menu 为 `New`、`Search`、`Inbox`、`Issues`，其下用 Project 分组展示 Tasks，Task icon 映射最新 Session 状态，`Settings` 作为底部 modal 入口并承载 theme/language。`/automations` 不进入主菜单，仅保留 `Coming soon` 直接路由；035/036 已交付对象页继续可达。\n\n## 技术上下文\n\n**Language/Version**: TypeScript 5.9, Node.js 24\n**Primary Dependencies**: Next.js 16, React 19, 现有 control-plane theme system, Castrel UX implementation/reference, dark-tech design system\n**Storage**: 仅使用浏览器 `localStorage` 保存 shell 偏好；不改变业务状态存储\n**Testing**: `pnpm --filter @mystra/control-plane typecheck`, `pnpm --filter @mystra/control-plane test`, 浏览器预览验证\n**Target Platform**: 桌面优先的内部 Web UI，并响应窄视口\n**Project Type**: Next.js Web 应用\n**Performance Goals**: shell 只轮询现有 `/api/tasks` 与 `/api/projects`，不新增 API 或持久化合同\n**Constraints**: 保持 API-truth 和 headless management 优先级；不加入页面级产品行为、caller auth、logs API、retry API 或 hosted tenancy 功能\n**Scale/Scope**: `apps/control-plane/app` 中的一个 shell 框架，五个 primary menu entries、一个 Project-grouped Tasks section、Settings modal、三个 layout archetype，theme/i18n 脚手架\n\n## 宪章检查\n\n- **规格拥有产品边界**：通过。025 仍是 shell/framework 范围，并明确延后页面级行为。\n- **服务边界使用类型化合同**：通过。本计划不引入 API、持久化、MCP 或 runner 合同变更。\n- **Provider 是可替换边界**：通过。不变更 provider 实现。\n- **Runner 隔离和 secret hygiene**：通过。不变更 runner、容器或 secret 处理。\n- **交付前验证与文档**：必须执行。plan、contracts、tasks 和浏览器验证需要与 shell 行为保持一致。\n\n## 项目结构\n\n### 本功能文档\n\n```text\nspecs/025-webui/\n├── spec.md\n├── features.md\n├── checklists.md\n├── prototype.md\n├── plan.md\n├── research.md\n├── data-model.md\n├── quickstart.md\n├── contracts/\n│   └── shell-contract.md\n└── tasks.md\n```\n\n### 源码结构\n\n```text\napps/control-plane/\n└── app/\n    ├── _components/app-shell.tsx\n    ├── globals.css\n    ├── layout.tsx\n    ├── page.tsx\n    └── theme-system.ts\n```\n\n**结构决策**：本切片保留在现有 control-plane app 中。`_components/app-shell.tsx` 是 shell taxonomy、主题和 Settings action 的第一实现面；现有 route pages 继续拥有对象页内容，尚未实现的页面保持 placeholder/read-only。\n\n## 设计与实施方向\n\n- 组件迁移以 `component-migration.md` 为清单：来源固定为 Castrel v2 `castrel-demo-v2` 的 `cdce88e2fff4667f306961ded4995d14b987a17e`，只迁移当前 025 表面实际使用的通用组件 anatomy、density、padding 与交互状态。\n- 在 `_components` 下建立 Mystra-owned 共享 UI 原语，并用它替换 shell、New、Search、Inbox、Issues 与 Settings 中的页面级 action、surface、field、dialog 和 state 实现。\n- spacing、control height、padding、radius、surface、text、border、focus 和 semantic signal 全部通过 `theme-system.ts` 输出的 CSS token 消费；Castrel 的 `9/7/7/9px` composer inset 等非 4px 特殊值必须使用命名 token。\n- 在 `_components/app-shell.tsx` 中定义小型 shell model：已批准菜单项、Project-grouped Task navigation、框架自有 label 和 placeholder state。\n- 保留 `theme-system.ts` 的 config-driven 架构；默认 Mystra family 用同一 `codeThemeId` 提供 light/dark explicit token map，dark 原样保留 Graphite，light 使用配套矿物灰语法；其他 preset 来自带版本的 Codex catalog。\n- 将 Castrel UX 的布局、密度和交互规则与 Mystra 的 UI/Content/Code 三角色 typography、0/2/4/6px radius、flat elevation、signal semantics、reduced-motion 规则同步到 `globals.css` 和 `mystra-ux` durable reference。\n- 为框架自有文案引入 i18n 脚手架，不在本切片翻译页面级业务行为。\n- 将现有 Task、Session、Runner 与 Project 对象页保留为直接可达 routes；不通过导航重构删除已交付能力。\n- 代码现实依据：现有 shell 在 `apps/control-plane/app/_components/app-shell.tsx`，overview 在 `apps/control-plane/app/page.tsx`，主题在 `apps/control-plane/app/theme-system.ts`，视觉方向和 shell mockup 函数在 `specs/025-webui/mockups/render-mockups.cjs`。\n\n### UX Intent：Settings Modal 布局迁移\n\n- **目标**：将 `/Users/arcadia/Documents/castrel-ai/frontend/components/pages/settings/SettingsModal.tsx` 的设置容器布局与紧凑交互语言迁移到 Mystra，并按 `Account`、`Appearance`、`Team`、`Integrations` 四个 Tab 梳理信息架构；Theme 与 Language 归入 Appearance，租户术语使用 Team。\n- **保留**：Mystra 现有 Theme/Language 数据、localStorage key、即时切换语义、GitHub connection 行为、中文/英文框架文案和 native dialog 键盘行为。\n- **迁移**：`920px × 760px` 上限、`240px + minmax(0,1fr)` 双栏、44px 内容标题栏、左侧 identity/search/tab 导航、28px 紧凑控件、内容区独立滚动，以及窄屏单栏重排。\n- **设置行组件**：复用已迁移的 Mystra-owned `SettingGroup` / `SettingRow`，对齐 Castrel v2 的左侧标题/说明、右侧控件 anatomy 和 32px 行间距；不复制 Castrel 业务状态或 palette。\n- **不迁移**：Castrel 的 Workspace、Billing、Usage、Agent permissions 等业务能力；Account 与 Team 在当前 MVP 只诚实显示只读/不可用状态，不创建 UI-owned 持久化。Castrel 的暖色具体 token、14px 圆角与 modal shadow也不迁移。\n- **状态与无障碍**：覆盖 selected、hover、focus、无搜索结果、320/768/1024/1440px；tab 使用 `tablist/tab/tabpanel` 语义，modal 使用 native `<dialog>` 保持 focus trap、Escape 和 backdrop close。\n- **影响依据**：GitNexus 对 `ShellSettings` 与 `AppShell` 的 upstream 分析均为 LOW；唯一直接调用方为 `AppShell`，间接影响 `RootLayout`，不触及 API、持久化或 Runner 流程。\n\n### UX Intent：主题与密度一致性修复\n\n- **体验问题**：当前 shell 在 768px 仍保留 300px sidebar，在 320px 初始覆盖内容；页面、搜索、Inbox、表格和设置多次叠加 inset，桌面按钮统一膨胀到 44px；主题切换还存在首帧回退到默认色和非默认 preset 改用比例字体的问题。\n- **影响表面**：共享 shell/header/sidebar、New、Search、Inbox、Issues/Tasks table、Projects 与对象页的通用 page frame、Settings、所有 selectable theme preset，以及 loading/empty/error/selected/focus 状态。\n- **固定规则**：使用 4/8/12/16/20/24/32/48/96px spacing scale；page inline 为桌面 16px/窄屏 12px，page top 12px、bottom 32px，panel 16px、modal 20px、popup 16px，layout gap 12px，stack gap 8px；composer 的 9/7/7/9px 是明确来源特例。radius 只允许 0/2/4/6px。Castrel-derived action 为 compact 24px、header/navigation 28px、default 32px，standard field 36px，coarse pointer hit target 44px。\n- **主题规则**：Mystra light/dark 统一使用 UI Arial、Content Georgia、Code Courier New，每个角色只保存一个 primary family；CSS 追加角色对应的 browser/system generic fallback。兼容 Codex v1 的主题把 payload UI font 同步到 UI/Content，把 code font 映射到 Code。保存的主题必须在 React hydration 前同步应用，hydration 未读取 preference 前不得回写默认主题。\n- **响应式与无障碍**：`<=1024px` sidebar 变为默认关闭的 overlay，由共享 header 打开，带关闭按钮、backdrop 和 route-change dismissal；`<=700px` 内容列堆叠。桌面视觉密度不得以牺牲 44px touch hit area、focus、ARIA name 或键盘关闭能力为代价。\n- **数据与性能**：shell、Inbox 与 Issues 对 `/api/tasks` 使用同一共享轮询资源，避免三个组件独立请求相同数据；不改变 API、缓存或持久化合同。\n- **风险与验证**：GitNexus 对 `AppShell`、`RootLayout`、`buildThemeCssVariables`、`applyThemeToDocument`、`TasksPage` 和 `InboxPage` 的 upstream 风险均为 LOW。用主题单测、control-plane 全量 test/typecheck/build、GitNexus change detection、HTTP 200，以及 1440/1024/768/320px 真实浏览器检查首帧主题、字体、sidebar、overflow、control height、focus 与 console。\n\n### UX Intent：Castrel Appearance 能力迁移\n\n- **目标**：把 `/Users/arcadia/Documents/castrel-ai/frontend/components/pages/settings/appearance/AppearanceSettings.tsx`、`useAppearanceSettings.ts` 与 `lib/theme/castrelTheme.ts` 中面向用户的外观能力迁移到 Mystra Appearance Tab，同时保留 Mystra-owned theme definitions、共享组件和 dark-tech semantic token。\n- **能力范围**：语言；`System` / `Light` / `Dark`；`Default` / `High Contrast` / `Color High Contrast`；代码表面 `Light` / `Dark`；浅色主题和深色主题分别选择；预览；0–100 对比度；UI/Chat/Code 字体；UI 12–14px 与 Chat 12–16px 字号；复位主题细节。\n- **状态模型**：`AppearancePreferences` 是纯浏览器 preference，不是业务实体。`AppShell` 持有 normalized state，`prefers-color-scheme` 只负责把 `System` 解析为当前 variant。状态变化即时应用到 `documentElement`，并写入单一 versioned localStorage JSON；首帧 bootstrap 使用同一 normalization/default contract 的序列化数据。\n- **数据流**：`localStorage -> parse/normalize -> resolve active variant -> resolve variant theme -> build semantic CSS variables -> documentElement dataset/style`。Settings 控件只发送 partial preference update，不直接操作 DOM 或选择 palette。\n- **复用与隔离**：扩展现有 `theme-system.ts`，不引入 Zustand、`next-themes`、Castrel service API 或数据库表。`UiDropdown` 继续承担 theme select；在 Mystra-owned field/action primitives 中补充 segmented 与 range anatomy，字体使用现有 input。运行时通过同一 Codex v1 adapter 消费 Mystra 双变体和静态 Codex catalog，不复制 Castrel 主题目录。\n- **失败策略**：损坏 JSON、未知 mode/border/variant、跨 variant theme id、非有限数值和越界字号必须逐字段回退；`System` listener 必须清理；localStorage 不可用时仍能以 Mystra 对应 variant 启动。Appearance 未产生网络、API 或 RDB failure state。\n- **性能**：所有变更是 O(theme token count) 的同步浏览器操作；只在 preference 或 system variant 变化时写 CSS variables，不引入轮询或渲染期存储读取。\n- **NOT in scope**：服务端/RDB persistence、账户同步、多设备同步、Castrel SDK theme override、通知 toast、外部字体下载、Castrel 全量 theme preset 迁移，以及当前 Mystra 尚不存在的独立 terminal/chat product surface。\n- **验证**：主题纯函数单测覆盖 normalization、variant resolution、bootstrap、contrast/border/code surface/font token；组件契约测试覆盖共享 controls；真实浏览器覆盖 mode/theme 分离、system media change、preview/reset、local refresh、320/768/1024/1440px、键盘与 console。\n\n```text\nAppearance controls\n        |\n        v\npartial preference update\n        |\n        v\nnormalize + localStorage --------> hydration bootstrap\n        |\n        v\nmode + prefers-color-scheme\n        |\n        v\nlightScheme / darkScheme\n        |\n        v\ntheme preset + detail overrides\n        |\n        v\nsemantic CSS variables + dataset\n```\n\n### 工程评审结论：Castrel Appearance 能力迁移\n\n- **Scope Challenge**：现有 theme presets、CSS variable builder、首帧 bootstrap、AppShell localStorage owner、Settings four-tab anatomy 与 shared dropdown 已覆盖大部分基础；最小完整方案只扩展这些 seams，不迁移 Castrel store/service/dependencies。\n- **Architecture**：0 个未解决问题。纯 preference resolver 是运行态和 bootstrap 的唯一真相；服务端 persistence 明确不在范围。\n- **Code Quality**：0 个未解决问题。使用显式 union、clamp、variant guard 和 partial update；不在 Settings panel 复制 token 计算。\n- **Tests**：覆盖图与 failure modes 已写入 `checklists/engineering-review.md`；损坏 storage、System listener、variant mismatch、细节 reset 和 responsive/browser flow 均进入 tasks。\n- **Performance**：0 个问题。固定规模 token map，单一 media listener，只在依赖变化时应用。\n- **What already exists**：`CONTROL_PLANE_THEMES`、`buildThemeCssVariables`、`buildThemeBootstrapScript`、`AppShell` preference effects、`UiDropdown`、`SettingGroup` / `SettingRow` 全部复用。\n- **NOT in scope**：RDB/API persistence、跨设备同步、Castrel SDK override、toast、外部字体下载、Castrel 全量 preset 和独立 terminal/chat 业务页面。\n- **Failure modes**：非法本地值由单元测试覆盖并 fail closed；localStorage 不可用时保留默认主题；没有网络错误路径或 silent critical gap。\n- **Parallelization**：顺序实施，无独立 worktree lane；theme model -> shared controls -> shell/settings wiring -> browser/full verification。\n\n### 技术场景：Codex Theme v1 完整兼容\n\n- **Actor / goal**：主题维护者提供 `codex-theme-v1:{JSON}` 字符串，希望 Mystra 原样理解该 schema，同时不把 schema version 误当主题 ID。\n- **合同**：`CODEX_THEME_SCHEMA_VERSION = \"codex-theme-v1\"`；payload 严格包含 `codeThemeId`、`theme`、`variant`。`codeThemeId` 是 canonical ID；Mystra `label`、`description` 与 explicit tokens 是 adapter metadata，不进入 Codex payload。\n- **查找语义**：同一 `codeThemeId` 可以分别存在于 light/dark variant，registry、Appearance、Settings 与 bootstrap 都通过 `(variant, codeThemeId)` 解析，不再维护第二个 `id`。\n- **迁移**：旧 `notion-light`、`linen-light`、`notion-dark`、`graphite-signal` 仅在 localStorage parse/bootstrap 边界映射为 `notion`、`notion`、`notion`、`mystra`；normalized preference 与 DOM dataset 只输出 `codeThemeId`。\n- **失败策略**：未知 schema version、JSON 损坏、额外 synthetic `id`、字段缺失、非法 variant/contrast/font/color value 抛出稳定 `TypeError`；Appearance 损坏值仍 fail closed 到 variant default。\n- **性能**：45 个固定 variant 在模块初始化时解析一次；运行态查找与 bootstrap 仍为固定规模 O(theme count)，不引入网络、RDB 或额外 client store。production build 与真实浏览器必须验证增加 catalog 后的首帧脚本仍可用。\n- **NOT in scope**：主题文件选择器、远端主题 catalog、数据库同步、Codex app 私有业务 API，以及扩大 Codex v1 schema。\n\n```text\ncodex-theme-v1:{JSON}\n        |\n        v\nschema version guard + exact payload validation\n        |\n        v\nCodexThemeV1Payload(codeThemeId, variant, theme)\n        |\n        +--> serialize --> codex-theme-v1:{JSON}\n        |\n        v\nMystra metadata adapter(label, description, explicit tokens)\n        |\n        v\n(variant, codeThemeId) --> Appearance/bootstrap --> CSS variables + dataset\n```\n\n### 工程评审结论：Codex Theme v1 兼容\n\n- **Scope Challenge**：复用单一 `theme-system.ts`、现有 registry/Appearance/bootstrap/Settings，只新增纯静态 `codex-theme-catalog.ts` 数据文件，不增加第二套 theme store、运行时 app-bundle 读取或网络 catalog。\n- **Architecture**：0 个未解决问题。schema parser/serializer 是导入边界；Mystra metadata 明确在 payload 外；首帧与 hydration 使用同一 canonical ID 规则。\n- **Code Quality**：0 个未解决问题。删除双 ID，而不是新增 alias field；legacy alias 只存在于受限迁移表。\n- **Tests**：Everforest exact round-trip、unknown version、synthetic `id` rejection、built-in round-trip、variant duplicate、legacy migration、bootstrap dataset 与全量回归均纳入 tasks。\n- **Performance**：0 个问题。无 I/O、轮询或随数据增长的集合。\n- **What already exists**：`CONTROL_PLANE_THEMES`、`buildThemeCssVariables`、`normalizeAppearancePreferences`、`buildThemeBootstrapScript`、`AppearanceSettingsPanel` 全部复用。\n- **Failure modes**：错误 version/payload 明确抛错；损坏 browser preference fail closed；没有无测试且静默的 critical gap。\n- **Parallelization**：顺序实施，无独立 worktree lane；contract tests -> parser/registry -> migration/bootstrap/UI -> full verification。\n\n### 技术场景：Codex 完整主题目录与 Mystra 双变体\n\n- **来源事实**：本机签名 `/Applications/ChatGPT.app` 中承载 Codex bundle，版本 26.730.61639 / build 6234；从 `app.asar` 的 code-theme registry 与 theme modules 提取 28 个 family、43 个实际注册 variant。\n- **静态边界**：提取结果落在 `codex-theme-catalog.ts`，运行时不读取 Codex 安装包，不依赖私有 IPC，不联网更新。source version 与 family/variant count 由测试锁定。\n- **Mystra identity**：原 Graphite dark payload 和 explicit tokens 改用 `codeThemeId: \"mystra\"`、label `Mystra`；新增 light variant，保持矿物灰层级、绿色 accent、restrained semantic signals、monospace 与 flat geometry。\n- **选择器顺序**：Mystra 在 light/dark 列表均置顶；其余 Codex themes 按 display label 排序，只出现在其实际注册的 variant 下。\n- **迁移**：`graphite-signal` 只在 dark preference/bootstrap 入口映射为 `mystra`；被移除的 `linen-light` 映射到有效的官方 Notion light，避免已保存偏好失效。\n- **测试地图**：catalog family/count/known payload、Mystra 双 variant/default、legacy migration、exact v1 round-trip、bootstrap dataset、全量 theme CSS variables、typecheck/test/build 与真实浏览器 dropdown/refresh/console。\n\n### 技术场景：UI / Content / Code 字体合同\n\n- **外部边界**：`codex-theme-v1` 继续严格只有 `fonts.ui` 与 `fonts.code`，parser/serializer 不增加 `content`，保证既有主题字符串 exact round-trip。\n- **内部 adapter**：`ControlPlaneThemeDefinition.fontRoles` 固定为 `{ ui, content, code }`。Codex `ui` 取首个 primary family 后同时写入 UI/Content；Codex `code` 写入 Code。Mystra metadata 可独立指定 Content。\n- **fallback**：primary family 只保存一个值；运行时分别追加 `system-ui, sans-serif`、`ui-serif, serif`、`ui-monospace, monospace`，不持久化 OS-specific 列表。\n- **迁移**：旧 `chatFont` / `chatFontSize` 仅作为 localStorage 输入迁移为 Content；旧 Graphite 默认多 family stack 回到 Mystra 新默认，显式单 family 不被抹除。\n- **风险**：字体变量参与首帧 bootstrap、RootLayout 与运行时 Settings，必须同时测试服务端变量、bootstrap、hydration 后变量和真实浏览器 computed style。\n\n### UX Intent：Sidebar Visual Slot 一致性修复\n\n- **体验问题**：sidebar 的 leading icon、Task status、section mark、trailing count badge 和 icon button 分别维护尺寸、padding 与位置，导致同一右侧列的 badge 与按钮中心线漂移，图标视觉规范也无法由一个组件合同保证。\n- **影响表面**：共享 sidebar header、primary navigation、Projects/Tasks section、Project/Task row 与 Settings 入口；不改变 route、API、数据加载或业务状态。\n- **复用规则**：所有 sidebar 图标、mark、status、count badge 与 icon button 必须通过 `SidebarVisual` 组件族。leading slot 固定为 16px；desktop trailing slot 固定为 24px；Shell icon 固定为 16px、`stroke-width: 1.7`，共享相同的颜色、透明度、位移与背景 transition 模板。coarse pointer 下 trailing slot 与 icon button 一起扩大为 44px。\n- **对齐规则**：trailing icon、badge 与 icon button 共享同一 slot 宽度和右边界；badge 只改变内部内容宽度，不改变 slot 中心线。Project mark 与 Task status 也先进入统一 leading slot，再与 label 建立固定间距。\n- **状态与无障碍**：icon-only button 继续使用真实 button 与显式 `aria-label`；Task status 保留 `role=\"img\"`、可访问名称和语义颜色；active spinner 保留现有旋转，并由全局 `prefers-reduced-motion` 规则降级。\n- **风险与验证**：GitNexus 对 `AppShell` 的 upstream 风险为 LOW，唯一直接调用方是 `RootLayout`。用 sidebar component contract test、control-plane typecheck/test、1440/1024/768/320px 真实浏览器 computed-style 与 console 检查验证。\n\n### UX Intent：New Task Project 与 Issue 选择修复\n\n- **体验问题**：New 页面重复显示 Logo 右侧文案，原生 select 与 composer ghost controls 不同构，`Repository` 错误替代了 `Project`，不可用 Issue select 和配置提示还占用空间；32px send action 令 9/7/7/9px 基础 inset 的右下边缘在视觉上更紧。\n- **影响表面**：仅限 New Task composer、Mystra-owned dropdown primitive、Project 选项、repository-scoped Issue loading/selection、Issue dispatch submission，以及 desktop/narrow 布局；不改变 API、数据库或 provider contract。\n- **复用规则**：新增 `UiDropdown`，沿用 Castrel trigger/content/item anatomy，但使用 Mystra action、icon、surface、border、radius、motion 与 accessibility tokens。New 页面选项 label 使用 Project name，repository full name 只作为说明。Issue 不再使用下拉，改为输入框下方的紧凑可选择卡片列表。\n- **几何规则**：Logo 使用 48px token 且不带相邻文案。composer 保留 9/7/7/9px 基础 inset，在 textarea 右侧和 footer 右侧/底部各补偿 2px，使四边有效视觉 inset 都为 9px；send action 保持共享 32px solid action。\n- **状态与无障碍**：Project 未选定时不请求或显示 Issue；Project dropdown 支持 button/listbox 语义、方向键、Home/End、Escape、外部点击和显式 label。Issue 卡片使用真实 button、`aria-pressed`、selected surface，并覆盖 loading/error 状态。无 Project 时只保持 disabled Project trigger，不显示额外引导句。\n- **风险与验证**：GitNexus 对 `NewTaskComposer` upstream 风险为 LOW，只有首页 `Page` 一个直接调用者。用先红后绿的 composer contract test、control-plane typecheck/test/build、HTTP、真实浏览器 computed-style、accessibility tree、responsive 与 console 检查验证。\n\n### UX Intent：可选全局 Right Panel\n\n- **体验问题**：当前全局 shell 只有 Sidebar 与 Main，Sidebar 内部已有 header/content 语义，Main 则把 route children 直接放在 header 后；页面需要检查器或辅助操作时只能在 Main 内临时造第二列，无法获得与 shell header 对齐的稳定 Right Panel。\n- **目标结构**：共享 grid 固定表达 `Sidebar | Main | Right Panel?`，三列分别拆成 Header 与 Content。Right Panel 由页面通过共享 `ShellRightPanel` seam 注册，未注册、组件卸载或跨 route 后不渲染且不占宽度。\n- **首个切片**：Task 详情把现有 `Create Session` 表单从 Main 的 `detailGrid` 迁入 Right Panel；表单状态、提交函数与 canonical `/api/tasks/:id/sessions` 请求保持页面所有权，不新增 API、RDB 或 shell-owned business state。\n- **响应式**：桌面三列；Sidebar 收起只释放左列。`<=1024px` 继续使用现有 Sidebar overlay，Main 与 Right Panel 相邻；`<=700px` Right Panel 在 Main 后堆叠，避免横向 overflow。\n- **工程评审**：GitNexus 对 `AppShell` 与 `TaskDetailPage` 的 upstream 风险均为 LOW；唯一跨层调用是 `RootLayout -> AppShell`。复用现有 AppShell、Task form 与 theme tokens，新增一个局部注册 context，不采用 pathname switch 或 Next parallel route。测试覆盖无 panel、注册、内容更新、卸载清理、Task 接入和 1440/1024/768/320px 浏览器布局；无网络、持久化或随数据量增长的性能路径。\n- **不在范围**：Right Panel resize/persistence、用户手动开合、多个 panel tab、跨 route 保留、Inbox 详情迁移和新的业务内容均延后；本切片只建立全局 anatomy 与一个真实 opt-in 用例。\n\n## 阶段 0：研究\n\n研究决策记录在 `research.md`。\n\n## 阶段 1：设计\n\n设计产物：\n\n- `data-model.md`：shell 级实体和偏好概念。\n- `contracts/shell-contract.md`：路由 taxonomy、layout archetype、placeholder、theme、locale 和 Electron 兼容合同。\n- `quickstart.md`：桌面、窄视口、主题、语言环境和路由 placeholder 行为的验证路径。\n- `prototype.md`：可打开的独立 HTML 原型入口和覆盖范围。\n\n## 复杂度追踪\n\n不需要 constitution 例外或复杂度豁免。\n\n## GSTACK REVIEW REPORT\n\n| Review | Count | Result |\n|---|---:|---|\n| Engineering review | 1 | CLEAR — local-only preference model, first-frame bootstrap, failure modes and verification map defined |\n| CEO review | 0 | Not requested |\n| Design review | 0 | Existing Castrel Appearance reference and approved Mystra Settings anatomy used |\n| Security review | 0 | No     <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
  </body>
</html>
