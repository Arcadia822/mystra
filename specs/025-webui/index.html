    <script id="spec-data" type="application/json">{"feature":"025-webui","title":"025-webui","prototypeHref":"mockups/index.html?v=1785760071700","generatedAt":"2026-08-05T11:28:24.930Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：MVP 操作 Web UI 框架\n\n**Feature Branch**: 已合并到本地 `main`，保留逻辑 feature id `025-webui`\n**Created**: 2026-05-19  \n**Status**: Draft  \n**Input**: 用户描述：“简单补充 025 的 spec，作为 mvp 版本的操作 ui”；后续范围决策：`025-webui` 只聚焦前端框架层，并纳入主题/design-system、国际化、主侧边栏、共享 layout、基础组件、响应式和未来 Electron 兼容边界。2026-08-05 owner 明确要求 demo/PR 平移 Castrel UX 的结构、密度与交互模式：主菜单为 `New`、`Search`、`Inbox`、`Issues`、`Automations`，其下是 Projects 与按 Project 分组的 Tasks；具体配色采用 dark-tech design system，默认 UI 字号为 12px。随后 owner 要求将当前页面实际使用的 Castrel v2 组件迁移并替换现有页面原语，尤其保证 padding 与配色通过主题 token system 实现。\n**Consolidation**: 2026-08-03 起，025 是唯一保留的未完成 UI spec；原 `026`–`031` 的页面探索材料并入 025，已完成的 035/036 对象页继续作为当前代码事实。025 的 shell 实施将显式迁移现有导航，而不是假装当前代码已经采用目标 taxonomy。\n\n## 用户场景与测试 *(mandatory)*\n\n### 用户故事 1 - 操作员使用已批准的 Shell 框架（优先级：P1）\n\n作为内部操作员，我希望 MVP UI 提供稳定的 shell、已批准的顶层导航和共享页面框架，以便我能识别 Mystra 的人类操作界面，同时不让 shell 拥有页面级业务行为。\n\n**优先级原因**：第一个有用的 UI 切片是框架本身：导航、布局、路由框架和共享 chrome。Mystra 仍然以 API 为真相，并保持 agent-first；shell 应先存在，而不是让任意一个页面先变成产品本体。\n\n**独立测试**：在桌面和窄视口打开应用，确认 shell 只暴露已批准的顶层菜单，为每个路由提供一致页面框架，并且不依赖页面级功能先实现才能可用。\n\n**验收场景**：\n\n1. **前提** 操作员打开应用 shell，**当** 主导航渲染，**则** primary navigation 依次包含 `New`、`Search`、`Inbox`、`Issues` 和 `Automations`；`Automations` 下方显示 Project list，再下方的 Tasks section 按 Project 分组显示 Task，`Settings` 作为底部 shell action 打开 modal。\n2. **前提** 操作员在已批准路由之间切换，**当** 每个路由加载，**则** shell 提供一致的导航、页面框架和共享视觉结构，即使该页面的专属 feature spec 尚未实现。\n3. **前提** 某个已批准页面目前只有框架级支持，**当** 操作员打开它，**则** UI 可以显示占位或只读框架内容，而不是发明属于后续实现切片的页面行为。\n\n---\n\n### 用户故事 2 - 后续页面实现切片接入 Shell 而不重新定义 Shell（优先级：P1）\n\n作为未来的 Mystra agent 或前端维护者，我希望页面级工作落在稳定的 shell 合同之后，以便 `New`、`Search`、`Inbox`、`Issues`、`Automations`、Project-grouped Tasks 和 `Settings` 可以在同一 025 边界内按独立实现切片演进，而不反复改变产品分类或共享 UI 所有权边界。\n\n**优先级原因**：页面功能需要拆成独立实现切片。025 必须定义什么属于框架、什么必须延后，否则下一个 agent 会再次即兴发挥。非常可预期。也非常不必要。\n\n**独立测试**：审查 shell 合同，确认后续页面实现切片可以向某个已批准路由添加具体内容，而不改变顶层导航、管理面层级或 shell 级偏好设置。\n\n**验收场景**：\n\n1. **前提** 后续实现切片定义具体的 `Recent Sessions` 行为，**当** 实现该工作，**则** 它接入现有已批准 shell 的 secondary route，而不是添加新的主导航入口或替换 shell 所有权。\n2. **前提** 某个页面能力需要新数据、动作或视觉解释，**当** 指定该能力，**则** 它由 025 中明确的实现切片拥有，而不是悄悄扩张 shell 任务。\n3. **前提** shell 框架已经存在，**当** 后续页面实现切片增量到来，**则** 它们可以独立交付，而不迫使全局导航、布局原语或共享偏好设置重设计。\n\n---\n\n### 用户故事 3 - 操作员跨设备、主题和语言环境使用 Shell（优先级：P2）\n\n作为内部操作员，我希望 shell 框架处理响应式导航、外观、主题和语言环境脚手架，以便后续页面实现切片继承可用的横切基础，而不是每个页面重新发明一遍。\n\n**优先级原因**：响应式、视觉偏好和本地化属于框架问题，应在 shell 层解决一次，而不是每个页面重复争论。\n\n**独立测试**：在窄视口和宽视口打开 shell，切换 light/dark 外观、主题和语言环境，确认即使页面级功能仍是占位，shell 也保持可用。\n\n**验收场景**：\n\n1. **前提** 操作员使用窄视口，**当** 在已批准路由之间导航，**则** shell 仍可使用，且主要导航策略不是横向滚动。\n2. **前提** 操作员切换 light/dark 外观或主题，**当** shell 重新渲染，**则** 共享导航和页面框架在所有已批准路由中保持视觉一致。\n3. **前提** 操作员切换语言环境，**当** 再次访问 shell，**则** 共享导航和框架自有文案显示所选语言或可预测 fallback。\n\n---\n\n### 用户故事 4 - 前端维护者复用共享布局和组件（优先级：P2）\n\n作为前端维护者，我希望 shell 框架提供主侧边栏、共享 layout archetype 和与 Mystra design-system 方向一致的基础组件层，以便后续页面实现切片能组合一致 UI，而不是临时重建结构和原语。\n\n**优先级原因**：如果框架现在不拥有 sidebar、layout mode 和 base components，每个后续页面实现切片都会从侧门把框架决策塞回来。这并不优雅，只是可预测。\n\n**独立测试**：审查 shell 合同，确认后续页面实现切片可以选择已批准 layout archetype 和共享基础组件，而不用重新定义 sidebar、token model 或基础交互模式。\n\n**验收场景**：\n\n1. **前提** 操作员使用 shell，**当** 显示导航，**则** 主侧边栏仍是已批准顶层路由的共享主导航容器。\n2. **前提** 后续页面实现切片需要会话式、仪表盘式或阅读式界面，**当** 实现它，**则** 它可以接入 `chatLayout`、`dashboardLayout` 或 `readLayout`，而不是默认发明新的顶层框架模型。\n3. **前提** 后续页面实现切片需要按钮、输入框、badge、panel、list 或类似原语，**当** 实现它，**则** 它可以依赖框架共享组件层和 design-system 对齐，而不是引入无关视觉语法。\n4. **前提** 当前 025 表面已经存在页面级 action、surface、field、dialog 和 state，**当** Castrel v2 组件迁移完成，**则** shell、New、Search、Inbox、Issues 与 Settings 都消费 Mystra-owned 共享组件，且 padding、颜色、border、focus、height 与 radius 可追溯到主题 token。\n\n---\n\n### 用户故事 5 - 未来桌面封装保留同一框架合同（优先级：P3）\n\n作为未来 Mystra 维护者，我希望 shell 框架与后续 Electron wrapper 兼容，以便 Mystra 可以获得桌面 shell，而不用重写导航、布局、主题、本地化或基础组件合同。\n\n**优先级原因**：owner 明确希望未来兼容 Electron。这应被视为框架切片的架构护栏，而不是发布前一周添加的道歉。\n\n**独立测试**：审查框架要求，确认 shell concern 的表达既能运行在当前 web delivery 形态中，也能兼容未来 Electron-hosted shell。\n\n**验收场景**：\n\n1. **前提** Mystra 当前以 web control-plane UI 交付，**当** 实现 shell 框架，**则** 它不假设浏览器唯一产品模型，以至于未来 Electron 需要重新设计路由分类、主题处理或布局所有权。\n2. **前提** 未来 Electron shell 包裹同一前端，**当** 迁移发生，**则** 主侧边栏、共享布局、i18n 和主题系统保持可复用，而不是成为 web-only 特例。\n3. **前提** 某个框架能力确实依赖 host 环境，**当** 指定或实现它，**则** 环境特定 seam 必须显式存在，而不是藏在共享 shell 行为内部。\n\n---\n\n### 边界情况\n\n- 当已批准页面还没有专属 feature spec 时怎么办？shell 仍应渲染有效路由，显示占位或只读框架，而不是省略路由或发明页面语义。\n- 当页面级后端能力尚不足以支持编辑或实时数据时怎么办？框架可以保持 inspection-first，不应伪装为已完成产品行为。\n- 当小屏导航空间不足时怎么办？shell 应保留所有已批准菜单入口，而不是为移动端创造不同产品分类。\n- 当选中主题或语言环境不完整时怎么办？shell 应可预测 fallback，同时保持导航可理解。\n- 当页面形态不明显适配 `chatLayout`、`dashboardLayout` 或 `readLayout` 时怎么办？默认映射到已批准 archetype，除非 025 的后续变更证明需要新的框架级 layout。\n- 当页面设计偏离共享 design system 时怎么办？页面应论证对框架的扩展，而不是静默绕过共享 token 和原语。\n- 当未来 Electron host 引入桌面专属 affordance 时怎么办？框架应保持共享 UI 合同可移植，并把 host-only 行为隔离在显式 seam。\n- 当后续页面实现切片试图引入新的主菜单或 UI-owned 管理语义时怎么办？该变化超出既定 shell 范围，必须先更新 025 并对照项目管理面层级证明。\n\n## 需求 *(mandatory)*\n\n### 功能需求\n\n- **FR-001**: 系统 MUST 提供内部 MVP web UI 框架，作为 Mystra 现有管理能力之上的二级操作与 inspection shell。\n- **FR-002**: MVP demo UI 的 primary navigation MUST 依次包含 `New`、`Search`、`Inbox`、`Issues` 和 `Automations`；`Settings` MUST 是底部 shell action/modal。\n- **FR-003**: 本 spec MUST 只拥有 shell 级 concern，包括已批准导航、路由框架、共享布局结构、共享视觉语言、shell-wide preference plumbing 和未来兼容 host-shell 边界。\n- **FR-004**: 本 spec MUST NOT 把页面探索材料伪装为已实现产品行为；`New`、`Search`、`Inbox`、`Issues`、`Automations`、`Settings` 或 Project-grouped Tasks 的具体行为 MUST 作为 025 内独立实现切片明确计划和验证。\n- **FR-005**: 每个已批准 navigation surface MUST 有路由或等价 shell entry，以便在页面级功能实现前导航模型已经具体。\n- **FR-006**: 当某个已批准路由的专属 feature spec 尚未落地时，shell MUST 允许该路由渲染 placeholder、unavailable 或 read-only 框架内容。\n- **FR-007**: shell MUST 提供主侧边栏，作为已批准 primary routes 与 Project-grouped Tasks 的共享导航容器。\n- **FR-008**: shell MUST 定义并拥有三个核心 layout archetype：`chatLayout`、`dashboardLayout` 和 `readLayout`。\n- **FR-009**: 后续页面级 spec MUST 默认组合到 `chatLayout`、`dashboardLayout` 或 `readLayout`，除非单独论证的框架变更扩展已批准 layout 集合。\n- **FR-010**: shell MUST 为各已批准路由使用的常见 UI 原语提供共享基础组件层。\n- **FR-011**: 基础组件层和 shell 视觉语言 MUST 与 Mystra 的 Claude design-system 方向保持一致，以便主题、token 和组件行为在框架内一致。\n- **FR-011a**: 当前 025 表面使用的 Castrel v2 通用组件 anatomy、density、padding 和交互状态 MUST 迁移到 Mystra-owned 共享组件；Castrel palette、业务 API 和未使用的领域组件 MUST NOT 被机械复制。\n- **FR-011b**: shell、New、Search、Inbox、Issues 与 Settings 的可见 color、background、border、focus、padding、gap、height 和 radius MUST 通过 semantic theme token 消费，非 4px 特殊值 MUST 使用命名 token。\n- **FR-012**: shell MUST 为导航、页面框架和共享交互模式提供跨路由一致结构，而不是让每个页面定义不兼容 shell。\n- **FR-013**: shell MUST 在支持的窄视口和宽视口中提供共享响应式行为。\n- **FR-014**: shell MUST 支持 light mode 和 dark mode。\n- **FR-015**: 当产品定义不同视觉主题时，shell MUST 支持超出 light/dark 外观模式的主题切换。\n- **FR-016**: shell MUST 支持国际化，使已批准导航和框架自有文案可以用受支持语言或可预测 fallback 呈现。\n- **FR-017**: shell MUST 保持项目管理面层级：API 为真相，skill/MCP 和 CLI 仍是优先 programmable interfaces；UI 框架 MUST NOT 成为管理语义的唯一 owner。\n- **FR-018**: shell MUST 将 workspace 视为 session-scoped execution-context 概念，MUST NOT 用 workspace 表示 hosted product structure 的 tenancy。\n- **FR-018a**: Settings MUST 按 `Account`、`Appearance`、`Team`、`Integrations` 四个 Tab 组织；Theme 与 Language MUST 归入 `Appearance`，租户术语 MUST 使用 `Team`。当前 MVP 不支持的 Account 或 Team 写操作 MUST 显示为 read-only/unavailable，不得由 UI 伪造持久化。\n- **FR-019**: MVP shell 框架 MUST 保持 private-operations focused，MUST NOT 在可用前要求 caller auth、logs API、retry API、public SaaS tenancy management 或其他当前 out-of-scope platform features。\n- **FR-020**: 025 的后续页面实现切片 MUST 能在不改变已批准 navigation taxonomy 或 shell-level ownership model 的前提下，为某个已批准 surface 添加路由内容、动作和数据呈现。\n- **FR-021**: shell 框架 MUST 保持与未来 Electron host 的兼容性，使导航、layout archetype、theme system、internationalization 和 base components 可复用，而无需重新定义框架合同。\n- **FR-022**: 未来 Electron shell 所需的任何环境特定行为 MUST 被隔离在显式 seam 之后，而不是作为 web-only 假设嵌入共享框架合同。\n- **FR-023**: shell 默认 UI 字号 MUST 为 12px，sidebar menu row MUST 使用 28px 紧凑行高和 token-derived hover/selected state。\n- **FR-024**: Tasks section MUST 按 Project 分组；每个 Task 的 icon MUST 表达其最新 Session 状态，无 Session 时使用明确的 idle icon。\n- **FR-025**: `Automations` 在本 demo/PR 切片中 MUST 只是 presentation-only shell entry，MUST NOT 引入 workflow API、持久化或平台编排语义。\n- **FR-026**: shell MUST 平移 Castrel UX 的结构、密度、层级与交互模式，并以 dark-tech design system 作为具体颜色来源：canvas `#111513`，surface `#181C1A` / `#202522` / `#2B312D`，ink `#E7ECE8` / `#AAB4AD` / `#76817A`，executor `#74B98B`，以及已批准 signal colors；统一使用等宽字体、0/2/4/6px radius、flat elevation，且不得使用 gradient、glow、glass 或 noise。\n- **FR-027**: `New` surface MUST 在主内容区域居中显示产品 Logo 和 Task 输入 composer；composer MUST 使用 Castrel 密度：默认 3 行输入高度、输入区 9/7/7/9px 内边距、无分隔线且透明的 ghost footer。footer 左侧 MUST 依次提供附件、Repository 和 Issue controls，右侧 MUST 提供语音输入和发送 controls。未被现有 API contract 支持的 control MUST 清楚表现为不可用，不得伪造提交成功。\n- **FR-028**: `Search` MUST 以 modal 形式覆盖当前 route，并支持按 Task id、objective、Issue、repository 或最新 branch 过滤和导航。\n- **FR-029**: 主侧边栏 MUST 支持显式收起与展开，并持久化该 preference；收起状态 MUST 将侧边栏完整压缩为 0px 并移除其交互命中，不得保留 icon rail。此时主区域 header MUST 提供 Mystra brand、`New` action 与重新展开 control。\n- **FR-030**: `Automations` 之后 MUST 显示 Projects section，且 Project item MUST 导航到对应 Project detail route；Projects 与 Tasks section heading MUST NOT 显示 count，Projects heading 右侧 MUST 提供 ghost-style add Project action；Project-grouped Tasks 继续作为其后的独立 section。\n- **FR-031**: `Inbox` MUST 使用标准 master-detail 布局：左侧为最新 Session 处于 `waiting_for_review` 的 Task 卡片列表，右侧为当前选中 Task 的只读详情；`Issues` 继续使用当前 Task table。Inbox 列表 MUST 支持搜索、刷新、明确选中态、加载态、空态与窄视口降级，右侧详情 MUST 提供进入完整 Task 对象页的入口。\n- **FR-032**: 主区域 header MUST 只显示当前 surface title，不得显示 `local control plane`、`本地控制平面` 或等价环境说明。\n\n### 关键实体\n\n- **Operations Shell**: 组织顶层导航和共享页面框架的框架级 UI 容器。\n- **Main Sidebar**: 已批准顶层路由的共享主导航栏。\n- **Navigation Model**: 已批准顶层菜单集合及其路由身份。\n- **Page Frame Contract**: 后续页面级 spec 添加内容时继承的共享 shell 结构。\n- **Layout Archetypes**: 已批准框架布局 `chatLayout`、`dashboardLayout` 和 `readLayout`。\n- **Base Component Layer**: 各路由共享的 UI 原语和交互模式集合。\n- **Theme System**: 框架拥有的主题、token 和外观模型，与 Mystra Claude design-system 方向对齐。\n- **Shell Preferences**: 框架拥有的 appearance、theme、locale 和其他跨路由共享 UI 设置。\n- **Project-grouped Tasks**: 侧边栏中的 Task 导航列表，按 Project 聚合，并用最新 Session 状态决定 Task icon。\n- **Placeholder Route State**: 已批准页面在专属 feature spec 尚未实现时的有效 shell-level 状态。\n- **Host Shell Compatibility Boundary**: 保持共享 UI 可在当前 web host 与未来 Electron host 之间移植的框架约束。\n\n## 成功标准 *(mandatory)*\n\n### 可衡量结果\n\n- **SC-001**: MVP demo UI 的 primary navigation 只暴露 `New`、`Search`、`Inbox`、`Issues` 和 `Automations`；其下依次显示 Project list 和 Project-grouped Tasks，`Settings` 保持底部 shell action 语义。\n- **SC-002**: shell 提供主侧边栏以及已批准的 `chatLayout`、`dashboardLayout` 和 `readLayout` archetype，作为后续页面实现切片可复用框架原语。\n- **SC-003**: shell 提供 Castrel-derived UX 结构与共享 dark-tech 默认配色、英语/简体中文切换、12px 默认字号、基础组件和响应式行为；dark-tech 源 token 可由自动测试逐项验证，后续页面实现切片无需重新定义。\n- **SC-004**: 操作员可访问每个已批准 navigation surface，并看到一致的 shell-valid 页面框架，即使页面级行为被延后。\n- **SC-005**: 后续页面级 spec 可添加具体路由行为，而不改变已批准 shell taxonomy 或重新定义共享 layout、component 和 preference。\n- **SC-006**: 操作员可在窄视口和宽视口使用 shell，并可切换 light/dark mode、theme 和受支持语言，而不破坏 shell 导航。\n- **SC-007**: 同一框架合同可用于当前 web host，并且不会以阻塞未来 Electron wrapper 的方式被指定。\n- **SC-008**: UI 框架保持为 API、skill/MCP 和 CLI 管理面的二级辅助界面，不需要 MVP excluded platform capabilities 才能有用。\n- **SC-009**: 操作员可在 `New` 页面看到 Castrel 密度的 ghost-footer composer controls、以 modal 搜索 Task、将侧边栏完整收起并从 header 恢复；Projects 与 Tasks heading 不显示 count 且 Projects 提供 add action；在 `Inbox` 中通过左侧卡片切换右侧详情，在 `Issues` 中继续使用 Task table；header 不再出现本地控制平面说明。\n- **SC-010**: 组件迁移清单覆盖当前 025 的全部可见原语，shell、New、Search、Inbox、Issues 与 Settings 不再各自拥有平行 action/surface/field/state 视觉实现；自动测试和浏览器计算样式可验证关键 padding 与配色来自 token。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：025-webui\n\n## 摘要\n\n025 定义 Mystra MVP 操作 Web UI 的框架层能力。它提供面向人类操作者的稳定 shell：统一导航、侧边栏、路由承载、布局范式、基础组件期望、主题与本地化脚手架、响应式行为，以及未来 Electron 宿主兼容边界。\n\n本功能刻意不把页面探索材料等同于已实现业务行为。`New`、`Search`、`Inbox`、`Issues`、`Automations`、Project-grouped Tasks 和 `Settings` 的业务语义、数据解释与操作动作，将作为 025 内独立实现切片接入这个 shell。\n\n## 功能地图\n\n- 建立 Mystra MVP 的操作型 Web UI shell。\n- 固定 primary navigation：`New`、`Search`、`Inbox`、`Issues`、`Automations`。\n- 固定 secondary surfaces：Project-grouped Tasks 与 `Settings` shell modal。\n- 为已批准页面提供共享侧边栏与路由框架。\n- 为 `Inbox` 提供标准 master-detail 检查面：左侧 review Task 卡片列表，右侧选中 Task 详情。\n- 定义共享布局范式：`chatLayout`、`dashboardLayout`、`readLayout`。\n- 建立 shell 基础组件层，供后续页面复用。\n- 保留主题、英语/简体中文、本地化与响应式脚手架；默认 UI 字号为 12px。\n- 默认平移 Castrel UX 的结构、密度和交互模式，并采用 dark-tech 的精确 palette、统一等宽字体、语义 signal colors、0/2/4/6px radius 与 flat elevation；禁止阴影、渐变、辉光、glass 和 noise。\n- 为未来 Electron 宿主保留兼容边界，但不提前实现桌面专属能力。\n\n## 边界\n\n- API 仍是管理能力的事实来源。\n- Skill/MCP 与 CLI 仍是优先的可编程管理界面。\n- 具体页面行为按 025 内独立实现切片承担，不能由 shell 重构顺带臆造。\n- `workspace` 仍表示 session-scoped 执行上下文，不表示租户或产品组织。\n- MVP 排除项继续排除：caller auth、logs API、retry API、公开 SaaS 租户管理、Kubernetes sandbox 以及相关平台能力。\n\n## 分阶段能力图\n\n- 阶段 1：交付共享 shell、固定导航、路由框架和可安全占位的页面槽位。\n- 阶段 2：允许页面级 spec 接入具体路由内容，但不重新定义全局 shell taxonomy。\n- 阶段 3：通过显式宿主边界扩展未来 Electron packaging，而不是把宿主行为混入 Web shell。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：025-webui\n\n## Owner 评审\n\n- [ ] 确认 primary navigation 严格为 `New`、`Search`、`Inbox`、`Issues`、`Automations`，并确认 Project-grouped Tasks 与 `Settings` modal 可达。\n- [ ] 确认 025 只负责 shell/framework 范围，不吞并页面级业务行为。\n- [ ] 确认并入 025 的页面探索材料仍与已实现行为分离，后续按独立实现切片推进。\n- [ ] 确认 Web UI shell 仍低于 API、Skill/MCP 和 CLI 等管理事实来源。\n- [ ] 确认 `prototype.md` 已提供可运行 Control Plane 入口，并把旧独立 HTML 明确标为历史探索材料。\n- [ ] 确认 Inbox 使用左侧 review Task 卡片列表与右侧选中 Task 详情，Issues 继续保留 Task table，并验证窄屏堆叠。\n\n## Spec 就绪度\n\n- [ ] `spec.md` 已描述 shell 层用户场景、需求、实体与成功标准。\n- [ ] 框架负责的事项已经明确：导航、侧边栏、路由承载、布局范式、基础组件、主题、本地化、响应式与 Electron 兼容边界。\n- [ ] 被推迟的页面行为已与 shell 行为分离。\n- [ ] MVP 排除项足够可见，避免后续 agent 把它们偷偷塞回当前切片。\n- [ ] 面向用户、评审者和后续 agent 的说明默认使用中文，必要英文仅保留为标识符、路径、命令或产品名。\n\n## 后续插件检查\n\n- [ ] `FEATURES` tab 通过固定路径加载本文件的同级 `features.md`。\n- [ ] `CHECKLISTS` tab 通过固定路径加载本文件。\n- [ ] `PROTOTYPE` tab 通过固定路径加载 `prototype.md`，并由该文件指向独立 HTML 原型。\n- [ ] renderer 不解析 `spec.md` heading，也不从标准 Spec-Kit 文件中推断产品结构。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 原型：025-webui\n\n## 当前实现入口\n\n- 启动 `pnpm --filter @mystra/control-plane exec next dev -p 3100` 后打开 `http://127.0.0.1:3100/`。\n\n## 历史原型入口\n\n- [打开交互式高保真 HTML 原型](mockups/index.html)\n- [打开 Settings Modal 布局迁移原型](mockups/settings-modal.html)\n\n## 覆盖范围\n\n当前可运行 Control Plane 是本切片的权威 demo/PR 表面。下列独立 HTML 是此前 shell/layout 探索材料，不再拥有当前 navigation taxonomy。\n\n当前实现平移 Castrel UX 的结构、密度与交互模式，并使用 dark-tech design system 的具体配色；历史 HTML 原型只用于布局交互参考，不再拥有颜色、字体、radius 或 elevation 的设计系统权威性。\n\n当前组件迁移的权威清单见 [`component-migration.md`](component-migration.md)。运行态必须使用 Mystra-owned 共享组件和主题 token；Castrel v2 只拥有来源 anatomy、density、padding 与交互证据，不拥有运行时 palette 或业务语义。\n\n- `New`：主区域居中的产品 Logo 与 Task composer；输入区默认 3 行并使用 9/7/7/9px 内边距，ghost footer 无分隔线，左侧是附件、Repository 和 Issue，右侧是语音输入和发送。\n- `Inbox`：使用标准 master-detail 布局；左侧显示最新 Session 处于 `waiting_for_review` 的 Task 卡片，右侧显示当前选中 Task 的只读详情与完整对象页入口。\n- `Search`：从侧边栏打开 modal，在不离开当前 route 的前提下过滤并导航 Task。\n- `Issues`：`/tasks` 继续使用 Castrel-aligned Task table，不跟随 Inbox 改为 master-detail。\n- `Automations`：presentation-only shell entry。\n- `Settings`：左下角入口打开 modal 组件，不再作为 route 页面；设置容器采用 Castrel Settings 的 `240px + 内容区` 双栏、左侧 identity/search/tab、44px 内容标题栏和独立滚动区。Tab 固定为 `Account`、`Appearance`、`Team`、`Integrations`；Theme/Language 位于 Appearance，GitHub connection 位于 Integrations，Account/Team 的未支持写操作保持只读/不可用。\n- `Projects`：位于 `Automations` 下方，heading 不显示 count，右侧 ghost plus 进入 Project 创建表面；Project item 直接导航到 Project detail。\n- 左侧 sidebar 的 `Tasks` section 按 Project 分组，Task icon 映射最新 Session 状态。\n\n## 使用方式\n\n1. 打开本 feature 的 Spec View：`specs/025-webui/index.html`。\n2. 切换到 `PROTOTYPE` tab。\n3. 点击上方原型入口，在独立页面打开 `mockups/index.html`。\n4. 在原型左侧导航中切换 route，检查 navigation、layout archetypes、placeholder framing 与视觉方向是否一致。\n5. 打开 Search modal，输入无匹配和有匹配查询，确认焦点、空状态、关闭和 Task 导航。\n6. 收起/展开左侧栏，检查收起时 sidebar 完整变为 0px 且没有 icon rail；header 显示 Mystra brand、`New` 与重新展开 control。\n7. 打开 New、Inbox 和 Issues，检查居中 composer、Inbox 左卡片/右详情布局与 Issues table；确认主 header 不显示环境说明。\n8. 打开 `mockups/settings-modal.html` 或运行中的 Settings，检查 920×760 上限、四个 Tab、Appearance 中的 Theme/Language、Integrations 中的 GitHub 状态、搜索过滤、选中态、Escape/backdrop close，以及 320/768/1024/1440px 重排。\n\n## 补充截图\n\n- [chatLayout](mockups/screenshots/chatlayout.jpg)\n- [chatLayout 打开右侧栏](mockups/screenshots/chatlayout-inspector.jpg)\n- [readLayout](mockups/screenshots/readlayout.jpg)\n\n## 当前限制\n\n- 原型是交互式高保真 HTML review artifact，不是生产实现。\n- 原型中的 route 内容区只放一个大 layout placeholder，不展示页面业务数据、组件网格、消息结构或真实 API 行为，也不会提交任务。\n- 所有可见交互都应有动画反馈，包括 route 切换、hover/selected、左侧栏完整展开/收起、右侧栏开合与 placeholder 入场。\n- 页面级业务能力仍由 025 内后续实现切片定义；当前原型只确认 shared shell、route taxonomy、layout archetypes 与兼容边界。\n- 如果后续 prototype plugin 接管该产物，应保持 `prototype.md` 作为 `PROTOTYPE` tab 的固定入口说明。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1785760071700"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# 实施计划：MVP 操作 Web UI 框架\n\n**Branch**: 本地 `main`（逻辑 feature id `025-webui`） | **Date**: 2026-05-20 | **Spec**: `specs/025-webui/spec.md`\n**Input**: 来自 `/specs/025-webui/spec.md` 的功能规格\n\n## 摘要\n\n将 025 Web UI 框架实现为现有 `@mystra/control-plane` Next.js 应用的 shell 层。当前切片复刻 Castrel 的紧凑侧边栏结构：primary menu 为 `New`、`Search`、`Inbox`、`Issues`、`Automations`，其下用 Project 分组展示 Tasks，Task icon 映射最新 Session 状态，`Settings` 作为底部 modal 入口并承载 theme/language。035/036 已交付对象页继续可达。\n\n## 技术上下文\n\n**Language/Version**: TypeScript 5.9, Node.js 24\n**Primary Dependencies**: Next.js 16, React 19, 现有 control-plane theme system, Castrel UX implementation/reference, dark-tech design system\n**Storage**: 仅使用浏览器 `localStorage` 保存 shell 偏好；不改变业务状态存储\n**Testing**: `pnpm --filter @mystra/control-plane typecheck`, `pnpm --filter @mystra/control-plane test`, 浏览器预览验证\n**Target Platform**: 桌面优先的内部 Web UI，并响应窄视口\n**Project Type**: Next.js Web 应用\n**Performance Goals**: shell 只轮询现有 `/api/tasks` 与 `/api/projects`，不新增 API 或持久化合同\n**Constraints**: 保持 API-truth 和 headless management 优先级；不加入页面级产品行为、caller auth、logs API、retry API 或 hosted tenancy 功能\n**Scale/Scope**: `apps/control-plane/app` 中的一个 shell 框架，五个 primary menu entries、一个 Project-grouped Tasks section、Settings modal、三个 layout archetype，theme/i18n 脚手架\n\n## 宪章检查\n\n- **规格拥有产品边界**：通过。025 仍是 shell/framework 范围，并明确延后页面级行为。\n- **服务边界使用类型化合同**：通过。本计划不引入 API、持久化、MCP 或 runner 合同变更。\n- **Provider 是可替换边界**：通过。不变更 provider 实现。\n- **Runner 隔离和 secret hygiene**：通过。不变更 runner、容器或 secret 处理。\n- **交付前验证与文档**：必须执行。plan、contracts、tasks 和浏览器验证需要与 shell 行为保持一致。\n\n## 项目结构\n\n### 本功能文档\n\n```text\nspecs/025-webui/\n├── spec.md\n├── features.md\n├── checklists.md\n├── prototype.md\n├── plan.md\n├── research.md\n├── data-model.md\n├── quickstart.md\n├── contracts/\n│   └── shell-contract.md\n└── tasks.md\n```\n\n### 源码结构\n\n```text\napps/control-plane/\n└── app/\n    ├── _components/app-shell.tsx\n    ├── globals.css\n    ├── layout.tsx\n    ├── page.tsx\n    └── theme-system.ts\n```\n\n**结构决策**：本切片保留在现有 control-plane app 中。`_components/app-shell.tsx` 是 shell taxonomy、主题和 Settings action 的第一实现面；现有 route pages 继续拥有对象页内容，尚未实现的页面保持 placeholder/read-only。\n\n## 设计与实施方向\n\n- 组件迁移以 `component-migration.md` 为清单：来源固定为 Castrel v2 `castrel-demo-v2` 的 `cdce88e2fff4667f306961ded4995d14b987a17e`，只迁移当前 025 表面实际使用的通用组件 anatomy、density、padding 与交互状态。\n- 在 `_components` 下建立 Mystra-owned 共享 UI 原语，并用它替换 shell、New、Search、Inbox、Issues 与 Settings 中的页面级 action、surface、field、dialog 和 state 实现。\n- spacing、control height、padding、radius、surface、text、border、focus 和 semantic signal 全部通过 `theme-system.ts` 输出的 CSS token 消费；Castrel 的 `9/7/7/9px` composer inset 等非 4px 特殊值必须使用命名 token。\n- 在 `_components/app-shell.tsx` 中定义小型 shell model：已批准菜单项、Project-grouped Task navigation、框架自有 label 和 placeholder state。\n- 保留 `theme-system.ts` 的 config-driven 架构；默认暗色 preset 继续使用不经混色的 explicit token map，并以 dark-tech palette 为颜色事实来源；保留其他 preset 以满足 025 的 light/dark theme scaffold。\n- 将 Castrel UX 的布局、密度和交互规则与 dark-tech 的 monospaced typography、0/2/4/6px radius、flat elevation、signal semantics、reduced-motion 规则同步到 `globals.css` 和 `mystra-ux` durable reference。\n- 为框架自有文案引入 i18n 脚手架，不在本切片翻译页面级业务行为。\n- 将现有 Task、Session、Runner 与 Project 对象页保留为直接可达 routes；不通过导航重构删除已交付能力。\n- 代码现实依据：现有 shell 在 `apps/control-plane/app/_components/app-shell.tsx`，overview 在 `apps/control-plane/app/page.tsx`，主题在 `apps/control-plane/app/theme-system.ts`，视觉方向和 shell mockup 函数在 `specs/025-webui/mockups/render-mockups.cjs`。\n\n### UX Intent：Settings Modal 布局迁移\n\n- **目标**：将 `/Users/arcadia/Documents/castrel-ai/frontend/components/pages/settings/SettingsModal.tsx` 的设置容器布局与紧凑交互语言迁移到 Mystra，并按 `Account`、`Appearance`、`Team`、`Integrations` 四个 Tab 梳理信息架构；Theme 与 Language 归入 Appearance，租户术语使用 Team。\n- **保留**：Mystra 现有 Theme/Language 数据、localStorage key、即时切换语义、GitHub connection 行为、中文/英文框架文案和 native dialog 键盘行为。\n- **迁移**：`920px × 760px` 上限、`240px + minmax(0,1fr)` 双栏、44px 内容标题栏、左侧 identity/search/tab 导航、28px 紧凑控件、内容区独立滚动，以及窄屏单栏重排。\n- **设置行组件**：复用已迁移的 Mystra-owned `SettingGroup` / `SettingRow`，对齐 Castrel v2 的左侧标题/说明、右侧控件 anatomy 和 32px 行间距；不复制 Castrel 业务状态或 palette。\n- **不迁移**：Castrel 的 Workspace、Billing、Usage、Agent permissions 等业务能力；Account 与 Team 在当前 MVP 只诚实显示只读/不可用状态，不创建 UI-owned 持久化。Castrel 的暖色具体 token、14px 圆角与 modal shadow也不迁移。\n- **状态与无障碍**：覆盖 selected、hover、focus、无搜索结果、320/768/1024/1440px；tab 使用 `tablist/tab/tabpanel` 语义，modal 使用 native `<dialog>` 保持 focus trap、Escape 和 backdrop close。\n- **影响依据**：GitNexus 对 `ShellSettings` 与 `AppShell` 的 upstream 分析均为 LOW；唯一直接调用方为 `AppShell`，间接影响 `RootLayout`，不触及 API、持久化或 Runner 流程。\n\n### UX Intent：主题与密度一致性修复\n\n- **体验问题**：当前 shell 在 768px 仍保留 300px sidebar，在 320px 初始覆盖内容；页面、搜索、Inbox、表格和设置多次叠加 inset，桌面按钮统一膨胀到 44px；主题切换还存在首帧回退到默认色和非默认 preset 改用比例字体的问题。\n- **影响表面**：共享 shell/header/sidebar、New、Search、Inbox、Issues/Tasks table、Projects 与对象页的通用 page frame、Settings、所有 selectable theme preset，以及 loading/empty/error/selected/focus 状态。\n- **固定规则**：使用 4/8/12/16/20/24/32/48/96px spacing scale；page inline 为桌面 16px/窄屏 12px，page top 12px、bottom 32px，panel 16px、modal 20px、popup 16px，layout gap 12px，stack gap 8px；composer 的 9/7/7/9px 是明确来源特例。radius 只允许 0/2/4/6px。Castrel-derived action 为 compact 24px、header/navigation 28px、default 32px，standard field 36px，coarse pointer hit target 44px。\n- **主题规则**：所有 preset 保持 Fira Code/Maple Mono monospace；保存的主题必须在 React hydration 前同步应用，hydration 未读取 preference 前不得回写默认主题。\n- **响应式与无障碍**：`<=1024px` sidebar 变为默认关闭的 overlay，由共享 header 打开，带关闭按钮、backdrop 和 route-change dismissal；`<=700px` 内容列堆叠。桌面视觉密度不得以牺牲 44px touch hit area、focus、ARIA name 或键盘关闭能力为代价。\n- **数据与性能**：shell、Inbox 与 Issues 对 `/api/tasks` 使用同一共享轮询资源，避免三个组件独立请求相同数据；不改变 API、缓存或持久化合同。\n- **风险与验证**：GitNexus 对 `AppShell`、`RootLayout`、`buildThemeCssVariables`、`applyThemeToDocument`、`TasksPage` 和 `InboxPage` 的 upstream 风险均为 LOW。用主题单测、control-plane 全量 test/typecheck/build、GitNexus change detection、HTTP 200，以及 1440/1024/768/320px 真实浏览器检查首帧主题、字体、sidebar、overflow、control height、focus 与 console。\n\n## 阶段 0：研究\n\n研究决策记录在 `research.md`。\n\n## 阶段 1：设计\n\n设计产物：\n\n- `data-model.md`：shell 级实体和偏好概念。\n- `contracts/shell-contract.md`：路由 taxonomy、layout archetype、placeholder、theme、locale 和 Electron 兼容合同。\n- `quickstart.md`：桌面、窄视口、主题、语言环境和路由 placeholder 行为的验证路径。\n- `prototype.md`：可打开的独立 HTML 原型入口和覆盖范围。\n\n## 复杂度追踪\n\n不需要 constitution 例外或复杂度豁免。\n"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# 任务：MVP 操作 Web UI 框架\n\n**Input**：来自 `/specs/025-webui/` 的设计文档\n**Prerequisites**：`plan.md`、`spec.md`、`research.md`、`data-model.md`、`contracts/shell-contract.md`、`prototype.md`\n\n**Tests**：025 会改变用户可见 shell 行为，因此需要包含聚焦 typecheck/test 任务和浏览器验证。\n\n## 阶段 1：准备\n\n- [x] T001 审查 `specs/025-webui/contracts/shell-contract.md`，在编辑 `apps/control-plane/app/_components/app-shell.tsx` 前确认已批准 r `SettingRow` 对齐 Castrel v2 设置行 anatomy；Account/Team 未支持写操作保持诚实只读。\n- [x] T060 重新渲染 025/039 Spec View，并运行 11/11 focused tests、96/96 control-plane tests、typecheck、production build、`git diff --check` 与真实浏览器回归；四 Tab、搜索、Theme/Language、GitHub 状态、320/768/1024/1440px、accessibility tree 和 0 console error/warning 均通过。本地 `file://` Spec View 被应用内浏览器安全策略拒绝，未规避策略。\n\n## 依赖与执行顺序\n\n- 阶段 1 可以立即执行。\n- 阶段 2 阻塞所有 story work。\n- US1 与 US2 都是 P1；先实现 US1，让 route navigation 存在，再实现 US2，让后续页面实现切片获得稳定 attachment points。\n- US3 与 US4 可在阶段 2 完成、且 US1 route frame 存在后推进。\n- US5 在 shell constants 存在后独立推进。\n- 验证在选定 implementation slice 之后执行。\n\n## 并行机会\n\n- T002、T003、T004 可以并行。\n- T015/T016 与 T017 可以在 route frames 存在后按 `page.tsx` 与 `globals.css` 拆分。\n- T019 与 T020 可以在 layout names 固定后按 `page.tsx` 与 `globals.css` 拆分。\n\n## 实施策略\n\n1. 先构建 shell route model 和 navigation。\n2. 在优化 content 前，让每个已批准 route 都渲染一个有效 frame。\n3. 除非另一个 spec 拥有页面行为，否则保持 placeholder/read-only。\n4. 每个 story 独立验证后，再继续更广泛的 polish。\n"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
