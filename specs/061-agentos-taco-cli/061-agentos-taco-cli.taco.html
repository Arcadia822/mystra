      "path": "specs/061-agentos-taco-cli/plan.md",
      "mediaType": "text/markdown",
      "content": "---\ntitle: \"061 实施计划与工程审查\"\nspec: \"spec.md\"\nstatus: \"工程审查通过，待实施验证\"\n---\n\n## 概要\n\n复用现有 Runner 构建命令和 AgentOS software 机制。构建时固定 Taco npm 包及本地 skill 来源，产生标准 `.aospkg` 与 skill 目录；Session 启动只消费本地产物，不在线安装。受信任部署变量显式启用 HTTPS 发布 origin。\n\n## 技术上下文\n\nNode 24.14.0、pnpm 10.25.0、AgentOS core/toolchain 0.2.19、Pi 0.2.7、Taco CLI 0.1.3、Vitest。仅 Runner 构建与适配器变更，无数据库或 HTTP API 新增。目标是 c1 Linux AgentOS guest，保持 Host Runtime 不变。\n\n## 宪章检查\n\n保留 Team/Task/Session 权限，复用 060 guest Control Plane 能力与模型秘密清理。Taco 不接收 Project、模型或平台凭据。公开上传只用无秘密合成样例。本地 skill 仍是文件工作流，发布是显式 Agent 操作。无 UI、无需 prototype；无新领域实体或数据模型，配置合同直接记录于本计划。\n\n## 现有能力与复用\n\n- `build-agentos-cli.mjs`：已有 guest CLI 发布目录 `dist/agentos`，复用同一构建入口，不改变原命令。\n- `guestCliDirectory()`：已有部署目录覆盖变量 `MYSTRA_AGENTOS_GUEST_CLI_DIR`，沿用。\n- `permissionsForEndpoints()`：保留模型和 Control Plane 规则，添加一个经过严格校验的可选 Taco origin。\n- AgentOS `software`：负责包校验、只读投影和 PATH 命令注册。不使用 shell 包装器或宿主执行兜底。\n- 上游 skill：固定 Git commit `410a425e50bcc10b7c89ad6015c4b67e7dc7d418` 下 `skills/taco/SKILL.md` 与 `taco-shell.html`，构建时读取官方 URL；本次只预装组装所需文件，不宣称模板包可用。\n\n## 配置与数据流\n\n`MYSTRA_AGENTOS_TACO_HOST_URL`：未设置时禁用；设置时必须是无凭据、无 path/query/fragment/通配符的 HTTPS origin。值仅由宿主配置读取，不从 Workspace 读取。有效值传给 guest `TACO_HOST_URL`。\n\n```text\n固定 npm CLI + 固定 skill 源码\n  -\u003e Runner 构建 -\u003e dist/agentos/taco-cli.aospkg + taco-skill/\n  -\u003e 正式 runPiInAgentOs\n  -\u003e software 装载 + 既有只读 CLI 目录\n  -\u003e guest taco-cli publish -\u003e 指定 HTTPS origin\n```\n\n`dist/agentos/taco-cli.aospkg` 在启用时必须存在，skill 两文件必须存在；否则创建 VM 前报错。guest 指令提供 `TACO_SKILL_PATH`，要求先阅读 skill，说明公开上传、免鉴权和网络 update 不可用。未启用时保持既有指令与 env 不变。\n\n## 工程审查\n\n### 影响证据\n\nGitNexus 本工作树索引与 main `a66bb12` 一致；注册名 mystra 有多个工作树，因此使用已注册绝对工作树路径消歧。`runPiInAgentOs` upstream 为 Pi shim（1 个直接调用方）；`permissionsForEndpoints` upstream 为该函数和 shim，均 LOW。LSP 确認出口函数的调用仅位于适配器；跨文件 shim 调用由 GitNexus 补齐。\n\n### 决策与风险\n\n- 不用裸 npm JS 文件/shebang 模拟 PATH 工具：已验证 toolchain 的软件目录及 `.aospkg` 均能直接运行 `taco-cli help`。\n- toolchain `pack` 默认返回 tar，core 将文件当作 `.aospkg`：必须调用官方 `packAospkgFromTar`，不可把 tar 改扩展名冒充。\n- 配置 origin 不接受 URL pattern 元字符，避免网络规则变为通配符；非法输入与未配置路径由回归测试覆盖。\n- `.aospkg` 缺失或 skill 缺失清晰报错；正式 guest 的 package load 错误不吞掉。\n- 新 VM 与恢复 VM 均重新装载固定软件，Session 状态无需迁移。\n- 发布网络失败由真实 CLI 返回，不添加重试、队列、别名或兼容层。\n- 构建网络失败立即失败，不写成功标记；只在构建时获取固定公开源，不在执行任务时下载。\n\n架构、代码质量与性能审查无未决方案；安全边界测试和 c1 真实执行是验收门槛。顺序实施，适配器与构建目录共享边界，不拆并行工作流。\n\n## 验证\n\n1. 先添加可选 origin 的负向与 allowlist 合同测试，再改适配器。\n2. 构建真实 `.aospkg`，在 c1 guest 直接执行帮助、读取 skill、离线组装与 dry-run。\n3. 通过正式适配器实际 Session 路径发布无秘密样例，验证返回 URL 和公开内容；再重建 VM 验证 CLI 仍存在。\n4. guest 对未授权目标失败；未配置 Taco 时原有规则不变。\n5. Runner 定向测试、typecheck、代码审查；不重启无关服务、不改已有数据库。\n\n## 不在范围内\n\n上游 Taco 功能开发、AgentOS SDK 升级、通用插件注册、私有 ACL、CDN 通配符放行、自动发布真实仓库、#47 已有协议修复。回滚恢复原适配器/产物并移除启用变量，不删除 Session 数据。\n",
      "sourceHash": "627a268a4ff6d0025345bbac8923154fbf0f40109f0ac17af7f1e149acac8cf0"

      "mediaType": "text/markdown",
      "content": "# 061 构建、部署与验收记录\n\n## 构建\n\n使用仓库 Node 24.14.0 / pnpm 10.25.0：\n\n```sh\npnpm --filter @mystra/shared build\npnpm --filter @mystra/runner-daemon build:agentos-cli\npnpm --filter @mystra/runner-daemon test\npnpm --filter @mystra/runner-daemon typecheck\n```\n\n`apps/runner-daemon/dist/agentos/` 包含 `mystra-agent.cjs`、`taco-cli.aospkg` 和 `taco-skill/{SKILL.md,taco-shell.html}`。构建阶段需要 npm 依赖和固定 GitHub commit 的资源；任务执行阶段不需要安装或下载。不要把中间 `.tar` 当作 `.aospkg`。\n\n部署当前 `agentos-runner.mjs` 到 Pi shim 相邻目录；将上述产物放到 `MYSTRA_AGENTOS_GUEST_CLI_DIR`。设置：\n\n```sh\nMYSTRA_AGENTOS_TACO_HOST_URL=https://tacobin.arcadia-han.com\n```\n\n这只增加 `tcp://tacobin.arcadia-han.com:443`，不增加 blob CDN、GitHub 或全网出口。返回 URL 的浏览器读取不等于 guest 获得对应 CDN 访问权。没有配置时不加载 Taco software，也不注入 Taco 环境或新增出口。\n\n## 2026-09-22 实测\n\n### 本机\n\n- 官方 CLI 0.1.3 + toolchain 0.2.19 成功构建 canonical `.aospkg`。\n- Skill 固定上游 commit：`410a425e50bcc10b7c89ad6015c4b67e7dc7d418`。\n- 新出口测试先红后绿；增加缺失产物失败关闭回归后，runner 包 **13 文件 / 63 测试通过**，typecheck 通过。\n- 初次 runner 全测有 2 个注册 schema 失败：合并 main 后 `@mystra/shared/dist` 仍是旧版本、缺少 `workloadInstruction`。重建 shared 后全部通过；没有修改 schema 或放宽验证。\n\n### host-c1 部署\n\n- 部署前两份 adapter 的 SHA-256 均与当前 main 基线一致：`1a3afb8a773a60bd5bc227a94514411805d21e83de446ff507c524b0ce34f53c`。\n- 新 adapter 部署到 `/opt/agentos/agentos-runner.mjs` 和 `/opt/mystra/apps/runner-daemon/src/session/agentos-runner.mjs`；原版本备份于 `/root/.mystra/backups/myst25-20260922/`。\n- Taco 包及 Skill 部署于 `/opt/agentos/guest-cli/`；保留原 workload CLI。\n- `/etc/systemd/system/mystra-agentos-runner.service.d/30-taco.conf` 设置显式 Taco HTTPS origin。\n- 只重启 `mystra-agentos-runner.service`；服务 active，Runtime `b5797837-160d-4340-8371-8820af16d830` 重新注册成功。未修改 Control Plane、Project 凭据或 Vercel 设置。\n\n### 真实 guest 验证（不是普通 Task/Session 验收）\n\n使用已部署 `.aospkg`、只读 Skill 挂载与生产 `permissionsForEndpoints`，两次独立创建并销毁 AgentOS VM：\n\n- 两轮 `taco-cli help` 均 exit 0，`binaryVersion=0.1.3`。不是宿主 PATH 代跑。\n- 两轮可读取 `SKILL.md`（16,462 bytes）及 `taco-shell.html`（732,401 bytes）。\n- 两轮 dry-run 成功，内容 hash 相同。\n- 两轮改投未放行 `https://example.com` 均 exit 1 / `fetch failed`。\n- 第一轮真实 publish 成功，无认证键、Project 凭据、模型 key 或 execution code。\n- 另一个全网 deny、零放行规则 VM 中，`taco-cli skills read taco` 和 `publish --dry-run` 均 exit 0，证明这两个命令不依赖网络。\n- 已删除本次创建的两个 probe 脚本、宿主临时 npm 安装目录及打包中间件；保留部署产物、回滚备份与合成验收证据。\n\n公开合成结果：\n\n- URL：\u003chttps://tacobin.arcadia-han.com/t/64f09b5b-8be6-479e-864f-1c0b9e3d9e5e\u003e\n- 发布时间：`2026-09-22T08:35:39.858Z`\n- Payload：380 bytes；`sha256:824916e4172f24db6d2a0634fee7ecb03b06d3f2e708b724b59e979b9891160a`\n- 唯一源文件：`myst25-smoke/spec.md`，91 bytes；正文声明 `Public synthetic test. No repository data or credentials.`\n- 浏览器已加载发布页面，DOM 中的标题和正文与样例一致。截图工具先报告零宽度，调整 viewport 后截图超时；不声称截图验收成功。\n- c1 保留合成 HTML 和 `verification.json`：`/opt/agentos/tasks/myst25-public-smoke/`。\n\n## 未完成的最终门禁\n\n普通授权 Task/Session 的首轮已通过，SC-004 / T008 仅剩同 Session 续接与新 VM 恢复验证。续接的 HTTP/MCP/CLI 入口由尚未完成的 MYST-28 提供；不直接写事件表替代入口。\n\n初始 401 已解决：用户授权注册独立测试账号，并选择用现有 `gh` 身份通过正式 API 配置独立测试 Project。API 注册和登录成功，CLI 读取会话及创建 Task 成功；未修改数据库授权、冒用既有用户或抽取 execution code。\n\n测试账号 `myst25_d006bfa0`（User `d5d4f0f0-8e35-4543-9797-126f070d3b26`）拥有独立 Team `871a9018-c0f3-4af9-9fe1-0ac6b2af8f7e`。通过正常 Connection API 将获准使用的 GitHub 凭据存入 SecretProvider；Project `8288b93f-e765-4999-b1f6-d3ad4f5aadd9` 只绑定公开仓库 `octocat/Hello-World`、稳定 ID `1296269`、基线 `master`。用户明确允许本机 GitHub 凭据用于测试，禁止向他人仓库提交 Issue/PR；本次也不 push。GitHub 凭据不进入 Taco 发布认证。\n\n独立 CLI 登录 bug 已建 [MYST-31](https://linear.app/castrel/issue/MYST-31)：`auth login --password-stdin` 返回 `PASSWORD_INPUT_FAILED`，默认实现调用 `node:fs/promises.readFile(0)`。本次通过正式 `/api/auth/login` 成功登录，再将服务端签发的真实 token 保存到 CLI 既定格式的专用 0600 state 文件；CLI `auth session` 和 `tasks create` 均成功。没有伪造 token。\n\n早期三次正式入口尝试失败，保留历史：\n\n| Task | 结果 |\n|---|---|\n| `7a3d3347-5e60-457f-ae74-745f9777249c` | Start 200；准备期间 runner 于 17:05:42、控制面于 17:06:55 被其他操作重启；Workspace 租约过期 |\n| `5a29e9b7-7fb7-4d95-807e-be21aba9422a` | Start 200；`repository_unavailable`，无法解析远端基线 |\n| `0473c1a7-5181-42bf-9c3e-db919a1228f6` | Start 200、Workspace `efa44a2a-99d6-4ef3-933e-a43c8d1b582f` 进入 preparing，最终 `materialization_failed / Workspace preparation lease expired`；planned Session `e1148e8c-1f4c-4aea-a162-6e6c57c75970` 未创建 |\n\n早期宿主直接 `git ls-remote` 和 `git clone --no-checkout https://github.com/octocat/Hello-World.git` 均观察到 `gnutls_handshake() failed: TLS 链接非正常地终止了`。强制 HTTP/1.1 曾使一次 ls-remote 成功，但后续 clone 仍失败；临时 URL-scoped 配置已撤回。后续使用获准的本机 GitHub 凭据，经 SSH stdin 和进程内 Git 配置执行 ls-remote/clone 均 exit 0；临时脚本和克隆目录已清理。没有关闭 TLS 验证、替换 GitHub 地址或扩大 guest 出口。当前连通性恢复，不据此断言早期 TLS 问题由缺少认证导致。\n\n账号、独立 Connection/Project、失败 Task 均保留用于后续复测。测试账号密码与真实 CLI session state 仅存操作者本机 `~/.mystra/myst25-test/`，目录 0700、文件 0600，不进入仓库或 Taco。正式 API 的 `task_not_eligible` 也已验证：无 Project 的测试 Task `e771b608-4bee-491e-b19d-b44d81ff7d61` 不会启动生产。\n\n### 普通 Session 首轮验收通过\n\n- Task：`3d0a7b44-d637-443a-bd2a-a9ac8f06ac8b`；Start API 200。\n- Workspace：`d6876b7f-92b0-43be-8ea4-cb93d483aaa2`；`readyAt=2026-09-22T09:31:23.924Z`。\n- Session：`6ba89b0d-1766-422b-84a4-ed1e475b68d9`，Runtime AgentOS / Provider Pi；正式事件包含 created、workspace_attached、runtime_dispatched、response_started、agent_message_chunk、response_completed。最终 `ready`，`stopReason=end_turn`，完成时间 `2026-09-22T09:35:52.446Z`。\n- Agent 报告真实执行 `node \"$MYSTRA_AGENT_PATH\" context get`、`taco-cli help`（0.1.3）、`skills read taco`、读取本地 Skill/shell、组装 HTML、dry-run 和 publish。\n- 发布 URL：\u003chttps://tacobin.arcadia-han.com/t/5dec9fa4-c259-4d01-b2b1-eec16b0b3dcb\u003e；发布时间 `2026-09-22T09:35:43.561Z`。\n- 独立读取公开 blob，确认唯一文件 `myst-25-acceptance/document.md` 只含合成标题和正文 `MYST-25 normal Session acceptance. Public synthetic content only; no repository data or credentials.`；无仓库内容、凭据或评论。\n- 在该 Session durable 事件中检查 38 个唯一工具调用输入：未匹配 `git push`、`gh issue create`、`gh pr create` 或 GitHub Issue/PR API 地址。没有执行远端写入测试。\n\n### 尚未完成：同 Session 续接\n\n[MYST-28](https://linear.app/castrel/issue/MYST-28) 当前为 Todo，明确记录 `SessionService.sendMessage` 尚无 HTTP/MCP/CLI 外部入口；LSP references 也仅找到实现及测试。待该入口落地后向上述 ready Session 发新消息，验证新 VM 中命令、Skill、dry-run 和原 Session capability preflight，再关闭 T008。未通过直接数据库写入或临时冒充外部入口来绕过这一依赖。\n\n## 回滚\n\n移除仅为本特性创建的 `30-taco.conf`，执行 `systemctl daemon-reload` 并重启 AgentOS runner；未配置时适配器保留原始行为。需要恢复代码时，用上述备份分别恢复两份 adapter。不要删除既有 Session 数据、工作区或其他服务配置。\n\n## 审查结论\n\n实现复用现有 readonly mount、software 与出口生成路径，不新增服务/API/DB，不向 Task 暴露任意权限配置。构建依赖版本与 Skill 来源固定；失败不走在线安装或宿主命令兜底。普通 Pi Session 首轮发布已通过；同 Session 续接依赖 MYST-28，因此当前仍不能声明全部验收完成。\n",
      "sourceHash": "d5ee274e18f6d34f557a0aee87cc148138001386b05506a997c5007f110d3420"

      "mediaType": "text/markdown",
      "content": "---\ntitle: \"061 AgentOS Taco 工具预装与发布出口\"\nfeature_id: \"061-agentos-taco-cli\"\ncreated: \"2026-09-22\"\nstatus: \"实现及普通 Session 首轮发布验收完成；续接依赖 MYST-28\"\nissue: \"MYST-25\"\n---\n\n## 用户场景与验证\n\n用户已确认按现有 Taco 上游能力交付，并在 PR #47 合并后从 main 继续。范围是运行环境预装，不扩展 Taco 上游 API，也不改变 Task/Session 授权。\n\n### 场景一：需求 Agent 离线取得工具（P1）\n\n作为需求 Agent，我希望沙盒启动后即可读取 Taco 本地组装说明和 shell，并运行固定版本 CLI，避免任务中安装依赖。\n\n验收：配置 Taco 的 Runtime 创建普通 AgentOS Session 后，`taco-cli help` 返回 `binaryVersion: 0.1.3`，`taco-cli skills read taco` 可用，本地 Taco skill 与 shell 可读；重建 VM 后仍然成立。软件作为 Runtime 只读输入，不由 Workspace 提供。\n\n### 场景二：受限发布（P1）\n\n作为操作者，我希望 Agent 可把明确要求公开的 Taco 上传到配置的发布服务，而不获得任意公网出口或仓库凭据。\n\n验收：`publish --dry-run` 不访问网络；`publish` 返回可访问的 URL，上传内容与公开合成样例一致。默认 deny，只额外允许配置的 HTTPS origin 对应 TCP 资源。未启用时不安装 Taco、不增加出口。非法配置在创建 VM 前拒绝。\n\n### 边界场景\n\n- 发布服务故障或拒绝请求：保留 CLI 非零退出，不伪造成功或自动重试。\n- 包文件缺失：在 VM 创建前失败，不在任务里下载或调用宿主 CLI 兜底。\n- 非 HTTPS、内嵌认证、路径、query、fragment、通配符 origin：拒绝配置。\n- 公网发布无 ACL：仅上传明确允许公开的内容；不上传真实仓库、会话或凭据作测试。\n\n## 功能需求\n\n- FR-001：固定 `@tacobin/cli@0.1.3`；版本验收读取帮助中的 `binaryVersion`，不把无独立实现的 `--version` 当作合同。\n- FR-002：复用 AgentOS software 装载契约注册 PATH 中的 `taco-cli`；不能只证明宿主安装成功。\n- FR-003：预装固定来源的本地 Taco skill 与完整 shell；本地组装仍是 skill 流程，不发明 `bundle` 子命令。\n- FR-004：由受信任部署环境显式配置 HTTPS 发布 origin；不从 Task/Workspace 推导权限，不增加全网或 CDN 通配符。\n- FR-005：当前 publish 是免登录上传；不注入 `TACO_HOST_API_KEY`，不复用 Project、Linear、模型或 Session 凭据。\n- FR-006：保留当前上游能力边界：真实网络 `update` 未实现，不修改上游或伪装更新。\n- FR-007：在 c1 通过正式适配器的预装配置验证 guest 命令与发布，并记录启动路径、出口和真实结果。\n\n## 成功标准\n\n- SC-001：配置后的沙盒无需在线安装即可运行 CLI 并读取本地组装资源。\n- SC-002：公开合成 Taco 发布成功，返回地址与内容可独立核对。\n- SC-003：未配置及非法配置不扩大出口；配置后非允许目标仍被拒绝。\n- SC-004：普通启动、VM 重建与现有 Session 能力探测未被旁路。\n\n## 不在范围内\n\nTaco 上游 bundle/version/update 实现、私有发布、自动发布用户文档、Vercel 权限变更、通用工具目录、任意网络出口和 Task/Session 领域模型变更。\n",
      "sourceHash": "bc040fd6661c9223efc71297135fcf3923ff564c4a3116624b884d78a46d89ac"
    },
    {
      "path": "specs/061-agentos-taco-cli/tasks.md",
      "mediaType": "text/markdown",
      "content": "---\ntitle: \"061 实施与验收任务\"\n---\n\n## 前提与研究\n\n- [x] T001 核对 PR #47 合并与用户范围裁定，记录 `spec.md`。\n- [x] T002 在 c1 用官方 toolchain 证明目录和 `.aospkg` 的 PATH 命令可运行，记录 `plan.md`。\n- [x] T003 GitNexus/LSP 确认适配器影响范围，完成 `plan.md` 工程审查。\n\n## 场景一：固定工具预装\n\n- [x] T004 在 `apps/runner-daemon/package.json` 固定 CLI/toolchain 依赖，扩展 build:agentos-cli 产物；实现 `scripts/build-agentos-taco.mjs`。\n- [x] T005 在 `src/session/agentos-runner.mjs` 接入可选软件包与本地 skill，未配置保持现有行为；复用既有 Session 启动链。\n\n## 场景二：受限发布\n\n- [x] T006 在 `src/session/agentos-runner.test.ts` 验证严格 HTTPS origin、默认关闭及精确出口规则，再实现适配器配置。\n- [x] T007 构建产物并执行 Runner 定向测试与 typecheck（13 文件 / 63 测试通过）。\n- [ ] T008 部署到 c1，真实普通 Session 执行 CLI/skill/发布和 VM 重建验证，记录 `quickstart.md`；验证非允许出口仍拒绝。\n  - 已完成部署、两次真实 VM 的 PATH/资源/dry-run、真实发布、非允许出口失败及零出口离线验证。\n  - 普通授权 Task `3d0a7b44-d637-443a-bd2a-a9ac8f06ac8b` 已完成 Workspace 准备与 Pi Session 首轮公开合成发布，Session `6ba89b0d-1766-422b-84a4-ed1e475b68d9` 为 ready。\n  - **仅剩续接门禁**：依赖 MYST-28 的正式 HTTP/MCP/CLI send-message 入口；不直接写事件表。完整证据见 `quickstart.md`。\n\n## 依赖\n\nT001–T003 → T006 → T004/T005 → T007 → T008。构建和适配器共用产物合同，顺序实施；不为并行而拆分同模块。最终保持上游版本及公开发布约束，不把独立实验等同于正式 Session 验收。\n",
      "sourceHash": "b0e28e65649d22f7764d2d90cdc769d70ef0dff98d28fa83b2d01aa49fc21d3d"

}</script>

    <script>
(async () => {
  var fail = function (message) {
    var node = document.createElement('div')
    node.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:#f4f1ea;color:#20211f;font:15px/1.6 system-ui,sans-serif;text-align:center;padding:40px;z-index:99999'
    node.textContent = message
    document.body.appendChild(node)
    var splash = document.getElementById('taco-splash')
    if (splash) splash.remove()
  }
  if (typeof DecompressionStream === 'undefined') {
    fail('Taco requires a browser with DecompressionStream support.')
    return
  }
  var inflate = async function (id) {
    var text = document.getElementById(id).textContent.trim()
    var bytes = Uint8Array.from(atob(text), function (character) { return character.charCodeAt(0) })
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
    return await new Response(stream).text()
  }
  var moduleUrl = ''
  try {
    var css = await inflate('taco-rt-css')
    var stale = document.querySelectorAll('style[data-taco-transient]')
    for (var index = 0; index < stale.length; index++) stale[index].remove()
    var style = document.createElement('style')
    style.id = 'taco-rt-style'
    style.setAttribute('data-taco-transient', '')
    style.textContent = css
    document.head.appendChild(style)
    var javascript = await inflate('taco-rt')
    moduleUrl = URL.createObjectURL(new Blob([javascript], { type: 'text/javascript' }))
    await import(moduleUrl)
  } catch (error) {
    fail('Taco could not start: ' + (error && error.message ? error.message : error))
  } finally {
    if (moduleUrl) URL.revokeObjectURL(moduleUrl)
  }
})()
</script>
