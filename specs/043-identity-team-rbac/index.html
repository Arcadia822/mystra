    <script id="spec-data" type="application/json">{"feature":"043-identity-team-rbac","title":"043-identity-team-rbac","prototypeHref":"mockups/index.html?v=1786032064149","generatedAt":"2026-08-06T16:01:29.070Z","tabs":[{"id":"spec","label":"SPEC","eyebrow":"Specification","markdown":"# 功能规格：开源本地用户、Personal Team 与 RBAC\n\n**Feature Number**: `043`\n**Feature Directory**: `specs/043-identity-team-rbac`\n**Working Branch**: `main`（Owner 明确要求在当前 branch 更新 043；后续 Spec-Kit 命令必须显式设置 `SPECIFY_FEATURE=043-identity-team-rbac`）\n**Created**: 2026-08-06\n**Status**: Draft — ready for owner review；implementation waits for 040 Prisma RDB integration and product-boundary amendment\n**Goal**: 开源 Mystra 部署后直接进入本地登录页；Human User 使用 username/password 登录和注册，每个 User 始终拥有一个可改名、可加成员的 Personal Team，并可切换、创建和删除其他 Team；Account Settings 支持修改 password 与 display name，Team Settings 支持成员增删和角色管理。\n**Input**: 外部安装流程未来负责提供默认 `admin/admin` 与该用户名为 `Personal` 的 Personal Team；043 不实现安装器或 seed 命令，只定义并消费部署完成后的 bootstrap contract。self-host 不引入 email。SaaS/SSO、Agent authentication、Agent key、Sandbox workload identity 与强认证因子本期不做。\n\n## 用户场景与验收\n\n### User Story 1 - 登录、注册与维护本地账户（Priority: P1）\n\n作为开源 Mystra 的人类用户，我希望部署后进入登录页，以 username/password 登录或注册，并能修改 password 与 display name，以便无需 email 或外部身份服务即可维护自己的账户。\n\n**Why this priority**：登录是所有 Team 与 RBAC 操作的入口。默认凭据如果不强制更换，则也是所有人的入口……这种对称性不值得保留。\n\n**Independent Test**：使用安装流程预置的 `admin/admin` 登录，验证首次登录强制修改 password；注册第二个 User，验证其 Personal Team 自动创建；修改 display name 和 password，验证旧 password 与被撤销 session 不再可用。\n\n**Acceptance Scenarios**：\n\n1. **Given** 部署已按 bootstrap contract 预置 `admin/admin` 与 `Personal` Team，**When** 浏览器首次打开 Mystra，**Then** 默认进入登录页，不自动进入应用 shell。\n2. **Given** `admin` 使用默认 password `admin` 登录，**When** credential 验证成功，**Then** 系统只允许进入强制修改 password 流程，完成后才允许访问 Team 资源。\n3. **Given** 初始化已完成，**When** 新用户提交唯一 username 和有效 password 注册，**Then** 系统原子创建 User、其 Personal Team、Owner membership 与 session。\n4. **Given** User 已注册，**When** 使用正确 username/password 登录，**Then** 系统建立可撤销 session 并恢复或选择一个有效 Team context。\n5. **Given** User 在 Account Settings 修改 display name，**When** 保存成功，**Then** 新 display name 出现在 shell、成员列表和账户页面；唯一登录 username 保持不变。\n6. **Given** User 在 Account Settings 提交当前 password 和符合策略的新 password，**When** 修改成功，**Then** 旧 password 失效，除当前 session 外的其他 session 默认撤销。\n7. **Given** 规范化 username 已被占用，**When** 串行或并发重复注册发生，**Then** 最多创建一个 User/Personal Team，其他请求返回稳定冲突，不产生孤儿 Team 或 membership。\n8. **Given** password 错误、User 停用或 session 已撤销，**When** 请求受保护资源，**Then** 系统在业务副作用前 fail closed，并避免泄漏账户是否存在。\n\n---\n\n### User Story 2 - 使用和管理 Personal Team 与其他 Team（Priority: P1）\n\n作为已登录 User，我希望始终拥有自己的 Personal Team，并能创建、切换、重命名和删除其他 Team，以便将个人工作与不同协作范围分开管理。\n\n**Why this priority**：Team 是 Mystra 的租户边界；如果用户无法明确切换 Team，系统将非常高效地把正确数据写进错误租户。\n\n**Independent Test**：注册 User 并验证 Personal Team；创建两个 Team，在 shell 中切换并刷新页面；重命名 Personal Team；删除一个非 Personal Team；验证 Personal Team 和仅剩的最后 Team 均不可删除。\n\n**Acceptance Scenarios**：\n\n1. **Given** 任意 Human User 创建成功，**When** 读取其 Team 列表，**Then** 系统恰好存在一个由该 User 永久拥有、初始 display name 为 `Personal` 的 Personal Team。\n2. **Given** User 位于任意 Team，**When** 打开 Team switcher，**Then** 列表只显示其 active memberships，并清楚标识当前 Team 与其 Personal Team。\n3. **Given** User 选择另一个 Team，**When** 切换完成或刷新页面，**Then** 后续导航和请求使用新 Team context；无权或已删除 Team 不得恢复为 active context。\n4. **Given** User 创建新 Team，**When** 提交有效名称，**Then** 系统创建普通 Team，并将创建者设为 Owner 后切换或提供明确进入动作。\n5. **Given** Owner 修改普通 Team 或自己的 Personal Team 的 display name，**When** 保存成功，**Then** switcher、Settings 和成员页面显示新名称；Personal Team 的内部类型与 personal owner 不变。\n6. **Given** Owner 管理一个非 Personal Team，且自己还属于至少一个其他 active Team，**When** 确认删除，**Then** Team 被归档并从所有成员的 switcher 中消失，历史业务归属保持可追溯。\n7. **Given** Team 是 Personal Team，或它是当前 User 唯一的 active Team，**When** User 查看或调用删除动作，**Then** 删除操作不可用并返回稳定不可删除原因。\n8. **Given** 当前 Team 被其他 Owner 删除或当前 membership 被移除，**When** User 发起下一请求，**Then** 系统切换到其 Personal Team 或要求选择其他有效 Team，不继续使用失效 Team context。\n\n---\n\n### User Story 3 - 在 Settings 管理 Team 成员与角色（Priority: P1）\n\n作为 Team Owner 或具备成员管理权限的 Admin，我希望在 Settings 的 Team Members 页面按 username 添加或移除已有 User，并设置 Owner、Admin、Member 角色，以便用一个清晰的页面维护 Team 访问权。\n\n**Why this priority**：RBAC 只有在成员与角色可管理、服务端又真正执行时才存在。其余情况通常称为“下拉框”。\n\n**Independent Test**：在普通 Team 和 Personal Team 中分别添加已有 User、修改角色、移除成员；验证 Owner/Admin/Member 权限矩阵、最后 Owner与 Personal owner 保护，并确认 API、MCP、CLI 与 Web 的授权结果一致。\n\n**Acceptance Scenarios**：\n\n1. **Given** Owner 打开 Settings > Team > Members，**When** 页面加载，**Then** 列表显示 display name、username、role、membership status 和允许操作，并提供清晰的空、加载、失败与无权状态。\n2. **Given** Owner 或有权限的 Admin 输入已存在的准确 username，**When** 添加成员，**Then** 系统创建唯一 TeamMembership，不要求或查询 email。\n3. **Given** username 不存在或 User 已是成员，**When** 提交添加，**Then** 系统返回稳定 not-found 或 conflict，不创建重复 membership。\n4. **Given** Owner 修改成员角色，**When** 保存成功，**Then** 新请求立即按更新后的 Team Role 计算权限；Web 隐藏按钮不能替代服务端 enforcement。\n5. **Given** Admin 管理成员，**When** 尝试授予/移除 Owner、修改 Owner 或删除 Team，**Then** 系统拒绝；这些动作只允许 Owner。\n6. **Given** Team 只剩一名有效 Owner，**When** 尝试移除、停用或降级该 Owner，**Then** 系统拒绝，直到先产生另一名有效 Owner。\n7. **Given** Team 是某 User 的 Personal Team，**When** 尝试移除或降级 personal owner，**Then** 系统永久拒绝；其他成员仍可正常增删和变更角色。\n8. **Given** membership 被移除或停用，**When** User 再次请求 Team 资源，**Then** 新请求立即失败，Team 从其 switcher 中移除。\n\n### Edge Cases\n\n- username 必须 trim、按稳定规则规范化并大小写不敏感唯一；仅改变大小写不得创建第二个 User。\n- login username 与 display name 是不同字段：username 首期只读且唯一；display name 可修改、可重复、不可用于登录。\n- 默认 `admin/admin` 只能来自部署 bootstrap contract；应用运行时不得在数据库为空时静默自建默认管理员。\n- 默认 password 尚未修改时，除修改 password、退出与读取最小账户状态外的受保护操作全部拒绝。\n- 每个 User 必须恰好拥有一个 Personal Team；注册事务失败时不得只留下 User 或只留下 Team。\n- Personal Team 可以重命名、添加成员和设置角色，但不能删除、转移 personal ownership 或移除 personal owner。\n- 普通 Team 的显示名称可以重复；内部 Team ID 是租户边界，不得用名称解析授权。\n- Team switcher 只列出 active memberships；被移除、停用或归档 Team 不能由缓存恢复。\n- Team 删除是可审计归档而非数据库级联硬删除；历史 Project、Task 和 Session 仍保留 Team ID。\n- 未加入任何协作 Team 的 User 仍可通过自己的 Personal Team 使用系统，因此不存在零 Team 的有效 User。\n- Role 变更和 membership 删除必须使新请求立即失效；长时操作在外部副作用前重新确认权限。\n- password、session token 和 bootstrap secret 不得进入 URL、日志、公共响应或验收证据。\n- 数据库暂时不可用时，不得创建半完成 User、Personal Team、membership、role binding 或 session。\n- Team Members 的 Castrel AI 视觉参考尚未提供具体路径或截图；043 当前只锁定信息结构和行为，不声称完成视觉对齐。\n\n## Requirements\n\n### Functional Requirements\n\n#### Bootstrap contract, local auth and account settings\n\n- **FR-001**：043 MUST 从登录页开始；未认证用户访问受保护 route 时 MUST 被引导到登录页，并保留安全的 return destination。\n- **FR-002**：部署完成后的外部 bootstrap contract MUST 提供 username `admin`、初始 password `admin`、对应 Human User 与其初始名为 `Personal` 的 Personal Team；043 MUST NOT 实现 installer 或 seed orchestration。\n- **FR-003**：默认 `admin` User MUST 标记为 required-password-change；首次成功认证后，在 password 修改完成前只能访问最小账户安全流程。\n- **FR-004**：应用运行时 MUST NOT 因数据库为空而静默创建或重建 `admin/admin`；bootstrap 缺失时 MUST fail closed 并报告 installation incomplete。\n- **FR-005**：系统 MUST 为每个人类 User 生成稳定内部 ID；内部 ID 是所有关系和未来扩展的身份锚点。\n- **FR-006**：每个 User MUST 拥有平台范围内大小写不敏感唯一的 username；username 是首期唯一外部登录标识，首期不可修改。\n- **FR-007**：每个 User MUST 拥有可修改、可重复的 display name；display name 不得用于认证、唯一性判断或授权。\n- **FR-008**：self-host User 模型、注册、登录、成员管理和恢复表面 MUST NOT 要求、保存、推导或查询 email。\n- **FR-009**：本地注册 MUST 只收集 username 与 password，并在同一事务中创建 User、Personal Team、Owner membership 与 session。\n- **FR-010**：系统 MUST 支持 username/password 登录、退出、当前 session 查询、指定 session 撤销与账户停用。\n- **FR-011**：Account Settings MUST 支持修改 display name，并在保存后对 shell、Team Members 与账户表面使用一致 projection。\n- **FR-012**：Account Settings MUST 支持使用当前 password 修改 password；成功后旧 password 立即失效，除当前 session 外的其他 session 默认撤销。\n- **FR-013**：password MUST 使用经过审查的自适应 password hashing；系统不得保存、记录或返回明文 password。\n- **FR-014**：username normalization、长度、字符集和保留字 MUST 在 shared contract 中稳定定义，并在所有数据库 profile 上一致执行。\n- **FR-015**：注册与登录 MUST 防止 username 枚举，并对暴力尝试、session fixation、重放、CSRF 和不可信 origin 实施 fail-closed 保护。\n- **FR-016**：首期 MUST NOT 提供 email verification、email invitation 或 email password reset；未实现本地 recovery 时，UI MUST 显示明确 unavailable。\n\n#### Personal Team, Team lifecycle and active context\n\n- **FR-017**：每个 Human User MUST 恰好拥有一个 Personal Team；该关系使用稳定 personal owner ID 表达，不依赖 Team display name 是否仍为 `Personal`。\n- **FR-018**：新 User 注册事务 MUST 原子创建其 Personal Team，并将 User 设为不可移除、不可降级的 personal Owner。\n- **FR-019**：Team MUST 是 Mystra 顶层租户；`workspace` 不得被用作 tenancy 同义词。\n- **FR-020**：系统 MUST 提供 Team switcher，列出当前 User 的 active TeamMembership，标识当前 Team 和 Personal Team，并允许切换 active Team context。\n- **FR-021**：active Team context MUST 持久保存并由服务端验证；无权、已停用或已归档 Team MUST fail closed，并回退到 Personal Team 或明确选择流程。\n- **FR-022**：任意 User MUST 能创建普通 Team；创建者 MUST 原子成为该 Team Owner。\n- **FR-023**：Owner MUST 能修改普通 Team 和自己的 Personal Team 的 display name；Team display name MAY 重复且不得参与授权解析。\n- **FR-024**：Owner MUST 能删除普通 Team；用户可见“删除” MUST 实现为可审计归档并从 active switcher 移除，不得级联硬删除历史业务记录。\n- **FR-025**：Personal Team MUST 永远不可删除；任何 Team 若是当前 User 唯一 active Team，其删除动作也 MUST 不可用。\n- **FR-026**：Team 删除 MUST 要求 Owner permission、显式确认与稳定冲突处理；Admin 和 Member 不得删除 Team。\n- **FR-027**：Team 删除或 membership 失效后，所有表面 MUST 在下一请求停止使用该 Team context；客户端缓存不得继续授权。\n\n#### Team Members and RBAC\n\n- **FR-028**：TeamMembership MUST 将一个 Human User 关联到 Team，并保存 active/disabled 状态与生命周期；首期 Principal 类型仅为 User。\n- **FR-029**：Settings MUST 提供 Team Members 页面，至少显示 display name、username、role、membership status 与当前操作者允许的 actions。\n- **FR-030**：Owner 与具备成员管理 permission 的 Admin MUST 能通过准确 username 查找已有 User 并添加唯一 TeamMembership；该流程不得依赖 email 或外部目录。\n- **FR-031**：Owner MUST 能移除或停用普通成员；Admin MAY 管理 Member，但 MUST NOT 修改 Owner、授予 Owner、移除 Owner 或管理 personal owner。\n- **FR-032**：系统 MUST 提供不可删除的内置 Team roles：Owner、Admin、Member；首期不要求自定义 Role 或 Project-scoped Role。\n- **FR-033**：Permission catalog MUST 稳定定义至少 Team settings、member management、role management、Team deletion 与普通 Team resource access；API、MCP、CLI 与 Web MUST 使用相同语义。\n- **FR-034**：RoleBinding MUST 将 User、Role 与 Team 明确关联；一个 membership 首期只有一个 active Team Role。\n- **FR-035**：Owner MUST 能将普通成员角色设置为 Owner、Admin 或 Member；变更对新请求立即生效。\n- **FR-036**：系统 MUST 保护每个普通 Team 至少一名有效 Owner；最后 Owner 不得被移除、停用、降级或退出。\n- **FR-037**：Personal Team 的 personal owner MUST 永久保持 active Owner；其他成员 MAY 被授予 Owner，但不得借此移除、降级或替换 personal owner。\n- **FR-038**：所有受保护的 API、MCP、CLI 与 Web 操作 MUST 在服务端解析 User、Team context、目标资源和 effective permissions；客户端隐藏按钮不能替代 enforcement。\n- **FR-039**：未认证请求 MUST 使用稳定 unauthenticated 语义；已认证但未授权请求 MUST 使用稳定 forbidden 语义，并避免泄漏跨 Team 资源存在性。\n- **FR-040**：Team Members 页面 MUST 提供 loading、empty、error、read-only/forbidden、add conflict、last-owner conflict 与 personal-owner-protected 状态。\n\n#### Framework, persistence and extension boundaries\n\n- **FR-041**：Human Auth engine MUST 使用 Better Auth 稳定发布版，并仅启用 username/password 与 session 所需能力；Better Auth 类型不得泄漏到公共合同。\n- **FR-042**：Team、Personal Team ownership、Membership、Role、Permission 与 RoleBinding MUST 是 Mystra-owned 领域模型；Better Auth Organization/Team 不得成为产品真相来源。\n- **FR-043**：SQLite、PostgreSQL 与 Supabase-backed PostgreSQL MUST 提供相同行为和数据关系；Supabase MUST 复用 PostgreSQL profile，不形成 Supabase Auth 或 Data API 旁路。\n- **FR-044**：Prisma MUST 是身份与授权关系数据的 schema、migration 与 runtime access owner；Better Auth MUST NOT 绕过 Prisma migration history。\n- **FR-045**：SQLite 与 PostgreSQL Prisma schema MUST 覆盖相同 Auth、Personal Team 与 RBAC 逻辑模型，并通过自动 parity 检查阻止无意漂移。\n- **FR-046**：开源仓库 MUST NOT 提供 SaaS deployment profile、Google/GitHub SSO、social login、caller-login OAuth adapter、route、配置项或 UI 入口。\n- **FR-047**：未来认证因子 MUST 通过稳定内部 User ID 关联；043 MUST NOT 预建 TOTP、Passkey、Email/SMS OTP 或 One-Time Token 的流程、可执行 UI 或首期验收。\n- **FR-048**：未来平台内部 Agent 如需参与 RBAC，MUST 通过可扩展 Principal contract 增加；043 MUST NOT 实现 AgentPrincipal、Agent key、Agent login 或 Sandbox workload identity。\n- **FR-049**：Account、Team、Team Members 与 Roles Settings MUST 显示真实可用、只读或 prerequisite-unavailable 状态，并支持英语、简体中文、键盘、焦点、错误播报与窄屏重排。\n- **FR-050**：043 implementation MUST 等待 040 Prisma RDB ownership 合入 `main`，并以已经落地的 041 数据模型为当前基线。\n- **FR-051**：043 implementation 前 MUST 修订 5xP/constitution 中 caller auth 与 Team administration 的旧排除项；SaaS/hosted multi-tenancy 保持在本仓库范围外。\n- **FR-052**：在版本达到 `0.1.0` 前，身份 schema MUST 直接替换过时开发合同并同步更新调用方、fixtures、tests 与文档；MUST NOT 为旧开发快照添加 migration、alias、fallback 或 dual-read/dual-write compatibility path。\n\n### Key Entities\n\n- **User**：Human 本地账户；拥有稳定内部 ID、唯一 login username、可重复 display name、password-change-required 状态、账户状态和时间信息，不包含 email。\n- **LocalCredentialAccount**：User 的 username/password 登录绑定；只保存 password hash 和必要安全元数据。\n- **AuthSession**：有过期时间、可撤销的 User 认证会话；保存 active Team context 或其安全引用。\n- **Team**：Mystra 顶层租户；包含稳定 ID、可重复 display name、kind（Personal 或 Standard）、状态和时间信息。\n- **PersonalTeamOwnership**：一个 User 与其唯一 Personal Team 的不可转移所有权事实；不依赖 Team display name。\n- **TeamMembership**：Human User 在 Team 中的成员关系、状态和 Team Role。\n- **Permission**：平台定义的稳定、机器可读操作能力。\n- **Role**：首期固定为 Owner、Admin、Member 的命名 permission 集合。\n- **RoleBinding**：TeamMembership 与一个 active Team Role 的授权事实。\n\n### Extension concepts — not entities in the first slice\n\n- **AuthenticationFactor**：未来可能绑定内部 User ID 的强认证因子；043 不创建其表、流程或 UI。\n- **Agent Principal / Workload Identity**：未来可能进入平台 RBAC 的内部 Agent 或 Session actor；043 不创建 credential、membership、token 或 capability grant。\n\n## Scope\n\n### In scope — first implementation slice\n\n- 部署完成后进入登录页，并消费外部 installer 提供的 `admin/admin` + `Personal` bootstrap contract。\n- 默认 admin 首次登录强制修改 password。\n- username/password 注册、登录、session、退出、撤销和停用。\n- Account Settings 修改 password 与 display name；login username 首期只读。\n- 每 User 一个不可删除、可改名、可加人的 Personal Team。\n- Team switcher、创建普通 Team、重命名 Team、归档删除普通 Team；唯一 Team 与 Personal Team 不可删除。\n- Settings > Team Members：按 username 添加、移除/停用成员并设置 Owner/Admin/Member。\n- Team-level permission enforcement、最后 Owner 与 personal owner 保护。\n- SQLite、PostgreSQL、Supabase-backed PostgreSQL parity。\n\n### Extension-ready only — no implementation in 043\n\n- 自定义 Role 与 Project-scoped Role。\n- TOTP/2FA、Passkey、Email/SMS OTP、One-Time Token 与 password recovery。\n- Control-plane Agent identity、Agent authorization、Agent credential 与 Sandbox workload identity。\n\n### Out of scope\n\n- 安装器、seed command、deployment packaging 或首次部署 orchestration；它们由后续安装规格实现。\n- self-host User email、email verification、email invitation、email login 或 email password reset。\n- SaaS deployment mode 及其任何代码；Google/GitHub SSO、social login、caller-login OAuth 和 hosted account linking 均由另一仓库管理。\n- AgentPrincipal、Agent key、Agent 登录、Sandbox workload token 或 Agent 对外发声能力。\n- 首期启用 TOTP、Passkey、Email/SMS OTP、One-Time Token 或账户恢复。\n- 通用 ABAC/ReBAC engine、deny rules、任意条件表达式或客户自定义 policy DSL。\n- 本 Specify 阶段实施、迁移或部署代码；043 implementation 仍等待 040 合入和 5xP boundary amendment。\n\n## Assumptions & Dependencies\n\n- 外部 installer 的具体实现延期；043 只锁定其 post-install bootstrap state，不在应用启动时自建默认管理员。\n- `admin/admin` 是方便本地首次进入的已知默认凭据，因此强制首次修改 password 是不可省略的安全合同。\n- 每个 User 恰好拥有一个 Personal Team；Personal Team 可改名、可加人，但不可删除或转移 personal ownership。\n- 初始化后允许公开本地注册；新 User 注册时原子获得自己的 Personal Team。\n- Team Members 的 Castrel AI 参考尚未提供可读取的路径或截图；详细视觉对齐等待 Owner 提供材料，不阻塞行为规格。\n- 041 已随 `main` 的 `10750ca` 落地；040 worktree 已完成多数核心实现但尚未合入 `main`。\n\n## Success Criteria\n\n### Measurable Outcomes\n\n- **SC-001**：已正确 bootstrap 的部署首次访问受保护页面时，100% 进入登录页；`admin/admin` 可完成一次登录，并在访问 Team 数据前 100% 被强制修改 password。\n- **SC-002**：新 User 注册后，User、Personal Team、Owner membership 与 session 要么全部成功，要么全部不存在；每个 active User 的 Personal Team 数始终为 1。\n- **SC-003**：用户可在 60 秒内修改 display name 或 password；password 修改后旧 password 登录成功数为 0，其他旧 session 成功请求数为 0。\n- **SC-004**：用户可在 30 秒内切换 Team，刷新后 active Team 保持一致；无权、已停用或归档 Team 被恢复为 active context 的次数为 0。\n- **SC-005**：Personal Team 可成功重命名和添加成员，但删除、转移 personal ownership、移除或降级 personal owner 的成功次数均为 0。\n- **SC-006**：普通 Team 在 Owner 仍有其他 active Team 时可归档删除；Personal Team或当前唯一 active Team 的删除成功次数为 0。\n- **SC-007**：Owner 可在一个 Team Members 页面完成添加成员、移除成员和设置 Owner/Admin/Member；重复添加、未知 username、last-owner 与 personal-owner 冲突均返回稳定结果。\n- **SC-008**：API、MCP、CLI 与 Web 对相同 User、Team 和 Role 的授权矩阵结果一致率为 100%；跨 Team 与已撤销 membership 测试 100% fail closed。\n- **SC-009**：self-host User schema、注册/登录 payload、成员管理 UI 与恢复表面中的 email 字段和必需依赖计数为 0。\n- **SC-010**：开源仓库可执行登录入口、route、配置和依赖中的 Google/GitHub SSO、Agent key、WorkloadIdentity 与强认证因子实现计数为 0。\n- **SC-011**：SQLite、PostgreSQL 与 Supabase-backed PostgreSQL 运行相同 identity/Personal Team/RBAC contract suite，核心场景通过率均为 100%，schema parity 无未记录差异。\n- **SC-012**：登录、注册、Account、Team switcher、Team Settings 与 Members 页面在 320 / 768 / 1024 / 1440px 和键盘操作下没有不可达主要操作或页面级水平滚动。\n- **SC-013**：043 implementation 开始前，040 已合入 `main` 且 5xP/constitution 的 caller auth 与 Team administration 边界已更新；缺少任一前置时启动检查必须失败。\n"},{"id":"features","label":"FEATURES","eyebrow":"Features","markdown":"# 功能说明：本地用户、Personal Team 与 RBAC\n\n## 目标\n\n开源 Mystra 部署后从登录页开始。外部安装流程未来提供默认 `admin/admin` 和 admin 的 `Personal` Team；043 消费这个 bootstrap state，但不实现安装器。默认 admin 首次登录必须修改 password。\n\n每个本地 User 使用唯一 username/password，拥有可修改的 display name，并始终拥有一个 Personal Team。用户可以切换 Team、创建普通 Team、重命名任意拥有的 Team，并删除非 Personal、非唯一的普通 Team。\n\n## 功能地图\n\n- **Authentication**：登录、注册、退出、session 撤销、默认 admin 强制改密。\n- **Account**：修改 password 与 display name；login username 首期只读。\n- **Personal Team**：每 User 恰好一个，初始名 `Personal`，可改名、可加成员、不可删除或转移 personal owner。\n- **Team lifecycle**：Team switcher、创建、切换、重命名与归档删除；唯一 Team 不可删除。\n- **Members**：Settings > Team Members 按 username 添加、停用、移除成员并设置角色。\n- **RBAC**：首期固定 Owner、Admin、Member，服务端统一 enforcement，保护 last Owner 与 personal owner。\n- **Persistence**：SQLite、PostgreSQL、Supabase-backed PostgreSQL 使用相同 Prisma-owned 逻辑模型。\n\n## 明确边界\n\n- self-host 不含 email；username 用于登录，display name 只用于展示。\n- 安装器与 seed orchestration 后续单独实现；应用运行时不得静默创建 `admin/admin`。\n- SaaS/SSO、Agent authentication、Agent key、Sandbox workload identity 与强认证因子不进入 043。\n- Castrel AI Workspace Members 的视觉对齐等待 Owner 提供具体页面路径或截图；当前原型只验证信息结构和行为。\n- 041 已落地；implementation 等待 040 合入和 5xP boundary amendment。\n"},{"id":"checklists","label":"CHECKLISTS","eyebrow":"Checklists","markdown":"# 评审清单：本地用户、Personal Team 与 RBAC\n\n## Owner 需求\n\n- [x] 部署后默认进入登录页。\n- [x] 外部 installer bootstrap contract 提供 `admin/admin` 与 `Personal` Team；安装器实现延期。\n- [x] 默认 admin 首次登录强制修改 password。\n- [x] self-host User 只使用 username/password，不引入 email。\n- [x] Account Settings 支持修改 password 与 display name；login username 首期只读。\n- [x] 每个 User 恰好一个 Personal Team，初始名为 `Personal`。\n- [x] Personal Team 可以改名、添加成员和设置角色，但不能删除或转移 personal owner。\n- [x] 支持 Team 切换、创建、重命名和删除；Personal Team 或唯一 Team 不可删除。\n- [x] Settings 增加 Team Members 页面，支持按 username 添加、移除/停用和设置 Owner/Admin/Member。\n- [x] SaaS/SSO、Agent key、Agent 登录、Sandbox workload 与强认证因子不进入 043。\n- [ ] Owner 提供 Castrel AI Workspace Members 页面的路径或截图后，完成视觉对齐检查。\n\n## Spec 就绪度\n\n- [x] 三个独立 User Story 覆盖账户、Team lifecycle 与 Members/RBAC。\n- [x] installer 实现与 post-install bootstrap contract 已分离。\n- [x] username/display name、Personal Team ownership、删除保护和角色权限明确。\n- [x] Team context、last Owner、personal owner 和跨 Team fail-closed 明确。\n- [x] 041 已落地；040 合入前置、Prisma ownership 和 pre-0.1 策略明确。\n- [x] Requirements Quality Score 达到 97/100。\n- [ ] 040 已合入 `main`。\n- [ ] 5xP/constitution 的 caller-auth/Team-admin 排除项已正式修订。\n- [ ] 进入 `/speckit.plan`。\n\n## Planning 检查\n\n- [ ] 锁定 Better Auth 稳定版及 Prisma adapter，只启用 username/password 与 session 能力。\n- [ ] 定义 installer/043 之间 `admin/admin`、password-change-required 与 Personal Team 的 bootstrap contract。\n- [ ] 定义 User 注册与 Personal Team 原子创建事务。\n- [ ] 定义 active Team context、Team archive 和删除后回退语义。\n- [ ] 定义 Owner/Admin/Member permission matrix 与 Members route contracts。\n- [ ] 证明 User schema 与 OSS composition 不含 email、hosted/social provider、Agent credential 或 factor 实现。\n- [ ] 为 SQLite/PG 两套 Prisma schema 建立 Auth/Personal Team/RBAC parity gate。\n- [ ] `plan-eng-review` 覆盖全 route/MCP/CLI authorization、bootstrap secret、Team deletion 和 Prisma blast radius。\n"},{"id":"prototype","label":"PROTOTYPE","eyebrow":"Prototype","markdown":"# 交互原型：本地用户、Personal Team 与 RBAC\n\n## 原型入口\n\n[打开独立 HTML 原型](mockups/index.html)\n\n## Intake\n\n- **目标**：验证默认 admin 登录/强制改密、Account Settings、Team switcher、Team lifecycle 和 Members/Roles 管理的信息层级。\n- **主要用户**：首次登录的 admin、普通本地 User、Team Owner 与 Team Admin。\n- **主要动作**：登录、修改 password/display name、切换/创建/重命名/删除 Team、按 username 添加成员和设置角色。\n- **限制**：不展示 email、SaaS/SSO、Agent identity 或未来认证因子；不实现安装器。\n\n## 覆盖页面与状态\n\n原型左侧切换六个关键表面：\n\n1. **Sign in**：username/password；示例显示 `admin` 默认账户和首次改密提示。\n2. **Account**：修改 display name 与 password；login username 只读。\n3. **Team switcher**：标识当前 Team、Personal Team，并提供创建 Team 入口。\n4. **Team settings**：重命名 Team；Personal/唯一 Team 删除禁用，普通 Team可确认归档。\n5. **Members**：display name、username、role、status 与 add/remove actions。\n6. **Roles**：Owner/Admin/Member permission summary 与保护规则。\n\n## Interaction Notes\n\n- 默认 `admin/admin` 登录成功后进入强制修改 password 状态，不可直接进入 Team shell。\n- Personal Team 的 display name 可改，但 Personal 标识独立存在。\n- Team switcher 只列 active memberships；创建 Team 后创建者成为 Owner。\n- 删除只针对普通 Team，表现为确认后的归档；Personal Team 和唯一 Team均禁用。\n- Members 按准确 username 添加已有本地 User，不使用 email invitation。\n- Castrel AI Workspace Members 视觉参考未提供，本轮不猜测其具体布局、组件或交互。\n\n## 当前限制\n\n- 静态示例数据，不调用数据库、API 或 MCP。\n- 不模拟 password hashing、session cookie、真实 role mutation 或并发冲突。\n- UI copy 以英语示例为主；实现必须提供英语和简体中文。\n- 按项目规则执行静态一致性检查，不声称完成运行时或浏览器验收。\n\n## High-fidelity 升级目标\n\n- 获得 Castrel AI 页面路径或截图后，补充 Workspace Members 视觉与交互映射。\n- 覆盖 forced password change、duplicate username、last Owner、personal owner、last Team 和 Team delete confirmation 状态。\n- 映射现有 Account/Team Settings components。\n- 040 合入 `main` 后再制作真实 runtime prototype；041 已是当前基线。\n","action":{"label":"Open Prototype","href":"mockups/index.html?v=1786032064149"}},{"id":"plan","label":"PLAN","eyebrow":"Plan","markdown":"# Plan\n\n_specs/043-identity-team-rbac/plan.md is not present for this spec yet._"},{"id":"tasks","label":"TASKS","eyebrow":"Tasks","markdown":"# Tasks\n\n_specs/043-identity-team-rbac/tasks.md is not present for this spec yet._"}]}</script>
    <script>
      const data = JSON.parse(document.getElementById("spec-data").textContent);
      const tabsEl = document.getElementById("tabs");
      const docEl = document.getElementById("doc");
      const pageTitleEl = document.getElementById("page-title");
      const activeLabelEl = document.getElementById("active-label");
      const activePositionEl = document.getElementById("active-position");
      const activeEyebrowEl = document.getElementById("active-eyebrow");
      const prototypeLinkEl = document.getElementById("prototype-link");

      document.getElementById("feature-id").textContent = data.feature;
      document.getElementById("generated-at").textContent =
        "Generated " + new Date(data.generatedAt).toLocaleString();
      pageTitleEl.textContent = data.title;
      prototypeLinkEl.href = data.prototypeHref;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineMarkdown(value) {
        let html = escapeHtml(value);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return html;
      }

      function renderTable(lines) {
        const rows = lines
          .filter((line) => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line))
          .map((line) =>
            line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => inlineMarkdown(cell.trim())),
          );
        return rows
          .map((row, index) => {
            const tag = index === 0 ? "th" : "td";
            return "<tr>" + row.map((cell) => `<${tag}>${cell}</${tag}>`).join("") + "</tr>";
          })
          .join("");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const out = [];
        let listType = null;
        let paragraph = [];
        let table = [];
        let inCode = false;
        let codeLines = [];

        function closeParagraph() {
          if (paragraph.length) {
            out.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        function closeTable() {
          if (table.length) {
            out.push(`<table>${renderTable(table)}</table>`);
            table = [];
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            closeTable();
            if (inCode) {
              out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (line.trim().startsWith("|") && line.includes("|")) {
            closeParagraph();
            closeList();
            table.push(line);
            continue;
          }

          closeTable();

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (/^---+\s*$/.test(line.trim())) {
            closeParagraph();
            closeList();
            out.push("<hr />");
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              out.push(`<${nextType}>`);
              listType = nextType;
            }
            out.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          if (line.startsWith(">")) {
            closeParagraph();
            closeList();
            out.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        closeTable();
        return out.join("\n");
      }

      function setActive(id) {
        const activeIndex = Math.max(0, data.tabs.findIndex((tab) => tab.id === id));
        const tab = data.tabs[activeIndex];
        for (const button of tabsEl.querySelectorAll("button")) {
          button.setAttribute("aria-selected", String(button.dataset.tabId === tab.id));
        }
        activeLabelEl.textContent = tab.label;
        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;
        activeEyebrowEl.textContent = tab.eyebrow;
        docEl.innerHTML = renderMarkdown(tab.markdown);
        const missing = tab.markdown.includes("is not present for this spec yet");
        if (missing) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.";
          docEl.prepend(note);
        }
        history.replaceState(null, "", `#${tab.id}`);
      }

      data.tabs.forEach((tab, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.role = "tab";
        button.dataset.tabId = tab.id;
        button.innerHTML = `<span>${tab.label}</span><span class="tab-index">${String(index + 1).padStart(2, "0")}</span>`;
        button.addEventListener("click", () => setActive(tab.id));
        tabsEl.append(button);
      });

      setActive(location.hash.replace("#", "") || data.tabs[0].id);
    </script>
