      "path": "specs/051-factory-task-harness/checklists/engineering-review.md",
      "mediaType": "text/markdown",
      "content": "# Engineering Review：薄 Task 生产状态机与 mystra-agent CLI\n\n**Reviewed**: 2026-08-11\n**Plan**: [plan.md](../plan.md)\n**Status**: CLEAR\n\n## Step 0 — Scope Challenge\n\n- [x] 复用 047 Task、048 Workspace、049 Session/lease、050 Task detail；没有 parallel lifecycle/runtime。\n- [x] 最小完成面仍必然跨 shared contracts、RDB、services、API、Runner、CLI 与 Task UI；超过 8 files/2 services 是端到端边界的结果，不是可删的抽象。\n- [x] owner 已明确 051 必须完成从 Assign 到 PR handoff 的 journey；减少 CLI、Runner capability 或 Human closeout 任一项都会使 journey 不成立，因此 scope accepted as-is。\n- [x] 旧 004 gstack design doc 与 051 无关，不作为本评审 source of truth；051 spec/plan 与 5xP 为当前依据。\n- [x] 仓库无 `TODOS.md`；没有 deferred item 阻塞本计划，也不新增模糊 TODO。\n- [x] 新 CLI 的分发已定义为 Runner-bundled private workspace artifact；独立 npm/release channel 明确不在自用 MVP。\n\n## Architecture Review\n\n1. **[P1] (confidence 10/10) Workspace completion -\u003e Session launch gap**\n   现有 `WorkspacePreparationService.report` 把重复 attempt 当 stale。若 Workspace ready 已提交而 continuation 失败，Runner retry 无法再次触发 launch。计划已改为同 attempt/同 payload completion 幂等，不同 payload继续 fenced；continuation使用预分配 Session IDs。\n\n2. **[P1] (confidence 9/10) Assign post-commit setup failure lacked durable diagnosis**\n   Assign transaction提交后 remote base/workspace setup 可能失败。Task按规格保持 in_progress，但没有事实解释。Harness增加 bounded `setupFailureCode/setupFailureMessage` diagnostic，不增加 lifecycle state。\n\n3. **[P1] (confidence 9/10) Frozen revision without frozen prompt is insufficient**\n   Agent definition没有 revision history table；只保存 revision 后无法在 Agent更新后恢复旧 prompt。Harness保存 Agent system prompt snapshot，并让 Harness launch不再二次 resolve current Agent。\n\n4. **[P1] (confidence 9/10) Control Plane cannot truthfully return host workspace path**\n   048只保存 opaque workspaceRef。计划已把 logical context留在 server，最终 CLI用实际 cwd补 `workspace.root`，不扩散 Runtime-private facts。\n\n5. **[P1] (confidence 9/10) execution code handoff timing**\n   Assign时没有 Session，launch时没有 Runtime ownership。claim-time issuance复用现有 lease transaction，hash indexed persistence、expiry/reclaim rotation、terminal revocation；明文只返回一次。\n\n6. **[P2] (confidence 9/10) CLI distribution could silently fail**\n   仅创建 package 不会保证 Provider child 能调用 bare command。计划要求 Runner production dependency + exported bin path + PATH prepend，并纳入 runner build/deploy tests；独立发布延后。\n\n## Code Quality Review\n\n7. **[P2] (confidence 8/10) Avoid duplicating transition rules across DB/API/CLI**\n   allowlist、note rule 和 allowedTransitions 放在 shared pure transition policy；DB仍做 authoritative concurrency/idempotency，Human/workload services只提供 actor scope。CLI不复制业务规则，只解析命令和服务响应。\n\n8. **[P2] (confidence 8/10) Standard prompt must not retain mutable Task context**\n   Harness launch使用 runtime/provider/frozen agent/bootstrap四组件；Task/Project/Issue数据只通过 `mystra-agent context get` 暴露。普通非 Harness Session保留049现有 assembler，避免无关行为变化。\n\n9. **[P1] (confidence 10/10) Planned Session identity cannot be a not-yet-valid FK**\n   Assign先于 Workspace/Session creation；Harness若把预分配 ID直接建成 required Session FK，两个 dialect都会拒绝插入。数据模型改为 unique `plannedSessionId` 非外键 + nullable actual `sessionId`，ready launch成功后绑定。\n\n## Test Review\n\n```text\nTask policy matrix\n  +-- legal human/agent transitions\n  +-- note/terminal/allowedTransitions\n  +-- projection clearing\n        |\n        v\nRDB contract\n  +-- assign tx atomicity + replay + 20-way race\n  +-- projection/history tx + stale revision\n  +-- workspace completion replay fencing\n  +-- harness/session uniqueness\n  +-- capability hash/expiry/revocation/scope\n        |\n        v\nService/API/CLI\n  +-- Human RBAC + actor audit\n  +-- workload bearer-only + no arbitrary IDs\n  +-- stable HTTP/CLI errors + JSON limits\n  +-- cwd-composed context + secret exclusions\n        |\n        v\nRunner/E2E\n  +-- PATH/endpoint/code env merge\n  +-- no prompt/event/log/database code leakage\n  +-- workspace-ready recovery + single Session\n  +-- fixture linctl -\u003e edit/test -\u003e fixture gh -\u003e review status\n  +-- failed Session != Task state\n```\n\nCoverage additions required in tasks：shared unit、RdbProvider contract、SQLite integration、optional PostgreSQL contract、service unit、route tests、CLI tests、runner worker tests、HTTP/Runner E2E、Task detail runtime/browser test。未发现 silent + unhandled + untested critical gap after plan corrections。\n\n## Failure Modes\n\n| Codepath | Production failure | Test | Handling/user signal |\n| --- | --- | --- | --- |\n| Assign transaction | concurrent pending claims | race test | one success; stable conflict/replay |\n| post-commit setup | Git remote/runtime unavailable | service/E2E | durable Harness diagnostic; Task remains in_progress |\n| ready continuation | launch throws after ready commit | replay E2E | same report retries continuation |\n| capability claim | response lost/lease reclaimed | lease test | new code rotates; old code invalid |\n| workload auth | expired/revoked/foreign scope | API contract | uniform fail-closed error, no context |\n| status update | stale revision/timeout replay | service/API/CLI | conflict or same transition result |\n| Provider child | CLI bin missing/PATH wrong | runner test | Provider can report failure; deployment test fails |\n| external CLI | linctl/gh unauthenticated | fixture E2E | Agent reports blocked; no fallback |\n| Agent exits silently | no final status call | E2E | Task intentionally remains in_progress |\n| Human review | note contains false URL/tests | presentation test | displayed as unverified Agent report |\n\n**Critical gaps:** 0\n\n## Performance Review\n\n- [x] Assign/status use short Prisma transactions with no remote/network I/O.\n- [x] `TaskStatusTransition(taskId,revision)` and `(taskId,idempotencyKey)` unique indexes support conflict/replay paths.\n- [x] `SessionDispatchLease.executionCodeHash` indexed unique lookup avoids scans.\n- [x] status history is limit bounded; Task list reads projection only.\n- [x] randomBytes/hash work is constant small input and not a throughput concern for single-node MVP.\n- [x] no new poller, queue, event bus or unbounded retry loop。\n\n## What Already Exists\n\n| Existing | Reuse decision |\n| --- | --- |\n| `TaskWorkspaceService.setup/resolveSessionAttachment` | reused; no second Workspace |\n| Workspace Runner claim/report loop | reused; completion becomes safe replay trigger |\n| `SessionService.launch` + initial events | reused through frozen Harness launch variant |\n| `RuntimeSessionService.claim` + lease token hashing | reused for execution capability lifecycle |\n| Provider command environment merge | reused for endpoint/code/PATH injection |\n| Human auth/RBAC subject with user ID | reused for Human transition actor |\n| Task detail Workspace/Sessions panels | extended; no new top-level Harness application |\n\n## NOT in Scope\n\n- Full Harness orchestration/heartbeat/subscriptions/multi-Session: needs separate state-machine specification。\n- Retry/reopen/second attempt: v1 terminal semantics and one-Harness uniqueness intentionally avoid undefined policies。\n- Generic artifact and delivery verification: Mystra currently cannot validate it。\n- Linear/GitHub proxy/fallback: would change credential and Integration boundaries。\n- Standalone CLI release channel: Runner-bundled self-use delivery is sufficient for MVP。\n- Workflow/Recipe/Skill selection, triage, review automation and quality gates: not required for accepted journey。\n\n## Worktree Parallelization\n\nSequential implementation, no safe parallelization opportunity. Shared schemas/RDB contracts gate services; services gate both API and CLI; Runner claim schema gates environment handoff. Parallel worktrees would repeatedly touch `packages/shared` and control-plane DB modules and add merge risk without reducing critical path。\n\n## Completion Summary\n\n- Step 0: scope accepted as-is; every major surface is journey-critical。\n- Architecture Review: 7 issues found, all incorporated into plan。\n- Code Quality Review: 2 issues found, both resolved by shared policy and Harness-only prompt path。\n- Test Review: diagram produced, 2 original gaps fixed, 0 remaining critical gaps。\n- Performance Review: 0 unresolved issues。\n- NOT in scope: written。\n- What already exists: written。\n- TODOS.md updates: 0 proposed；deferred product features already live in spec boundary。\n- Failure modes: 0 critical gaps。\n- Outside voice: skipped；current review is code-evidence-backed and product decisions are owner-approved。\n- Parallelization: sequential, 0 parallel lanes。\n- Lake Score: 9/9 recommendations use the complete recoverable option。\n\n**Unresolved decisions:** 0\n\n**Verdict:** CLEAR — proceed to `/speckit.tasks`。\n",
      "sourceHash": "4713f2240b73e8051abe9a629fe7b2189c05e06bfe5d1a294dd4af51ed2461e1"
    },

      "title": "Specification Quality Checklist: 薄 Task 生产状态机与 mystra-agent CLI",
      "path": "specs/051-factory-task-harness/checklists/requirements.md",
      "mediaType": "text/markdown",
      "content": "# Specification Quality Checklist: 薄 Task 生产状态机与 mystra-agent CLI\n\n**Purpose**: 在进入规划前验证状态合同、权限边界和 MVP 范围\n**Created**: 2026-08-11\n**Feature**: [spec.md](../spec.md)\n\n## Content Quality\n\n- [x] Focused on Task production lifecycle rather than a general workflow engine\n- [x] State names and meanings are business-readable\n- [x] All mandatory sections completed\n- [x] Mystra verification capability is not fabricated\n\n## Requirement Completeness\n\n- [x] Transition table is complete and deterministic\n- [x] Agent and Human permissions are explicit\n- [x] Terminal-state and note requirements are explicit\n- [x] Optimistic concurrency and idempotency behavior are testable\n- [x] Task, Session, Harness, and external Issue states are separated\n- [x] Acceptance scenarios cover stale revision, replay, scope mismatch, and missing Agent update\n- [x] Deferred scope is explicit\n\n## Contract Readiness\n\n- [x] Agent uses a dedicated status transition service, not generic Task PATCH\n- [x] Runtime-injected capability prevents arbitrary Task addressing\n- [x] `mystra` and `mystra-agent` have distinct actors and resource boundaries\n- [x] Execution code lifetime, scope, transport inputs, and secret-handling constraints are explicit\n- [x] TaskExecutionContext includes the minimum sufficient fields and excludes external content and credentials\n- [x] Local linctl/gh responsibility and no-platform-fallback behavior are explicit\n- [x] Current projection and append-only transition history are defined\n- [x] Stable JSON result and error categories are defined\n- [x] One Harness attempt still starts only one Autopilot Session\n- [x] Requirements are ready for speckit.plan\n\n## Product Requirements Review\n\nReviewed with the project-local product-requirements and api-and-interface-design rubrics.\n\n**Quality Score**: 98/100\n\n- Business Value \u0026 Goals: 30/30\n- Functional Requirements: 25/25\n- User or Operator Experience: 20/20\n- Technical Constraints: 15/15\n- Scope \u0026 Priorities: 9/10\n\nNotes:\n\n- productionStatus is intentionally named to distinguish it from external Issue status and Session execution state.\n- Task has no failed state; failure remains attempt-level truth, while blocked is the Agent-reported business condition.\n- Generic Task PATCH is unsuitable for workload identity because it would expose requirement fields.\n- waiting_for_review means Agent-declared review readiness, not platform-verified delivery.\n- The accepted binary split prevents the workload capability from silently becoming a general Control Plane credential.\n- Planning must decide execution-code signing/storage, revocation and redaction mechanics without broadening `mystra-agent`.\n- Assign/Start now defines a short atomic Task/Harness transaction followed by asynchronous Workspace preparation and idempotent Session creation.\n- Host-local `linctl`/`gh` installation and authentication are deployment preconditions, not Mystra Integration behavior.\n\n## Current-contract evidence\n\n- Current Task update contract only allows title and description; 051 therefore requires a dedicated transition contract.\n- Current Session states already describe execution lifecycle and must not be reused as Task business states.\n- Feature 047 explicitly excluded Task lifecycle state; 051 supersedes only that clause while preserving provider-owned Issue state.\n",
      "sourceHash": "21ff4fd2357e23360606e0bcd98df0d0b2208900ffee7cfe20c2b7863adb0515"
    },

      "mediaType": "text/markdown",
      "content": "# Verification：051 Factory Task Harness\n\n**Verdict**: PASS WITH DECLARED ENVIRONMENTAL SKIPS\n**Date**: 2026-08-11\n\n## Delivered contract\n\n- Task 拥有独立、带 revision 的 productionStatus 与 append-only transition history。\n- Assign/Start 原子创建 in_progress transition 与 frozen Harness；Workspace ready continuation 幂等启动唯一 Harness Session。\n- `mystra-agent` 仅凭 attempt-scoped execution code 提供 whoami、context 和 allowlisted status transition，不接受任意 Task ID。\n- Runtime claim-time 签发 code，RDB 仅保存 SHA-256 hash/expiry；terminal Task 吊销 capability；Provider 输出中的 code 被清理为 `[REDACTED]`。\n- Agent 使用宿主机本地 `linctl`/`gh`；PR 与自测 note 明确为 `verified:false`，Mystra 不验证。\n\n## Automated verification\n\n- `corepack pnpm --filter @mystra/control-plane db:generate`: PASS，双 Prisma client 已生成。\n- `corepack pnpm --filter @mystra/control-plane db:validate`: PASS，SQLite 与 PostgreSQL schema 均有效。\n- `corepack pnpm test`: PASS：shared 147、agent-adapters 9、agent-cli 5、control-plane 350、runner-daemon 31；control-plane 另有 19 项环境条件测试跳过。\n- `corepack pnpm typecheck`: PASS。\n- `corepack pnpm build`: PASS，Next.js production build 包含新的 production 与 agent-execution routes。\n- provider contracts 覆盖 20-way optimistic revision race、idempotent replay、Harness uniqueness、capability expiry/revocation 和 Workspace completion replay。\n\n## Runtime evidence\n\n- 临时 SQLite 数据库迁移全部应用后，通过真实 HTTP 完成 register → Runtime/Agent/Project/Task → Assign → replay → production read → Human cancel。\n- Assign replay 返回同一 transition/Harness 且 `created:false`；cancel 进入 revision 3，数据库确认 capability revocation 与两条 append-only transition。\n- assign、replay、production read 和 cancel response 均携带 `Cache-Control: no-store`。\n- 真实浏览器验证 Task detail 的 production panel、Harness、latest Session、current actor、history 和 canceled sidebar icon；交互前后 console 均无 error/warning。\n- agent-cli journey 使用临时本地 fixture `linctl`/`gh` 完成 issue read、PR create/report，并断言只访问 scoped Control Plane URLs。\n\n## Review evidence\n\n- GitNexus fresh index：11,110 nodes、18,483 edges、207 clusters、300 flows；final detect_changes 映射 174 个 changed symbols、11 条 affected processes。\n- aggregate change detection 对中心 RDB/provider 改动报告 HIGH；逐符号 impact 已在编辑前审查。高风险来自预期的跨层生产合同，而不是未解释的旁路。\n- project-local review 已修正：assignment replay 对 mutable dependencies 的错误重验、Human auth no-store、UI retry idempotency、history ordering/current actor、execution code provider-output 泄漏、Harness prompt mutable context 重复、expiry 合同漂移与 capability scope 校验缺口。\n\n## Declared skips\n\n- 环境未配置 `MYSTRA_TEST_POSTGRES_URL`，未执行 PostgreSQL runtime connectivity；双 schema validate 不能替代该证据。\n- 未使用真实 Linear Issue 或创建真实 GitHub PR，因为本次验证没有指定外部目标，也未授权外部副作用。宿主机 `linctl`/`gh` 是 Agent-owned delivery boundary，已用真实进程 fixture journey 验证组合方式。\n- 没有实现 PR/自测验真、Harness heartbeat/event subscription、多 Session 或通用 Artifact；这些均为 051 明确排除项。\n",
      "sourceHash": "c9e2377944e07854073b07b8090de61517a8f73c2d8715af64eee9bea98c99ca"
    },

      "title": "评审清单：薄 Task 生产状态机",
      "path": "specs/051-factory-task-harness/checklists.md",
      "mediaType": "text/markdown",
      "content": "# 评审清单：薄 Task 生产状态机\n\n## Owner 决策\n\n- [x] Task 是基本生产任务，并拥有 Mystra-owned productionStatus。\n- [x] 状态仅为 pending、in_progress、blocked、waiting_for_review、done、canceled。\n- [x] Agent 只可报告 blocked、恢复 in_progress、声明 waiting_for_review。\n- [x] done 与 canceled 由 Human 控制。\n- [x] Task productionStatus 与 Session.state 独立，不自动同步。\n- [x] `mystra` 保留为 Control Plane 管理 CLI；workload-local 客户端定名为 `mystra-agent`。\n- [x] `mystra-agent` 通过 attempt-scoped execution code 提供 whoami、context get 与 Task status 命令，不接受任意 Task ID。\n- [x] Agent 使用本地已认证的 `linctl` 读取 Linear、使用本地已认证的 `gh` 提交 PR；Mystra 不代理、不提供凭据、不验证。\n- [x] PR 和自测信息只是 Agent 声明；Mystra 不验证。\n- [x] 一个 Harness attempt 仍只启动一个 goal/autopilot Session。\n- [x] 已通过 shared contract、CLI command tests、真实 HTTP smoke 与浏览器 Task detail 验证状态机和 CLI 交互。\n\n## Spec 就绪度\n\n- [x] transition table、actor 权限和终态明确。\n- [x] expectedRevision 与 idempotency 规则明确。\n- [x] `mystra-agent` execution scope、`TaskExecutionContext` 与字段 allowlist 明确。\n- [x] TaskStatusTransition 审计事实明确。\n- [x] 047 的旧无状态边界被显式、有限地取代。\n- [x] 外部 Issue status、Session state 和 Agent report 的边界明确。\n- [x] Assign/Start 短事务与 Workspace-ready 后 Session launch 的边界已在 Spec 明确。\n- [x] plan 与实现已确认 claim-time 签发、SHA-256 hash 持久化、六小时过期、终态吊销、Runner 环境传输和敏感信息清理。\n\n## 后续边界\n\n- [x] 已确认 PR/自测验真排除于 051，必须由后续独立 Spec 引入。\n- [x] 已确认多 Session、心跳和事件订阅排除于 051，必须由后续独立 Spec 引入。\n- [x] 已确认通用 Artifact/Delivery 与 Production Recipe 不是 051 的隐藏依赖。\n- [x] 已确认 Mystra 不代理 `linctl`/`gh`、不托管本地 CLI 凭据；改变该边界必须另立 Spec。\n",
      "sourceHash": "d781fc4f7b140424c40bfb87b19148678aea39d51ee45d05295921d90172a41d"
    },

      "title": "Contract：Agent workload API",
      "path": "specs/051-factory-task-harness/contracts/agent-workload-api.md",
      "mediaType": "text/markdown",
      "content": "# Contract：Agent workload API\n\n所有端点只接受：\n\n```http\nAuthorization: Bearer \u003cMYSTRA_EXECUTION_CODE\u003e\n```\n\n不接受 Human cookie、generic API token、Task ID query/body 或 Agent ID override。成功/错误均 `cache-control: no-store`，不得记录 Authorization header/body code。\n\n## GET `/api/agent-execution/whoami`\n\n```json\n{\n  \"version\": 1,\n  \"execution\": {\n    \"teamId\": \"uuid\",\n    \"taskId\": \"uuid\",\n    \"harnessId\": \"uuid\",\n    \"sessionId\": \"uuid\",\n    \"agentId\": \"uuid\",\n    \"agentRevision\": 3,\n    \"expiresAt\": \"date-time\"\n  },\n  \"capabilities\": [\"context:read\", \"task-status:read\", \"task-status:transition\"]\n}\n```\n\n## GET `/api/agent-execution/context`\n\nControl Plane logical response：\n\n```json\n{\n  \"version\": 1,\n  \"execution\": { \"taskId\": \"uuid\", \"harnessId\": \"uuid\", \"sessionId\": \"uuid\", \"agentId\": \"uuid\", \"agentRevision\": 3 },\n  \"task\": { \"title\": \"Frozen title\", \"description\": \"Frozen description\", \"issue\": { \"provider\": \"linear\", \"connectionId\": \"uuid\", \"scopeExternalId\": \"team\", \"externalId\": \"issue\", \"identifier\": \"ENG-123\" } },\n  \"project\": { \"id\": \"uuid\", \"repositoryConnectionId\": \"uuid\", \"repositoryExternalId\": \"owner/repo\", \"repositoryBaseBranch\": \"main\" },\n  \"workspace\": { \"id\": \"uuid\", \"branch\": \"eng-123-fix\" },\n  \"capabilities\": [\"context:read\", \"task-status:read\", \"task-status:transition\"]\n}\n```\n\nCLI 添加 `workspace.root=process.cwd()` 后输出最终 TaskExecutionContext。响应不含 Linear/GitHub body、clone credential、PAT/App token、repository secret 或 execution code。\n\n## GET `/api/agent-execution/task-status`\n\n```json\n{\n  \"taskId\": \"uuid\",\n  \"productionStatus\": \"in_progress\",\n  \"statusRevision\": 2,\n  \"statusNote\": null,\n  \"statusUpdatedAt\": \"date-time\",\n  \"allowedTransitions\": [\"blocked\", \"waiting_for_review\"]\n}\n```\n\n## POST `/api/agent-execution/task-status`\n\n```json\n{\n  \"status\": \"blocked\",\n  \"expectedRevision\": 2,\n  \"idempotencyKey\": \"agent-status-1\",\n  \"note\": \"linctl is not authenticated\"\n}\n```\n\nRequest 不含 taskId/harnessId/sessionId/agentId；这些全部来自 capability resolution。\n\nSuccess:\n\n```json\n{\n  \"taskId\": \"uuid\",\n  \"productionStatus\": \"blocked\",\n  \"statusRevision\": 3,\n  \"statusUpdatedAt\": \"date-time\",\n  \"transitionId\": \"uuid\"\n}\n```\n\n## Stable errors\n\n| code | HTTP | 语义 |\n| --- | --- | --- |\n| `capability_expired` | 401 | code absent、unknown、expired、revoked |\n| `scope_mismatch` | 403 | resolved objects/revisions不再匹配；不返回 context |\n| `invalid_transition` | 409 | Agent actor不允许该迁移 |\n| `task_status_conflict` | 409 | stale revision/idempotency conflict |\n| `missing_status_note` | 400 | blocked/waiting_for_review note缺失 |\n| `invalid_request` | 400 | schema/limits失败 |\n",
      "sourceHash": "0f4bb4228cd984552317a951642b322b822d1b1fc4e795e579b48b8c640cf6d0"
    },

      "title": "Contract：mystra-agent CLI",
      "path": "specs/051-factory-task-harness/contracts/mystra-agent-cli.md",
      "mediaType": "text/markdown",
      "content": "# Contract：mystra-agent CLI\n\n## Environment\n\n- `MYSTRA_CONTROL_PLANE_URL`: required absolute HTTP(S) URL。\n- `MYSTRA_EXECUTION_CODE`: required opaque code；CLI不得打印、缓存或写入 argv。\n- 当前工作目录：Runner 已解析的 ready Task Workspace root。\n\n缺少环境变量时 CLI 在发起网络请求前 fail closed。\n\n## Commands\n\n```text\nmystra-agent whoami\nmystra-agent context get\nmystra-agent task status get\nmystra-agent task status set \u003cblocked|in_progress|waiting_for_review\u003e \\\n  --expected-revision \u003cpositive-int\u003e \\\n  --idempotency-key \u003cbounded-string\u003e \\\n  [--note \u003cbounded-string\u003e]\n```\n\nCLI 不提供 `--task-id`、`--agent-id`、`--harness-id`、`--session-id`、`done`、`canceled`、Task PATCH 或 external credential commands。\n\n## Output\n\n- 成功：单个 JSON object + newline 写 stdout，exit 0；无进度装饰。\n- 失败：单个 `{\"error\":{\"code\":\"...\",\"message\":\"...\"}}` + newline 写 stderr，stdout 空，exit 1（usage error exit 2）。\n- HTTP error code 原样映射 stable application code；网络/JSON异常映射 `control_plane_unavailable`。\n- 所有输出经 schema parse；未知/超大 server response fail closed。\n- `context get` 在 schema parse 后添加 `workspace.root=process.cwd()`。\n\n## Secret handling\n\n- execution code 只从环境读取并放入 Authorization header。\n- usage、错误和 debug output 不包含 code 或完整 request headers。\n- CLI 不调用 `linctl`/`gh`；标准 Agent prompt负责调用。这样 helper 不成为外部工具 orchestration layer。\n",
      "sourceHash": "45c0c853e5ddfb33081414bc0115d3f53e0f826395e25acfef38016d1b1d67c1"
    },
    {
      "title": "Contract：Runner execution capability handoff",
      "path": "specs/051-factory-task-harness/contracts/runner-execution-capability.md",
      "mediaType": "text/markdown",
      "content": "# Contract：Runner execution capability handoff\n\n## Session claim extension\n\n既有 `SessionClaimAssignment` 增加可选字段：\n\n```json\n{\n  \"execution\": {\n    \"code\": \"opaque-plaintext-returned-once\",\n    \"expiresAt\": \"date-time\",\n    \"capabilities\": [\"context:read\", \"task-status:read\", \"task-status:transition\"]\n  }\n}\n```\n\n只有满足以下条件的 Session 才返回 `execution`：\n\n- 存在 Harness 且 `Harness.sessionId == Session.id`；\n- Harness Team/Task/Agent revision 与 Session一致；\n- Harness未吊销且 Task非terminal；\n- claim 事务成功写入 matching `executionCodeHash`/expiry。\n\n普通手工 Session claim 没有该字段，Runner不得构造假 capability。\n\n## Provider child environment\n\nRunner 构造 command 后 merge：\n\n```text\nPATH=\u003cagent-cli-bin-dir\u003e:\u003cexisting-path\u003e\nMYSTRA_CONTROL_PLANE_URL=\u003crunner-configured-endpoint\u003e\nMYSTRA_EXECUTION_CODE=\u003cclaim execution.code\u003e\n```\n\n只有 assignment.execution 存在时注入 code。Control Plane URL 来自 Runner自身配置，不由 Session prompt/context提供。Provider adapter自己的 HOME/XDG/CODEX_HOME 等环境规则保持生效。\n\n`runProviderProcess` 的日志/错误不得序列化完整 environment。execution code 不写 SessionEvent。\n\n## Lifecycle\n\n- code expiry 不晚于 lease expiry；默认 6 小时，与当前 lease上限一致。\n- reclaim 生成新 code/hash，旧 code立即无效。\n- Human done/canceled 或安全吊销写 `Harness.capabilityRevokedAt`；后续 workload call fail closed。\n- Provider child退出不会自动修改 Task，也不会自动创建 blocked transition。\n",
      "sourceHash": "f6962be85c5326d34abc89b82d267270faa02895fedf53622edafd8c8693ff1c"
    },
    {
      "title": "Contract：Human Task production API",
      "path": "specs/051-factory-task-harness/contracts/task-production-api.md",
      "mediaType": "text/markdown",
      "content": "# Contract：Human Task production API\n\n所有端点使用现有 Human session/Team authorization，响应 `cache-control: no-store`。\n\n## POST `/api/tasks/{taskId}/production/assign`\n\nRequest:\n\n```json\n{\n  \"agentId\": \"uuid\",\n  \"runtimeId\": \"uuid\",\n  \"providerKey\": \"codex\",\n  \"expectedRevision\": 1,\n  \"idempotencyKey\": \"assign-051-1\"\n}\n```\n\nSuccess `200`（created 或 replay）：\n\n```json\n{\n  \"task\": { \"id\": \"uuid\", \"productionStatus\": \"in_progress\", \"statusRevision\": 2 },\n  \"transition\": { \"id\": \"uuid\", \"fromStatus\": \"pending\", \"toStatus\": \"in_progress\", \"revision\": 2 },\n  \"harness\": { \"id\": \"uuid\", \"agentId\": \"uuid\", \"agentRevision\": 3, \"workspaceId\": null, \"plannedSessionId\": \"uuid\", \"sessionId\": null },\n  \"created\": true\n}\n```\n\n服务在响应前只保证 Task/Harness transaction 已提交并已请求 Workspace setup；不保证 Session 已启动。重复相同 key/payload 返回同一对象与 `created:false`。\n\n## GET `/api/tasks/{taskId}/production`\n\n返回 Task production projection、Harness、status transition page、Workspace projection 与 latest Session projection。Agent note 字段必须带 `verified:false`/presentation label，不得表示 Mystra 已验真。\n\n## POST `/api/tasks/{taskId}/production/status`\n\nHuman request:\n\n```json\n{\n  \"status\": \"done\",\n  \"expectedRevision\": 4,\n  \"idempotencyKey\": \"review-accept-1\",\n  \"note\": \"Accepted\"\n}\n```\n\nHuman transition allowlist：\n\n- `blocked -\u003e in_progress`\n- `waiting_for_review -\u003e in_progress|done`\n- any nonterminal `-\u003e canceled`\n\n## Stable errors\n\n| code | HTTP | 语义 |\n| --- | --- | --- |\n| `task_not_found` | 404 | Team scope 内不存在 |\n| `task_not_eligible` | 409 | 缺 Project/Repository 或非 pending Assign |\n| `agent_unavailable` | 409 | Agent foreign/archived |\n| `runtime_unavailable` | 409 | Runtime offline/capability missing |\n| `invalid_transition` | 409 | actor/from/to 不合法或 terminal |\n| `task_status_conflict` | 409 | stale revision 或 idempotency payload conflict |\n| `missing_status_note` | 400 | required note 缺失 |\n| `invalid_request` | 400 | schema/limit 失败 |\n\n错误体：`{\"error\":{\"code\":\"...\",\"message\":\"...\"}}`。message 不泄漏 foreign Team 对象是否存在。\n",
      "sourceHash": "5fa0f378720d3abb9f8a0a4bf91a9a60c1fc0bac6fcd2f070a573c523a6f28ff"
    },
    {
      "title": "数据模型：薄 Task 生产状态机与 mystra-agent CLI",
      "path": "specs/051-factory-task-harness/data-model.md",
      "mediaType": "text/markdown",
      "content": "# 数据模型：薄 Task 生产状态机与 mystra-agent CLI\n\n## 关系概览\n\n```text\nTeam 1 -- * Task 1 -- 0..1 Harness 1 -- 0..1 Session\n               |             |\n               *             0..1 TaskWorkspace\n      TaskStatusTransition   |\n                             * claim rotates\n                    SessionDispatchLease + executionCodeHash\n```\n\nTask/Project/Agent/Harness/Session 都是 Team-scoped sibling objects。Harness 通过 references 关联这些对象，不改变其 ownership。\n\n## Task production projection\n\n在现有 Task 字段上增加：\n\n| 字段 | 类型 | 约束 |\n| --- | --- | --- |\n| `productionStatus` | enum | `pending|in_progress|blocked|waiting_for_review|done|canceled`；create 默认 pending |\n| `statusRevision` | positive integer | create 为 1；每次成功迁移 +1 |\n| `statusNote` | string? | 有界、trim；blocked/waiting_for_review 必填；无 note 的新迁移清为 null |\n| `statusUpdatedAt` | timestamp | 当前 transition 的 occurredAt |\n| `statusActor` | object projection | `{kind,id?,agentId?,harnessId?,sessionId?}`；create 为 system |\n\ntitle/description/Project/Issue 的现有可变/不可变规则不变。productionStatus 不映射 external Issue status 或 Session.state。\n\n## TaskStatusTransition\n\n| 字段 | 类型 | 约束 |\n| --- | --- | --- |\n| `id` | UUID | transitionId primary key |\n| `teamId` | UUID | tenant filter |\n| `taskId` | UUID | Task FK |\n| `fromStatus` | enum | transition 前的 productionStatus；Task 创建的初始 pending 不额外制造 transition |\n| `toStatus` | enum | 必填 |\n| `revision` | positive integer | 对应写入后的 Task.statusRevision；`(taskId,revision)` unique |\n| `actorKind` | enum | `system|human|agent` |\n| `actorId` | string? | Human user/session subject stable ID；system 可空 |\n| `agentId` | UUID? | workload transition 必填 |\n| `harnessId` | UUID? | workload transition 必填 |\n| `sessionId` | UUID? | workload transition 必填 |\n| `note` | string? | 有界不可信文本 |\n| `idempotencyKey` | string | 每次 command 必填；`(taskId,idempotencyKey)` unique |\n| `requestFingerprint` | SHA-256 hex | 同 key 不同 payload 检测 |\n| `occurredAt` | timestamp | 服务端时间 |\n\n相同 key + fingerprint 返回原 transition；相同 key + 不同 fingerprint 返回 `task_status_conflict`。\n\n## Harness\n\n| 字段 | 类型 | 约束 |\n| --- | --- | --- |\n| `id` | UUID | primary key |\n| `teamId` | UUID | tenant boundary |\n| `taskId` | UUID | v1 unique；一个 Task 至多一个 attempt |\n| `agentId` | UUID | frozen assignment |\n| `agentRevision` | positive integer | frozen revision |\n| `agentSystemPrompt` | bounded text | frozen prompt snapshot；不含 execution code |\n| `taskTitle` | bounded text | Assign 时冻结 |\n| `taskDescription` | bounded text | Assign 时冻结 |\n| `taskIssue` | bounded JSON? | Assign 时冻结 exact Issue reference；不含 body |\n| `runtimeId` | UUID | selected Runtime |\n| `providerKey` | provider enum | selected available Provider |\n| `workspaceId` | UUID? | ready/setup 后绑定；unique when non-null |\n| `plannedSessionId` | UUID | Assign 时预分配的非外键幂等 identity；unique |\n| `sessionId` | UUID? | Session 创建后绑定的真实 FK；unique when non-null |\n| `firstMessageId` | UUID | Assign 时预分配；用于 idempotent launch |\n| `assignIdempotencyKey` | string | 与 Task scope 唯一 |\n| `assignRequestFingerprint` | SHA-256 hex | replay validation |\n| `capabilityRevokedAt` | timestamp? | Human done/canceled 或显式安全吊销 |\n| `setupFailureCode` | bounded string? | Workspace setup/preparation 最近 failure code；不是 Harness state |\n| `setupFailureMessage` | bounded string? | redacted operator diagnostic；成功 continuation 清空 |\n| `createdAt`,`updatedAt` | timestamp | durable attempt identity |\n\nHarness 没有 `status`、heartbeat、retry counters 或 output fields。Workspace/Session nullable existence 与 setup failure diagnostic 是异步事实，不是 Harness lifecycle。\n\n## SessionDispatchLease execution capability\n\n在既有 lease 上增加：\n\n| 字段 | 类型 | 约束 |\n| --- | --- | --- |\n| `executionCodeHash` | SHA-256 hex? | 仅 Harness Session claim 存在；不保存明文 |\n| `executionCodeExpiresAt` | timestamp? | 不晚于 lease expiry |\n\n每次有效 claim/reclaim 生成新 code/hash。workload authorization 同时验证：\n\n1. indexed hash lookup 匹配当前 lease；未知、过期和吊销对调用方返回同类错误；\n2. `now \u003c executionCodeExpiresAt \u003c= leaseExpiresAt`；\n3. lease Session 与 Harness.sessionId 相同；\n4. Harness、Task、Session、Agent revision、Team references 一致；\n5. Harness.capabilityRevokedAt 为空；\n6. Task 非 `done|canceled`。\n\n任何失败只返回稳定 capability error，不泄漏对象是否存在。\n\n## TaskExecutionContext\n\nCLI 输出 version `1`：\n\n```ts\ntype TaskExecutionContext = {\n  version: 1;\n  execution: {\n    teamId: string;\n    taskId: string;\n    harnessId: string;\n    sessionId: string;\n    agentId: string;\n    agentRevision: number;\n  };\n  task: {\n    title: string;\n    description: string;\n    issue: ExactIssueReference | null;\n  };\n  project: {\n    id: string;\n    repositoryConnectionId: string;\n    repositoryExternalId: string;\n    repositoryBaseBranch: string;\n  };\n  workspace: {\n    id: string;\n    root: string;\n    branch: string;\n  };\n  capabilities: [\"context:read\", \"task-status:read\", \"task-status:transition\"];\n};\n```\n\nControl Plane response 不含 `workspace.root`，CLI 用 workload `process.cwd()` 合成最终输出。Task 输入来自 Harness frozen fields；Issue reference 仍是 exact immutable reference，不含 Linear body。Project只返回 repository identity/configured base branch，不返回 credential、URL token 或 Integration secret。\n\n## 状态迁移矩阵\n\n| Actor | from | to | note |\n| --- | --- | --- | --- |\n| Human Assign | pending | in_progress | optional |\n| Agent | in_progress | blocked | required |\n| Agent | blocked | in_progress | optional |\n| Agent | in_progress | waiting_for_review | required |\n| Human | blocked | in_progress | optional |\n| Human | waiting_for_review | in_progress | optional |\n| Human | waiting_for_review | done | optional |\n| Human | pending/in_progress/blocked/waiting_for_review | canceled | optional |\n\n其余全部 `invalid_transition`。done/canceled 终态。\n\n## 原子不变量\n\n1. Assign transaction 同时创建 pending-\u003ein_progress transition、Task projection 和 Harness；任一失败全部回滚。\n2. production transition 同时更新 Task projection/history；terminal Human transition 同时吊销 Harness capability。\n3. Harness taskId/plannedSessionId/sessionId unique；未创建 Session 前不得写悬空 session FK；同 Workspace attempt + completion payload 可重放；重复 ready continuation 最多创建一个 Session。\n4. Agent status actor identity来自 capability resolution，不接受 request body task/agent/harness/session IDs。\n5. execution code 永不进入 Harness、TaskTransition、SessionEvent payload、prompt 或日志。\n6. Session projection/event事务不更新 Task；TaskStatusService 不写 Session event/state。\n",
      "sourceHash": "ab296bbee4db088d1e55b7d82647fa6355720e2be840c2b3c9d28e38c2c510a5"
    },
    {
      "title": "功能说明：薄 Task 生产状态机与 mystra-agent CLI",
      "path": "specs/051-factory-task-harness/features.md",
      "mediaType": "text/markdown",
      "content": "# 功能说明：薄 Task 生产状态机与 mystra-agent CLI\n\n## 摘要\n\n051 的第一版只增加一套业务状态：Task.productionStatus。Assign/Start 的短事务把 pending Task 原子推进到 in_progress 并创建轻量 Harness attempt；Workspace ready 后再幂等启动其唯一 Autopilot Session。随后由 Agent 通过 workload-local `mystra-agent` 报告 blocked、恢复 in_progress 或声明 waiting_for_review；done 与 canceled 仍由人控制。\n\n## 状态边界\n\n- Task productionStatus：pending、in_progress、blocked、waiting_for_review、done、canceled。\n- Session.state：执行会话是否 queued、running、ready、failed 等。\n- Harness attempt：冻结 Agent revision 并关联一次 Session，不拥有第二套状态机。\n- External Issue status：仍由 Linear/GitHub Provider 拥有，不复制、不回写、不映射。\n\n## 两个 CLI 的边界\n\n- `mystra`：Human、外部 Agent 和自动化使用的 Control Plane 管理 CLI。\n- `mystra-agent`：当前 Agent workload 使用的 attempt-scoped CLI。\n- `mystra-agent whoami`：解析当前 execution identity。\n- `mystra-agent context get`：取得版本化 `TaskExecutionContext`。\n- `mystra-agent task status get`：读取当前状态、revision 和允许迁移。\n- `mystra-agent task status set blocked`：报告阻塞，必须带 note。\n- `mystra-agent task status set in_progress`：从 blocked 恢复。\n- `mystra-agent task status set waiting_for_review`：声明等待人工审查，必须带 note。\n- Runtime 只注入 Control Plane URL 与短期 execution code；CLI 不允许 Agent 指定任意 Task。\n\n`TaskExecutionContext` 提供冻结 Task 输入、exact Issue reference、Project repository 配置和 Workspace 路径/分支，但不复制 Linear body，也不返回任何外部凭据。Agent 使用宿主机已认证的 `linctl` 读取 Linear，使用已认证的 `gh` 推送并创建 PR。Agent note 可包含 PR 和自测摘要，但这些只是 Agent reported。Mystra 不代理这些 CLI、不回退到 Project Integration credential、不查询 PR、不运行测试、不验证交付结果。\n\n## 第一版边界\n\n- 一个 Harness attempt 只启动一个 goal/autopilot Session。\n- Session state 不自动驱动 Task productionStatus。\n- 所有状态迁移使用专用 TaskStatusService，并应用 transition allowlist、expectedRevision、idempotency key 和 append-only history。\n- Agent 不能设置 pending、done、canceled，也不能通过 CLI 修改 Task requirement。\n- `linctl` 或 `gh` 缺失/未认证时，由 Agent 报告 blocked；Mystra 不代为执行。\n- 完整 Harness 心跳、事件订阅、多 Session、通用 Artifact、Production Recipe 和质量验收均延后。\n",
      "sourceHash": "e5c2930660517b840d0586d020202b8905f3863fbd38335e404c3753afd95657"
    },

\u003cstrong\u003eSpec Review Surface\u003c/strong\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"tabs\" role=\"tablist\" aria-label=\"Spec document tabs\" id=\"tabs\"\u003e\u003c/div\u003e\n      \u003c/aside\u003e\n      \u003cmain class=\"main\"\u003e\n        \u003cdiv class=\"shell\"\u003e\n          \u003cdiv class=\"topbar\"\u003e\n            \u003cdiv class=\"title-block\"\u003e\n              \u003cdiv class=\"eyebrow\" id=\"active-eyebrow\"\u003e\u003c/div\u003e\n              \u003ch1 id=\"page-title\"\u003e\u003c/h1\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"meta\"\u003e\n              \u003cspan class=\"badge\" id=\"generated-at\"\u003e\u003c/span\u003e\n              \u003ca class=\"action\" id=\"prototype-link\" target=\"_blank\" rel=\"noreferrer\"\u003eOpen Prototype\u003c/a\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003carticle class=\"content\"\u003e\n            \u003cdiv class=\"content-header\"\u003e\n              \u003ch2 id=\"active-label\"\u003e\u003c/h2\u003e\n              \u003cspan id=\"active-position\"\u003e\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"doc\" id=\"doc\"\u003e\u003c/div\u003e\n          \u003c/article\u003e\n        \u003c/div\u003e\n      \u003c/main\u003e\n    \u003c/div\u003e\n    \u003cscript id=\"spec-data\" type=\"application/json\"\u003e{\"feature\":\"051-factory-task-harness\",\"title\":\"051-factory-task-harness\",\"prototypeHref\":\"mockups/index.html?v=1786454186583\",\"generatedAt\":\"2026-08-11T14:56:52.466Z\",\"tabs\":[{\"id\":\"spec\",\"label\":\"SPEC\",\"eyebrow\":\"Specification\",\"markdown\":\"# 功能规格：薄 Task 生产状态机与 mystra-agent CLI\\n\\n**Feature Branch**: 051-factory-task-harness\\n**Created**: 2026-08-11\\n**Status**: Complete\\n**Input**: Mystra 以“工厂”为核心产品模型。第一版先为 Task 增加薄生产状态机，并提供 workload-local `mystra-agent` CLI，让被分配 Agent 用当前 attempt 的短期 execution code 获取完整执行上下文并报告生产进度。`mystra` 保留为面向 Human、外部 Agent 和操作者的 Control Plane 管理 CLI。Agent 通过宿主机已认证的 `linctl` 读取 Linear、通过 `gh` 提交 PR；Mystra 不代理或验证这些操作。一个 Harness attempt 仍只启动一个 goal/autopilot Session；完整 Harness 编排、平台验收和通用产出物延后。\\n\\n## 决策摘要\\n\\nTask 是基本生产任务，并拥有 Mystra-owned 的 productionStatus。Session 只表达一次执行会话的运行状态，两者不得互相镜像。Harness 第一版只是一次生产 attempt 的归因身份：冻结 Agent revision，关联一个 Session，不再拥有第二套生产状态机。\\n\\n`mystra` 与 `mystra-agent` 是两个明确分离的客户端。前者管理 Control Plane 资源；后者只服务当前运行中的 workload，通过 Runtime 注入的 execution code 解析当前 Team、Task、Harness、Session、冻结 Agent revision、Project、Issue reference 和 Workspace。`mystra-agent` 不接受任意 Task ID，也不能使用通用 Task PATCH 修改 title、description、Project 或 Issue context。\\n\\nAgent 通过宿主机本地、已认证的 `linctl` 读取 Linear Issue，通过本地 `gh` 推送分支并创建 PR。execution code 不授权这两个工具，Mystra 也不代理其请求、托管其凭据或验证其结果。Agent 对 PR、自测和阻塞原因的说明都是未验证声明；Mystra 本期不运行测试、不查询或验证 PR，也不根据 Session 输出推断 Task 是否完成。\\n\\n本规格明确取代 047 中“Task 没有生产状态”的边界，但不改变其外部信息所有权：Linear/GitHub Issue status 仍由 Provider 拥有，Mystra 不复制、不回写，也不把它映射为 productionStatus。\\n\\n## Task Production State Machine\\n\\n### 状态\\n\\n| productionStatus | 含义 | 进入者 |\\n| --- | --- | --- |\\n| pending | Task 已创建，尚未开始生产 | 系统创建 |\\n| in_progress | 已分配 Agent，生产正在进行或恢复进行 | Assign/Start；Agent 恢复；Human 退回修改 |\\n| blocked | Agent 明确声明当前无法继续，并提供原因 | Agent |\\n| waiting_for_review | Agent 明确声明已完成当前生产目标，等待人工审查 | Agent |\\n| done | 人工确认本次生产任务结束 | Human |\\n| canceled | 人工终止未完成的生产任务 | Human |\\n\\nTask 不提供 failed 状态。失败属于 Harness/Session attempt；Agent 无法继续时将 Task 置为 blocked。这样可以避免一次进程异常永久定义业务任务，也避免 Mystra 假装理解 Agent 的执行结果。\\n\\n### 合法迁移\\n\\n    create ───────────────→ pending\\n    pending ──Assign/Start→ in_progress\\n    in_progress ──Agent───→ blocked\\n    blocked ─────Agent────→ in_progress\\n    in_progress ──Agent───→ waiting_for_review\\n    waiting_for_review ─Human→ in_progress\\n    waiting_for_review ─Human→ done\\n    blocked ────────────Human→ in_progress\\n    any nonterminal ────Human→ canceled\\n\\ndone 和 canceled 在第一版为终态；reopen 延后。Agent 不得设置 pending、done 或 canceled，也不得从 waiting_for_review 自行恢复生产。\\n\\n### 状态机规则\\n\\n1. Assign/Start 的短 RDB 事务必须原子完成 pending → in_progress 并创建 Harness attempt。事务提交后自动请求 Workspace preparation；Workspace ready 后再幂等创建该 attempt 的唯一 Session。数据库事务不得跨越 Workspace 或 Runtime I/O。\\n2. productionStatus 与 Session.state 独立。Session failed、closed、interrupted 或 ready 均不得自动改变 Task；Task 状态迁移也不得隐式启动、停止或重试 Session。\\n3. 如果 Agent 退出前没有报告 blocked 或 waiting_for_review，Task 可以保持 in_progress。本期接受这一不完整信号，不由 Mystra猜测结果。\\n4. blocked 和 waiting_for_review 必须包含非空 note；其他迁移可选 note。每次迁移都替换当前 statusNote；未提供时投影为 null，不保留上一状态的旧说明。\\n5. 每次迁移使用 expectedRevision 乐观并发控制。旧 revision 返回稳定 task_status_conflict，不覆盖新状态。\\n6. 每次写入必须带 idempotency key。同 key 与同 payload 重放返回原结果；同 key 不同 payload 返回稳定冲突。\\n7. 当前投影保存在 Task；每次迁移同时追加 TaskStatusTransition，供审计和恢复当前投影。\\n\\n## mystra-agent CLI Contract\\n\\nMystra 提供两个边界不同的 CLI：\\n\\n- `mystra`：面向 Human、外部 Agent 和自动化，管理 Control Plane 资源；它不是任务 workload 的默认身份入口。\\n- `mystra-agent`：面向当前运行中的 Agent workload，只能访问 execution code 授权的 attempt。\\n\\n第一版 `mystra-agent` 开放身份、执行上下文、Task 状态读取和受控迁移：\\n\\n    mystra-agent whoami\\n    mystra-agent context get\\n    mystra-agent task status get\\n    mystra-agent task status set blocked --expected-revision 3 --idempotency-key cmd-101 --note \\\"Waiting for API contract\\\"\\n    mystra-agent task status set in_progress --expected-revision 4 --idempotency-key cmd-102 --note \\\"Contract received\\\"\\n    mystra-agent task status set waiting_for_review --expected-revision 5 --idempotency-key cmd-103 --note \\\"PR: ...; tests: ...\\\"\\n\\nRuntime 至少注入 `MYSTRA_CONTROL_PLANE_URL` 与 `MYSTRA_EXECUTION_CODE`。execution code 是一次 Harness/Session attempt 的短期、可吊销 capability，绑定准确 Team、Task、Harness、Session 和冻结 Agent revision；它不是 Agent 的长期身份 code，也不得出现在 system prompt、普通日志、状态 note 或明文持久化中。`mystra-agent` 不接受任意 Task ID。\\n\\n`context get` 返回 schema-versioned `TaskExecutionContext`，至少包含 execution identity、冻结的 Task title/description 与 exact Issue reference、Project repository identity 与 configured base branch、Workspace root/working branch，以及当前允许的 CLI capabilities。它不得复制 Linear Issue body，不得返回 GitHub/Linear credentials、Project Integration secret 或其他 secrets。\\n\\n`task status` 只能调用专用 TaskStatusService.transition，不复用人类 Task PATCH。输出为稳定 JSON，至少包含 taskId、productionStatus、statusRevision、statusUpdatedAt 和 transitionId。错误至少区分 invalid_transition、task_status_conflict、missing_status_note、scope_mismatch 和 capability_expired。\\n\\nAgent 拿到 exact Linear Issue reference 后，使用宿主机本地、已认证的 `linctl` 获取当前需求；完成代码与自测后，使用宿主机本地、已认证的 `gh` 推送分支并创建 PR。Mystra 不代理这些 CLI、不向它们兑换凭据、不查询 PR，也不验证自测。若任一工具缺失、未认证或不可执行，Agent 应通过 `mystra-agent task status set blocked` 报告原因；平台不回退到 Project Integration credential 或 RepoDeliveryProvider 代为完成。\\n\\nAgent note 是不可信文本。即使包含 PR URL、commit SHA 或测试结果，Mystra 也只保存并展示为 “Agent reported”，不连接 GitHub、不运行命令、不做结果验真。\\n\\n## User Scenarios \u0026 Testing\\n\\n### User Story 1 - Assign Agent 开始生产 (Priority: P1)\\n\\n作为 Team 操作者，我希望为 pending Task 分配 Agent 后自动开始一个生产 attempt，以便 Task 明确进入 in_progress 并启动唯一 Autopilot Session。\\n\\n**Independent Test**: 对 eligible Task 执行 Assign/Start，验证短事务原子创建状态迁移与 Harness；随后 Workspace ready 事件只触发一个 Session，重复命令或事件不产生重复对象。\\n\\n**Acceptance Scenarios**:\\n\\n1. **Given** pending Project-bound Task 和同 Team active Agent，**When** 操作者 Assign/Start，**Then** Task 与冻结 Agent revision 的 Harness 在同一短事务中创建，Task 进入 in_progress，提交后开始 Workspace preparation。\\n2. **Given** Workspace 随后 ready，**When** launch continuation 被触发或重放，**Then** 该 Harness 幂等获得恰好一个 Session。\\n3. **Given** 同一 Assign/Start 命令被重放，**When** 服务处理，**Then** 返回同一 transition 和 Harness，不创建重复 Workspace 或 Session。\\n4. **Given** Task 非 pending、Project 不可交付或 Agent 无效，**When** Assign/Start，**Then** fail closed 且不留下部分 Task/Harness 状态。\\n\\n### User Story 2 - Agent 报告生产状态 (Priority: P1)\\n\\n作为被分配 Agent，我希望只凭当前 attempt 的 execution code，通过 `mystra-agent` 获取身份、Task、Project、Issue reference 和 Workspace 信息并更新当前 Task 状态，以便用标准 bootstrap prompt 开始工作，同时继续使用本地 `linctl` 与 `gh` 完成外部读取和 PR 交付。\\n\\n**Independent Test**: 仅注入 Control Plane URL 与 execution code，验证 Agent 无需 Task ID 即可取得 `TaskExecutionContext`；随后用 fixture `linctl`/`gh` 完成读取与 PR 创建，并依次执行 in_progress → blocked → in_progress → waiting_for_review，验证 revision、note、actor 和 transition history。\\n\\n**Acceptance Scenarios**:\\n\\n1. **Given** Runtime 注入有效 execution code，**When** Agent 执行 `mystra-agent whoami` 和 `context get`，**Then** 返回当前 attempt 的身份与完整执行上下文，不要求或接受 Task ID。\\n2. **Given** context 含 exact Linear Issue reference，**When** Agent 读取需求，**Then** 使用本地 `linctl`；Mystra 不复制 Linear body 或代理调用。\\n3. **Given** Task 为 in_progress，**When** Agent 带 note 设置 blocked，**Then** 状态和审计记录原子更新。\\n4. **Given** Task 为 blocked，**When** 同一 Agent 设置 in_progress，**Then** 生产恢复，Session 是否继续由执行层独立决定。\\n5. **Given** Agent 完成代码与自测，**When** 它使用本地 `gh` 创建 PR 并带交付说明设置 waiting_for_review，**Then** Mystra 只保存未验证声明，不创建、不查询或验证 PR 和自测。\\n6. **Given** `linctl` 或 `gh` 缺失或未认证，**When** Agent 无法继续，**Then** Agent 报告 blocked，Mystra 不提供 Integration credential fallback。\\n7. **Given** Agent 尝试设置 done、canceled、pending、指定其他 Task ID 或修改其他 Task 字段，**When** CLI 处理，**Then** 拒绝请求。\\n\\n### User Story 3 - 人工收口或退回 (Priority: P1)\\n\\n作为 Reviewer，我希望确认 Agent 声明后把 Task 标记 done，或退回 in_progress，以便业务完成权仍属于人。\\n\\n**Independent Test**: 从 waiting_for_review 分别执行 done 与 in_progress，并验证 actor 权限和审计记录。\\n\\n**Acceptance Scenarios**:\\n\\n1. **Given** waiting_for_review Task，**When** Human 接受结果，**Then** Task 进入 done。\\n2. **Given** waiting_for_review Task，**When** Human 要求修改，**Then** Task 进入 in_progress；是否启动新 Session 不由该迁移隐式决定。\\n3. **Given** 任意非终态 Task，**When** Human 取消，**Then** Task 进入 canceled。\\n4. **Given** done 或 canceled Task，**When** 任意调用方请求迁移，**Then** 第一版返回 invalid_transition。\\n\\n### User Story 4 - 状态与 Session 可分别观察 (Priority: P2)\\n\\n作为操作者，我希望同时看见 Task productionStatus 和最新 Session.state，以便区分业务进度与进程运行情况。\\n\\n**Independent Test**: 构造 Session failed 但 Task in_progress，以及 Session ready 但 Task blocked；验证系统不自动同步两者。\\n\\n**Acceptance Scenarios**:\\n\\n1. **Given** Session failed，**When** Agent 未更新 Task，**Then** Task 保持 in_progress。\\n2. **Given** Task blocked，**When** Session state 变化，**Then** Task 不被自动修改。\\n3. **Given** waiting_for_review note 包含 PR 和 tests，**When** 页面或 API 展示，**Then** 明确标识为 Agent reported / not verified by Mystra。\\n\\n### Edge Cases\\n\\n- 两个 Agent 命令使用同一 expectedRevision 时只有一个成功。\\n- 过期 Harness、Session 或 Agent revision 的 capability 不得更新新 attempt 的 Task。\\n- CLI 网络超时后可用同 idempotency key安全重试。\\n- Session 崩溃且 Agent 未能发出 blocked 时，Task 保持 in_progress。\\n- 外部 Issue 被关闭、重开或改状态时，productionStatus 不自动变化。\\n- waiting_for_review 的 URL 无效或测试说明虚假时，Mystra 仍只保存声明；人工 Reviewer 决定后续状态。\\n- execution code 过期、吊销、泄漏到错误 attempt 或 scope 不匹配时，`mystra-agent` fail closed，不返回任何 Task/Project/Workspace context。\\n- `linctl` 或 `gh` 不在 PATH、未认证或返回错误时，不改变 Mystra 的外部 Integration；Agent 可报告 blocked，平台不静默切换凭据或 delivery provider。\\n- Workspace preparation 失败时 Harness 保留可诊断事实，Task 可继续保持 in_progress；Mystra 不根据基础设施失败猜测业务状态。\\n\\n## Requirements\\n\\n### Functional Requirements\\n\\n- **FR-001**: Task MUST 增加 Mystra-owned productionStatus，取值仅为 pending、in_progress、blocked、waiting_for_review、done、canceled。\\n- **FR-002**: 新 Task MUST 初始化为 pending。\\n- **FR-003**: Task productionStatus MUST 与外部 Issue status、Session.state 和 Harness attempt outcome 分离，不进行自动映射。\\n- **FR-004**: 第一版 MUST NOT 提供 Task failed 状态。\\n- **FR-005**: Assign/Start 的短 RDB 事务 MUST 原子执行 pending → in_progress 并创建一个 Harness attempt；事务提交后 MUST 请求 Workspace preparation，Workspace ready 后 MUST 幂等创建该 attempt 的唯一 Autopilot Session，且事务不得跨越 Workspace 或 Runtime I/O。\\n- **FR-006**: Harness MUST 冻结 Agent revision 并关联 Task、Workspace 和一个 Session，但 MUST NOT 拥有平行生产状态机。\\n- **FR-007**: Agent 只可请求 in_progress → blocked、blocked → in_progress、in_progress → waiting_for_review。\\n- **FR-008**: Human 只可按本规格执行 waiting_for_review → done、waiting_for_review/blocked → in_progress，以及任意非终态 → canceled。\\n- **FR-009**: done 和 canceled MUST 为第一版终态。\\n- **FR-010**: blocked 与 waiting_for_review 迁移 MUST 要求非空 note。\\n- **FR-011**: 所有 productionStatus 迁移 MUST 使用专用 TaskStatusService；Agent 尤其不得复用允许编辑 title/description 的通用 Task PATCH。\\n- **FR-012**: `mystra-agent` execution capability MUST 绑定准确 Team、Task、Harness、Session、Agent ID/revision，且 CLI 不得接受任意 Task ID 越权寻址。\\n- **FR-013**: 每次状态迁移 MUST 使用 expectedRevision 并返回稳定冲突错误。\\n- **FR-014**: 每次状态迁移 MUST 支持 idempotency key；相同 key/payload 重放返回同一结果。\\n- **FR-015**: Task MUST 保存当前状态投影、statusRevision、当前 transition 的 statusNote、statusUpdatedAt 和最后 actor summary；新迁移无 note 时 statusNote MUST 清为 null。\\n- **FR-016**: 每次成功迁移 MUST 原子追加不可变 TaskStatusTransition，记录 transitionId、taskId、from、to、revision、actor、可选 Agent/Harness/Session identity、note、idempotency identity 和 occurredAt。\\n- **FR-017**: `mystra-agent` MUST 提供 `whoami`、`context get`、`task status get` 和 `task status set`，输出稳定 machine-readable JSON；`mystra` MUST 保留为独立的 Control Plane 管理 CLI。\\n- **FR-018**: CLI 错误 MUST 至少区分 invalid_transition、task_status_conflict、missing_status_note、scope_mismatch 和 capability_expired。\\n- **FR-019**: Session state 变化 MUST NOT 自动改变 productionStatus；普通 productionStatus 迁移 MUST NOT 隐式控制 Session。\\n- **FR-020**: Agent 未报告最终状态时，Mystra MUST 允许 Task 保持 in_progress，不根据 Session 文本、exit code 或事件推断结果。\\n- **FR-021**: Agent note 中的 PR、commit 和自测信息 MUST 标识为未验证 Agent 声明；Mystra 本期 MUST NOT 查询 PR、运行测试或验证证据。\\n- **FR-022**: Issue Provider MUST 保持 read-only；productionStatus 更新不得回写外部 Issue。\\n- **FR-023**: 状态读取、迁移和历史 MUST 受 Team authorization、字段级 allowlist、有界文本和敏感信息清理约束。\\n- **FR-024**: Runtime MUST 通过 `MYSTRA_CONTROL_PLANE_URL` 和 `MYSTRA_EXECUTION_CODE` 向 workload 注入连接信息；execution code MUST 短期、可吊销、attempt-scoped，且 MUST NOT 出现在 prompt、普通日志、状态 note 或明文持久化中。\\n- **FR-025**: `context get` MUST 返回 schema-versioned `TaskExecutionContext`，包含 execution identity、冻结 Task 输入、exact Issue reference、Project repository identity/configured base branch、Workspace root/working branch 与允许的 capabilities；MUST NOT 返回 Linear body、Integration credentials 或 secrets。\\n- **FR-026**: 第一版 Agent MUST 使用宿主机本地、已认证的 `linctl` 读取 Linear，并使用本地、已认证的 `gh` 推送和创建 PR；Mystra MUST NOT 代理、授权、查询或验证这些操作。\\n- **FR-027**: `linctl` 或 `gh` 缺失、未认证或失败时，平台 MUST NOT 回退到 Project Integration credential 或 RepoDeliveryProvider；Agent MAY 将 Task 报告为 blocked。\\n\\n### Key Entities\\n\\n- **Task**: Team-scoped 基本生产任务，保存 requirement context 和当前 production status projection。\\n- **TaskStatusTransition**: append-only 状态迁移事实，用于审计、幂等、冲突诊断和投影恢复。\\n- **Harness Attempt**: 一次生产归因 identity，冻结 Agent revision，关联一个 Session；第一版不拥有独立状态机。\\n- **Session**: Agent 的执行会话，拥有自己的 execution state；不代表 Task 业务状态。\\n- **TaskExecutionContext**: `mystra-agent context get` 返回的版本化、最小充分执行上下文；包含当前 attempt 的身份、冻结需求引用、Project/Workspace 信息和允许能力，不包含外部系统正文或凭据。\\n- **Execution Capability**: Runtime 注入的短期、可吊销、最小权限 execution code，只允许当前 attempt 读取上下文和申请合法 Task 状态迁移。\\n\\n## Assumptions \u0026 Dependencies\\n\\n- 第一版仍为一个 Harness attempt 启动一个 goal/autopilot Session。\\n- Assign Agent 后立即 Start；自动分诊和独立 Start UI 不在本期。\\n- 现有 Task Context、Workspace、Session launch、Runtime/Provider 和 Agent revision 合同可复用。\\n- 第一版目标环境为 host Runtime；Provider 进程继承同一操作系统用户可用的 PATH 与本地 CLI 登录态。\\n- `linctl` 与 `gh` 已安装、可执行且预先认证，是该自用 MVP deployment 的运行前提，不由 Mystra 配置或托管。\\n- 内置 Agent 的标准 bootstrap prompt 只需要求：先调用 `mystra-agent context get`，再按 Issue reference 使用 `linctl`，在提供的 Workspace/branch 内改码和自测，使用 `gh` 创建 PR，最后通过 `mystra-agent` 报告 waiting_for_review 或 blocked。\\n- 项目处于 pre-0.1；本功能直接替换旧的“Task 无生产状态”开发合同，不增加兼容别名或迁移 shim。\\n\\n## Deferred / Out of Scope\\n\\n- Mystra 验证 PR、commit、自测证据或执行质量门禁。\\n- 通用 Artifact/Delivery 提交、非 PR 产出物和多类型流水线。\\n- 多 Session Harness、心跳、事件订阅、自动恢复、自动 Retry 和等待条件。\\n- Production Recipe、Skill/Workflow 自动选择、任务分诊、需求审查和多 Agent 协作。\\n- Agent 创建/编辑 Task 需求字段、选择任意 Task 或人工完成/取消 Task。\\n- 由 Mystra 代理 `linctl`/`gh`、托管其用户凭据、用 Project Integration credential 代替本地 CLI，或让 workload CLI 管理任意 Control Plane 资源。\\n- done/canceled reopen、外部 Issue write-back、PR merge、部署与发布。\\n\\n## Success Criteria\\n\\n- **SC-001**: 100% 新 Task 初始化为 pending；Assign/Start 原子产生 in_progress 与唯一 Harness，Workspace ready 后幂等产生该 Harness 的唯一 Session。\\n- **SC-002**: Agent 的所有允许和禁止迁移均由一张确定性 transition table 判定；非法迁移无状态副作用。\\n- **SC-003**: 对同一 revision 的 20 个并发迁移请求，最多一个成功，其余返回 task_status_conflict。\\n- **SC-004**: 同一 idempotency key/payload 重放 20 次只产生一个 TaskStatusTransition。\\n- **SC-005**: Agent capability 无法设置 done/canceled/pending，也无法更新 title、description、Project 或 Issue context。\\n- **SC-006**: Session 的任意状态变化都不会自动改变 productionStatus。\\n- **SC-007**: waiting_for_review 展示中的 PR 和测试信息 100% 标识为 Agent reported / not verified by Mystra。\\n- **SC-008**: Owner 可从 Task 详情和 CLI/API 一致看到当前 productionStatus、revision、note、actor、最新 Session.state 和迁移历史。\\n- **SC-009**: 仅凭一个有效 execution code，Agent 可在不提交 Task ID 的情况下取得唯一 `TaskExecutionContext`；跨 Task、过期或吊销 code 100% fail closed。\\n- **SC-010**: fixture host 环境中，Agent 可通过本地 `linctl` 读取 exact Issue、通过本地 `gh` 创建 PR 并报告 waiting_for_review；Mystra 的记录中不存在外部 CLI 凭据、代理调用或 PR/self-test 验真结果。\\n\"},{\"id\":\"features\",\"label\":\"FEATURES\",\"eyebrow\":\"Features\",\"markdown\":\"# 功能说明：薄 Task 生产状态机与 mystra-agent CLI\\n\\n## 摘要\\n\\n051 的第一版只增加一套业务状态：Task.productionStatus。Assign/Start 的短事务把 pending Task 原子推进到 in_progress 并创建轻量 Harness attempt；Workspace ready 后再幂等启动其唯一 Autopilot Session。随后由 Agent 通过 workload-local `mystra-agent` 报告 blocked、恢复 in_progress 或声明 waiting_for_review；done 与 canceled 仍由人控制。\\n\\n## 状态边界\\n\\n- Task productionStatus：pending、in_progress、blocked、waiting_for_review、done、canceled。\\n- Session.state：执行会话是否 queued、running、ready、failed 等。\\n- Harness attempt：冻结 Agent revision 并关联一次 Session，不拥有第二套状态机。\\n- External Issue status：仍由 Linear/GitHub Provider 拥有，不复制、不回写、不映射。\\n\\n## 两个 CLI 的边界\\n\\n- `mystra`：Human、外部 Agent 和自动化使用的 Control Plane 管理 CLI。\\n- `mystra-agent`：当前 Agent workload 使用的 attempt-scoped CLI。\\n- `mystra-agent whoami`：解析当前 execution identity。\\n- `mystra-agent context get`：取得版本化 `TaskExecutionContext`。\\n- `mystra-agent task status get`：读取当前状态、revision 和允许迁移。\\n- `mystra-agent task status set blocked`：报告阻塞，必须带 note。\\n- `mystra-agent task status set in_progress`：从 blocked 恢复。\\n- `mystra-agent task status set waiting_for_review`：声明等待人工审查，必须带 note。\\n- Runtime 只注入 Control Plane URL 与短期 execution code；CLI 不允许 Agent 指定任意 Task。\\n\\n`TaskExecutionContext` 提供冻结 Task 输入、exact Issue reference、Project repository 配置和 Workspace 路径/分支，但不复制 Linear body，也不返回任何外部凭据。Agent 使用宿主机已认证的 `linctl` 读取 Linear，使用已认证的 `gh` 推送并创建 PR。Agent note 可包含 PR 和自测摘要，但这些只是 Agent reported。Mystra 不代理这些 CLI、不回退到 Project Integration credential、不查询 PR、不运行测试、不验证交付结果。\\n\\n## 第一版边界\\n\\n- 一个 Harness attempt 只启动一个 goal/autopilot Session。\\n- Session state 不自动驱动 Task productionStatus。\\n- 所有状态迁移使用专用 TaskStatusService，并应用 transition allowlist、expectedRevision、idempotency key 和 append-only history。\\n- Agent 不能设置 pending、done、canceled，也不能通过 CLI 修改 Task requirement。\\n- `linctl` 或 `gh` 缺失/未认证时，由 Agent 报告 blocked；Mystra 不代为执行。\\n- 完整 Harness 心跳、事件订阅、多 Session、通用 Artifact、Production Recipe 和质量验收均延后。\\n\"},{\"id\":\"checklists\",\"label\":\"CHECKLISTS\",\"eyebrow\":\"Checklists\",\"markdown\":\"# 评审清单：薄 Task 生产状态机\\n\\n## Owner 决策\\n\\n- [x] Task 是基本生产任务，并拥有 Mystra-owned productionStatus。\\n- [x] 状态仅为 pending、in_progress、blocked、waiting_for_review、done、canceled。\\n- [x] Agent 只可报告 blocked、恢复 in_progress、声明 waiting_for_review。\\n- [x] done 与 canceled 由 Human 控制。\\n- [x] Task productionStatus 与 Session.state 独立，不自动同步。\\n- [x] `mystra` 保留为 Control Plane 管理 CLI；workload-local 客户端定名为 `mystra-agent`。\\n- [x] `mystra-agent` 通过 attempt-scoped execution code 提供 whoami、context get 与 Task status 命令，不接受任意 Task ID。\\n- [x] Agent 使用本地已认证的 `linctl` 读取 Linear、使用本地已认证的 `gh` 提交 PR；Mystra 不代理、不提供凭据、不验证。\\n- [x] PR 和自测信息只是 Agent 声明；Mystra 不验证。\\n- [x] 一个 Harness attempt 仍只启动一个 goal/autopilot Session。\\n- [x] 已通过 shared contract、CLI command tests、真实 HTTP smoke 与浏览器 Task detail 验证状态机和 CLI 交互。\\n\\n## Spec 就绪度\\n\\n- [x] transition table、actor 权限和终态明确。\\n- [x] expectedRevision 与 idempotency 规则明确。\\n- [x] `mystra-agent` execution scope、`TaskExecutionContext` 与字段 allowlist 明确。\\n- [x] TaskStatusTransition 审计事实明确。\\n- [x] 047 的旧无状态边界被显式、有限地取代。\\n- [x] 外部 Issue status、Session state 和 Agent report 的边界明确。\\n- [x] Assign/Start 短事务与 Workspace-ready 后 Session launch 的边界已在 Spec 明确。\\n- [x] plan 与实现已确认 claim-time 签发、SHA-256 hash 持久化、六小时过期、终态吊销、Runner 环境传输和敏感信息清理。\\n\\n## 后续边界\\n\\n- [x] 已确认 PR/自测验真排除于 051，必须由后续独立 Spec 引入。\\n- [x] 已确认多 Session、心跳和事件订阅排除于 051，必须由后续独立 Spec 引入。\\n- [x] 已确认通用 Artifact/Delivery 与 Production Recipe 不是 051 的隐藏依赖。\\n- [x] 已确认 Mystra 不代理 `linctl`/`gh`、不托管本地 CLI 凭据；改变该边界必须另立 Spec。\\n\"},{\"id\":\"prototype\",\"label\":\"PROTOTYPE\",\"eyebrow\":\"Prototype\",\"markdown\":\"# 原型：Task 生产状态与 mystra-agent CLI\\n\\n## 入口\\n\\n- [打开独立 HTML 线框原型](mockups/index.html)\\n\\n## Design Intake\\n\\n- **目标用户**：观察 Agent 生产进度并人工收口的 Team 操作者。\\n- **首要行动**：区分 Task productionStatus 与 Session.state，并理解谁能执行下一次迁移。\\n- **核心信息**：当前状态、revision、Agent note、允许迁移、最新 Session state、transition history。\\n- **硬约束**：Agent report 不等于 Mystra verification；Agent 不能完成或取消 Task。\\n- **变体范围**：只验证状态机和薄 CLI，不设计完整 Harness orchestration。\\n\\n## Wireframe 方向\\n\\n页面以 Task 状态为主轴。顶部展示 productionStatus 与 revision；中部展示 `mystra-agent` 的 attempt-scoped context/status contract、本地 `linctl`/`gh` 工具边界和独立 Session execution state；底部展示 append-only transition history。waiting_for_review 的 PR 与测试文字明确标注 Agent reported / not verified by Mystra。\\n\\n## 覆盖状态\\n\\n- pending：等待 Assign/Start。\\n- in_progress：Agent 正在生产。\\n- blocked：Agent 报告无法继续，必须有 note。\\n- waiting_for_review：Agent 声明可审查，内容未经 Mystra 验证。\\n- done：Human 接受，终态。\\n- canceled：Human 取消，终态。\\n\\n## 交互说明\\n\\n- 状态切换按钮只用于原型评审，不代表真实权限实现。\\n- `mystra-agent` 只展示当前 attempt 的 whoami/context/status contract，不允许任意 Task ID。\\n- `mystra` 明确保留为 Control Plane 管理 CLI；原型内的 workload 命令不使用该名称。\\n- Linear 读取与 PR 创建分别标注为本地 `linctl` 和 `gh`，Mystra 不代理或验证。\\n- Session badge 可以独立切换，证明 Session failed 不会自动修改 Task。\\n- Human actions 只在对应 Task 状态出现。\\n\\n## 当前限制\\n\\n- 静态 fixture 不连接真实 API、Runtime、`mystra-agent`、`linctl` 或 `gh`。\\n- 不表示最终视觉设计。\\n- 不设计 PR/测试验真、多 Session、心跳、通用 Artifact 或 Production Recipe。\\n\",\"action\":{\"label\":\"Open Prototype\",\"href\":\"mockups/index.html?v=1786454186583\"}},{\"id\":\"plan\",\"label\":\"PLAN\",\"eyebrow\":\"Plan\",\"markdown\":\"# 实施计划：薄 Task 生产状态机与 mystra-agent CLI\\n\\n**分支**: `051-factory-task-harness` | **日期**: 2026-08-11 | **规格**: [spec.md](./spec.md)\\n\\n## 摘要\\n\\n051 在现有 047–050 Task、Workspace、Session、Runtime 基础上增加一条最薄的生产路径：Human 对 pending Task 执行 Assign/Start，在一个短 RDB 事务中写入 `pending -\u003e in_progress` 和唯一 Harness attempt；事务提交后复用 048 的 Task Workspace preparation；Workspace ready 时幂等创建该 Harness 唯一的 049 Session。Harness 冻结 Agent revision、system prompt 与 Task 输入，但不拥有第二套状态机。\\n\\nAgent workload 通过独立的 `mystra-agent` CLI 使用 attempt-scoped execution code 读取当前 identity/context，并仅通过专用 `TaskStatusService` 报告 `blocked`、恢复 `in_progress` 或声明 `waiting_for_review`。execution code 在 Runtime claim 时一次性签发，数据库只保存 SHA-256 hash，并与 Session lease、Harness revocation 和过期时间共同校验。Agent 仍使用宿主机已认证的 `linctl` 读取 Linear、使用 `gh` push/create PR；Mystra 不代理、授权或验证这些命令与声明。\\n\\n## 技术上下文\\n\\n- **语言/运行时**: TypeScript 5.9、Node.js 24.14.0。\\n- **主要依赖**: Next.js 16 Route Handlers、React 19、Zod 4、Prisma 7.9.1、Vitest 4、Node `crypto`/`child_process`；既有 `@mystra/shared`、`@mystra/agent-adapters`、`mystra-runner`。\\n- **存储**: SQLite 与 PostgreSQL/Supabase-backed PostgreSQL，通过 `RdbProvider` 暴露相同领域合同。\\n- **测试**: Vitest unit/contract/integration/E2E；fixture `linctl`/`gh` 可执行文件；真实 HTTP 与 host Runner smoke test。\\n- **目标平台**: self-hosted single-node Control Plane + host-bound TypeScript Runner；Web 为次要 Human client，CLI/API 为主要合同。\\n- **性能目标**: Task list读取 current projection，history/capability lookup走有界分页与索引；Assign/Start RDB事务不执行网络或文件系统 I/O；每个 Task第一版最多一个 Harness、一个 Harness最多一个 Session。\\n- **约束**: capability 明文只存在于 claim response 与 workload environment；不得进入 prompt、普通日志、状态 note 或持久化；Task/Session 状态完全解耦；pre-0.1 直接替换旧合同，无兼容 shim。\\n- **范围**: Task schema/status/history、Harness persistence、Human production API/UI、workload API、`mystra-agent` package、Runner environment 注入、Workspace-ready continuation 和一个完整 happy/blocked/review journey。\\n\\n## Constitution Check\\n\\n### 规划前 gate\\n\\n- **5xP 与 Spec-Kit**: PASS。051 已同步 PRODUCT/PLATFORM/PROCESS/AGENTS/constitution，feature artifacts 保持在 `specs/051-factory-task-harness/`。\\n- **边界复用**: PASS。复用 047 Task context、048 Task Workspace、049 Session launch/claim、050 Task surface；不引入 parallel Workspace、Turn、Workflow DSL 或 Harness 状态机。\\n- **Provider/RDB 隔离**: PASS。双 Prisma schema 通过 `RdbProvider` 统一；Prisma 类型不越过 DB 模块。\\n- **安全与授权**: PASS。Human 使用现有 Team auth/RBAC；workload 使用独立 capability；Agent CLI 无任意 Task ID；外部 CLI credential 不进入 Control Plane。\\n- **事务边界**: PASS。Assign/Start 只包含数据库状态与 Harness 创建；Workspace、Git、Runtime、Provider I/O 均在提交后。\\n- **验证纪律**: PASS。先写 schema/service contract tests，再实现；完成前执行聚焦测试、全量 typecheck/build、真实 HTTP/Runner smoke 和 graph-aware review。\\n\\n### Phase 1 设计后复核\\n\\n- execution code 采用 claim-time opaque token + persisted hash，解决一次性交付、过期和显式吊销，不需要新增 secret store 或 JWT signing key。\\n- `TaskExecutionContext.workspace.root` 由 workload-local CLI 使用真实 `process.cwd()` 合成；Control Plane 只提供 Workspace logical identity/branch，保持 Runtime-private path 边界。\\n- Harness 冻结 Agent system prompt 与 Task title/description，避免 Agent 或 Task 在 Workspace 异步准备期间变化导致 Session 输入漂移。\\n- Workspace ready continuation 使用 Harness 预分配的 `sessionId` 和 `firstMessageId`，依赖现有 Session create idempotency，重复 ready report 不产生第二 Session。\\n\\n所有 gate 继续 PASS；没有需要豁免的 constitution violation。\\n\\n## 已有能力与改动边界\\n\\n| 已有能力 | 051 的扩展 |\\n| --- | --- |\\n| `Task` CRUD 与 immutable Project/Issue references | 增加 production projection、history 与 dedicated transition service |\\n| `TaskWorkspaceService.setup` + Runner preparation/report | Assign 后调用 setup；ready report 后触发 Harness continuation |\\n| `SessionService.launch` 与 idempotent `createSessionWithEvents` | 增加使用 Harness-frozen Agent/Task 输入的 launch 路径 |\\n| `RuntimeSessionService.claim` + `SessionDispatchLease` | claim 时为 Harness Session 生成 execution code hash/expiry并返回明文一次 |\\n| Runner Provider command environment merge | 注入 Control Plane URL、execution code，并确保 `mystra-agent` 在 PATH |\\n| Task detail + Workspace/Sessions panels | 增加 Assign/Start、production status/history 和 Human review controls |\\n| root `scripts/operator-cli.mjs` | 保持为 Control Plane operator CLI；新增独立 `packages/agent-cli` |\\n\\n## 关键数据流\\n\\n```text\\nHuman Assign/Start\\n  -\u003e TaskProductionService.assignStart\\n     -\u003e validate Team Task + active Agent snapshot + online Runtime/provider\\n     -\u003e RDB tx: Task pending-\u003ein_progress + transition + Harness(frozen inputs + plannedSessionId)\\n  -\u003e commit\\n  -\u003e TaskWorkspaceService.setup\\n     -\u003e queued: Runner materializes repository\\n     -\u003e already ready: continue immediately\\n     -\u003e failed: persist Harness setup diagnostic; Task stays in_progress\\n\\nRunner workspace report ready (same attempt/payload replay is idempotent)\\n  -\u003e WorkspacePreparationService.report\\n  -\u003e TaskProductionService.continueReadyWorkspace\\n     -\u003e attach Workspace to Harness\\n     -\u003e SessionService.launchHarness(planned session/message IDs)\\n     -\u003e attach created unique Session to Harness.sessionId\\n\\nRunner claims Harness Session\\n  -\u003e RDB tx: SessionDispatchLease + executionCodeHash/expiresAt\\n  -\u003e claim response includes executionCode plaintext once\\n  -\u003e runner process env: MYSTRA_CONTROL_PLANE_URL + MYSTRA_EXECUTION_CODE\\n  -\u003e Agent executes standardized bootstrap prompt\\n     -\u003e mystra-agent context get\\n     -\u003e linctl read\\n     -\u003e code + tests\\n     -\u003e gh push/pr\\n     -\u003e mystra-agent task status set waiting_for_review | blocked\\n```\\n\\n## 状态与权限\\n\\n```text\\npending --Human Assign/Start--\u003e in_progress\\nin_progress --Agent-----------\u003e blocked\\nblocked --Agent/Human---------\u003e in_progress\\nin_progress --Agent-----------\u003e waiting_for_review\\nwaiting_for_review --Human----\u003e in_progress | done\\nnonterminal --Human-----------\u003e canceled\\n```\\n\\n`done`/`canceled` 终态。Session `failed|ready|closed` 不修改 Task；Task 状态修改也不启动、停止或重试 Session。Human `done|canceled` 同一状态事务吊销 Harness execution capability；其他状态迁移只更新 Task projection/history。\\n\\n## 模块边界\\n\\n```text\\npackages/shared/src/\\n├── task.ts                       # productionStatus/projection/transition contracts\\n├── harness.ts                    # Harness, assignment, execution context/capability schemas\\n├── session.ts                    # optional Harness execution claim envelope\\n└── index.ts\\n\\npackages/agent-cli/\\n├── src/cli.ts                    # mystra-agent argv/env/stdout/stderr boundary\\n├── src/client.ts                 # workload HTTP adapter\\n└── src/*.test.ts\\n\\napps/control-plane/\\n├── prisma/{sqlite,postgresql}/   # Task projection, Harness, transition, lease capability\\n├── src/lib/db/                   # RdbProvider + Prisma transaction implementation\\n├── src/lib/tasks/                # TaskStatusService + TaskProductionService\\n├── src/lib/sessions/             # frozen Harness launch + claim capability\\n├── src/lib/task-workspaces/      # ready continuation hook\\n├── app/api/tasks/[id]/production/*\\n├── app/api/agent-execution/*     # execution-code-only workload surface\\n└── app/tasks/[id]/*              # production status/assignment/review UI\\n\\napps/runner-daemon/src/\\n├── index.ts                      # Control Plane URL and CLI path wiring\\n└── session/*                     # execution code handoff and child env merge\\n```\\n\\n**结构决策**: `mystra-agent` 是独立 workspace package 和 binary，不污染 Control Plane management CLI。Runner 声明该 package 为运行时依赖，并把其 bin directory prepend 到 Provider child `PATH`；部署 runner 即同时部署 workload helper。API、CLI 和 UI 都调用同一 application services，不复制状态迁移逻辑。\\n\\n## 持久化与事务顺序\\n\\n1. Assign/Start 前读取并验证 Task、Project、active Agent snapshot、Runtime/provider capability。\\n2. 一个 RDB 事务验证 Task `pending`、expected revision 和 idempotency，写 Task projection、TaskStatusTransition、Harness；Harness 保存非外键 `plannedSessionId`/`firstMessageId` 并冻结 Agent/Task/Issue输入，实际 `sessionId` 保持 null。\\n3. 提交后调用现有 Workspace setup。失败把 bounded setup failure code/message 写入 Harness，Task 保持 `in_progress`，不伪造 blocked。\\n4. 同一个 Workspace preparation attempt 的同 payload completion 是幂等命令；ready continuation 原子绑定 Harness.workspaceId，再用 `plannedSessionId` 作为 Session create ID执行 frozen launch；成功后把 actual `sessionId` 绑定 Harness。相同 ID/payload replay 返回原 Session，不同 attempt/payload 仍 fail closed。\\n5. Runtime claim 事务在 Session lease 上保存 execution code hash/expiry；明文只在 claim response 中返回。\\n6. workload API 对 code hash、expiry、revocation、Harness/Session/Task/Agent revision scope 做全量校验后读取 context 或调用 TaskStatusService。\\n7. 状态迁移事务以 `(taskId, idempotencyKey)` 判重，以 expectedRevision 防并发，写 projection + append-only transition；终态同时写 Harness capability revocation。\\n\\n## API 与 CLI\\n\\n- Human API: `POST /api/tasks/{taskId}/production/assign`、`GET /api/tasks/{taskId}/production`、`POST /api/tasks/{taskId}/production/status`。\\n- Workload API: `GET /api/agent-execution/whoami`、`GET /api/agent-execution/context`、`GET|POST /api/agent-execution/task-status`；只接受 Bearer execution code。\\n- CLI: `mystra-agent whoami|context get|task status get|task status set ...`；JSON stdout、稳定错误 JSON stderr、成功 0/输入或服务错误非 0。\\n- Runner protocol: `SessionClaimAssignment.execution` 为可选；只有关联 Harness 的 Session 才返回 `{ code, expiresAt, capabilities }`。\\n\\n详细 schema 与错误映射见 [contracts](./contracts/) 和 [data-model.md](./data-model.md)。\\n\\n## 失败模式\\n\\n| 失败 | 系统行为 |\\n| --- | --- |\\n| 并发 Assign 或 stale revision | 只有一个事务成功；其他返回 `task_status_conflict`/idempotent replay |\\n| Workspace preparation 失败 | Harness 持久化 bounded setup diagnostic，Task 保持 `in_progress`；不自动改状态 |\\n| ready report 后 launch 失败 | Runner 重放相同 attempt/report；completion 返回既有 ready Workspace，再重试幂等 continuation |\\n| ready report 重放 | 相同 preparation payload 与预分配 Session ID 返回既有结果，不创建重复对象 |\\n| claim response 丢失 | 既有 Session lease 到期/回收后重新 claim 并轮换 execution code；旧 hash 失效 |\\n| capability 过期/吊销/foreign scope | workload API fail closed，不返回上下文 |\\n| status 命令超时 | 相同 idempotency key 安全重放 |\\n| Session/Provider 失败 | Session 记录 execution failure；Task 仍 `in_progress`，除非 Agent 成功报告 blocked |\\n| `linctl`/`gh` 不可用 | Agent 报告 blocked；Mystra 无 credential/delivery fallback |\\n| Agent note 伪造 PR/tests | 原样作为有界不可信声明展示；Human 决定 done/退回 |\\n\\n## 测试与验证\\n\\n```text\\nshared schema/reducer tests\\n  -\u003e RdbProvider contract tests (SQLite + optional PostgreSQL)\\n     -\u003e TaskStatusService/TaskProductionService unit + race/idempotency tests\\n        -\u003e Human/workload API route tests\\n           -\u003e mystra-agent CLI contract tests\\n              -\u003e Runner env/capability claim tests\\n                 -\u003e HTTP + fake provider + fixture linctl/gh E2E\\n                    -\u003e task detail browser/runtime smoke\\n```\\n\\n- 迁移矩阵覆盖全部合法/非法 actor transition、note、terminal 状态。\\n- 20 路并发 expectedRevision/idempotency race 只产生一条 transition/Harness/Session；Workspace ready report 的 completion/continuation 分段故障可恢复。\\n- Team、Task、Harness、Session、Agent revision 任一 scope mismatch 均 fail closed。\\n- 测试断言 execution code 不出现在 prompt、SessionEvent、普通日志、Task note 或数据库明文字段。\\n- E2E fixture 证明 Agent 能只凭两个环境变量运行 `mystra-agent`，再调用本地 `linctl`/`gh`；fixture 不是 Mystra provider fallback。\\n- 完成前运行 `db:generate`、focused tests、`pnpm typecheck`、`pnpm test`、`pnpm build`、真实 HTTP/Runner smoke 和 `gitnexus_detect_changes`。\\n\\n## 实施顺序\\n\\n1. 共享 Task/Harness/execution schemas 与纯状态迁移规则测试。\\n2. 双 Prisma schema、migration、mapper、RdbProvider 原子命令与 contract tests，包括 Workspace completion idempotency。\\n3. TaskStatusService 和 TaskProductionService，包括 Harness-frozen inputs 与 Workspace continuation。\\n4. Human production API；随后 Task detail projection/controls。\\n5. claim-time execution capability、workload API 和泄漏/越权测试。\\n6. `packages/agent-cli` binary、Runner PATH/env 注入和 provider child tests。\\n7. Harness-specific standardized prompt/Session launch，移除该路径对 mutable Task/Agent 的二次解析。\\n8. 完整 journey E2E、运行验证、代码审查与 Spec-Kit closeout。\\n\\n## NOT in scope\\n\\n- Harness heartbeat、事件订阅、多 Session、retry/recovery policy 或独立 Harness 状态机。\\n- 自动分诊、需求审查、Recipe/Skill/Workflow 选择、standing orders、arbitrary triggers。\\n- Mystra 执行/验证测试，查询/验证 PR，解析 Agent 输出推断 Task 状态。\\n- Linear/GitHub credential 托管、CLI 代理、Issue write-back 或 RepoDeliveryProvider fallback。\\n- 通用 Artifact/Delivery API、非 PR 产出物、质量门禁与修复循环。\\n- task reopen、第二次 Harness attempt、并行 Agent、跨 Runtime 迁移。\\n- 通用 Control Plane `mystra` CLI 的重构或发布；本期只新增 workload-local `mystra-agent`。\\n\\n## Complexity Tracking\\n\\n无 constitution violation。新增 Harness 与 TaskStatusTransition 是规格要求的最小 durable facts；execution capability 复用 SessionDispatchLease，不新增独立认证平台。\\n\\n## GSTACK REVIEW REPORT\\n\\n| Review | Trigger | Why | Runs | Status | Findings |\\n| --- | --- | --- | --- | --- | --- |\\n| CEO Review | `/plan-ceo-review` | Scope \u0026 strategy | 0 | — | 产品边界已由 owner 明确冻结 |\\n| Codex Review | `/codex review` | Independent 2nd opinion | 0 | — | 工程评审后决定是否需要 |\\n| Eng Review | `/plan-eng-review` | Architecture/data/tests (required) | 1 | CLEAR | 9 findings resolved, 0 critical gaps |\\n| Design Review | `/plan-design-review` | UI/UX gaps | 0 | — | 只扩展既有 Task detail surface |\\n| DX Review | `/plan-devex-review` | CLI developer experience | 0 | — | CLI contract 在本计划内直接评审 |\\n\\n**UNRESOLVED:** 0\\n\\n**VERDICT:** ENG CLEARED — ready for task decomposition and implementation\\n\"},{\"id\":\"tasks\",\"label\":\"TASKS\",\"eyebrow\":\"Tasks\",\"markdown\":\"# Tasks: 薄 Task 生产状态机与 mystra-agent CLI\\n\\n**Input**: `/specs/051-factory-task-harness/` 下的 spec、plan、research、data-model、contracts 与 quickstart  \\n**Tests**: 本功能明确采用 TDD；每个行为切片先写失败测试，再实现并回归。  \\n**Organization**: 按四个 user stories 分阶段；共享状态/RDB/capability foundation 先完成。\\n\\n## Format: `[ID] [P?] [Story]
