ies\\n- [x] T036 [US2] 在 `apps/control-plane/src/lib/sessions/runtime-session-service.ts` 扩展 claim-time code issuance/hash/expiry，并在 `packages/shared/src/session.ts` 合同下返回 capability envelope\\n- [x] T037 [US2] 在 `apps/control-plane/app/api/agent-execution/whoami/route.ts`、`context/route.ts` 与 `task-status/route.ts` 实现 execution-code-only HTTP surface 和 stable error mapping\\n- [x] T038 [US2] 在 `packages/agent-cli/src/client.ts`、`packages/agent-cli/src/cli.ts` 与 `packages/agent-cli/bin/mystra-agent` 实现 workload HTTP client、commands、machine-readable output 与 secret-safe failures\\n- [x] T039 [US2] 在 `apps/runner-daemon/src/index.ts`、`apps/runner-daemon/src/session/session-loop.ts` 与 `apps/runner-daemon/src/session/session-worker.ts` 注入 Runner endpoint、CLI bin PATH 和 claim execution code，不把 environment 写入 event/log\\n- [x] T040 [US2] 在 `packages/agent-cli/src/journey.test.ts` 使用临时 fixture `linctl`/`gh` 完成 issue-read/PR-report journey，并断言 `mystra-agent` 只访问 scoped Control Plane URLs、没有 Integration/RepoDelivery fallback\\n\\n**Checkpoint**: US2 独立证明 Agent workload 能完成 accepted CLI journey；PR/tests 仍只是未验证 note\\n\\n---\\n\\n## Phase 5: User Story 3 — Human 收口或退回（Priority: P1）\\n\\n**Goal**: Human 可从 waiting_for_review 标记 done/退回 in_progress，blocked 可恢复，任意非终态可 canceled；terminal 吊销 execution capability\\n\\n**Independent Test**: 从 waiting_for_review/blocked/nonterminal 执行所有 Human 合法迁移，验证 actor audit、terminal revocation 与 Agent 无完成权限\\n\\n### Tests first\\n\\n- [x] T041 [P] [US3] 在 `apps/control-plane/app/api/task-production-routes.test.ts` 写 Human RBAC、done/return/cancel、terminal、actor audit 和 stable error 失败测试\\n- [x] T042 [P] [US3] 在 `apps/control-plane/src/lib/tasks/task-status-service.test.ts` 增加 Human/Agent并发 terminal revocation 与 stale workload command 失败测试\\n\\n### Implementation\\n\\n- [x] T043 [US3] 在 `apps/control-plane/app/api/tasks/[id]/production/status/route.ts` 实现 Human status endpoint，并传递现有 auth subject userId/team role\\n- [x] T044 [US3] 在 `apps/control-plane/src/lib/tasks/task-status-service.ts` 完成 Human transition、terminal capability revocation 与 append-only actor projection\\n- [x] T045 [US3] 通过 `task-status-service.test.ts`、`agent-execution-service.test.ts`、route tests 与真实 HTTP smoke 验证 waiting_for_review→done/return、cancel 和旧 execution code fail closed\\n\\n**Checkpoint**: US3 独立证明业务完成权属于 Human，terminal 状态不可 reopen\\n\\n---\\n\\n## Phase 6: User Story 4 — Task 状态与 Session 分别观察（Priority: P2）\\n\\n**Goal**: Task detail/API 同时展示 productionStatus/history/Harness/latest Session，并明确 Agent report 未经 Mystra 验证\\n\\n**Independent Test**: 构造 Session failed + Task in_progress、Session ready + Task blocked、waiting_for_review虚假 URL/tests，验证互不驱动且 UI 标注 unverified\\n\\n### Tests first\\n\\n- [x] T046 [P] [US4] 在邻近 Task presentation/model tests、production route tests 与浏览器 smoke 验证 production projection、Assign controls、Human review controls、history 和 Agent-reported label\\n- [x] T047 [P] [US4] 在 `apps/control-plane/app/api/task-production-routes.test.ts` 增加 latest Session/Task 独立 projection 与 limit-bounded history 失败测试\\n\\n### Implementation\\n\\n- [x] T048 [US4] 在 `apps/control-plane/app/tasks/[id]/page.tsx` 与 `apps/control-plane/app/_components/task-production-panel.tsx` 增加 status badge、Assign/Start、history、Harness/latest Session 和 Human review controls\\n- [x] T049 [US4] 在 `apps/control-plane/app/api/tasks/[id]/production/route.ts` 与 Task presentation mapper 返回独立 Task/Session projections，并把 Agent note 标为 `verified:false`\\n- [x] T050 [US4] 通过 production route tests、shell/task presentation tests 与真实浏览器 smoke 验证 failed/ready Session 不驱动 Task、Task icon 使用 productionStatus 和 review 声明标注\\n\\n**Checkpoint**: US4 独立证明操作者能区分业务状态与执行状态\\n\\n---\\n\\n## Phase 7: Polish \u0026 Cross-Cutting Verification\\n\\n**Purpose**: 安全、文档、全量验证与 feature closeout\\n\\n- [x] T051 [P] 在 shared、RDB、prompt、runtime claim、route 与 Runner worker tests 中覆盖 execution code 不进入 DB 明文、prompt、SessionEvent、Task note、route/Runner logs 的泄漏回归\\n- [x] T052 [P] 更新 `apps/runner-daemon/README.md`、`packages/agent-cli/README.md` 与 `PLATFORM.md` 的 Runner-bundled CLI、host `linctl`/`gh` 前置条件、配置和故障语义\\n- [x] T053 执行 `corepack pnpm --filter @mystra/control-plane db:generate`、四 package focused tests、`corepack pnpm typecheck`、`corepack pnpm test`、`corepack pnpm build` 与 scoped `git diff --check`\\n- [x] T054 按 `specs/051-factory-task-harness/quickstart.md` 完成真实 HTTP + host boundary smoke；记录不能执行的 PostgreSQL/真实外部 CLI 条件且不夸大证据\\n- [x] T055 针对 `packages/shared/`、`apps/control-plane/`、`apps/runner-daemon/`、`packages/agent-cli/` 运行 GitNexus change detection、project-local code review、Spec-Kit analyze/status/doctor，修正所有 P1/P2、contract drift 与 artifact health 问题\\n- [x] T056 更新 `specs/051-factory-task-harness/spec.md` 状态、`specs/051-factory-task-harness/checklists.md`、`specs/spec-status.md` 与生成的 `index.html`，执行 `aaa-spec-close` 完成 051 收口\\n\\n---\\n\\n## Dependencies \u0026 Execution Order\\n\\n### Phase Dependencies\\n\\n- **Phase 1 Setup**: 无依赖。\\n- **Phase 2 Foundation**: 依赖 Phase 1；阻塞所有 user stories。\\n- **US1**: 依赖 Foundation；建立 Harness/Session production path。\\n- **US2**: 依赖 US1 的 Harness Session 与 Foundation capability fields。\\n- **US3**: 依赖 Foundation TaskStatusService；最终 E2E 依赖 US2 capability。\\n- **US4**: 依赖 US1–US3 API/projection。\\n- **Polish**: 依赖所有目标 stories 完成。\\n\\n### User Story Dependency Graph\\n\\n```text\\nSetup -\u003e Foundation -\u003e US1 Assign/Harness/Session -\u003e US2 Agent CLI/status\\n                         |                          |\\n                         +--------------------------+-\u003e US3 Human closeout\\n                                                     -\u003e US4 Observation UI\\nUS1 + US2 + US3 + US4 -\u003e Polish/Review/Closeout\\n```\\n\\n### Within Each Story\\n\\n1. 先写测试并确认因缺失行为失败。\\n2. shared/RDB contracts 先于 service。\\n3. service 先于 route/CLI/UI adapter。\\n4. focused tests 通过后才执行 story E2E。\\n5. 每个 checkpoint 必须独立可演示，不能用后续 story 掩盖失败。\\n\\n### Parallel Opportunities\\n\\n- T005/T006 可并行编写 shared tests；T011/T012 可在 schema shape稳定后并行写双 dialect artifacts。\\n- 每个 story 内标记 `[P]` 的测试文件可并行起草，但实现仍按 foundation→service→adapter 顺序。\\n- US3 route tests可在 US2 CLI实现后段起草；US4 UI tests可在 production read contract稳定后起草。\\n- 实际单 agent执行采用顺序模式，避免共享 `packages/shared` 和 DB provider 冲突。\\n\\n## Parallel Example: User Story 2\\n\\n```text\\nLane A: task-status-service.test.ts -\u003e TaskStatusService\\nLane B: agent-execution-service.test.ts -\u003e AgentExecutionService\\nLane C: agent-cli tests -\u003e CLI client/bin\\nLane D: runner session tests -\u003e environment handoff\\n\\nMerge A+B foundation, then workload routes; merge C+D after shared claim schema stabilizes。\\n```\\n\\n## Implementation Strategy\\n\\n### Accepted MVP Journey\\n\\n本 feature 的 MVP 不是只完成 US1。用户明确的最大产品边界是：\\n\\n```text\\nTask Assign -\u003e one Harness/Session -\u003e Agent context via mystra-agent\\n-\u003e local linctl/gh work -\u003e Agent waiting_for_review -\u003e Human done/return\\n```\\n\\n因此最小可交付范围是 Foundation + US1 + US2 + US3；US4 是 P2 可观察性，但 051 完成条件仍要求其 spec acceptance 通过。\\n\\n### Incremental Validation\\n\\n1. Foundation：纯状态/RDB安全性。\\n2. US1：生产链路能自动启动唯一 Session。\\n3. US2：Agent能自助取上下文和报告状态。\\n4. US3：Human拥有业务收口权。\\n5. US4：操作者能区分 Task/Session truth。\\n6. 全量安全、运行、审查和 Spec closeout。\\n\\n## Notes\\n\\n- 不创建 Task failed、Harness state、Turn、event bus、generic Artifact 或 PR verification。\\n- `mystra-agent` 不执行 `linctl`/`gh`；Agent prompt执行，fixture仅验证 journey。\\n- 任何代码 symbol/API edit 前按 AGENTS.md 运行 GitNexus impact；完成前运行 change detection。\\n- 当前 worktree 有 owner 的无关 dirty changes；只修改/验证 051 目标路径，禁止覆盖或全量 stage。\\n\"}]}\u003c/script\u003e\n    \u003cscript\u003e\n      const data = JSON.parse(document.getElementById(\"spec-data\").textContent);\n      const tabsEl = document.getElementById(\"tabs\");\n      const docEl = document.getElementById(\"doc\");\n      const pageTitleEl = document.getElementById(\"page-title\");\n      const activeLabelEl = document.getElementById(\"active-label\");\n      const activePositionEl = document.getElementById(\"active-position\");\n      const activeEyebrowEl = document.getElementById(\"active-eyebrow\");\n      const prototypeLinkEl = document.getElementById(\"prototype-link\");\n\n      document.getElementById(\"feature-id\").textContent = data.feature;\n      document.getElementById(\"generated-at\").textContent =\n        \"Generated \" + new Date(data.generatedAt).toLocaleString();\n      pageTitleEl.textContent = data.title;\n      prototypeLinkEl.href = data.prototypeHref;\n\n      function escapeHtml(value) {\n        return value\n          .replaceAll(\"\u0026\", \"\u0026amp;\")\n          .replaceAll(\"\u003c\", \"\u0026lt;\")\n          .replaceAll(\"\u003e\", \"\u0026gt;\");\n      }\n\n      function inlineMarkdown(value) {\n        let html = escapeHtml(value);\n        html = html.replace(/`([^`]+)`/g, \"\u003ccode\u003e$1\u003c/code\u003e\");\n        html = html.replace(/\\*\\*([^*]+)\\*\\*/g, \"\u003cstrong\u003e$1\u003c/strong\u003e\");\n        html = html.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '\u003ca href=\"$2\"\u003e$1\u003c/a\u003e');\n        return html;\n      }\n\n      function renderTable(lines) {\n        const rows = lines\n          .filter((line) =\u003e !/^\\|\\s*:?-{3,}:?\\s*(\\|\\s*:?-{3,}:?\\s*)+\\|?$/.test(line))\n          .map((line) =\u003e\n            line\n              .trim()\n              .replace(/^\\|/, \"\")\n              .replace(/\\|$/, \"\")\n              .split(\"|\")\n              .map((cell) =\u003e inlineMarkdown(cell.trim())),\n          );\n        return rows\n          .map((row, index) =\u003e {\n            const tag = index === 0 ? \"th\" : \"td\";\n            return \"\u003ctr\u003e\" + row.map((cell) =\u003e `\u003c${tag}\u003e${cell}\u003c/${tag}\u003e`).join(\"\") + \"\u003c/tr\u003e\";\n          })\n          .join(\"\");\n      }\n\n      function renderMarkdown(markdown) {\n        const lines = markdown.split(/\\r?\\n/);\n        const out = [];\n        let listType = null;\n        let paragraph = [];\n        let table = [];\n        let inCode = false;\n        let codeLines = [];\n\n        function closeParagraph() {\n          if (paragraph.length) {\n            out.push(`\u003cp\u003e${inlineMarkdown(paragraph.join(\" \"))}\u003c/p\u003e`);\n            paragraph = [];\n          }\n        }\n\n        function closeList() {\n          if (listType) {\n            out.push(`\u003c/${listType}\u003e`);\n            listType = null;\n          }\n        }\n\n        function closeTable() {\n          if (table.length) {\n            out.push(`\u003ctable\u003e${renderTable(table)}\u003c/table\u003e`);\n            table = [];\n          }\n        }\n\n        for (const line of lines) {\n          if (line.startsWith(\"```\")) {\n            closeParagraph();\n            closeList();\n            closeTable();\n            if (inCode) {\n              out.push(`\u003cpre\u003e\u003ccode\u003e${escapeHtml(codeLines.join(\"\\n\"))}\u003c/code\u003e\u003c/pre\u003e`);\n              codeLines = [];\n              inCode = false;\n            } else {\n              inCode = true;\n            }\n            continue;\n          }\n\n          if (inCode) {\n            codeLines.push(line);\n            continue;\n          }\n\n          if (line.trim().startsWith(\"|\") \u0026\u0026 line.includes(\"|\")) {\n            closeParagraph();\n            closeList();\n            table.push(line);\n            continue;\n          }\n\n          closeTable();\n\n          if (!line.trim()) {\n            closeParagraph();\n            closeList();\n            continue;\n          }\n\n          const heading = line.match(/^(#{1,3})\\s+(.+)$/);\n          if (heading) {\n            closeParagraph();\n            closeList();\n            const level = heading[1].length;\n            out.push(`\u003ch${level}\u003e${inlineMarkdown(heading[2])}\u003c/h${level}\u003e`);\n            continue;\n          }\n\n          if (/^---+\\s*$/.test(line.trim())) {\n            closeParagraph();\n            closeList();\n            out.push(\"\u003chr /\u003e\");\n            continue;\n          }\n\n          const unordered = line.match(/^\\s*[-*]\\s+(.+)$/);\n          const ordered = line.match(/^\\s*\\d+\\.\\s+(.+)$/);\n          if (unordered || ordered) {\n            closeParagraph();\n            const nextType = unordered ? \"ul\" : \"ol\";\n            if (listType !== nextType) {\n              closeList();\n              out.push(`\u003c${nextType}\u003e`);\n              listType = nextType;\n            }\n            out.push(`\u003cli\u003e${inlineMarkdown((unordered || ordered)[1])}\u003c/li\u003e`);\n            continue;\n          }\n\n          if (line.startsWith(\"\u003e\")) {\n            closeParagraph();\n            closeList();\n            out.push(`\u003cblockquote\u003e${inlineMarkdown(line.replace(/^\u003e\\s?/, \"\"))}\u003c/blockquote\u003e`);\n            continue;\n          }\n\n          paragraph.push(line.trim());\n        }\n\n        closeParagraph();\n        closeList();\n        closeTable();\n        return out.join(\"\\n\");\n      }\n\n      function setActive(id) {\n        const activeIndex = Math.max(0, data.tabs.findIndex((tab) =\u003e tab.id === id));\n        const tab = data.tabs[activeIndex];\n        for (const button of tabsEl.querySelectorAll(\"button\")) {\n          button.setAttribute(\"aria-selected\", String(button.dataset.tabId === tab.id));\n        }\n        activeLabelEl.textContent = tab.label;\n        activePositionEl.textContent = `${activeIndex + 1} / ${data.tabs.length}`;\n        activeEyebrowEl.textContent = tab.eyebrow;\n        docEl.innerHTML = renderMarkdown(tab.markdown);\n        const missing = tab.markdown.includes(\"is not present for this spec yet\");\n        if (missing) {\n          const note = document.createElement(\"div\");\n          note.className = \"empty-note\";\n          note.textContent = \"This artifact is not available yet. The view is intentionally preserved so the spec surface stays stable.\";\n          docEl.prepend(note);\n        }\n        history.replaceState(null, \"\", `#${tab.id}`);\n      }\n\n      data.tabs.forEach((tab, index) =\u003e {\n        const button = document.createElement(\"button\");\n        button.className = \"tab-button\";\n        button.type = \"button\";\n        button.role = \"tab\";\n        button.dataset.tabId = tab.id;\n        button.innerHTML = `\u003cspan\u003e${tab.label}\u003c/span\u003e\u003cspan class=\"tab-index\"\u003e${String(index + 1).padStart(2, \"0\")}\u003c/span\u003e`;\n        button.addEventListener(\"click\", () =\u003e setActive(tab.id));\n        tabsEl.append(button);\n      });\n\n      setActive(location.hash.replace(\"#\", \"\") || data.tabs[0].id);\n    \u003c/script\u003e\n  \u003c/body\u003e\n\u003c/html\u003e\n",

      "content": "\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n  \u003ctitle\u003eMystra · Task Production State\u003c/title\u003e\n  \u003cstyle\u003e\n    :root{font-family:Inter,ui-sans-serif,system-ui;background:#f5f5f2;color:#20211f}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#20211f;color:#eee;padding:24px}.brand{font-weight:700;margin-bottom:32px}.nav{color:#aaa;line-height:2.2}.nav b{color:#fff}.main{padding:32px;max-width:1120px;width:100%}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#74766f}.title{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.title h1{margin:8px 0}.lede{color:#666;max-width:760px}.badge{display:inline-flex;border-radius:999px;padding:7px 11px;background:#ebece7;font-size:12px}.badge.primary{background:#dff5d8;color:#215d19}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:20px}.card{background:white;border:1px solid #dedfd9;border-radius:14px;padding:20px}.card h2{font-size:15px;margin:0 0 12px}.muted{color:#777;font-size:13px}.states{display:flex;gap:7px;flex-wrap:wrap}.state{border:1px solid #d9dad4;background:#fafaf8;border-radius:999px;padding:8px 10px;font-size:12px;cursor:pointer}.state.active{background:#222;color:#fff;border-color:#222}.arrow{color:#aaa}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#1f211f;color:#e7eadf;padding:14px;border-radius:9px;line-height:1.7;font-size:12px;white-space:pre-wrap}.notice{border-left:3px solid #999;background:#f7f7f4;padding:11px 13px;font-size:13px}.warning{border-color:#b68618;background:#fff8e8}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid #eee;font-size:13px}.history{margin-top:16px}.dot{width:8px;height:8px;border-radius:50%;background:#222;display:inline-block;margin-right:8px}.actions button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;margin:5px 5px 0 0}.actions button.primary{background:#222;color:#fff;border-color:#222}@media(max-width:780px){.shell{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.main{padding:20px}}\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"shell\"\u003e\n  \u003caside class=\"side\"\u003e\u003cdiv class=\"brand\"\u003eMystra\u003c/div\u003e\u003cdiv class=\"nav\"\u003eNew\u003cbr\u003eSearch\u003cbr\u003eInbox\u003cbr\u003eIssues\u003cbr\u003e\u003cbr\u003e\u003cb\u003eTasks\u003c/b\u003e\u003cbr\u003eProjects\u003c/div\u003e\u003c/aside\u003e\n  \u003cmain class=\"main\"\u003e\n    \u003cdiv class=\"eyebrow\"\u003eTask / MST-214\u003c/div\u003e\n    \u003cdiv class=\"title\"\u003e\n      \u003cdiv\u003e\u003ch1\u003eLocalize account settings\u003c/h1\u003e\u003cp class=\"lede\"\u003eTask owns production progress. Session owns execution state. They are related, not synchronized.\u003c/p\u003e\u003c/div\u003e\n      \u003cspan class=\"badge primary\" id=\"taskBadge\"\u003ein_progress · r3\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"states\" aria-label=\"Prototype states\"\u003e\n      \u003cbutton class=\"state\" data-state=\"pending\"\u003epending\u003c/button\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\n      \u003cbutton class=\"state active\" data-state=\"in_progress\"\u003ein_progress\u003c/button\u003e\n      \u003cbutton class=\"state\" data-state=\"blocked\"\u003eblocked\u003c/button\u003e\n      \u003cbutton class=\"state\" data-state=\"waiting_for_review\"\u003ewaiting_for_review\u003c/button\u003e\n      \u003cbutton class=\"state\" data-state=\"done\"\u003edone\u003c/button\u003e\n      \u003cbutton class=\"state\" data-state=\"canceled\"\u003ecanceled\u003c/button\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"grid\"\u003e\n      \u003csection class=\"card\"\u003e\n        \u003ch2\u003eTask production status\u003c/h2\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003eAssigned Agent\u003c/span\u003e\u003cb\u003eSoftware Engineer · revision 3\u003c/b\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003eHarness attempt\u003c/span\u003e\u003cb\u003eHAR-02 · one Session\u003c/b\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003eStatus note\u003c/span\u003e\u003cb id=\"statusNote\"\u003eImplementing settings locale switcher\u003c/b\u003e\u003c/div\u003e\n        \u003cdiv class=\"notice\" id=\"statusNotice\"\u003eAgent may report blocked or waiting_for_review. Human owns done and canceled.\u003c/div\u003e\n        \u003cdiv class=\"actions\" id=\"actions\"\u003e\u003c/div\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"card\"\u003e\n        \u003ch2\u003eSession execution state \u003cspan class=\"badge\" id=\"sessionBadge\"\u003erunning\u003c/span\u003e\u003c/h2\u003e\n        \u003cp class=\"muted\"\u003eSession state changes independently. A failed Session does not silently rewrite the Task.\u003c/p\u003e\n        \u003cdiv class=\"actions\"\u003e\u003cbutton id=\"toggleSession\"\u003eToggle running / failed\u003c/button\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003eSession\u003c/span\u003e\u003cb\u003eSES-91\u003c/b\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003eLast activity\u003c/span\u003e\u003cb\u003e8 seconds ago\u003c/b\u003e\u003c/div\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"card\"\u003e\n        \u003ch2\u003emystra-agent · exact injected scope\u003c/h2\u003e\n        \u003cdiv class=\"code\" id=\"cli\"\u003emystra-agent context get\n\nmystra-agent task status get\n\nmystra-agent task status set blocked \\\n  --expected-revision 3 \\\n  --idempotency-key cmd-101 \\\n  --note \"Waiting for API contract\"\u003c/div\u003e\n        \u003cp class=\"muted\"\u003eRuntime injects MYSTRA_CONTROL_PLANE_URL + MYSTRA_EXECUTION_CODE. No arbitrary Task ID. The mystra CLI remains for Control Plane management.\u003c/p\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"card\"\u003e\n        \u003ch2\u003eAgent-reported delivery\u003c/h2\u003e\n        \u003cdiv class=\"notice warning\"\u003eNot verified by Mystra\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003ePR\u003c/span\u003e\u003cb id=\"prText\"\u003eNot reported\u003c/b\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan\u003eSelf-test\u003c/span\u003e\u003cb id=\"testText\"\u003eNot reported\u003c/b\u003e\u003c/div\u003e\n        \u003cp class=\"muted\"\u003eAgent reads Linear with local linctl and creates the PR with local gh. Mystra stores the note; it does not proxy or verify either command.\u003c/p\u003e\n      \u003c/section\u003e\n    \u003c/div\u003e\n\n    \u003csection class=\"card history\"\u003e\n      \u003ch2\u003eAppend-only transition history\u003c/h2\u003e\n      \u003cdiv class=\"row\"\u003e\u003cspan\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003epending → in_progress\u003c/span\u003e\u003cspan\u003esystem.assign · revision 3\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"row\" id=\"latestTransition\"\u003e\u003cspan\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003eCurrent projection\u003c/span\u003e\u003cspan\u003ein_progress · Agent\u003c/span\u003e\u003c/div\u003e\n    \u003c/section\u003e\n  \u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n  const data={\n    pending:{note:\"Waiting for Agent assignment\",notice:\"Assign/Start is the only path to in_progress.\",cli:\"mystra-agent context get\\\\n\\\\nmystra-agent task status get\",pr:\"Not reported\",test:\"Not reported\",actor:\"System\"},\n    in_progress:{note:\"Implementing settings locale switcher\",notice:\"Agent may report blocked or waiting_for_review. Human owns done and canceled.\",cli:'mystra-agent context get\\\\n\\\\nlinctl issue get LIN-214\\\\n\\\\nmystra-agent task status set blocked \\\\\\\\\\\\n  --expected-revision 3 \\\\\\\\\\\\n  --idempotency-key cmd-101 \\\\\\\\\\\\n  --note \"Waiting for API contract\"',pr:\"Not reported\",test:\"Not reported\",actor:\"Agent\"},\n    blocked:{note:\"Waiting for API contract\",notice:\"Agent may resume to in_progress. Human may also resume or cancel.\",cli:'mystra-agent task status set in_progress \\\\\\\\\\\\n  --expected-revision 4 \\\\\\\\\\\\n  --idempotency-key cmd-102 \\\\\\\\\\\\n  --note \"Contract received\"',pr:\"Not reported\",test:\"Blocked before completion\",actor:\"Agent\"},\n    waiting_for_review:{note:\"PR: github.com/acme/app/pull/214; tests: pnpm test passed\",notice:\"Agent declared readiness. Human may accept as done or return to in_progress.\",cli:\"gh pr create --fill\\\\n\\\\nmystra-agent task status get\",pr:\"github.com/acme/app/pull/214\",test:\"pnpm test · reported passed\",actor:\"Agent\"},\n    done:{note:\"Accepted by reviewer\",notice:\"Terminal in v1. Reopen is deferred.\",cli:\"mystra-agent task status get\",pr:\"github.com/acme/app/pull/214\",test:\"pnpm test · Agent reported passed\",actor:\"Human\"},\n    canceled:{note:\"Canceled by owner\",notice:\"Terminal in v1. Reopen is deferred.\",cli:\"mystra-agent task status get\",pr:\"Not applicable\",test:\"Not applicable\",actor:\"Human\"}\n  };\n  function render(state){\n    document.querySelectorAll(\".state\").forEach(x=\u003ex.classList.toggle(\"active\",x.dataset.state===state));\n    document.getElementById(\"taskBadge\").textContent=state+\" · r\"+(state===\"pending\"?\"1\":\"3\");\n    document.getElementById(\"statusNote\").textContent=data[state].note;\n    document.getElementById(\"statusNotice\").textContent=data[state].notice;\n    document.getElementById(\"cli\").textContent=data[state].cli;\n    document.getElementById(\"prText\").textContent=data[state].pr;\n    document.getElementById(\"testText\").textContent=data[state].test;\n    document.getElementById(\"latestTransition\").innerHTML=\"\u003cspan\u003e\u003ci class='dot'\u003e\u003c/i\u003eCurrent projection\u003c/span\u003e\u003cspan\u003e\"+state+\" · \"+data[state].actor+\"\u003c/span\u003e\";\n  }\n  document.querySelectorAll(\".state\").forEach(x=\u003ex.addEventListener(\"click\",()=\u003erender(x.dataset.state)));\n  document.getElementById(\"toggleSession\").addEventListener(\"click\",()=\u003e{\n    const b=document.getElementById(\"sessionBadge\");b.textContent=b.textContent===\"running\"?\"failed\":\"running\";\n  });\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",

      "title": "实施计划：薄 Task 生产状态机与 mystra-agent CLI",
      "path": "specs/051-factory-task-harness/plan.md",
      "mediaType": "text/markdown",
      "content": "# 实施计划：薄 Task 生产状态机与 mystra-agent CLI\n\n**分支**: `051-factory-task-harness` | **日期**: 2026-08-11 | **规格**: [spec.md](./spec.md)\n\n## 摘要\n\n051 在现有 047–050 Task、Workspace、Session、Runtime 基础上增加一条最薄的生产路径：Human 对 pending Task 执行 Assign/Start，在一个短 RDB 事务中写入 `pending -\u003e in_progress` 和唯一 Harness attempt；事务提交后复用 048 的 Task Workspace preparation；Workspace ready 时幂等创建该 Harness 唯一的 049 Session。Harness 冻结 Agent revision、system prompt 与 Task 输入，但不拥有第二套状态机。\n\nAgent workload 通过独立的 `mystra-agent` CLI 使用 attempt-scoped execution code 读取当前 identity/context，并仅通过专用 `TaskStatusService` 报告 `blocked`、恢复 `in_progress` 或声明 `waiting_for_review`。execution code 在 Runtime claim 时一次性签发，数据库只保存 SHA-256 hash，并与 Session lease、Harness revocation 和过期时间共同校验。Agent 仍使用宿主机已认证的 `linctl` 读取 Linear、使用 `gh` push/create PR；Mystra 不代理、授权或验证这些命令与声明。\n\n## 技术上下文\n\n- **语言/运行时**: TypeScript 5.9、Node.js 24.14.0。\n- **主要依赖**: Next.js 16 Route Handlers、React 19、Zod 4、Prisma 7.9.1、Vitest 4、Node `crypto`/`child_process`；既有 `@mystra/shared`、`@mystra/agent-adapters`、`mystra-runner`。\n- **存储**: SQLite 与 PostgreSQL/Supabase-backed PostgreSQL，通过 `RdbProvider` 暴露相同领域合同。\n- **测试**: Vitest unit/contract/integration/E2E；fixture `linctl`/`gh` 可执行文件；真实 HTTP 与 host Runner smoke test。\n- **目标平台**: self-hosted single-node Control Plane + host-bound TypeScript Runner；Web 为次要 Human client，CLI/API 为主要合同。\n- **性能目标**: Task list读取 current projection，history/capability lookup走有界分页与索引；Assign/Start RDB事务不执行网络或文件系统 I/O；每个 Task第一版最多一个 Harness、一个 Harness最多一个 Session。\n- **约束**: capability 明文只存在于 claim response 与 workload environment；不得进入 prompt、普通日志、状态 note 或持久化；Task/Session 状态完全解耦；pre-0.1 直接替换旧合同，无兼容 shim。\n- **范围**: Task schema/status/history、Harness persistence、Human production API/UI、workload API、`mystra-agent` package、Runner environment 注入、Workspace-ready continuation 和一个完整 happy/blocked/review journey。\n\n## Constitution Check\n\n### 规划前 gate\n\n- **5xP 与 Spec-Kit**: PASS。051 已同步 PRODUCT/PLATFORM/PROCESS/AGENTS/constitution，feature artifacts 保持在 `specs/051-factory-task-harness/`。\n- **边界复用**: PASS。复用 047 Task context、048 Task Workspace、049 Session launch/claim、050 Task surface；不引入 parallel Workspace、Turn、Workflow DSL 或 Harness 状态机。\n- **Provider/RDB 隔离**: PASS。双 Prisma schema 通过 `RdbProvider` 统一；Prisma 类型不越过 DB 模块。\n- **安全与授权**: PASS。Human 使用现有 Team auth/RBAC；workload 使用独立 capability；Agent CLI 无任意 Task ID；外部 CLI credential 不进入 Control Plane。\n- **事务边界**: PASS。Assign/Start 只包含数据库状态与 Harness 创建；Workspace、Git、Runtime、Provider I/O 均在提交后。\n- **验证纪律**: PASS。先写 schema/service contract tests，再实现；完成前执行聚焦测试、全量 typecheck/build、真实 HTTP/Runner smoke 和 graph-aware review。\n\n### Phase 1 设计后复核\n\n- execution code 采用 claim-time opaque token + persisted hash，解决一次性交付、过期和显式吊销，不需要新增 secret store 或 JWT signing key。\n- `TaskExecutionContext.workspace.root` 由 workload-local CLI 使用真实 `process.cwd()` 合成；Control Plane 只提供 Workspace logical identity/branch，保持 Runtime-private path 边界。\n- Harness 冻结 Agent system prompt 与 Task title/description，避免 Agent 或 Task 在 Workspace 异步准备期间变化导致 Session 输入漂移。\n- Workspace ready continuation 使用 Harness 预分配的 `sessionId` 和 `firstMessageId`，依赖现有 Session create idempotency，重复 ready report 不产生第二 Session。\n\n所有 gate 继续 PASS；没有需要豁免的 constitution violation。\n\n## 已有能力与改动边界\n\n| 已有能力 | 051 的扩展 |\n| --- | --- |\n| `Task` CRUD 与 immutable Project/Issue references | 增加 production projection、history 与 dedicated transition service |\n| `TaskWorkspaceService.setup` + Runner preparation/report | Assign 后调用 setup；ready report 后触发 Harness continuation |\n| `SessionService.launch` 与 idempotent `createSessionWithEvents` | 增加使用 Harness-frozen Agent/Task 输入的 launch 路径 |\n| `RuntimeSessionService.claim` + `SessionDispatchLease` | claim 时为 Harness Session 生成 execution code hash/expiry并返回明文一次 |\n| Runner Provider command environment merge | 注入 Control Plane URL、execution code，并确保 `mystra-agent` 在 PATH |\n| Task detail + Workspace/Sessions panels | 增加 Assign/Start、production status/history 和 Human review controls |\n| root `scripts/operator-cli.mjs` | 保持为 Control Plane operator CLI；新增独立 `packages/agent-cli` |\n\n## 关键数据流\n\n```text\nHuman Assign/Start\n  -\u003e TaskProductionService.assignStart\n     -\u003e validate Team Task + active Agent snapshot + online Runtime/provider\n     -\u003e RDB tx: Task pending-\u003ein_progress + transition + Harness(frozen inputs + plannedSessionId)\n  -\u003e commit\n  -\u003e TaskWorkspaceService.setup\n     -\u003e queued: Runner materializes repository\n     -\u003e already ready: continue immediately\n     -\u003e failed: persist Harness setup diagnostic; Task stays in_progress\n\nRunner workspace report ready (same attempt/payload replay is idempotent)\n  -\u003e WorkspacePreparationService.report\n  -\u003e TaskProductionService.continueReadyWorkspace\n     -\u003e attach Workspace to Harness\n     -\u003e SessionService.launchHarness(planned session/message IDs)\n     -\u003e attach created unique Session to Harness.sessionId\n\nRunner claims Harness Session\n  -\u003e RDB tx: SessionDispatchLease + executionCodeHash/expiresAt\n  -\u003e claim response includes executionCode plaintext once\n  -\u003e runner process env: MYSTRA_CONTROL_PLANE_URL + MYSTRA_EXECUTION_CODE\n  -\u003e Agent executes standardized bootstrap prompt\n     -\u003e mystra-agent context get\n     -\u003e linctl read\n     -\u003e code + tests\n     -\u003e gh push/pr\n     -\u003e mystra-agent task status set waiting_for_review | blocked\n```\n\n## 状态与权限\n\n```text\npending --Human Assign/Start--\u003e in_progress\nin_progress --Agent-----------\u003e blocked\nblocked --Agent/Human---------\u003e in_progress\nin_progress --Agent-----------\u003e waiting_for_review\nwaiting_for_review --Human----\u003e in_progress | done\nnonterminal --Human-----------\u003e canceled\n```\n\n`done`/`canceled` 终态。Session `failed|ready|closed` 不修改 Task；Task 状态修改也不启动、停止或重试 Session。Human `done|canceled` 同一状态事务吊销 Harness execution capability；其他状态迁移只更新 Task projection/history。\n\n## 模块边界\n\n```text\npackages/shared/src/\n├── task.ts                       # productionStatus/projection/transition contracts\n├── harness.ts                    # Harness, assignment, execution context/capability schemas\n├── session.ts                    # optional Harness execution claim envelope\n└── index.ts\n\npackages/agent-cli/\n├── src/cli.ts                    # mystra-agent argv/env/stdout/stderr boundary\n├── src/client.ts                 # workload HTTP adapter\n└── src/*.test.ts\n\napps/control-plane/\n├── prisma/{sqlite,postgresql}/   # Task projection, Harness, transition, lease capability\n├── src/lib/db/                   # RdbProvider + Prisma transaction implementation\n├── src/lib/tasks/                # TaskStatusService + TaskProductionService\n├── src/lib/sessions/             # frozen Harness launch + claim capability\n├── src/lib/task-workspaces/      # ready continuation hook\n├── app/api/tasks/[id]/production/*\n├── app/api/agent-execution/*     # execution-code-only workload surface\n└── app/tasks/[id]/*              # production status/assignment/review UI\n\napps/runner-daemon/src/\n├── index.ts                      # Control Plane URL and CLI path wiring\n└── session/*                     # execution code handoff and child env merge\n```\n\n**结构决策**: `mystra-agent` 是独立 workspace package 和 binary，不污染 Control Plane management CLI。Runner 声明该 package 为运行时依赖，并把其 bin directory prepend 到 Provider child `PATH`；部署 runner 即同时部署 workload helper。API、CLI 和 UI 都调用同一 application services，不复制状态迁移逻辑。\n\n## 持久化与事务顺序\n\n1. Assign/Start 前读取并验证 Task、Project、active Agent snapshot、Runtime/provider capability。\n2. 一个 RDB 事务验证 Task `pending`、expected revision 和 idempotency，写 Task projection、TaskStatusTransition、Harness；Harness 保存非外键 `plannedSessionId`/`firstMessageId` 并冻结 Agent/Task/Issue输入，实际 `sessionId` 保持 null。\n3. 提交后调用现有 Workspace setup。失败把 bounded setup failure code/message 写入 Harness，Task 保持 `in_progress`，不伪造 blocked。\n4. 同一个 Workspace preparation attempt 的同 payload completion 是幂等命令；ready continuation 原子绑定 Harness.workspaceId，再用 `plannedSessionId` 作为 Session create ID执行 frozen launch；成功后把 actual `sessionId` 绑定 Harness。相同 ID/payload replay 返回原 Session，不同 attempt/payload 仍 fail closed。\n5. Runtime claim 事务在 Session lease 上保存 execution code hash/expiry；明文只在 claim response 中返回。\n6. workload API 对 code hash、expiry、revocation、Harness/Session/Task/Agent revision scope 做全量校验后读取 context 或调用 TaskStatusService。\n7. 状态迁移事务以 `(taskId, idempotencyKey)` 判重，以 expectedRevision 防并发，写 projection + append-only transition；终态同时写 Harness capability revocation。\n\n## API 与 CLI\n\n- Human API: `POST /api/tasks/{taskId}/production/assign`、`GET /api/tasks/{taskId}/production`、`POST /api/tasks/{taskId}/production/status`。\n- Workload API: `GET /api/agent-execution/whoami`、`GET /api/agent-execution/context`、`GET|POST /api/agent-execution/task-status`；只接受 Bearer execution code。\n- CLI: `mystra-agent whoami|context get|task status get|task status set ...`；JSON stdout、稳定错误 JSON stderr、成功 0/输入或服务错误非 0。\n- Runner protocol: `SessionClaimAssignment.execution` 为可选；只有关联 Harness 的 Session 才返回 `{ code, expiresAt, capabilities }`。\n\n详细 schema 与错误映射见 [contracts](./contracts/) 和 [data-model.md](./data-model.md)。\n\n## 失败模式\n\n| 失败 | 系统行为 |\n| --- | --- |\n| 并发 Assign 或 stale revision | 只有一个事务成功；其他返回 `task_status_conflict`/idempotent replay |\n| Workspace preparation 失败 | Harness 持久化 bounded setup diagnostic，Task 保持 `in_progress`；不自动改状态 |\n| ready report 后 launch 失败 | Runner 重放相同 attempt/report；completion 返回既有 ready Workspace，再重试幂等 continuation |\n| ready report 重放 | 相同 preparation payload 与预分配 Session ID 返回既有结果，不创建重复对象 |\n| claim response 丢失 | 既有 Session lease 到期/回收后重新 claim 并轮换 execution code；旧 hash 失效 |\n| capability 过期/吊销/foreign scope | workload API fail closed，不返回上下文 |\n| status 命令超时 | 相同 idempotency key 安全重放 |\n| Session/Provider 失败 | Session 记录 execution failure；Task 仍 `in_progress`，除非 Agent 成功报告 blocked |\n| `linctl`/`gh` 不可用 | Agent 报告 blocked；Mystra 无 credential/delivery fallback |\n| Agent note 伪造 PR/tests | 原样作为有界不可信声明展示；Human 决定 done/退回 |\n\n## 测试与验证\n\n```text\nshared schema/reducer tests\n  -\u003e RdbProvider contract tests (SQLite + optional PostgreSQL)\n     -\u003e TaskStatusService/TaskProductionService unit + race/idempotency tests\n        -\u003e Human/workload API route tests\n           -\u003e mystra-agent CLI contract tests\n              -\u003e Runner env/capability claim tests\n                 -\u003e HTTP + fake provider + fixture linctl/gh E2E\n                    -\u003e task detail browser/runtime smoke\n```\n\n- 迁移矩阵覆盖全部合法/非法 actor transition、note、terminal 状态。\n- 20 路并发 expectedRevision/idempotency race 只产生一条 transition/Harness/Session；Workspace ready report 的 completion/continuation 分段故障可恢复。\n- Team、Task、Harness、Session、Agent revision 任一 scope mismatch 均 fail closed。\n- 测试断言 execution code 不出现在 prompt、SessionEvent、普通日志、Task note 或数据库明文字段。\n- E2E fixture 证明 Agent 能只凭两个环境变量运行 `mystra-agent`，再调用本地 `linctl`/`gh`；fixture 不是 Mystra provider fallback。\n- 完成前运行 `db:generate`、focused tests、`pnpm typecheck`、`pnpm test`、`pnpm build`、真实 HTTP/Runner smoke 和 `gitnexus_detect_changes`。\n\n## 实施顺序\n\n1. 共享 Task/Harness/execution schemas 与纯状态迁移规则测试。\n2. 双 Prisma schema、migration、mapper、RdbProvider 原子命令与 contract tests，包括 Workspace completion idempotency。\n3. TaskStatusService 和 TaskProductionService，包括 Harness-frozen inputs 与 Workspace continuation。\n4. Human production API；随后 Task detail projection/controls。\n5. claim-time execution capability、workload API 和泄漏/越权测试。\n6. `packages/agent-cli` binary、Runner PATH/env 注入和 provider child tests。\n7. Harness-specific standardized prompt/Session launch，移除该路径对 mutable Task/Agent 的二次解析。\n8. 完整 journey E2E、运行验证、代码审查与 Spec-Kit closeout。\n\n## NOT in scope\n\n- Harness heartbeat、事件订阅、多 Session、retry/recovery policy 或独立 Harness 状态机。\n- 自动分诊、需求审查、Recipe/Skill/Workflow 选择、standing orders、arbitrary triggers。\n- Mystra 执行/验证测试，查询/验证 PR，解析 Agent 输出推断 Task 状态。\n- Linear/GitHub credential 托管、CLI 代理、Issue write-back 或 RepoDeliveryProvider fallback。\n- 通用 Artifact/Delivery API、非 PR 产出物、质量门禁与修复循环。\n- task reopen、第二次 Harness attempt、并行 Agent、跨 Runtime 迁移。\n- 通用 Control Plane `mystra` CLI 的重构或发布；本期只新增 workload-local `mystra-agent`。\n\n## Complexity Tracking\n\n无 constitution violation。新增 Harness 与 TaskStatusTransition 是规格要求的最小 durable facts；execution capability 复用 SessionDispatchLease，不新增独立认证平台。\n\n## GSTACK REVIEW REPORT\n\n| Review | Trigger | Why | Runs | Status | Findings |\n| --- | --- | --- | --- | --- | --- |\n| CEO Review | `/plan-ceo-review` | Scope \u0026 strategy | 0 | — | 产品边界已由 owner 明确冻结 |\n| Codex Review | `/codex review` | Independent 2nd opinion | 0 | — | 工程评审后决定是否需要 |\n| Eng Review | `/plan-eng-review` | Architecture/data/tests (required) | 1 | CLEAR | 9 findings resolved, 0 critical gaps |\n| Design Review | `/plan-design-review` | UI/UX gaps | 0 | — | 只扩展既有 Task detail surface |\n| DX Review | `/plan-devex-review` | CLI developer experience | 0 | — | CLI contract 在本计划内直接评审 |\n\n**UNRESOLVED:** 0\n\n**VERDICT:** ENG CLEARED — ready for task decomposition and implementation\n",
      "sourceHash": "da339a75a13d7eb66b84a145d4797a82d18846feeec18ddf27b774f68e497f77"

      "mediaType": "text/markdown",
      "content": "# 原型：Task 生产状态与 mystra-agent CLI\n\n## 入口\n\n- [打开独立 HTML 线框原型](mockups/index.html)\n\n## Design Intake\n\n- **目标用户**：观察 Agent 生产进度并人工收口的 Team 操作者。\n- **首要行动**：区分 Task productionStatus 与 Session.state，并理解谁能执行下一次迁移。\n- **核心信息**：当前状态、revision、Agent note、允许迁移、最新 Session state、transition history。\n- **硬约束**：Agent report 不等于 Mystra verification；Agent 不能完成或取消 Task。\n- **变体范围**：只验证状态机和薄 CLI，不设计完整 Harness orchestration。\n\n## Wireframe 方向\n\n页面以 Task 状态为主轴。顶部展示 productionStatus 与 revision；中部展示 `mystra-agent` 的 attempt-scoped context/status contract、本地 `linctl`/`gh` 工具边界和独立 Session execution state；底部展示 append-only transition history。waiting_for_review 的 PR 与测试文字明确标注 Agent reported / not verified by Mystra。\n\n## 覆盖状态\n\n- pending：等待 Assign/Start。\n- in_progress：Agent 正在生产。\n- blocked：Agent 报告无法继续，必须有 note。\n- waiting_for_review：Agent 声明可审查，内容未经 Mystra 验证。\n- done：Human 接受，终态。\n- canceled：Human 取消，终态。\n\n## 交互说明\n\n- 状态切换按钮只用于原型评审，不代表真实权限实现。\n- `mystra-agent` 只展示当前 attempt 的 whoami/context/status contract，不允许任意 Task ID。\n- `mystra` 明确保留为 Control Plane 管理 CLI；原型内的 workload 命令不使用该名称。\n- Linear 读取与 PR 创建分别标注为本地 `linctl` 和 `gh`，Mystra 不代理或验证。\n- Session badge 可以独立切换，证明 Session failed 不会自动修改 Task。\n- Human actions 只在对应 Task 状态出现。\n\n## 当前限制\n\n- 静态 fixture 不连接真实 API、Runtime、`mystra-agent`、`linctl` 或 `gh`。\n- 不表示最终视觉设计。\n- 不设计 PR/测试验真、多 Session、心跳、通用 Artifact 或 Production Recipe。\n",
      "sourceHash": "d175d4be8402bb5ea90258784878a5356f668a5348c96b4f393bd5c87f1432f1"
    },
    {
      "title": "Quickstart：Task Assign 到 Agent reported PR",
      "path": "specs/051-factory-task-harness/quickstart.md",
      "mediaType": "text/markdown",
      "content": "# Quickstart：Task Assign 到 Agent reported PR\n\n## 前置条件\n\n- Node `24.14.0`，Corepack pnpm `10.25.0`。\n- Control Plane 与 host `mystra-runner` 可达；Runtime online 且报告 `codex` 或 `copilot` provider。\n- host Runner 用户 PATH 中有可执行且已认证的 `linctl`、`gh` 和对应 Agent provider CLI。\n- 已存在同 Team active Agent、Project-bound pending Task；Project repository/base branch 可准备 Workspace。\n\n## 本地验证流程\n\n1. 生成 Prisma clients 并准备数据库：\n\n   ```bash\n   corepack pnpm --filter @mystra/control-plane db:generate\n   corepack pnpm db:migrate:dev\n   ```\n\n2. 启动 Control Plane 与 Runner：\n\n   ```bash\n   corepack pnpm dev:control-plane\n   MYSTRA_RUNNER_ENDPOINT=http://127.0.0.1:3000 corepack pnpm dev:runner\n   ```\n\n3. 在 Task detail 选择 Agent、Runtime/provider 并执行 Assign/Start。预期：\n\n   - Task 立即为 `in_progress`；\n   - 出现一条 Human transition 和一个 Harness；\n   - Workspace queued/preparing/ready；\n   - ready 后出现且只出现一个 Session。\n\n4. Runner claim 后，Provider workload 只获得：\n\n   ```text\n   MYSTRA_CONTROL_PLANE_URL=http://127.0.0.1:3000\n   MYSTRA_EXECUTION_CODE=\u003credacted\u003e\n   ```\n\n   以及 PATH 中的 `mystra-agent`。prompt 不包含 execution code。\n\n5. workload bootstrap：\n\n   ```bash\n   mystra-agent whoami\n   mystra-agent context get\n   linctl issue get \u003cidentifier-from-context\u003e\n   # edit and test in current working directory\n   gh pr create --fill\n   mystra-agent task status get\n   mystra-agent task status set waiting_for_review \\\n     --expected-revision 2 \\\n     --idempotency-key delivery-1 \\\n     --note \"PR: https://github.com/example/repo/pull/1; tests: corepack pnpm test\"\n   ```\n\n6. Human 在 Task detail 看见 `waiting_for_review` 与 “Agent reported; not verified by Mystra”，选择 done 或退回 in_progress。\n\n## 必须观察到的隔离\n\n- 手工把 Session 制造成 failed，Task 仍保持原 productionStatus。\n- Task blocked/waiting_for_review 不改变 Session.state。\n- 相同 status idempotency key 重放返回同一 transition；换 payload 返回冲突。\n- 使用旧 revision、过期 code、其他 attempt code 或任意 Task ID 均失败。\n- 数据库、prompt、SessionEvent 和普通 Runner logs 中检索不到 execution code 明文。\n- fixture `linctl`/`gh` 失败只导致 Agent 自主报告 blocked；Mystra 不调用 Integration credential fallback。\n\n## 验证命令\n\n```bash\ncorepack pnpm --filter @mystra/shared test\ncorepack pnpm --filter @mystra/control-plane test\ncorepack pnpm --filter @mystra/agent-cli test\ncorepack pnpm --filter @mystra/runner-daemon test\ncorepack pnpm typecheck\ncorepack pnpm test\ncorepack pnpm build\n```\n\n真实 PostgreSQL/Supabase connectivity 仅在配置 `MYSTRA_TEST_POSTGRES_URL` 时验证；SQLite 结果不得被描述为 PostgreSQL runtime proof。\n\n## 2026-08-11 收口证据\n\n- 全仓测试通过：shared 147、agent-adapters 9、agent-cli 5、control-plane 350（另 19 项按环境跳过）、runner-daemon 31。\n- 全仓 typecheck 与 production build 通过；SQLite/PostgreSQL Prisma schema 均通过 validate。\n- 使用临时 SQLite 数据库完成真实 HTTP smoke：注册、Runtime/Agent/Project/Task 创建、Assign、相同 key 重放、production read、Human cancel 和 terminal capability revocation 均符合合同，相关 response 均为 `Cache-Control: no-store`。\n- 使用浏览器完成 Task detail smoke：观察 in_progress、Harness/history/current actor，执行 Human cancel 后观察 canceled revision 与 sidebar productionStatus icon；控制台无 error/warning。\n- fixture journey 实际执行本地 `linctl`/`gh` 替身并完成 scoped context/status/PR-report 流程；未对真实 Linear/GitHub 产生外部副作用。\n- 当前环境未配置 `MYSTRA_TEST_POSTGRES_URL`，因此没有 PostgreSQL runtime connectivity 证据；这不影响双 schema 静态一致性结论。\n",
      "sourceHash": "0e3c1f5f1f696874657bea5eb05466806988a8137597082cdf430ad14ec8a672"
    },
    {
      "title": "研究：薄 Task 生产状态机与 mystra-agent CLI",
      "path": "specs/051-factory-task-harness/research.md",
      "mediaType": "text/markdown",
      "content": "# 研究：薄 Task 生产状态机与 mystra-agent CLI\n\n## Decision 1：execution code 在 Session claim 时签发\n\n**Decision**: Runtime claim Harness Session 时生成至少 256-bit opaque code；同一事务把 SHA-256 hash 与 `expiresAt` 写入 SessionDispatchLease，claim response 只返回一次明文。\n\n**Rationale**: Assign 时 Session 尚不存在；launch 时 Runtime 尚未拥有执行权。claim 是 Control Plane 已知准确 Session/Runtime ownership 且能安全把秘密交给 Runner 的第一个时点。复用 lease 也使过期、重 claim 轮换和执行结束后的失效有明确边界。\n\n**Alternatives considered**:\n\n- 长期 Agent API key：scope 过大，无法绑定 attempt/session，直接违反规格。\n- JWT/HMAC capability：需要新增签名密钥生命周期；当前 opaque token + hash 已满足自用 MVP。\n- 明文或可逆密文持久化：增加泄漏面和 SecretProvider 耦合，没有必要。\n- 在 system prompt 传 code：会进入持久化 SessionEvent 与 Provider transcript，明确禁止。\n\n**Primary-source check**: Node documents `crypto.randomBytes()` as cryptographically strong pseudorandom data and `createHash()` as the standard digest API: \u003chttps://nodejs.org/api/crypto.html\u003e。\n\n## Decision 2：Harness 是唯一 attempt identity，不拥有 lifecycle state\n\n**Decision**: 每个 Task v1 至多一个 Harness。Harness 保存 frozen Agent snapshot、frozen Task input、runtime/provider selection、非外键 `plannedSessionId`/message ID、可空 actual Workspace/Session references 与 capability revocation time；没有 `status` 字段。\n\n**Rationale**: Task 已拥有业务状态，Session 已拥有执行状态。Harness 只需把一次生产归因与异步步骤关联起来。`taskId @unique` 与 planned IDs 可以直接保证重复 Assign/ready continuation 不创建第二 attempt/Session，同时 nullable actual `sessionId` 避免在 Session 创建前形成非法 FK。\n\n**Alternatives considered**:\n\n- Harness 状态机：与 Task/Session 重叠，且 heartbeat/retry 尚不在范围。\n- Task 直接保存 Agent/Session：无法表达 attempt-frozen input 和未来第二次 attempt，且把生产归因压回 Task projection。\n- 允许多 Harness：v1 没有 reopen/retry policy，会制造无法解释的 active attempt 选择。\n\n## Decision 3：Task 状态写入使用原子 projection + append-only transition\n\n**Decision**: `TaskStatusService` 是唯一迁移入口。RDB command 在同一事务验证 actor allowlist、expectedRevision、note、idempotency payload，更新 Task projection 并追加 TaskStatusTransition。\n\n**Rationale**: 通用 Task PATCH 允许编辑 requirement fields，不适合 workload capability。projection 保证快速读取，history 保证审计与幂等结果重放。唯一 `(taskId,idempotencyKey)` 让网络超时可安全重试。\n\n**Alternatives considered**:\n\n- 只存 Task current status：无法审计 actor、重建 projection 或返回原 transition。\n- 只存 event/history 并动态折叠：Task 列表/导航读取成本和并发控制更复杂。\n- 从 SessionEvent 推断：Agent 进程事实不是业务完成事实。\n\n## Decision 4：冻结 Agent prompt 与 Task 输入\n\n**Decision**: Assign/Start 时 Harness 保存 Agent ID/revision/system prompt 和 Task title/description；exact Issue reference 与 Project identity由 immutable Task context/Project reference解析并在 execution context 中返回。Harness Session launch 使用 frozen snapshot，不再次解析 active Agent 的当前 revision。\n\n**Rationale**: Workspace preparation 是异步的。若期间 Agent prompt 或 Task requirement 被编辑，后续 Session 不应悄然改变已归因 attempt 的输入。只保存 revision 而不保存 prompt 无法在更新后恢复旧 revision 内容。\n\n**Alternatives considered**:\n\n- launch 时读取最新 Agent/Task：破坏冻结语义。\n- 建立通用 AgentRevision 表：超出 051；Harness snapshot 已满足 attempt 需求。\n- 冻结完整外部 Issue body：违反 provider-owned current information 边界。\n\n## Decision 5：Workspace root 由 workload-local CLI 合成\n\n**Decision**: workload context API 返回 Workspace logical identity、branch 与 repository context；`mystra-agent context get` 用实际 `process.cwd()` 填充输出中的 `workspace.root`，并校验 cwd 非空/可解析。\n\n**Rationale**: Control Plane 持有 opaque `workspaceRef`，真实 host path 是 Runtime-private fact。Provider process 已以 ready Workspace directory 为 cwd，因此 CLI 是唯一既有能力知道准确路径又不需要扩大 Runner protocol 的组件。\n\n**Alternatives considered**:\n\n- 把 host path 持久化到 Workspace：打破 Runtime 抽象并泄漏主机事实。\n- 由 Runner回写 path：增加无必要的 mutable truth 和跨 Runtime 语义。\n- 不返回 root：不满足已接受的 TaskExecutionContext contract。\n\n## Decision 6：`mystra-agent` 随 Runner 分发并由 Runner 注入 PATH\n\n**Decision**: 新建 `packages/agent-cli`，以 `mystra-agent` bin 导出。`mystra-runner` 将其作为 production dependency，并在 Provider child environment 前置该 package 的 bin directory，同时注入 endpoint/code。\n\n**Rationale**: workload CLI 是 Runtime 能力而非 Control Plane UI。与 Runner 一起安装可保证版本相容并避免要求用户单独全局安装；保留独立 package/binary 可维护 `mystra` 与 `mystra-agent` 的权限边界。\n\n**Alternatives considered**:\n\n- 扩展 root operator CLI：混合 Human 与 workload credential。\n- 只提供 `pnpm` script：Agent prompt 无法稳定调用 bare `mystra-agent`。\n- 下载临时 binary：引入网络、供应链和版本发现问题。\n\n## Decision 7：Workspace ready 直接触发幂等 continuation\n\n**Decision**: Workspace report route 在 `completeTaskWorkspacePreparation` 成功返回 ready 后调用 `TaskProductionService.continueReadyWorkspace`；Assign/Start 若发现 Workspace 已 ready 也调用同一方法。\n\n**Rationale**: 当前 048 已有明确 ready report 边界，但没有通用事件总线。一个直接 application callback 是最薄实现；预分配 Session ID 与 RDB uniqueness 提供 at-least-once 安全。\n\n**Alternatives considered**:\n\n- 新增 event bus/subscription Harness：正是明确延期范围。\n- polling cron：增加延迟、并发与新后台进程。\n- Runner直接创建 Session：绕过 Human/Team application authorization 和 frozen Harness inputs。\n\n## Decision 8：Agent 使用本地 linctl/gh，平台不做 fallback\n\n**Decision**: 标准 bootstrap prompt 指示 Agent先用 `mystra-agent context get`，按 exact Issue reference 调用本地 `linctl`，在 cwd 修改/自测，再用本地 `gh` push/create PR，最后报告 status。\n\n**Rationale**: 这是 owner 明确的自用 MVP deployment contract。Mystra execution capability 只授权 Mystra workload API；它不扩大为 Linear/GitHub credential broker。\n\n**Alternatives considered**:\n\n- Control Plane 代理 Linear/GitHub：扩大 secret、Integration 和审计范围。\n- RepoDeliveryProvider fallback：会掩盖 host CLI 失败并改变用户旅程。\n- Mystra 验证 PR/tests：平台当前没有此能力，且明确不在 051。\n\n## Decision 9：Workspace completion 与 Session continuation 分段可恢复\n\n**Decision**: `completeTaskWorkspacePreparation` 对同 preparation attempt + 同 report payload 重放返回既有结果；不同 attempt/payload 仍冲突。ready continuation 可重复调用，使用 Harness 预分配 IDs 收敛到同一 Session。\n\n**Rationale**: Workspace completion 已提交而后续 launch 失败时，Runner 会重试 HTTP report。若 completion 一律把重复视为 stale，系统会永久失去自动 launch 触发点。幂等 completion 保留现有 attempt fencing，同时让跨两个短事务的故障可恢复。\n\n**Alternatives considered**:\n\n- 把 Workspace completion 与 Session launch 放进一个事务：跨越不同 application boundaries，并可能把外部/复杂读取带入事务。\n- 新增 durable event bus/outbox：可靠但超出 thin Harness MVP。\n- report 成功后吞掉 launch failure：造成无后续触发器的 silent failure。\n\n**Primary-source check**: Prisma recommends short transactions and avoiding network/slow work inside interactive transactions, while naming idempotent operations and optimistic concurrency as appropriate read-modify-write techniques: \u003chttps://www.prisma.io/docs/orm/prisma-client/queries/transactions\u003e。\n\n## Decision 10：自用 MVP 的 CLI 分发是 Runner-bundled，不单独发布\n\n**Decision**: `@mystra/agent-cli` 是 private workspace package；Runner production dependency包含其 executable wrapper，Runner从 package导出的 bin path prepend child PATH。root recursive build 与现有 deployment repo sync/pnpm install 同时交付两者。本期不发布 npm/GitHub Release 独立 artifact。\n\n**Rationale**: 第一版用户是本机 Runner workload；独立跨平台下载渠道不会解锁当前 journey。显式 runner-bundled distribution 则避免“代码存在但 workload 找不到 command”。\n\n**Alternatives considered**:\n\n- npm/global package：增加版本矩阵与发布管线，当前没有外部消费者。\n- 用户手工安装：不能保证 Runner child PATH 和版本一致。\n- 把 CLI 内联进 runner source：权限边界与独立合同不清晰。\n",
      "sourceHash": "57ff93c2ebd9a517705aa336ea3b0b4006bf4bd4000b6e67292a4898df828416"
    },
    {
      "title": "功能规格：薄 Task 生产状态机与 mystra-agent CLI",
      "path": "specs/051-factory-task-harness/spec.md",
      "mediaType": "text/markdown",
      "content": "# 功能规格：薄 Task 生产状态机与 mystra-agent CLI\n\n**Feature Branch**: 051-factory-task-harness\n**Created**: 2026-08-11\n**Status**: Complete\n\n\u003e **052 supersession (2026-08-12)**: “Assign Agent/Assign \u0026 Start” 已由 canonical\n\u003e `Start production` 直接替换。Agent Context 可 omitted/null；显式 ID 必须在 Start\n\u003e transaction 内解析并冻结，且无效选择 fail closed。Harness/Session Agent snapshot\n\u003e 必须全有或全无；不得创建 default/sentinel Agent 或保留 `/assign` alias。051 的\n\u003e Task productionStatus、Harness、Workspace continuation、execution code 和 scoped\n\u003e status transition 合同继续有效。\n\n\u003e **054 status supersession (2026-08-13)**: 054 直接删除\n\u003e `waiting_for_review`，并将其 handoff 语义并入 `blocked`。当前五态为\n\u003e `pending/in_progress/blocked/done/canceled`，其中 `blocked` 显示为待接手；Human\n\u003e 可将其恢复为 `in_progress` 或确认为 `done`。051 下文的六态枚举与\n\u003e `waiting_for_review` transition 仅保留为已实现旧合同的迁移证据，不再是目标产品合同。\n**Input**: Mystra 以“工厂”为核心产品模型。第一版先为 Task 增加薄生产状态机，并提供 workload-local `mystra-agent` CLI，让被分配 Agent 用当前 attempt 的短期 execution code 获取完整执行上下文并报告生产进度。`mystra` 保留为面向 Human、外部 Agent 和操作者的 Control Plane 管理 CLI。Agent 通过宿主机已认证的 `linctl` 读取 Linear、通过 `gh` 提交 PR；Mystra 不代理或验证这些操作。一个 Harness attempt 仍只启动一个 goal/autopilot Session；完整 Harness 编排、平台验收和通用产出物延后。\n\n## 决策摘要\n\nTask 是基本生产任务，并拥有 Mystra-owned 的 productionStatus。Session 只表达一次执行会话的运行状态，两者不得互相镜像。Harness 第一版只是一次生产 attempt 的归因身份：冻结 Agent revision，关联一个 Session，不再拥有第二套生产状态机。\n\n`mystra` 与 `mystra-agent` 是两个明确分离的客户端。前者管理 Control Plane 资源；后者只服务当前运行中的 workload，通过 Runtime 注入的 execution code 解析当前 Team、Task、Harness、Session、冻结 Agent revision、Project、Issue reference 和 Workspace。`mystra-agent` 不接受任意 Task ID，也不能使用通用 Task PATCH 修改 title、description、Project 或 Issue context。\n\nAgent 通过宿主机本地、已认证的 `linctl` 读取 Linear Issue，通过本地 `gh` 推送分支并创建 PR。execution code 不授权这两个工具，Mystra 也不代理其请求、托管其凭据或验证其结果。Agent 对 PR、自测和阻塞原因的说明都是未验证声明；Mystra 本期不运行测试、不查询或验证 PR，也不根据 Session 输出推断 Task 是否完成。\n\n本规格明确取代 047 中“Task 没有生产状态”的边界，但不改变其外部信息所有权：Linear/GitHub Issue status 仍由 Provider 拥有，Mystra 不复制、不回写，也不把它映射为 productionStatus。\n\n## Task Production State Machine\n\n### 状态\n\n| productionStatus | 含义 | 进入者 |\n| --- | --- | --- |\n| pending | Task 已创建，尚未开始生产 | 系统创建 |\n| in_progress | 已分配 Agent，生产正在进行或恢复进行 | Assign/Start；Agent 恢复；Human 退回修改 |\n| blocked | Agent 明确声明当前无法继续，并提供原因 | Agent |\n| waiting_for_review | Agent 明确声明已完成当前生产目标，等待人工审查 | Agent |\n| done | 人工确认本次生产任务结束 | Human |\n| canceled | 人工终止未完成的生产任务 | Human |\n\nTask 不提供 failed 状态。失败属于 Harness/Session attempt；Agent 无法继续时将 Task 置为 blocked。这样可以避免一次进程异常永久定义业务任务，也避免 Mystra 假装理解 Agent 的执行结果。\n\n### 合法迁移\n\n    create ───────────────→ pending\n    pending ──Assign/Start→ in_progress\n    in_progress ──Agent───→ blocked\n    blocked ─────Agent────→ in_progress\n    in_progress ──Agent───→ waiting_for_review\n    waiting_for_review ─Human→ in_progress\n    waiting_for_review ─Human→ done\n    blocked ────────────Human→ in_progress\n    any nonterminal ────Human→ canceled\n\ndone 和 canceled 在第一版为终态；reopen 延后。Agent 不得设置 pending、done 或 canceled，也不得从 waiting_for_review 自行恢复生产。\n\n### 状态机规则\n\n1. Assign/Start 的短 RDB 事务必须原子完成 pending → in_progress 并创建 Harness attempt。事务提交后自动请求 Workspace preparation；Workspace ready 后再幂等创建该 attempt 的唯一 Session。数据库事务不得跨越 Workspace 或 Runtime I/O。\n2. productionStatus 与 Session.state 独立。Session failed、closed、interrupted 或 ready 均不得自动改变 Task；Task 状态迁移也不得隐式启动、停止或重试 Session。\n3. 如果 Agent 退出前没有报告 blocked 或 waiting_for_review，Task 可以保持 in_progress。本期接受这一不完整信号，不由 Mystra猜测结果。\n4. blocked 和 waiting_for_review 必须包含非空 note；其他迁移可选 note。每次迁移都替换当前 statusNote；未提供时投影为 null，不保留上一状态的旧说明。\n5. 每次迁移使用 expectedRevision 乐观并发控制。旧 revision 返回稳定 task_status_conflict，不覆盖新状态。\n6. 每次写入必须带 idempotency key。同 key 与同 payload 重放返回原结果；同 key 不同 payload 返回稳定冲突。\n7. 当前投影保存在 Task；每次迁移同时追加 TaskStatusTransition，供审计和恢复当前投影。\n\n## mystra-agent CLI Contract\n\nMystra 提供两个边界不同的 CLI：\n\n- `mystra`：面向 Human、外部 Agent 和自动化，管理 Control Plane 资源；它不是任务 workload 的默认身份入口。\n- `mystra-agent`：面向当前运行中的 Agent workload，只能访问 execution code 授权的 attempt。\n\n第一版 `mystra-agent` 开放身份、执行上下文、Task 状态读取和受控迁移：\n\n    mystra-agent whoami\n    mystra-agent context get\n    mystra-agent task status get\n    mystra-agent task status set blocked --expected-revision 3 --idempotency-key cmd-101 --note \"Waiting for API contract\"\n    mystra-agent task status set in_progress --expected-revision 4 --idempotency-key cmd-102 --note \"Contract received\"\n    mystra-agent task status set waiting_for_review --expected-revision 5 --idempotency-key cmd-103 --note \"PR: ...; tests: ...\"\n\nRuntime 至少注入 `MYSTRA_CONTROL_PLANE_URL` 与 `MYSTRA_EXECUTION_CODE`。execution code 是一次 Harness/Session attempt 的短期、可吊销 capability，绑定准确 Team、Task、Harness、Session 和冻结 Agent revision；它不是 Agent 的长期身份 code，也不得出现在 system prompt、普通日志、状态 note 或明文持久化中。`mystra-agent` 不接受任意 Task ID。\n\n`context get` 返回 schema-versioned `TaskExecutionContext`，至少包含 execution identity、冻结的 Task title/description 与 exact Issue reference、Project repository identity 与 configured base branch、Workspace root/working branch，以及当前允许的 CLI capabilities。它不得复制 Linear Issue body，不得返回 GitHub/Linear credentials、Project Integration secret 或其他 secrets。\n\n`task status` 只能调用专用 TaskStatusService.transition，不复用人类 Task PATCH。输出为稳定 JSON，至少包含 taskId、productionStatus、statusRevision、statusUpdatedAt 和 transitionId。错误至少区分 invalid_transition、task_status_conflict、missing_status_note、scope_mismatch 和 capability_expired。\n\nAgent 拿到 exact Linear Issue reference 后，使用宿主机本地、已认证的 `linctl` 获取当前需求；完成代码与自测后，使用宿主机本地、已认证的 `gh` 推送分支并创建 PR。Mystra 不代理这些 CLI、不向它们兑换凭据、不查询 PR，也不验证自测。若任一工具缺失、未认证或不可执行，Agent 应通过 `mystra-agent task status set blocked` 报告原因；平台不回退到 Project Integration credential 或 RepoDeliveryProvider 代为完成。\n\nAgent note 是不可信文本。即使包含 PR URL、commit SHA 或测试结果，Mystra 也只保存并展示为 “Agent reported”，不连接 GitHub、不运行命令、不做结果验真。\n\n## User Scenarios \u0026 Testing\n\n### User Story 1 - Assign Agent 开始生产 (Priority: P1)\n\n作为 Team 操作者，我希望为 pending Task 分配 Agent 后自动开始一个生产 attempt，以便 Task 明确进入 in_progress 并启动唯一 Autopilot Session。\n\n**Independent Test**: 对 eligible Task 执行 Assign/Start，验证短事务原子创建状态迁移与 Harness；随后 Workspace ready 事件只触发一个 Session，重复命令或事件不产生重复对象。\n\n**Acceptance Scenarios**:\n\n1. **Given** pending Project-bound Task 和同 Team active Agent，**When** 操作者 Assign/Start，**Then** Task 与冻结 Agent revision 的 Harness 在同一短事务中创建，Task 进入 in_progress，提交后开始 Workspace preparation。\n2. **Given** Workspace 随后 ready，**When** launch continuation 被触发或重放，**Then** 该 Harness 幂等获得恰好一个 Session。\n3. **Given** 同一 Assign/Start 命令被重放，**When** 服务处理，**Then** 返回同一 transition 和 Harness，不创建重复 Workspace 或 Session。\n4. **Given** Task 非 pending、Project 不可交付或 Agent 无效，**When** Assign/Start，**Then** fail closed 且不留下部分 Task/Harness 状态。\n\n### User Story 2 - Agent 报告生产状态 (Priority: P1)\n\n作为被分配 Agent，我希望只凭当前 attempt 的 execution code，通过 `mystra-agent` 获取身份、Task、Project、Issue reference 和 Workspace 信息并更新当前 Task 状态，以便用标准 bootstrap prompt 开始工作，同时继续使用本地 `linctl` 与 `gh` 完成外部读取和 PR 交付。\n\n**Independent Test**: 仅注入 Control Plane URL 与 execution code，验证 Agent 无需 Task ID 即可取得 `TaskExecutionContext`；随后用 fixture `linctl`/`gh` 完成读取与 PR 创建，并依次执行 in_progress → blocked → in_progress → waiting_for_review，验证 revision、note、actor 和 transition history。\n\n**Acceptance Scenarios**:\n\n1. **Given** Runtime 注入有效 execution code，**When** Agent 执行 `mystra-agent whoami` 和 `context get`，**Then** 返回当前 attempt 的身份与完整执行上下文，不要求或接受 Task ID。\n2. **Given** context 含 exact Linear Issue reference，**When** Agent 读取需求，**Then** 使用本地 `linctl`；Mystra 不复制 Linear body 或代理调用。\n3. **Given** Task 为 in_progress，**When** Agent 带 note 设置 blocked，**Then** 状态和审计记录原子更新。\n4. **Given** Task 为 blocked，**When** 同一 Agent 设置 in_progress，**Then** 生产恢复，Session 是否继续由执行层独立决定。\n5. **Given** Agent 完成代码与自测，**When** 它使用本地 `gh` 创建 PR 并带交付说明设置 waiting_for_review，**Then** Mystra 只保存未验证声明，不创建、不查询或验证 PR 和自测。\n6. **Given** `linctl` 或 `gh` 缺失或未认证，**When** Agent 无法继续，**Then** Agent 报告 blocked，Mystra 不提供 Integration credential fallback。\n7. **Given** Agent 尝试设置 done、canceled、pending、指定其他 Task ID 或修改其他 Task 字段，**When** CLI 处理，**Then** 拒绝请求。\n\n### User Story 3 - 人工收口或退回 (Priority: P1)\n\n作为 Reviewer，我希望确认 Agent 声明后把 Task 标记 done，或退回 in_progress，以便业务完成权仍属于人。\n\n**Independent Test**: 从 waiting_for_review 分别执行 done 与 in_progress，并验证 actor 权限和审计记录。\n\n**Acceptance Scenarios**:\n\n1. **Given** waiting_for_review Task，**When** Human 接受结果，**Then** Task 进入 done。\n2. **Given** waiting_for_review Task，**When** Human 要求修改，**Then** Task 进入 in_progress；是否启动新 Session 不由该迁移隐式决定。\n3. **Given** 任意非终态 Task，**When** Human 取消，**Then** Task 进入 canceled。\n4. **Given** done 或 canceled Task，**When** 任意调用方请求迁移，**Then** 第一版返回 invalid_transition。\n\n### User Story 4 - 状态与 Session 可分别观察 (Priority: P2)\n\n作为操作者，我希望同时看见 Task productionStatus 和最新 Session.state，以便区分业务进度与进程运行情况。\n\n**Independent Test**: 构造 Session failed 但 Task in_progress，以及 Session ready 但 Task blocked；验证系统不自动同步两者。\n\n**Acceptance Scenarios**:\n\n1. **Given** Session failed，**When** Agent 未更新 Task，**Then** Task 保持 in_progress。\n2. **Given** Task blocked，**When** Session state 变化，**Then** Task 不被自动修改。\n3. **Given** waiting_for_review note 包含 PR 和 tests，**When** 页面或 API 展示，**Then** 明确标识为 Agent reported / not verified by Mystra。\n\n### Edge Cases\n\n- 两个 Agent 命令使用同一 expectedRevision 时只有一个成功。\n- 过期 Harness、Session 或 Agent revision 的 capability 不得更新新 attempt 的 Task。\n- CLI 网络超时后可用同 idempotency key安全重试。\n- Session 崩溃且 Agent 未能发出 blocked 时，Task 保持 in_progress。\n- 外部 Issue 被关闭、重开或改状态时，productionStatus 不自动变化。\n- waiting_for_review 的 URL 无效或测试说明虚假时，Mystra 仍只保存声明；人工 Reviewer 决定后续状态。\n- execution code 过期、吊销、泄漏到错误 attempt 或 scope 不匹配时，`mystra-agent` fail closed，不返回任何 Task/Project/Workspace context。\n- `linctl` 或 `gh` 不在 PATH、未认证或返回错误时，不改变 Mystra 的外部 Integration；Agent 可报告 blocked，平台不静默切换凭据或 delivery provider。\n- Workspace preparation 失败时 Harness 保留可诊断事实，Task 可继续保持 in_progress；Mystra 不根据基础设施失败猜测业务状态。\n\n## Requirements\n\n### Functional Requirements\n\n- **FR-001**: Task MUST 增加 Mystra-owned productionStatus，取值仅为 pending、in_progress、blocked、waiting_for_review、done、canceled。\n- **FR-002**: 新 Task MUST 初始化为 pending。\n- **FR-003**: Task productionStatus MUST 与外部 Issue status、Session.state 和 Harness attempt outcome 分离，不进行自动映射。\n- **FR-004**: 第一版 MUST NOT 提供 Task failed 状态。\n- **FR-005**: Assign/Start 的短 RDB 事务 MUST 原子执行 pending → in_progress 并创建一个 Harness attempt；事务提交后 MUST 请求 Workspace preparation，Workspace ready 后 MUST 幂等创建该 attempt 的唯一 Autopilot Session，且事务不得跨越 Workspace 或 Runtime I/O。\n- **FR-006**: Harness MUST 冻结 Agent revision 并关联 Task、Workspace 和一个 Session，但 MUST NOT 拥有平行生产状态机。\n- **FR-007**: Agent 只可请求 in_progress → blocked、blocked → in_progress、in_progress → waiting_for_review。\n- **FR-008**: Human 只可按本规格执行 waiting_for_review → done、waiting_for_review/blocked → in_progress，以及任意非终态 → canceled。\n- **FR-009**: done 和 canceled MUST 为第一版终态。\n- **FR-010**: blocked 与 waiting_for_review 迁移 MUST 要求非空 note。\n- **FR-011**: 所有 productionStatus 迁移 MUST 使用专用 TaskStatusService；Agent 尤其不得复用允许编辑 title/description 的通用 Task PATCH。\n- **FR-012**: `mystra-agent` execution capability MUST 绑定准确 Team、Task、Harness、Session、Agent ID/revision，且 CLI 不得接受任意 Task ID 越权寻址。\n- **FR-013**: 每次状态迁移 MUST 使用 expectedRevision 并返回稳定冲突错误。\n- **FR-014**: 每次状态迁移 MUST 支持 idempotency key；相同 key/payload 重放返回同一结果。\n- **FR-015**: Task MUST 保存当前状态投影、statusRevision、当前 transition 的 statusNote、statusUpdatedAt 和最后 actor summary；新迁移无 note 时 statusNote MUST 清为 null。\n- **FR-016**: 每次成功迁移 MUST 原子追加不可变 TaskStatusTransition，记录 transitionId、taskId、from、to、revision、actor、可选 Agent/Harness/Session identity、note、idempotency identity 和 occurredAt。\n- **FR-017**: `mystra-agent` MUST 提供 `whoami`、`context get`、`task status get` 和 `task status set`，输出稳定 machine-readable JSON；`mystra` MUST 保留为独立的 Control Plane 管理 CLI。\n- **FR-018**: CLI 错误 MUST 至少区分 invalid_transition、task_status_conflict、missing_status_note、scope_mismatch 和 capability_expired。\n- **FR-019**: Session state 变化 MUST NOT 自动改变 productionStatus；普通 productionStatus 迁移 MUST NOT 隐式控制 Session。\n- **FR-020**: Agent 未报告最终状态时，Mystra MUST 允许 Task 保持 in_progress，不根据 Session 文本、exit code 或事件推断结果。\n- **FR-021**: Agent note 中的 PR、commit 和自测信息 MUST 标识为未验证 Agent 声明；Mystra 本期 MUST NOT 查询 PR、运行测试或验证证据。\n- **FR-022**: Issue Provider MUST 保持 read-only；productionStatus 更新不得回写外部 Issue。\n- **FR-023**: 状态读取、迁移和历史 MUST 受 Team authorization、字段级 allowlist、有界文本和敏感信息清理约束。\n- **FR-024**: Runtime MUST 通过 `MYSTRA_CONTROL_PLANE_URL` 和 `MYSTRA_EXECUTION_CODE` 向 workload 注入连接信息；execution code MUST 短期、可吊销、attempt-scoped，且 MUST NOT 出现在 prompt、普通日志、状态 note 或明文持久化中。\n- **FR-025**: `context get` MUST 返回 schema-versioned `TaskExecutionContext`，包含 execution identity、冻结 Task 输入、exact Issue reference、Project repository identity/configured base branch、Workspace root/working branch 与允许的 capabilities；MUST NOT 返回 Linear body、Integration credentials 或 secrets。\n- **FR-026**: 第一版 Agent MUST 使用宿主机本地、已认证的 `linctl` 读取 Linear，并使用本地、已认证的 `gh` 推送和创建 PR；Mystra MUST NOT 代理、授权、查询或验证这些操作。\n- **FR-027**: `linctl` 或 `gh` 缺失、未认证或失败时，平台 MUST NOT 回退到 Project Integration credential 或 RepoDeliveryProvider；Agent MAY 将 Task 报告为 blocked。\n\n### Key Entities\n\n- **Task**: Team-scoped 基本生产任务，保存 requirement context 和当前 production status projection。\n- **TaskStatusTransition**: append-only 状态迁移事实，用于审计、幂等、冲突诊断和投影恢复。\n- **Harness Attempt**: 一次生产归因 identity，冻结 Agent revision，关联一个 Session；第一版不拥有独立状态机。\n- **Session**: Agent 的执行会话，拥有自己的 execution state；不代表 Task 业务状态。\n- **TaskExecutionContext**: `mystra-agent context get` 返回的版本化、最小充分执行上下文；包含当前 attempt 的身份、冻结需求引用、Project/Workspace 信息和允许能力，不包含外部系统正文或凭据。\n- **Execution Capability**: Runtime 注入的短期、可吊销、最小权限 execution code，只允许当前 attempt 读取上下文和申请合法 Task 状态迁移。\n\n## Assumptions \u0026 Dependencies\n\n- 第一版仍为一个 Harness attempt 启动一个 goal/autopilot Session。\n- Assign Agent 后立即 Start；自动分诊和独立 Start UI 不在本期。\n- 现有 Task Context、Workspace、Session launch、Runtime/Provider 和 Agent revision 合同可复用。\n- 第一版目标环境为 host Runtime；Provider 进程继承同一操作系统用户可用的 PATH 与本地 CLI 登录态。\n- `linctl` 与 `gh` 已安装、可执行且预先认证，是该自用 MVP deployment 的运行前提，不由 Mystra 配置或托管。\n- 内置 Agent 的标准 bootstrap prompt 只需要求：先调用 `mystra-agent context get`，再按 Issue reference 使用 `linctl`，在提供的 Workspace/branch 内改码和自测，使用 `gh` 创建 PR，最后通过 `mystra-agent` 报告 waiting_for_review 或 blocked。\n- 项目处于 pre-0.1；本功能直接替换旧的“Task 无生产状态”开发合同，不增加兼容别名或迁移 shim。\n\n## Deferred / Out of Scope\n\n- Mystra 验证 PR、commit、自测证据或执行质量门禁。\n- 通用 Artifact/Delivery 提交、非 PR 产出物和多类型流水线。\n- 多 Session Harness、心跳、事件订阅、自动恢复、自动 Retry 和等待条件。\n- Production Recipe、Skill/Workflow 自动选择、任务分诊、需求审查和多 Agent 协作。\n- Agent 创建/编辑 Task 需求字段、选择任意 Task 或人工完成/取消 Task。\n- 由 Mystra 代理 `linctl`/`gh`、托管其用户凭据、用 Project Integration credential 代替本地 CLI，或让 workload CLI 管理任意 Control Plane 资源。\n- done/canceled reopen、外部 Issue write-back、PR merge、部署与发布。\n\n## Success Criteria\n\n- **SC-001**: 100% 新 Task 初始化为 pending；Assign/Start 原子产生 in_progress 与唯一 Harness，Workspace ready 后幂等产生该 Harness 的唯一 Session。\n- **SC-002**: Agent 的所有允许和禁止迁移均由一张确定性 transition table 判定；非法迁移无状态副作用。\n- **SC-003**: 对同一 revision 的 20 个并发迁移请求，最多一个成功，其余返回 task_status_conflict。\n- **SC-004**: 同一 idempotency key/payload 重放 20 次只产生一个 TaskStatusTransition。\n- **SC-005**: Agent capability 无法设置 done/canceled/pending，也无法更新 title、description、Project 或 Issue context。\n- **SC-006**: Session 的任意状态变化都不会自动改变 productionStatus。\n- **SC-007**: waiting_for_review 展示中的 PR 和测试信息 100% 标识为 Agent reported / not verified by Mystra。\n- **SC-008**: Owner 可从 Task 详情和 CLI/API 一致看到当前 productionStatus、revision、note、actor、最新 Session.state 和迁移历史。\n- **SC-009**: 仅凭一个有效 execution code，Agent 可在不提交 Task ID 的情况下取得唯一 `TaskExecutionContext`；跨 Task、过期或吊销 code 100% fail closed。\n- **SC-010**: fixture host 环境中，Agent 可通过本地 `linctl` 读取 exact Issue、通过本地 `gh` 创建 PR 并报告 waiting_for_review；Mystra 的记录中不存在外部 CLI 凭据、代理调用或 PR/self-test 验真结果。\n",

      "content": "# Tasks: 薄 Task 生产状态机与 mystra-agent CLI\n\n**Input**: `/specs/051-factory-task-harness/` 下的 spec、plan、research、data-model、contracts 与 quickstart\n**Tests**: 本功能明确采用 TDD；每个行为切片先写失败测试，再实现并回归。\n**Organization**: 按四个 user stories 分阶段；共享状态/RDB/capability foundation 先完成。\n\n## Format: `[ID] [P?] [Story] Description`\n\n- **[P]**: 可在不同文件中并行，且不依赖同阶段未完成任务\n- **[Story]**: 对应 spec 中 US1–US4\n- 所有任务包含目标文件路径\n\n## Phase 1: Setup（共享工程结构）\n\n**Purpose**: 建立 workload CLI package 与 feature verification 入口，不实现业务行为\n\n- [x] T001 在 `packages/agent-cli/package.json`、`packages/agent-cli/tsconfig.json`、`packages/agent-cli/tsconfig.build.json` 创建 private `@mystra/agent-cli` workspace package 和 `mystra-agent` bin build contract\n- [x] T002 在 `packages/agent-cli/bin/mystra-agent` 与 `packages/agent-cli/src/index.ts` 建立可执行 wrapper 和 Runner 可解析的 bin-directory export\n- [x] T003 更新 `apps/runner-daemon/package.json` 的 production dependency 与 prebuild/predev/pretest wiring，确保 Runner 安装/构建时包含 `@mystra/agent-cli`\n- [x] T004 更新 `package.json` 增加直接运行 workload CLI 的本地开发命令，并保持 `mystra` operator CLI 边界不变\n\n---\n\n## Phase 2: Foundational（状态合同、持久化与安全基础）\n\n**Purpose**: 所有 user story 共同依赖的 Task/Harness/status/capability 领域合同\n\n**⚠️ CRITICAL**: 本阶段完成前不进入任何 user story implementation\n\n### Tests first\n\n- [x] T005 [P] 在 `packages/shared/src/task.test.ts` 写 productionStatus、actor allowlist、note、terminal、statusNote clearing 与 allowedTransitions 的失败测试\n- [x] T006 [P] 在 `packages/shared/src/harness.test.ts` 写 Harness、TaskExecutionContext、execution identity/capability schema 的边界与 secret-exclusion 失败测试\n- [x] T007 在 `apps/control-plane/src/lib/db/rdb-provider.contract.ts` 写 Task projection/history、assign atomicity、idempotency、20-way revision race、Harness uniqueness、capability lifecycle 与 Workspace completion replay 的 provider contract 失败测试\n\n### Shared contracts and persistence\n\n- [x] T008 在 `packages/shared/src/task.ts` 实现 production projection、transition request/result/history schemas 与纯
