schema_version: '1.0'

extension:
  id: 'taco'
  name: 'Taco Review'
  version: '0.7.0'
  description: 'Packages Spec Kit features for human review and syncs edits and comments back.'
  author: 'Arcadia822'
  repository: 'https://github.com/Arcadia822/taco'
  homepage: 'https://github.com/Arcadia822/taco#readme'
  category: 'integration'
  effect: 'read-write'
  license: 'MIT'

requires:
  speckit_version: '>=0.16.0,<2.0.0'
  commands:
    - 'speckit.specify'

provides:
  templates:
    - name: 'spec-template'
      file: 'templates/spec-template.md'
      description: 'Spec Kit feature specification template with canonical Taco YAML metadata.'
    - name: 'spec-pack'
      file: 'templates/spec'
      description: 'Self-contained template pack for feature specifications with a ready-to-open empty Taco.'
    - name: 'architecture-pack'
      file: 'templates/architecture'
      description: 'Self-contained template pack for architecture documents with a ready-to-open empty Taco.'
    - name: 'api-reference-pack'
      file: 'templates/api-reference'
      description: 'Self-contained template pack for API reference documents with a ready-to-open empty Taco.'
    - name: 'adr-pack'
      file: 'templates/adr'
      description: 'Self-contained template pack for architecture decision records with a ready-to-open empty Taco.'
  commands:
    - name: 'speckit.taco.update'
      file: 'commands/update.md'
      description: 'Create or refresh the in-directory Taco for the active feature.'
    - name: 'speckit.taco.review'
      file: 'commands/review.md'
      description: 'Sync Taco edits back to source files and process human review comments.'
  scripts:
    - name: 'taco-cli'
      file: 'bin/taco.mjs'
      description: 'Optional offline CLI for Taco files (prepare-template, prepare-policy, and pack/sync/validate utilities). The Agent workflow uses the shell and bundle JSON directly and does not require this CLI.'

hooks:
  after_specify:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after the feature specification is written.'
  after_clarify:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after the specification is clarified.'
  after_plan:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after planning artifacts change.'
  after_checklist:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after a checklist changes.'
  after_tasks:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after task artifacts change.'
  after_analyze:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after cross-artifact analysis.'
  after_implement:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after implementation progress changes feature artifacts.'
  after_converge:
    command: 'speckit.taco.update'
    optional: false
    priority: 10
    description: 'Update Taco after convergence changes feature artifacts.'

tags:
  - 'documentation'
  - 'review'
  - 'spec-kit'
  - 'human-in-the-loop'
