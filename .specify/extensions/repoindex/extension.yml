schema_version: "1.0"

extension:
  id: "repoindex"
  name: "Repository Index"
  version: "1.0.0"
  description: "Generate repository overviews, architecture maps, and module indexes for existing codebases"
  author: "Yiyu Liu"
  repository: "https://github.com/liuyiyu/repoindex"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"
  tools:
    - name: "gitnexus"
      required: false
      version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.repoindex.overview"
      file: "commands/overview.md"
      description: "Generate a repo-wide overview grounded in project context and code structure"
      aliases: ["speckit.repoindex-overview"]

    - name: "speckit.repoindex.architecture"
      file: "commands/architecture.md"
      description: "Generate deep architectural analysis with execution-flow and dependency evidence"
      aliases: ["speckit.repoindex-architecture"]

    - name: "speckit.repoindex.module"
      file: "commands/module.md"
      description: "Generate focused analysis of one module, including boundaries, flows, contracts, and key files"
      aliases: ["speckit.repoindex-module"]

tags:
  - "utility"
  - "documentation"
  - "architecture"
  - "brownfield"