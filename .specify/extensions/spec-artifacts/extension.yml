schema_version: "1.0"

extension:
  id: "spec-artifacts"
  name: "Spec Artifacts"
  version: "0.1.0"
  description: "Generate owner-facing feature and checklist artifacts beside Spec-Kit specifications without changing standard spec, plan, or task files."
  author: "Mystra"
  repository: ""
  license: "UNLICENSED"
  homepage: ""

requires:
  speckit_version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.spec-artifacts.generate"
      file: "commands/generate.md"
      description: "Generate features.md and checklists.md for a feature spec"

tags:
  - "workflow"
  - "artifact-generation"
  - "owner-review"
